<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#450D17;
  --maroon-light:#8C2233;
  --gold:#AD8A3B;
  --gold-light:#E4D4A7;
  --gold-pale:#F3EAD1;
  --bg:#F2ECDD;
  --paper:#FFFFFF;
  --ink:#2B2320;
  --ink-soft:#6B5F55;
  --line:#E2D8C2;
  --silver-accent:#7C8794;
  --success:#2F7A4F;
  --success-bg:#E4F0E7;
  --danger:#AD3B32;
  --danger-bg:#F5E4E1;
  --warn-bg:#FBEFD9;
  --radius:10px;
  --shadow:0 2px 10px rgba(69,13,23,0.08);
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--maroon-dark),var(--maroon) 60%,#5A1420);
  display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;
}
.seal{
  width:92px;height:92px;border-radius:50%;border:3px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:30px;color:var(--gold-light);letter-spacing:1px;margin-bottom:18px;
  box-shadow:0 0 0 4px rgba(228,212,167,0.15);
}
.lockCard{
  background:rgba(255,255,255,0.06);border:1px solid rgba(228,212,167,0.35);
  border-radius:16px;padding:36px 40px;text-align:center;min-width:340px;
  backdrop-filter:blur(2px);
}
.lockCard h1{font-family:var(--font-display);color:#fff;font-size:26px;margin:0 0 2px;letter-spacing:.5px;}
.lockCard p.sub{color:var(--gold-light);margin:0 0 22px;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.pinDots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pinDot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold-light);background:transparent;transition:.15s;}
.pinDot.filled{background:var(--gold-light);}
.padGrid{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center;margin-top:10px;}
.padBtn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(228,212,167,0.5);background:rgba(255,255,255,0.05);color:#fff;font-size:22px;}
.padBtn:active{background:var(--gold);color:var(--maroon-dark);}
.padBtn.wide{grid-column:span 1;font-size:14px;}
#lockError{color:#FFC9C0;font-size:13px;height:18px;margin-top:8px;}
#lockHint{color:rgba(255,255,255,.55);font-size:12px;margin-top:14px;}

/* ---------- SHELL ---------- */
#shell{display:none;height:100vh;width:100vw;grid-template-columns:230px 1fr;}
#shell.active{display:grid;}
#sidebar{
  background:var(--maroon-dark);color:#fff;display:flex;flex-direction:column;
  padding:18px 0;overflow-y:auto;
}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(228,212,167,0.2);margin-bottom:10px;display:flex;gap:10px;align-items:center;}
.brand .mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold-light);font-size:15px;flex-shrink:0;}
.brand .txt h2{font-family:var(--font-display);font-size:15px;margin:0;line-height:1.2;color:#fff;}
.brand .txt span{font-size:10px;color:var(--gold-light);letter-spacing:1px;}

<script>
/* =====================================================================
   GAYATRI JEWELLERS — OFFLINE SHOP MANAGER
   Single-file offline ERP. All data in localStorage. No network calls.
===================================================================== */

const DB_KEY = 'gj_erp_db_v1';
const uid = (p='ID') => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmtWt = (n) => (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:3}) + ' g';
const daysBetween = (fromISODate, toISODate) => {
  if(!fromISODate) return 0;
  const a = new Date(fromISODate+'T00:00:00'), b = new Date((toISODate||todayStr())+'T00:00:00');
  return Math.max(Math.round((b-a)/86400000), 0);
};

function defaultDB(){
  return {
    meta:{
      shopName:'Gayatri Jewellers', location:'Soni Gali, Sarwan, Madhya Pradesh, India',
      startDate:'2024-01-22', pin:'1234', ownerPin:'9999', language:'en',
      discountApprovalThresholdPct: 3, lastBackupAt:null
    },
    rateHistory:[],
    currentRates:{ gold24:9800, gold22:8990, silverKg:88000, updatedAt: nowISO() },
    customers:[],
    sales:[], buying:[], girvi:[], creditEntries:[], inventory:[], jobs:[], exchange:[],
    expenses:[], cashDays:[], staff:[{id:uid('STF'),name:'Owner',role:'owner',pin:'1234'}],
    wholesalers:[], wholesalerEntries:[],
    history:[]
  };
}
/* Backward-compatible migration: fills in any fields added in later app updates
   without touching or erasing existing shop data. */
function migrateDB(d){
  if(!d.wholesalers) d.wholesalers=[];
  if(!d.wholesalerEntries) d.wholesalerEntries=[];
  if(d.meta && d.meta.discountApprovalThresholdPct===undefined) d.meta.discountApprovalThresholdPct=3;
  (d.girvi||[]).forEach(g=>{
    if(!g.transactions){
      g.transactions=[{id:uid('GTX'), date:g.date, type:'Loan Given', amount:g.loanAmount, note:'Initial girvi loan'}];
    }
    if(g.photo===undefined) g.photo=null;
    if(g.outstandingPrincipal===undefined){
      let principal = g.loanAmount||0;
      g.transactions.forEach(t=>{
        if(t.type==='Additional Loan') principal += t.amount;
        if(t.type==='Part Payment') principal -= t.amount;
      });
      g.outstandingPrincipal = Math.max(principal,0);
    }
  });
  (d.sales||[]).forEach(s=>{ (s.items||[]).forEach(i=>{ if(i.purity===undefined || i.purity==='') i.purity=100; }); });
  (d.buying||[]).forEach(b=>{ if(b.purity===undefined || b.purity==='') b.purity=100; });
  return d;
}
let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) { const d=defaultDB(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
    return migrateDB(JSON.parse(raw));
  }catch(e){ return defaultDB(); }
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    renderRateStrip();
    return true;
  }catch(err){
    toast('⚠️ Could not save — device storage is full. Please back up and free up space.');
    return false;
  }
}
function logHistory(module, action, description){
  DB.history.unshift({id:uid('H'), ts:nowISO(), module, action, description});
  if(DB.history.length>3000) DB.history.length=3000;
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),2400);
}

/* ---------------------- I18N ---------------------- */
const STR = {
  en:{
    dashboard:'Dashboard', sales:'Sales', buying:'Buying', girvi:'Girvi (Loan)', credit:'Credit / Udhaar',
    inventory:'Inventory', jobs:'Manufacturing & Repair', exchange:'Exchange', ledger:'Customer Ledger',
    history:'History', reports:'Reports', settings:'Settings',
    newSale:'New Sale', newPurchase:'New Purchase', newGirvi:'New Girvi Loan', newJob:'New Job',
    newExchange:'New Exchange', addItem:'Add Item', save:'Save', cancel:'Cancel', search:'Search...',
    customer:'Customer', phone:'Phone', total:'Total', amountPaid:'Amount Paid', balance:'Balance',
    date:'Date', status:'Status', action:'Action', weight:'Weight (g)', purity:'Purity', rate:'Rate',
    making:'Making Charge', discount:'Discount', category:'Category', metal:'Metal', gold:'Gold', silver:'Silver',
  },
  hi:{
    dashboard:'डैशबोर्ड', sales:'बिक्री', buying:'खरीद', girvi:'गिरवी (लोन)', credit:'उधार / क्रेडिट',
    inventory:'स्टॉक', jobs:'निर्माण व मरम्मत', exchange:'अदला-बदली', ledger:'ग्राहक खाता',
    history:'इतिहास', reports:'रिपोर्ट', settings:'सेटिंग्स',
    newSale:'नई बिक्री', newPurchase:'नई खरीद', newGirvi:'नया गिरवी लोन', newJob:'नया काम',
    newExchange:'नई अदला-बदली', addItem:'आइटम जोड़ें', save:'सेव करें', cancel:'रद्द करें', search:'खोजें...',
    customer:'ग्राहक', phone:'फोन', total:'कुल', amountPaid:'भुगतान राशि', balance:'बकाया',
    date:'तारीख', status:'स्थिति', action:'कार्य', weight:'वज़न (ग्राम)', purity:'शुद्धता', rate:'दर',
    making:'मज़दूरी', discount:'छूट', category:'श्रेणी', metal:'धातु', gold:'सोना', silver:'चांदी',
  }
};
function T(key){ const l=DB.meta.language||'en'; return (STR[l]&&STR[l][key]) || STR.en[key] || key; }

/* ---------------------- NAV CONFIG ---------------------- */
const NAV = [
  {id:'dashboard', num:'', label:'Dashboard', hi:'डैशबोर्ड', icon:'🏠', group:'main'},
  {id:'sales', num:'1', label:'Sales', hi:'बिक्री', icon:'🧾', group:'main'},
  {id:'buying', num:'2', label:'Buying', hi:'खरीद', icon:'⚖️', group:'main'},
  {id:'girvi', num:'3', label:'Girvi', hi:'गिरवी', icon:'🔐', group:'main'},
  {id:'credit', num:'4', label:'Credit', hi:'उधार', icon:'📒', group:'main'},
  {id:'inventory', num:'5', label:'Inventory', hi:'स्टॉक', icon:'💍', group:'main'},
  {id:'jobs', num:'6', label:'Manufacturing & Repair', hi:'निर्माण व मरम्मत', icon:'🛠️', group:'main'},
  {id:'exchange', num:'7', label:'Exchange', hi:'अदला-बदली', icon:'🔁', group:'main'},
  {id:'ledger', num:'8', label:'Customer Ledger', hi:'ग्राहक खाता', icon:'👤', group:'main'},
  {id:'history', num:'9', label:'History', hi:'इतिहास', icon:'🕘', group:'main'},
  {id:'reports', num:'10', label:'Reports', hi:'रिपोर्ट', icon:'📊', group:'main'},
  {id:'settings', num:'11', label:'Settings', hi:'सेटिंग्स', icon:'⚙️', group:'main'},
  {id:'cashday', num:'', label:'Cash / Day Close', hi:'कैश डे क्लोज़', icon:'💰', group:'extra'},
  {id:'expenses', num:'', label:'Expenses', hi:'खर्च', icon:'🧮', group:'extra'},
  {id:'wholesaler', num:'', label:'Wholesaler Khata', hi:'थोक व्यापारी खाता', icon:'📇', group:'extra'},
  {id:'calculator', num:'', label:'Calculator', hi:'कैलकुलेटर', icon:'🖩', group:'extra'},
];

let currentPage='dashboard';

function renderNav(){
  const el = document.getElementById('navlist'); el.innerHTML='';
  const lang = DB.meta.language;
  let grp='';
  NAV.forEach(item=>{
    if(item.group!==grp){
      grp=item.group;
      const lbl=document.createElement('div'); lbl.className='navGroupLabel';
      lbl.textContent = grp==='main' ? (lang==='hi'?'मुख्य मॉड्यूल':'Modules') : (lang==='hi'?'अतिरिक्त':'Extras');
      el.appendChild(lbl);
    }
    const d=document.createElement('div');
    d.className='navitem'+(currentPage===item.id?' active':'');
    d.innerHTML = `<span class="num">${item.num}</span><span>${item.icon}</span><span>${lang==='hi'?item.hi:item.label}</span>`;
    d.onclick=()=>goTo(item.id);
    el.appendChild(d);
  });
}
function goTo(id){
  currentPage=id; renderNav();
  const item = NAV.find(n=>n.id===id);
  document.getElementById('pageTitle').textContent = DB.meta.language==='hi'?item.hi:item.label;
  const renderFn = PAGES[id];
  document.getElementById('content').innerHTML='';
  if(renderFn) renderFn();
}
function renderRateStrip(){
  document.getElementById('topGoldRate').textContent = fmtMoney(DB.currentRates.gold24)+'/10g';
  document.getElementById('topSilverRate').textContent = fmtMoney(DB.currentRates.silverKg)+'/kg';
}

/* ---------------------- MODAL HELPERS ---------------------- */
function openModal(title, bodyHTML, footButtons){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=bodyHTML;
  const foot=document.getElementById('modalFoot'); foot.innerHTML='';
  (footButtons||[]).forEach(b=>{
    const btn=document.createElement('button');
    btn.className='btn '+(b.cls||'btn-ghost'); btn.textContent=b.label;
    btn.onclick=b.onClick; foot.appendChild(btn);
  });
  document.getElementById('modalWrap').classList.add('active');
}
function closeModal(){ document.getElementById('modalWrap').classList.remove('active'); }

function askOwnerApproval(reason, cb){
  openModal('Owner Approval Required',
    `<p style="margin-top:0">${reason}</p>
     <div class="field"><label>Owner PIN</label><input type="password" id="ownerPinInput" maxlength="6" placeholder="Enter owner PIN"></div>
     <div id="ownerPinErr" style="color:var(--danger);font-size:12px;margin-top:6px;"></div>`,
    [
      {label:'Cancel', cls:'btn-ghost', onClick:closeModal},
      {label:'Approve', cls:'btn-primary', onClick:()=>{
        const val = document.getElementById('ownerPinInput').value;
        if(val===DB.meta.ownerPin){ closeModal(); cb(true); }
        else{ document.getElementById('ownerPinErr').textContent='Incorrect PIN'; }
      }}
    ]);
}

function confirmAction(msg, cb){
  openModal('Please Confirm', `<p style="margin-top:0">${msg}</p>`, [
    {label:'Cancel', cls:'btn-ghost', onClick:closeModal},
    {label:'Confirm', cls:'btn-primary', onClick:()=>{ closeModal(); cb(); }}
  ]);
}

/* ---------------------- MANAGER PIN GUARD (edit / delete anything) ---------------------- */
function guardEdit(entityLabel, cb){
  askOwnerApproval(`Enter manager PIN to edit this ${entityLabel}.`, cb);
}
function guardDelete(entityLabel, cb){
  askOwnerApproval(`Enter manager PIN to delete this ${entityLabel}. It will disappear from lists and totals, but stays in History for reference — nothing is permanently erased.`, ()=>{
    confirmAction(`Delete this ${entityLabel}? This can only be undone by an owner restoring from a backup.`, cb);

/* ---------------------- CUSTOMER HELPERS ---------------------- */
function findOrCreateCustomer(name, phone){
  name=(name||'').trim(); if(!name) return null;
  let c = DB.customers.find(x=>x.name.toLowerCase()===name.toLowerCase() && (!phone || x.phone===phone));
  if(!c){
    c = {id:uid('CUS'), name, phone:phone||'', address:'', notes:'', createdAt:nowISO()};
    DB.customers.push(c);
    logHistory('Customer','Created','New customer added: '+name);
  }
  return c;
}
function customerBalance(customerId){
  let bal=0;
  DB.creditEntries.filter(e=>e.customerId===customerId && !e.deleted).forEach(e=>{ bal += (e.type==='debit'? e.amount : -e.amount); });
  return bal;
}
function customerOptionsHTML(){
  return DB.customers.map(c=>`<option value="${c.id}">${c.name}${c.phone?' — '+c.phone:''}</option>`).join('');
}

  html += `</div>`;

  html += `<div class="card"><div class="cardHead"><h3>Today's Rates</h3><button class="btn btn-sm btn-outline" onclick="goTo('settings')">Update Rate</button></div>

let saleDraftItems = [];
let editingSaleId = null;
function renderSales(){
  let html = `<div class="cardHead" style="margin-bottom:14px;">
    <div></div>
    <button class="btn btn-primary" onclick="openSaleForm()">+ ${T('newSale')}</button>
  </div>`;
  html += `<div class="card"><div class="searchBar"><input id="saleSearch" placeholder="Search by customer or item..." oninput="filterSalesTable()"></div><div id="salesTableWrap"></div></div>`;
  document.getElementById('content').innerHTML = html;
  filterSalesTable();
}
function filterSalesTable(){
  const q = (document.getElementById('saleSearch')?.value||'').toLowerCase();
  let rows = [...DB.sales].filter(s=>!s.deleted).sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt));
  if(q) rows = rows.filter(s => s.customerName.toLowerCase().includes(q) || s.items.some(i=>i.itemName.toLowerCase().includes(q)));
  let html = `<table><tr><th>Date</th><th>Bill No</th><th>Customer</th><th>Weight</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="9"><div class="empty"><div class="big">🧾</div>No sales yet. Create your first bill.</div></td></tr>`;
  rows.forEach(s=>{
    const wt = s.items.reduce((a,i)=>a+Number(i.weight||0),0);
    html += `<tr>
      <td>${fmtDate(s.date)}</td><td>${s.billNo}</td><td>${s.customerName}</td><td>${fmtWt(wt)}</td>
      <td>${fmtMoney(s.grandTotal)}</td><td>${fmtMoney(s.amountPaid)}</td><td>${fmtMoney(s.grandTotal-s.amountPaid)}</td>
      <td>${s.void?'<span class="tag tag-red">VOID</span>':(s.grandTotal-s.amountPaid<=0?'<span class="tag tag-green">Paid</span>':'<span class="tag tag-gold">Due</span>')}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="viewSale('${s.id}')">View</button></td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById('salesTableWrap').innerHTML = html;
}
function deleteSale(id){
  const s = DB.sales.find(x=>x.id===id); if(!s) return;
  guardDelete('sale bill ('+s.billNo+')', ()=>{
    s.deleted = true;
    logHistory('Sales','Deleted', `Bill ${s.billNo} for ${s.customerName} deleted`);
    saveDB(); closeModal(); renderSales(); toast('Bill deleted');
  });
}
function openSaleForm(editId){
  const existing = editId ? DB.sales.find(s=>s.id===editId) : null;
  editingSaleId = existing ? existing.id : null;
  saleDraftItems = existing ? existing.items.map(i=>({...i, purity:(i.purity===undefined||i.purity==='')?100:i.purity})) : [];
  const existingCust = existing ? DB.customers.find(c=>c.id===existing.customerId) : null;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>${T('customer')} *</label><input list="custList" id="saleCustomer" placeholder="Type or select customer" value="${existing?existing.customerName:''}">
        <datalist id="custList">${DB.customers.map(c=>`<option value="${c.name}">`).join('')}</datalist></div>
      <div class="field"><label>${T('phone')}</label><input id="salePhone" placeholder="10-digit mobile" value="${existingCust?existingCust.phone:''}"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>${T('date')} <span class="helpText">(back-date allowed)</span></label><input type="date" id="saleDate" value="${existing?existing.date:todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Payment Mode</label><select id="salePayMode">
        ${['Cash','UPI','Card','Part Credit','Full Credit'].map(m=>`<option ${existing&&existing.paymentMode===m?'selected':''}>${m}</option>`).join('')}
      </select></div>
    </div>
    <div style="margin-top:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <label style="font-weight:600;font-size:13px;color:var(--ink-soft);">ITEMS</label>
        <button class="btn btn-sm btn-outline" onclick="addSaleItemRow()">+ ${T('addItem')}</button>
      </div>
      <div id="saleItemsWrap" style="margin-top:10px;"></div>
    </div>
    <div class="grid grid-2" style="margin-top:14px;">
      <div class="field"><label>${T('discount')} (₹)</label><input type="number" id="saleDiscount" value="${existing?existing.discount:0}" oninput="recalcSaleTotals()"></div>
      <div class="field"><label>Amount Paid</label><input type="number" id="saleAmountPaid" value="${existing?existing.amountPaid:''}" placeholder="auto = grand total"></div>
    </div>
    <div class="totalsBox" id="saleTotalsBox"></div>
    <div id="saleApprovalNote"></div>
  `;
  openModal(existing?('Edit Sale — '+existing.billNo):T('newSale'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:existing?'Save Changes':T('save')+' Bill', cls:'btn-primary', onClick:saveSale}
  ]);
  if(!existing) addSaleItemRow(); else renderSaleItemRows();
  recalcSaleTotals();
}
function addSaleItemRow(){
  saleDraftItems.push({itemName:'', category:'Silver', weight:0, purity:100, rate:0, making:0, itemDiscount:0});
  renderSaleItemRows();
}
function removeSaleItemRow(i){ saleDraftItems.splice(i,1); renderSaleItemRows(); recalcSaleTotals(); }
function renderSaleItemRows(){
  const wrap = document.getElementById('saleItemsWrap');
  wrap.innerHTML = saleDraftItems.map((it,i)=>{
    const purity = (it.purity===undefined||it.purity==='')?100:it.purity;
    const pureWt = (Number(it.weight)||0) * (Number(purity)||0)/100;
    return `
    <div class="itemRow" style="grid-template-columns:1.2fr 0.85fr 0.7fr 0.75fr 0.8fr 0.75fr 0.8fr 0.85fr auto;">
      <div class="field"><label>Item</label><input value="${it.itemName}" placeholder="e.g. Silver Payal" oninput="saleDraftItems[${i}].itemName=this.value"></div>
      <div class="field"><label>${T('category')}</label>
        <select onchange="saleDraftItems[${i}].category=this.value; autoFillRate(${i}); recalcSaleTotals();">
          <option ${it.category==='Silver'?'selected':''}>Silver</option>
          <option ${it.category==='Gold'?'selected':''}>Gold</option>
          <option ${it.category==='Part Silver'?'selected':''}>Part Silver</option>
          <option ${it.category==='Khirchi Silver'?'selected':''}>Khirchi Silver</option>
          <option ${it.category==='Custom'?'selected':''}>Custom</option>
        </select></div>
      <div class="field"><label>${T('weight')}</label><input type="number" step="0.001" value="${it.weight}" oninput="saleDraftItems[${i}].weight=parseFloat(this.value)||0; recalcSaleTotals();"></div>
      <div class="field"><label>${T('purity')} %</label><input type="number" step="0.1" value="${purity}" placeholder="e.g. 90" oninput="saleDraftItems[${i}].purity=parseFloat(this.value)||0; recalcSaleTotals();"></div>
      <div class="field"><label>Pure Wt</label><input value="${pureWt.toFixed(3)}" disabled style="background:var(--bg);color:var(--ink-soft);"></div>
      <div class="field"><label>${T('rate')}/g</label><input type="number" value="${it.rate}" oninput="saleDraftItems[${i}].rate=parseFloat(this.value)||0; recalcSaleTotals();"></div>
      <div class="field"><label>${T('making')}</label><input type="number" value="${it.making}" oninput="saleDraftItems[${i}].making=parseFloat(this.value)||0; recalcSaleTotals();"></div>
      <div class="field"><label>Amount</label><input value="${fmtMoney(pureWt*(it.rate||0)+Number(it.making||0))}" disabled style="background:var(--bg);color:var(--ink-soft);"></div>
      <button class="miniRemove" onclick="removeSaleItemRow(${i})">✕</button>
    </div>
  `;}).join('');
  saleDraftItems.forEach((it,i)=> autoFillRate(i));
}
function autoFillRate(i){
  const it = saleDraftItems[i]; if(!it) return;
  if(it.rate) return;
  if(it.category==='Gold') it.rate = DB.currentRates.gold22/10;
  else if(it.category!=='Custom') it.rate = DB.currentRates.silverKg/1000;
}
function recalcSaleTotals(){
  let sub=0, wt=0, pureWt=0;
  saleDraftItems.forEach(it=>{
    const purity = (it.purity===undefined||it.purity==='') ? 100 : Number(it.purity);
    const pw = (Number(it.weight)||0) * (purity/100);
    pureWt += pw; wt += Number(it.weight||0);
    sub += (pw*(it.rate||0)) + Number(it.making||0);
  });
  const discount = parseFloat(document.getElementById('saleDiscount')?.value)||0;
  const grand = Math.max(sub-discount,0);
  const pct = sub>0 ? (discount/sub*100) : 0;
  document.getElementById('saleTotalsBox').innerHTML = `
    <div class="totalsRow"><span>Total Weight</span><span>${fmtWt(wt)}</span></div>
    <div class="totalsRow"><span>Pure Weight (by purity)</span><span>${fmtWt(pureWt)}</span></div>
    <div class="totalsRow"><span>Subtotal</span><span>${fmtMoney(sub)}</span></div>
    <div class="totalsRow"><span>${T('discount')}</span><span>- ${fmtMoney(discount)}</span></div>
    <div class="totalsRow grand"><span>Grand Total</span><span>${fmtMoney(grand)}</span></div>`;
  const note = document.getElementById('saleApprovalNote');
  if(note){
    if(pct > DB.meta.discountApprovalThresholdPct){
      note.innerHTML = `<div class="approveBox">⚠️ Discount is ${pct.toFixed(1)}%, above the ${DB.meta.discountApprovalThresholdPct}% limit. Owner approval will be required to save this bill.</div>`;
    } else note.innerHTML='';
  }
}
function saveSale(){
  const custName = document.getElementById('saleCustomer').value.trim();
  if(!custName){ toast('Please enter customer name'); return; }
  if(saleDraftItems.length===0 || saleDraftItems.every(i=>!i.itemName)){ toast('Add at least one item'); return; }
  const phone = document.getElementById('salePhone').value.trim();
  const discount = parseFloat(document.getElementById('saleDiscount').value)||0;
  const payMode = document.getElementById('salePayMode').value;
  const saleDate = document.getElementById('saleDate').value || todayStr();
  const manualPaid = document.getElementById('saleAmountPaid').value;
  let sub=0; saleDraftItems.forEach(it=>{ const purity=(it.purity===undefined||it.purity==='')?100:Number(it.purity); const pw=(it.weight||0)*(purity/100); sub += (pw*(it.rate||0))+Number(it.making||0); });
  const pct = sub>0 ? (discount/sub*100):0;

  const finalize = ()=>{
    const cust = findOrCreateCustomer(custName, phone);
    const grand = Math.max(sub-discount,0);
    const amountPaid = manualPaid!=='' ? (parseFloat(manualPaid)||0) : ((payMode==='Full Credit') ? 0 : grand);
    const cleanItems = saleDraftItems.filter(i=>i.itemName).map(i=>({...i, purity:(i.purity===undefined||i.purity==='')?100:Number(i.purity)}));
    if(editingSaleId){
      const s = DB.sales.find(x=>x.id===editingSaleId);
      s.customerId=cust.id; s.customerName=cust.name; s.date=saleDate; s.items=cleanItems;
      s.subTotal=sub; s.discount=discount; s.discountPct=pct; s.grandTotal=grand; s.paymentMode=payMode; s.amountPaid=amountPaid;
      logHistory('Sales','Edited', `Bill ${s.billNo} edited for ${cust.name} — new total ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale updated: '+s.billNo); renderSales();
    } else {
      const sale = {
        id: uid('SAL'), billNo: 'INV-'+(DB.sales.length+1001), date: saleDate, createdAt: nowISO(),
        customerId: cust.id, customerName: cust.name, items: cleanItems,
        subTotal: sub, discount, discountPct: pct, grandTotal: grand, paymentMode: payMode, amountPaid, void:false
      };
      DB.sales.push(sale);
      if(amountPaid < grand){
        DB.creditEntries.push({id:uid('CR'), customerId:cust.id, date:saleDate, type:'debit', amount: grand-amountPaid, description:'Sale '+sale.billNo, createdAt: nowISO()});
      }
      logHistory('Sales','Created', `Bill ${sale.billNo} for ${cust.name} — ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale saved: '+sale.billNo); renderSales();
    }
  };

  if(pct > DB.meta.discountApprovalThresholdPct){
    askOwnerApproval(`This bill has a discount of ${pct.toFixed(1)}%, above the allowed ${DB.meta.discountApprovalThresholdPct}%. Owner PIN is required to proceed.`, ()=>finalize());
  } else finalize();
}
function viewSale(id){
  const s = DB.sales.find(x=>x.id===id); if(!s) return;
  let body = `<div class="grid grid-2" style="margin-bottom:14px;">
    <div><b>Bill No:</b> ${s.billNo}</div><div><b>Date:</b> ${fmtDate(s.date)}</div>
    <div><b>Customer:</b> ${s.customerName}</div><div><b>Payment:</b> ${s.paymentMode}</div>
  </div>
  <table><tr><th>Item</th><th>Category</th><th>Wt</th><th>Purity</th><th>Pure Wt</th><th>Rate</th><th>Making</th><th>Amount</th></tr>
  ${s.items.map(i=>{ const purity=(i.purity===undefined||i.purity==='')?100:i.purity; const pw=(i.weight||0)*(purity/100); const amt=pw*(i.rate||0)+Number(i.making||0); return `<tr><td>${i.itemName}</td><td>${i.category}</td><td>${fmtWt(i.weight)}</td><td>${purity}%</td><td>${fmtWt(pw)}</td><td>${fmtMoney(i.rate)}</td><td>${fmtMoney(i.making)}</td><td>${fmtMoney(amt)}</td></tr>`; }).join('')}
  </table>
  <div class="totalsBox">
    <div class="totalsRow"><span>Subtotal</span><span>${fmtMoney(s.subTotal)}</span></div>
    <div class="totalsRow"><span>Discount</span><span>- ${fmtMoney(s.discount)}</span></div>
    <div class="totalsRow grand"><span>Grand Total</span><span>${fmtMoney(s.grandTotal)}</span></div>
    <div class="totalsRow"><span>Paid</span><span>${fmtMoney(s.amountPaid)}</span></div>
    <div class="totalsRow"><span>Balance</span><span>${fmtMoney(s.grandTotal-s.amountPaid)}</span></div>
  </div>`;
  const foot = [{label:'Close', cls:'btn-ghost', onClick:closeModal}];
  if(!s.void){
    foot.push({label:'✎ Edit', cls:'btn-outline', onClick:()=>{ guardEdit('sale bill ('+s.billNo+')', ()=>openSaleForm(s.id)); }});
    foot.push({label:'Void Bill', cls:'btn-danger', onClick:()=>{
      askOwnerApproval('Voiding a bill requires owner approval. This will not delete the record — it stays in History.', ()=>{
        s.void=true; logHistory('Sales','Voided','Bill '+s.billNo+' voided'); saveDB(); closeModal(); renderSales(); toast('Bill voided');
      });
    }});
  }
  foot.push({label:'🗑 Delete', cls:'btn-danger', onClick:()=>deleteSale(s.id)});
  openModal('Sale — '+s.billNo, body, foot);
}

function buyRecalc(){
  const w = parseFloat(document.getElementById('buyWeight').value)||0;
  const purity = parseFloat(document.getElementById('buyPurity').value);
  const p = (purity===undefined||isNaN(purity)) ? 100 : purity;
  const r = parseFloat(document.getElementById('buyRate').value)||0;
  const pw = w*(p/100);
  document.getElementById('buyPureWtOut').textContent = fmtWt(pw);
  document.getElementById('buyAmountOut').textContent = fmtMoney(pw*r);
}

}

function girviInterestDue(g){
  const months = daysBetween(g.lastInterestDate||g.date) / 30;

function handleGirviPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      const maxDim = 320;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try{
        grPhotoData = canvas.toDataURL('image/jpeg', 0.6);
        document.getElementById('grPhotoPreview').outerHTML = `<img id="grPhotoPreview" src="${grPhotoData}" class="photoThumb">`;
      }catch(err){
        toast('Could not process this photo — try a different one');
      }
    };
    img.onerror = function(){ toast('Could not read this photo — try a different one'); };
    img.src = evt.target.result;
  };
  reader.onerror = function(){ toast('Could not read this file'); };
  reader.readAsDataURL(file);
}

function recomputeGirviPrincipal(g){
  let p = 0, lastInterest = g.date;
  (g.transactions||[]).filter(t=>!t.deleted).forEach(t=>{
    if(t.type==='Loan Given' || t.type==='Additional Loan') p += t.amount;
    else if(t.type==='Part Payment') p -= t.amount;
    else if(t.type==='Interest Received') lastInterest = t.date;
    else if(t.type==='Redeemed') p = 0;
  });
  g.outstandingPrincipal = Math.max(p,0);
  g.lastInterestDate = lastInterest;
}
function deleteGirviTx(girviId, txId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const t = (g.transactions||[]).find(x=>x.id===txId); if(!t) return;
  if(t.type==='Loan Given'){ toast('Cannot delete the initial loan entry — delete the whole loan record instead if this was a mistake.'); return; }
  guardDelete('transaction ('+t.type+' — '+fmtMoney(t.amount)+')', ()=>{
    t.deleted = true;
    recomputeGirviPrincipal(g);
    logHistory('Girvi','Transaction Deleted', `${t.type} of ${fmtMoney(t.amount)} removed from ${g.customerName}'s girvi (${g.itemDesc})`);
    saveDB(); toast('Transaction deleted'); viewGirvi(girviId);
  });
}

function saveGirviTx(id, type){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const amt = parseFloat(document.getElementById('gtxAmount').value)||0;
  const date = document.getElementById('gtxDate').value || todayStr();
  const note = document.getElementById('gtxNote').value || '';
  if(amt<=0){ toast('Enter a valid amount'); return; }
  g.transactions = g.transactions || [];
  g.transactions.push({id:uid('GTX'), date, type, amount:amt, note});
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  if(type==='Additional Loan') g.outstandingPrincipal = principal + amt;
  else if(type==='Part Payment') g.outstandingPrincipal = Math.max(principal - amt, 0);
  else if(type==='Interest Received') g.lastInterestDate = date;
  logHistory('Girvi', type, `${type} of ${fmtMoney(amt)} for ${g.customerName} (${g.itemDesc})`);
  saveDB(); closeModal(); toast('Entry saved'); renderGirvi();
}
function redeemGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const bal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;

    g.transactions.push({id:uid('GTX'), date:todayStr(), type:'Redeemed', amount:bal, note:'Loan closed / item redeemed'});
    logHistory('Girvi','Redeemed', `${g.itemDesc} redeemed by ${g.customerName}`);

function forfeitGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  askOwnerApproval('Forfeiting means the shop keeps the item permanently since the customer did not repay. This requires owner approval.', ()=>{
    g.status='forfeited';
    g.transactions.push({id:uid('GTX'), date:todayStr(), type:'Forfeited', amount:0, note:'Item forfeited to shop'});

   PAGE: CREDIT / UDHAAR
===================================================================== */
function renderCredit(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openCreditForm()">+ Add Entry</button></div>`;
  html += `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">`;
  const totalDue = DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0);
  const customersWithDue = DB.customers.filter(c=>customerBalance(c.id)>0).length;
  html += `<div class="statCard"><div class="lbl">Total Outstanding</div><div class="val">${fmtMoney(totalDue)}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Customers with Due</div><div class="val">${customersWithDue}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Total Customers</div><div class="val">${DB.customers.length}</div></div>`;
  html += `</div>`;
  html += `<div class="card"><table><tr><th>Customer</th><th>Phone</th><th>Balance Due</th><th></th></tr>`;
  const withBal = DB.customers.map(c=>({c,bal:customerBalance(c.id)})).sort((a,b)=>b.bal-a.bal);
  if(withBal.length===0) html += `<tr><td colspan="4"><div class="empty"><div class="big">📒</div>No customers yet.</div></td></tr>`;
  withBal.forEach(({c,bal})=>{
    html += `<tr><td>${c.name}</td><td>${c.phone||'-'}</td><td>${bal>0?'<b style="color:var(--danger)">'+fmtMoney(bal)+'</b>':fmtMoney(bal)}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View Ledger</button></td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openCreditForm(prefillName){
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>${T('customer')} *</label><input list="custList4" id="crCustomer" value="${prefillName?prefillName:''}">

      <div class="field"><label>Entry Type</label><select id="crType"><option value="debit">Udhaar Given (they owe more)</option><option value="credit">Payment Received (reduce due)</option></select></div>

    </div>
    <div class="field" style="margin-top:12px;"><label>Note</label><input id="crDesc" placeholder="Reason / description"></div>

function saveCredit(){
  const name = document.getElementById('crCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  const cust = findOrCreateCustomer(name,'');
  const amt = parseFloat(document.getElementById('crAmount').value)||0;

  const crDate = document.getElementById('crDate').value || todayStr();
  DB.creditEntries.push({id:uid('CR'), customerId:cust.id, date:crDate, type, amount:amt, description:document.getElementById('crDesc').value||'Manual entry', createdAt:nowISO()});

function saveEx(id){

  const oldVal=parseFloat(document.getElementById('exOldVal').value)||0, newVal=parseFloat(document.getElementById('exNewVal').value)||0;

  if(id){
    const e = DB.exchange.find(x=>x.id===id); if(!e) return;

  let html = `<table><tr><th>Name</th><th>Phone</th><th>Balance</th><th>Sales</th><th>Girvi</th><th></th></tr>`;

function viewCustomerLedger(id){
  const c = DB.customers.find(x=>x.id===id); if(!c) return;
  const sales = DB.sales.filter(s=>s.customerId===id && !s.deleted);
  const girvi = DB.girvi.filter(g=>g.customerId===id && !g.deleted);
  const credit = DB.creditEntries.filter(e=>e.customerId===id && !e.deleted);
  const jobs = DB.jobs.filter(j=>j.customerId===id && !j.deleted);
  let body = `<div class="grid grid-2" style="margin-bottom:10px;"><div><b>Phone:</b> ${c.phone||'-'}</div><div><b>Balance:</b> ${fmtMoney(customerBalance(id))}</div></div>`;

function renderHistory(){
  let html = `<div class="card"><div class="searchBar"><input id="histSearch" placeholder="Search history..." oninput="renderHistTable()"></div><div id="histTableWrap"></div></div>`;
  document.getElementById('content').innerHTML = html;

function renderHistTable(){
  const q=(document.getElementById('histSearch')?.value||'').toLowerCase();
  let rows = DB.history.filter(h=> !q || h.description.toLowerCase().includes(q) || h.module.toLowerCase().includes(q));
  let html = `<table><tr><th>Time</th><th>Module</th><th>Action</th><th>Description</th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="4"><div class="empty"><div class="big">🕘</div>No history recorded yet.</div></td></tr>`;
  rows.slice(0,300).forEach(h=> html += `<tr><td>${new Date(h.ts).toLocaleString('en-IN')}</td><td>${h.module}</td><td>${h.action}</td><td>${h.description}</td></tr>`);
  html += `</table>`;
  document.getElementById('histTableWrap').innerHTML = html;
}

function renderReports(){
  const today = todayStr();
  const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);

  const sumSales = (from) => DB.sales.filter(s=>!s.void && !s.deleted && s.date>=from).reduce((a,s)=>a+s.grandTotal,0);

  let html = `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">
    <div class="statCard"><div class="lbl">Sales — Today</div><div class="val">${fmtMoney(sumSales(today))}</div></div>

    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 7 Days</div><div class="val">${fmtMoney(sumBuy(weekAgo))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 30 Days</div><div class="val">${fmtMoney(sumBuy(monthAgo))}</div></div>
  </div>`;
  html += `<div class="grid grid-2">`;
  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Outstanding Summary</h3>
    <table><tr><td>Total Credit Due</td><td>${fmtMoney(DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0))}</td></tr>
    <tr><td>Active Girvi Loans</td><td>${fmtMoney(DB.girvi.filter(g=>g.status==='active' && !g.deleted).reduce((a,g)=>a+(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount),0))}</td></tr>
    <tr><td>Pending Jobs</td><td>${DB.jobs.filter(j=>j.status!=='delivered' && !j.deleted).length}</td></tr>
    <tr><td>Items In Stock</td><td>${DB.inventory.filter(i=>i.status==='in-stock' && !i.deleted).length}</td></tr></table></div>`;
  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Expenses (30 Days)</h3>
    <table>${DB.expenses.filter(e=>e.date>=monthAgo && !e.deleted).map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.category}</td><td>${fmtMoney(e.amount)}</td></tr>`).join('') || '<tr><td colspan="3" class="helpText">No expenses logged.</td></tr>'}</table></div>`;

}

/* =====================================================================
   PAGE: WHOLESALER KHATA — separate ledger per supplier (e.g. Hiraraja
   Jamnalal), tracking purity, silver/gold owed and labour charges.
===================================================================== */
function wholesalerBalance(wholesalerId){
  let silverOwed=0, goldOwed=0, cashOwed=0;
  DB.wholesalerEntries.filter(e=>e.wholesalerId===wholesalerId && !e.deleted).forEach(e=>{
    if(e.type==='purchase'){
      if(e.metal==='Gold') goldOwed += e.pureWeight; else silverOwed += e.pureWeight;
      cashOwed += Number(e.labourCharge||0);
    } else {
      if(e.metal==='Gold') goldOwed -= e.pureWeight; else silverOwed -= e.pureWeight;
      cashOwed -= Number(e.cashPaid||0);
    }
  });
  return {silverOwed, goldOwed, cashOwed};
}
function renderWholesaler(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openWholesalerForm()">+ Add Wholesaler</button></div>`;
  const activeWholesalers = DB.wholesalers.filter(w=>!w.deleted);
  if(activeWholesalers.length===0){
    html += `<div class="card"><div class="empty"><div class="big">📇</div>No wholesalers added yet. Add Hiraraja Jamnalal or your other suppliers to start their kata.</div></div>`;
  } else {
    const totals = activeWholesalers.reduce((a,w)=>{ const b=wholesalerBalance(w.id); a.silver+=Math.max(b.silverOwed,0); a.cash+=Math.max(b.cashOwed,0); return a; }, {silver:0,cash:0});
    html += `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">
      <div class="statCard"><div class="lbl">Total Wholesalers</div><div class="val">${activeWholesalers.length}</div></div>
      <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Total Silver Owed</div><div class="val">${fmtWt(totals.silver)}</div></div>
      <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Total Cash/Labour Owed</div><div class="val">${fmtMoney(totals.cash)}</div></div>
    </div>`;
    html += `<div class="grid grid-3">`;
    activeWholesalers.forEach(w=>{
      const bal = wholesalerBalance(w.id);
      html += `<div class="wsCard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="wsName">${w.name}</div>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="guardEdit('wholesaler', ()=>openWholesalerForm('${w.id}'))">✎</button>
            <button class="btn btn-sm btn-danger" onclick="deleteWholesaler('${w.id}')">🗑</button>
          </div>
        </div>
        <div class="helpText">${w.phone||''}</div>
        <div class="wsBalRow"><span>Silver: <b>${fmtWt(bal.silverOwed)}</b></span></div>
        <div class="wsBalRow"><span>Gold: <b>${fmtWt(bal.goldOwed)}</b></span><span>Cash/Labour: <b>${fmtMoney(bal.cashOwed)}</b></span></div>
        <button class="btn btn-sm btn-outline" style="margin-top:10px;" onclick="viewWholesalerKata('${w.id}')">Open Kata</button>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('content').innerHTML = html;
}
function openWholesalerForm(id){
  const w = id ? DB.wholesalers.find(x=>x.id===id) : null;
  const body = `
    <div class="field"><label>Wholesaler Name *</label><input id="whName" placeholder="e.g. Hiraraja Jamnalal" value="${w?w.name:''}"></div>
    <div class="field" style="margin-top:12px;"><label>Phone</label><input id="whPhone" value="${w?w.phone||'':''}"></div>

      }
      DB.wholesalers.push({id:uid('WHS'), name, phone:document.getElementById('whPhone').value, notes:document.getElementById('whNotes').value, createdAt:nowISO()});
      logHistory('Wholesaler','Added', name+' added as wholesaler');

function deleteWholesaler(id){
  const w = DB.wholesalers.find(x=>x.id===id); if(!w) return;

  </table>`;
  openModal(w.name+' — Kata', body, [
    {label:'Close', cls:'btn-ghost', onClick:closeModal},
    {label:'+ Purchase Entry', cls:'btn-outline', onClick:()=>{ closeModal(); openWholesalerEntryForm(id,'purchase'); }},
    {label:'+ Payment Entry', cls:'btn-primary', onClick:()=>{ closeModal(); openWholesalerEntryForm(id,'payment'); }}

    <div class="grid grid-3" style="margin-top:12px;">

    </div>
    ${isPurchase?`<div class="field" style="margin-top:12px;"><label>Labour Charge (₹, cash owed)</label><input type="number" id="weLabour" value="${e?e.labourCharge||'':''}"></div>`
      :`<div class="field" style="margin-top:12px;"><label>Cash Paid (₹, reduces due)</label><input type="number" id="weCashPaid" value="${e?e.cashPaid||'':''}"></div>`}
    <div class="field" style="margin-top:12px;"><label>Note</label><input id="weNote" value="${e?e.note||'':''}"></div>
  `;
  openModal((e?'Edit ':'')+(isPurchase?'Wholesaler Purchase Entry':'Wholesaler Payment Entry'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:e?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>saveWholesalerEntry(wholesalerId,type,editId)}
  ]);
  weRecalc();
}
function weRecalc(){
  const w = parseFloat(document.getElementById('weWeight')?.value)||0;
  const p = parseFloat(document.getElementById('wePurity')?.value);
  const pf = isNaN(p)?1:(p/100);
  const out = document.getElementById('wePureOut');
  if(out) out.value = fmtWt(w*pf);
}
function saveWholesalerEntry(wholesalerId, type, editId){
  const weight = parseFloat(document.getElementById('weWeight').value)||0;
  const purity = parseFloat(document.getElementById('wePurity').value);
  const pf = isNaN(purity)?1:(purity/100);
  const w = DB.wholesalers.find(x=>x.id===wholesalerId);
  if(editId){
    const e = DB.wholesalerEntries.find(x=>x.id===editId); if(!e) return;
    e.date = document.getElementById('weDate').value||e.date; e.metal = document.getElementById('weMetal').value;
    e.purity = isNaN(purity)?100:purity; e.weight = weight; e.pureWeight = weight*pf;
    e.itemDesc = type==='purchase' ? (document.getElementById('weItem')?.value||'') : e.itemDesc;
    e.labourCharge = type==='purchase' ? (parseFloat(document.getElementById('weLabour')?.value)||0) : 0;
    e.cashPaid = type==='payment' ? (parseFloat(document.getElementById('weCashPaid')?.value)||0) : 0;
    e.note = document.getElementById('weNote').value||'';
    logHistory('Wholesaler', type+' Edited', `${type} entry for ${w?w.name:''} edited — ${fmtWt(e.pureWeight)}`);
    saveDB(); closeModal(); toast('Entry updated'); renderWholesaler();
    return;
  }
  const e = {
    id: uid('WE'), wholesalerId, date: document.getElementById('weDate').value||todayStr(), createdAt: nowISO(),
    type, metal: document.getElementById('weMetal').value, purity: isNaN(purity)?100:purity,
    weight, pureWeight: weight*pf,
    itemDesc: type==='purchase' ? (document.getElementById('weItem')?.value||'') : '',
    labourCharge: type==='purchase' ? (parseFloat(document.getElementById('weLabour')?.value)||0) : 0,
    cashPaid: type==='payment' ? (parseFloat(document.getElementById('weCashPaid')?.value)||0) : 0,
    note: document.getElementById('weNote').value||''
  };
  DB.wholesalerEntries.push(e);
  logHistory('Wholesaler', type, `${type} entry for ${w?w.name:''} — ${fmtWt(e.pureWeight)}`);
  saveDB(); closeModal(); toast('Entry saved'); renderWholesaler();
}
function deleteWholesalerEntry(wholesalerId, entryId){
  const e = DB.wholesalerEntries.find(x=>x.id===entryId); if(!e) return;
  guardDelete('wholesaler entry ('+e.type+')', ()=>{
    e.deleted = true;
    logHistory('Wholesaler','Entry Deleted', `${e.type} entry deleted`);
    saveDB(); toast('Entry deleted'); viewWholesalerKata(wholesalerId);
  });
}

/* =====================================================================
   PAGE: CALCULATOR — a standard calculator plus a dedicated jewellery
   rate calculator (weight × purity% × rate + making).
===================================================================== */
let calcExpr='';
function renderCalculator(){
  let html = `<div class="pillTabs">
    <div class="pillTab active" data-t="std" onclick="setCalcTab(this,'std')">Standard Calculator</div>
    <div class="pillTab" data-t="jewel" onclick="setCalcTab(this,'jewel')">Jewellery Rate Calculator</div>
  </div>
  <div id="calcStdWrap" class="card" style="max-width:420px;"></div>
  <div id="calcJewelWrap" class="card hidden" style="max-width:520px;"></div>`;
  document.getElementById('content').innerHTML = html;
  renderStdCalc(); renderJewelCalc();
}
function setCalcTab(el, t){
  document.querySelectorAll('#content .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active');
  document.getElementById('calcStdWrap').classList.toggle('hidden', t!=='std');
  document.getElementById('calcJewelWrap').classList.toggle('hidden', t!=='jewel');
}
function renderStdCalc(){
  const wrap = document.getElementById('calcStdWrap');
  wrap.innerHTML = `
    <div class="calcScreen"><div class="expr" id="calcExprOut">&nbsp;</div><div class="val" id="calcValOut">0</div></div>
    <div class="calcGrid">
      <button class="calcBtn clear" onclick="calcPress('C')">C</button>
      <button class="calcBtn clear" onclick="calcPress('BACK')">⌫</button>
      <button class="calcBtn op" onclick="calcPress('%')">%</button>
      <button class="calcBtn op" onclick="calcPress('/')">÷</button>
      <button class="calcBtn" onclick="calcPress('7')">7</button>
      <button class="calcBtn" onclick="calcPress('8')">8</button>
      <button class="calcBtn" onclick="calcPress('9')">9</button>
      <button class="calcBtn op" onclick="calcPress('*')">×</button>
      <button class="calcBtn" onclick="calcPress('4')">4</button>
      <button class="calcBtn" onclick="calcPress('5')">5</button>
      <button class="calcBtn" onclick="calcPress('6')">6</button>
      <button class="calcBtn op" onclick="calcPress('-')">−</button>
      <button class="calcBtn" onclick="calcPress('1')">1</button>
      <button class="calcBtn" onclick="calcPress('2')">2</button>
      <button class="calcBtn" onclick="calcPress('3')">3</button>
      <button class="calcBtn op" onclick="calcPress('+')">+</button>
      <button class="calcBtn" onclick="calcPress('0')">0</button>
      <button class="calcBtn" onclick="calcPress('.')">.</button>
      <button class="calcBtn eq" onclick="calcPress('=')">=</button>
    </div>`;
  updateCalcDisplay();
}
function calcPress(k){
  if(k==='C'){ calcExpr=''; }
  else if(k==='BACK'){ calcExpr = calcExpr.slice(0,-1); }
  else if(k==='='){
    try{
      if(!/^[0-9+\-*/.% ]+$/.test(calcExpr)) throw new Error('invalid');
      const result = Function('"use strict";return ('+calcExpr.replace(/%/g,'/100')+')')();
      calcExpr = String(Math.round(result*100)/100);
    }catch(e){ calcExpr='Error'; }
  } else { calcExpr += k; }
  updateCalcDisplay();
}
function updateCalcDisplay(){
  const v=document.getElementById('calcValOut'); const e=document.getElementById('calcExprOut');
  if(v) v.textContent = calcExpr || '0';
}
function renderJewelCalc(){
  const wrap = document.getElementById('calcJewelWrap');
  wrap.innerHTML = `
    <p class="helpText" style="margin-top:0;">Same formula used across Sales, Buying and Girvi: weight × purity% = pure weight, then pure weight × rate + making = total.</p>
    <div class="grid grid-2">
      <div class="field"><label>${T('weight')}</label><input type="number" step="0.001" id="jcWeight" oninput="jcRecalc()"></div>
      <div class="field"><label>${T('purity')} %</label><input type="number" id="jcPurity" value="100" oninput="jcRecalc()"></div>
      <div class="field"><label>${T('rate')} (per gram)</label><input type="number" id="jcRate" oninput="jcRecalc()"></div>
      <div class="field"><label>${T('making')} (₹)</label><input type="number" id="jcMaking" value="0" oninput="jcRecalc()"></div>
    </div>
    <div class="totalsBox" id="jcOut"></div>
  `;
  jcRecalc();
}
function jcRecalc(){
  const w=parseFloat(document.getElementById('jcWeight')?.value)||0;
  const p=parseFloat(document.getElementById('jcPurity')?.value); const pf=isNaN(p)?1:(p/100);
  const r=parseFloat(document.getElementById('jcRate')?.value)||0;
  const m=parseFloat(document.getElementById('jcMaking')?.value)||0;
  const pureWt = w*pf; const amount = pureWt*r+m;
  const out = document.getElementById('jcOut');
  if(out) out.innerHTML = `
    <div class="totalsRow"><span>Pure Weight</span><span>${fmtWt(pureWt)}</span></div>
    <div class="totalsRow"><span>Metal Value</span><span>${fmtMoney(pureWt*r)}</span></div>
    <div class="totalsRow"><span>${T('making')}</span><span>${fmtMoney(m)}</span></div>
    <div class="totalsRow grand"><span>Total</span><span>${fmtMoney(amount)}</span></div>`;
}

        <button class="btn ${DB.meta.language==='hi'?'btn-primary':'btn-ghost'}" onclick="setLanguage('hi')">हिंदी</button>

function saveShopInfo(){
  DB.meta.shopName = document.getElementById('setShopName').value;
  DB.meta.location = document.getElementById('setLocation').value;
  document.getElementById('brandName').textContent = DB.meta.shopName;
  document.getElementById('brandLoc').textContent = DB.meta.location.toUpperCase();
  document.getElementById('lockTitle').textContent = DB.meta.shopName;
  saveDB(); toast('Shop info saved');
}
function saveRates(){
  DB.currentRates = {
    gold24: parseFloat(document.getElementById('setGold24').value)||0,
    gold22: parseFloat(document.getElementById('setGold22').value)||0,
    silverKg: parseFloat(document.getElementById('setSilverKg').value)||0,
    updatedAt: nowISO()
  };
  DB.rateHistory.push({...DB.currentRates});
  logHistory('Rates','Updated', `Gold24: ${DB.currentRates.gold24}, Gold22: ${DB.currentRates.gold22}, Silver/kg: ${DB.currentRates.silverKg}`);
  saveDB(); toast('Rates updated');
}
function saveSecurity(){
  DB.meta.pin = document.getElementById('setPin').value||DB.meta.pin;
  DB.meta.ownerPin = document.getElementById('setOwnerPin').value||DB.meta.ownerPin;
  DB.meta.discountApprovalThresholdPct = parseFloat(document.getElementById('setThreshold').value)||3;
  saveDB(); toast('Security settings saved');
}
function addStaff(){
  const name = document.getElementById('newStaffName').value.trim();
  if(!name){ toast('Enter staff name'); return; }
  DB.staff.push({id:uid('STF'), name, role:document.getElementById('newStaffRole').value, pin:'0000'});
  logHistory('Staff','Added', name+' added as '+document.getElementById('newStaffRole').value);
  saveDB(); renderSettings(); toast('Staff added');
}
function doBackup(){
  DB.meta.lastBackupAt = nowISO(); saveDB();
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'gayatri-jewellers-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logHistory('Backup','Created','Backup file downloaded');
  toast('Backup downloaded');
}
document.getElementById('restoreFileInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      confirmAction('Restoring will replace ALL current data on this tablet with the backup file. Continue?', ()=>{
        DB = data; saveDB(); location.reload();
      });
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
function setLanguage(l){ DB.meta.language=l; saveDB(); renderNav(); goTo(currentPage); toast(l==='hi'?'भाषा बदली गई':'Language changed'); }

/* =====================================================================
   PIN LOCK LOGIC
===================================================================== */
let pinBuffer='';
function renderPinPad(){
  const grid = document.getElementById('padGrid'); grid.innerHTML='';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className='padBtn'+(k===''?' hidden':''); b.textContent=k;
    if(k!=='') b.onclick = ()=> handlePinKey(k);
    grid.appendChild(b);
  });
  updatePinDots();
}
function updatePinDots(){
  const dots = document.getElementById('pinDots'); dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='pinDot'+(i<pinBuffer.length?' filled':''); dots.appendChild(d); }
}
function handlePinKey(k){
  document.getElementById('lockError').textContent='';
  if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if(pinBuffer.length>=6) return;
  pinBuffer += k; updatePinDots();
  if(pinBuffer.length===DB.meta.pin.length){
    if(pinBuffer===DB.meta.pin){ unlockApp(); }
    else{ document.getElementById('lockError').textContent='Incorrect PIN, try again.'; setTimeout(()=>{pinBuffer='';updatePinDots();},450); }
  }
}
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('shell').classList.add('active');
  pinBuffer='';
  init();
}
function lockNow(){
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('shell').classList.remove('active');
  pinBuffer=''; updatePinDots();
}
document.getElementById('lockNowBtn').addEventListener('click', lockNow);
document.getElementById('quickBackupBtn').addEventListener('click', doBackup);
document.getElementById('langEnBtn').addEventListener('click', ()=>{ setLanguage('en'); syncLangToggle(); });
document.getElementById('langHiBtn').addEventListener('click', ()=>{ setLanguage('hi'); syncLangToggle(); });
function syncLangToggle(){
  document.getElementById('langEnBtn').className = DB.meta.language==='en'?'active':'';
  document.getElementById('langHiBtn').className = DB.meta.language==='hi'?'active':'';
}

function updateClock(){
  const el = document.getElementById('topDateTime'); if(!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString(DB.meta.language==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const timeStr = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  el.textContent = dateStr + '  •  ' + timeStr;
}
function init(){
  document.getElementById('brandName').textContent = DB.meta.shopName;
  document.getElementById('brandLoc').textContent = DB.meta.location.split(',')[0].toUpperCase()+', '+ (DB.meta.location.split(',')[1]||'').toUpperCase();
  renderNav(); renderRateStrip(); syncLangToggle();
  goTo('dashboard');
  updateClock();
  if(!window._clockInterval) window._clockInterval = setInterval(updateClock, 30000);
}
document.getElementById('lockTitle').textContent = DB.meta.shopName;
renderPinPad();
