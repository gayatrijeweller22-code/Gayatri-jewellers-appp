<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#450D17;
  --maroon-light:#8C2233;
  --gold:#AD8A3B;
  --gold-light:#E4D4A7;
  --gold-pale:#F3EAD1;
  --bg:#F2ECDD;
  --paper:#FFFFFF;
  --ink:#2B2320;
  --ink-soft:#6B5F55;
  --line:#E2D8C2;
  --silver-accent:#7C8794;
  --success:#2F7A4F;
  --success-bg:#E4F0E7;
  --danger:#AD3B32;
  --danger-bg:#F5E4E1;
  --warn-bg:#FBEFD9;
  --radius:10px;
  --shadow:0 2px 10px rgba(69,13,23,0.08);
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--maroon-dark),var(--maroon) 60%,#5A1420);
  display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;
}
.seal{
  width:92px;height:92px;border-radius:50%;border:3px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:30px;color:var(--gold-light);letter-spacing:1px;margin-bottom:18px;
  box-shadow:0 0 0 4px rgba(228,212,167,0.15);
}
.lockCard{
  background:rgba(255,255,255,0.06);border:1px solid rgba(228,212,167,0.35);
  border-radius:16px;padding:36px 40px;text-align:center;min-width:340px;
  backdrop-filter:blur(2px);
}
.lockCard h1{font-family:var(--font-display);color:#fff;font-size:26px;margin:0 0 2px;letter-spacing:.5px;}
.lockCard p.sub{color:var(--gold-light);margin:0 0 22px;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.pinDots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pinDot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold-light);background:transparent;transition:.15s;}
.pinDot.filled{background:var(--gold-light);}
.padGrid{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center;margin-top:10px;}
.padBtn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(228,212,167,0.5);background:rgba(255,255,255,0.05);color:#fff;font-size:22px;}
.padBtn:active{background:var(--gold);color:var(--maroon-dark);}
.padBtn.wide{grid-column:span 1;font-size:14px;}
#lockError{color:#FFC9C0;font-size:13px;height:18px;margin-top:8px;}
#lockHint{color:rgba(255,255,255,.55);font-size:12px;margin-top:14px;}

/* ---------- SHELL ---------- */
#shell{display:none;height:100vh;width:100vw;grid-template-columns:230px 1fr;}
#shell.active{display:grid;}
#sidebar{
  background:var(--maroon-dark);color:#fff;display:flex;flex-direction:column;
  padding:18px 0;overflow-y:auto;
}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(228,212,167,0.2);margin-bottom:10px;display:flex;gap:10px;align-items:center;}
.brand .mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold-light);font-size:15px;flex-shrink:0;}
.brand .txt h2{font-family:var(--font-display);font-size:15px;margin:0;line-height:1.2;color:#fff;}
.brand .txt span{font-size:10px;color:var(--gold-light);letter-spacing:1px;}

<script>
/* =====================================================================
   GAYATRI JEWELLERS — OFFLINE SHOP MANAGER
   Single-file offline ERP. All data in localStorage. No network calls.
===================================================================== */

const DB_KEY = 'gj_erp_db_v1';
const uid = (p='ID') => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmtWt = (n) => (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:3}) + ' g';
/* Days between a given date (YYYY-MM-DD) and today (or a second date if given).
   Used across Girvi ageing, interest calculation, and the backup-reminder banner. */
const daysBetween = (fromISODate, toISODate) => {
  if(!fromISODate) return 0;
  const a = new Date(String(fromISODate).slice(0,10)+'T00:00:00'), b = new Date((toISODate||todayStr())+'T00:00:00');
  if(isNaN(a.getTime())) return 0;
  return Math.max(Math.round((b-a)/86400000), 0);
};

function defaultDB(){
  return {
    meta:{
      shopName:'Gayatri Jewellers', location:'Soni Gali, Sarwan, Madhya Pradesh, India',
      startDate:'2024-01-22', pin:'1234', ownerPin:'9999', language:'en',
      discountApprovalThresholdPct: 3, lastBackupAt:null,
      gstin:'', bisLicenceNo:'', signatureLine:'For Gayatri Jewellers',
      billTermsNote:'Goods once sold will not be taken back or exchanged except as per shop policy. All disputes subject to local jurisdiction.',
      autoLockMinutes: 0, backupReminderDays: 3
    },
    rateHistory:[],
    currentRates:{ gold24:9800, gold22:8990, silverKg:88000, updatedAt: nowISO() },
    marketRates:{ goldUsdOz:null, silverUsdOz:null, usdInr:null, fxSource:null, fetchedAt:null, source:null, lastError:null, mcxPremiumPctGold:15, mcxPremiumPctSilver:25 },
    customers:[],
    sales:[], buying:[], girvi:[], creditEntries:[], inventory:[], jobs:[], exchange:[],
    expenses:[], cashDays:[], staff:[{id:uid('STF'),name:'Owner',role:'owner',pin:'1234'}],
    wholesalers:[], wholesalerEntries:[],
    stockLots:[], components:[], inventoryMovements:[],
    todos:[],
    history:[]
  };
}
/* Backward-compatible migration: fills in any fields added in later app updates
   without touching or erasing existing shop data. */
function migrateDB(d){
  if(!d.wholesalers) d.wholesalers=[];
  if(!d.wholesalerEntries) d.wholesalerEntries=[];
  if(!d.marketRates) d.marketRates={ goldUsdOz:null, silverUsdOz:null, usdInr:null, fxSource:null, fetchedAt:null, source:null, lastError:null, mcxPremiumPctGold:15, mcxPremiumPctSilver:25 };
  else {
    const old = d.marketRates.mcxPremiumPct;
    if(d.marketRates.mcxPremiumPctGold===undefined) d.marketRates.mcxPremiumPctGold = (old!==undefined?old:15);
    if(d.marketRates.mcxPremiumPctSilver===undefined) d.marketRates.mcxPremiumPctSilver = (old!==undefined?Math.max(old,25):25);
    delete d.marketRates.mcxPremiumPct;
    // The USD-INR default used to be a stale hardcoded 88 — if it looks like
    // nobody ever adjusted it and no live fetch has happened, clear it so the
    // widget prompts a fresh fetch instead of silently using an old number.
    if(d.marketRates.usdInr===88 && !d.marketRates.fetchedAt) d.marketRates.usdInr = null;
    if(d.marketRates.fxSource===undefined) d.marketRates.fxSource = null;
    if(d.marketRates.lastError===undefined) d.marketRates.lastError = null;
  }
  if(d.meta && d.meta.discountApprovalThresholdPct===undefined) d.meta.discountApprovalThresholdPct=3;
  if(d.meta){
    if(d.meta.gstin===undefined) d.meta.gstin='';
    if(d.meta.bisLicenceNo===undefined) d.meta.bisLicenceNo='';
    if(d.meta.signatureLine===undefined) d.meta.signatureLine='For '+(d.meta.shopName||'the shop');
    if(d.meta.billTermsNote===undefined) d.meta.billTermsNote='Goods once sold will not be taken back or exchanged except as per shop policy. All disputes subject to local jurisdiction.';
    if(d.meta.autoLockMinutes===undefined) d.meta.autoLockMinutes=0;
    if(d.meta.backupReminderDays===undefined) d.meta.backupReminderDays=3;
  }
  (d.girvi||[]).forEach(g=>{
    if(!g.transactions){
      g.transactions=[{id:uid('GTX'), date:g.date, type:'Loan Given', amount:g.loanAmount, note:'Initial girvi loan'}];
    }
    if(g.photo===undefined) g.photo=null;
    if(g.outstandingPrincipal===undefined){
      let principal = g.loanAmount||0;
      g.transactions.forEach(t=>{
        if(t.type==='Additional Loan') principal += t.amount;
        if(t.type==='Part Payment') principal -= t.amount;
      });
      g.outstandingPrincipal = Math.max(principal,0);
    }
    if(g.referenceName===undefined) g.referenceName='';
    if(g.linkedBuyingId===undefined) g.linkedBuyingId=null;
    if(g.forwards===undefined) g.forwards=[];
    if(g.notes===undefined) g.notes='';
  });
  (d.sales||[]).forEach(s=>{ (s.items||[]).forEach(i=>{ if(i.purity===undefined || i.purity==='') i.purity=100; if(i.stoneWeight===undefined) i.stoneWeight=0; }); });
  (d.buying||[]).forEach(b=>{ if(b.purity===undefined || b.purity==='') b.purity=100; if(b.linkedGirviId===undefined) b.linkedGirviId=null; if(b.notes===undefined) b.notes=''; });
  (d.customers||[]).forEach(c=>{
    if(c.photo===undefined) c.photo=null;
    if(c.village===undefined) c.village='';
    if(c.referredBy===undefined) c.referredBy='';
    if(c.familyLink===undefined) c.familyLink='';
    if(c.tags===undefined) c.tags='';
    if(c.notes===undefined) c.notes='';
    if(c.creditEnabled===undefined){
      // Backward-compatible: any customer who already has real credit entries
      // stays visible in Credit — opt-in only applies going forward.
      c.creditEnabled = (d.creditEntries||[]).some(e=>e.customerId===c.id && !e.deleted);
    }
  });
  (d.creditEntries||[]).forEach(e=>{ if(e.dueDate===undefined) e.dueDate=''; });
  (d.inventory||[]).forEach(i=>{
    ['subcategory','designGroup','size','pairSingle','style','stoneOrNot','customAttr','batchNo','karigarSource','remarks','weightType','sourceType','wholesalerId'].forEach(f=>{
      if(i[f]===undefined) i[f]='';
    });
    if(i.pieceCount===undefined) i.pieceCount=1;
    if(i.actualPurity===undefined) i.actualPurity='';
    if(i.billingPurity===undefined) i.billingPurity='';
    if(i.wholesalerMakingPerGram===undefined) i.wholesalerMakingPerGram='';
    if(i.wholesalerRateUsed===undefined) i.wholesalerRateUsed='';
    if(i.linkedSaleId===undefined) i.linkedSaleId=null;
    // Masterclass inventory fields — additive only, never touches old values.
    ['grossWeight','netWeight','stoneType','stoneCount','stoneCarat','stoneColor','stoneClarity',
     'huid','hallmarkNumber','hallmarkCertDetails','location','mfgDate','tags',
     'linkedGirviId','linkedExchangeId','linkedJobId','lotId'].forEach(f=>{
      if(i[f]===undefined) i[f]='';
    });
    if(i.costPrice===undefined) i.costPrice='';
    if(i.sellingPrice===undefined) i.sellingPrice='';
    if(i.hallmarkStatus===undefined) i.hallmarkStatus = i.huid ? 'Hallmarked' : 'Not Hallmarked';
    if(i.location===undefined || i.location==='') i.location='Showcase';
    if(!Array.isArray(i.photos)) i.photos = i.photo ? [i.photo] : [];
  });
  if(!d.stockLots) d.stockLots=[];
  if(!d.todos) d.todos=[];
  if(!d.components) d.components=[];
  if(!d.inventoryMovements) d.inventoryMovements=[];
  (d.jobs||[]).forEach(j=>{ if(j.karigarName===undefined) j.karigarName=''; if(j.linkedInventoryId===undefined) j.linkedInventoryId=null; if(j.wastage===undefined) j.wastage=null; });
  (d.girvi||[]).forEach(g=>{ if(g.linkedInventoryId===undefined) g.linkedInventoryId=null; });
  (d.exchange||[]).forEach(e=>{ if(e.linkedInventoryId===undefined) e.linkedInventoryId=null; });
  return d;
}
let DB = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) { const d=defaultDB(); localStorage.setItem(DB_KEY, JSON.stringify(d)); return d; }
    return migrateDB(JSON.parse(raw));
  }catch(e){ return defaultDB(); }
}

function openGlobalSearch(){
  const body = `
    <input id="globalSearchInput" placeholder="Search name, phone, bill no, item, amount, date..." style="width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;" oninput="runGlobalSearch(this.value)">
    <div id="globalSearchResults" style="margin-top:14px;max-height:55vh;overflow-y:auto;"></div>
  `;
  openModal('Search Everything', body, [{label:'Close', cls:'btn-ghost', onClick:closeModal}]);
  setTimeout(()=>document.getElementById('globalSearchInput')?.focus(), 50);
}
function runGlobalSearch(qRaw){
  const box = document.getElementById('globalSearchResults'); if(!box) return;
  const q = (qRaw||'').trim().toLowerCase();
  if(q.length<2){ box.innerHTML = `<p class="helpText">Type at least 2 characters to search.</p>`; return; }
  const groups = [];

  const custMatches = DB.customers.filter(c=>c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.village||'').toLowerCase().includes(q));
  if(custMatches.length) groups.push({label:'Customers', items: custMatches.map(c=>({text:`${c.name}${c.phone?' — '+c.phone:''}${c.village?' — '+c.village:''}`, action:()=>{ closeModal(); viewCustomerLedger(c.id); }}))});

  const saleMatches = DB.sales.filter(s=>!s.deleted && (s.billNo.toLowerCase().includes(q) || s.customerName.toLowerCase().includes(q) || s.date.includes(q) || String(s.grandTotal).includes(q) || s.items.some(i=>i.itemName.toLowerCase().includes(q))));
  if(saleMatches.length) groups.push({label:'Sales', items: saleMatches.slice(0,20).map(s=>({text:`${s.billNo} — ${s.customerName} — ${fmtMoney(s.grandTotal)} — ${fmtDate(s.date)}`, action:()=>{ closeModal(); viewSale(s.id); }}))});

  const girviMatches = DB.girvi.filter(g=>!g.deleted && (g.customerName.toLowerCase().includes(q) || (g.itemDesc||'').toLowerCase().includes(q) || (g.referenceName||'').toLowerCase().includes(q) || g.date.includes(q)));
  if(girviMatches.length) groups.push({label:'Girvi', items: girviMatches.slice(0,20).map(g=>({text:`${g.customerName} — ${g.itemDesc} — ${fmtMoney(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount)} — ${g.status}`, action:()=>{ closeModal(); viewGirvi(g.id); }}))});

  const invMatches = DB.inventory.filter(i=>!i.deleted && (i.itemName.toLowerCase().includes(q) || i.code.toLowerCase().includes(q)));
  if(invMatches.length) groups.push({label:'Inventory', items: invMatches.slice(0,20).map(i=>({text:`${i.code} — ${i.itemName} — ${fmtWt(i.weight)} — ${i.status}`, action:()=>{ closeModal(); goTo('inventory'); }}))});

  const creditMatches = DB.creditEntries.filter(e=>!e.deleted && ((e.description||'').toLowerCase().includes(q) || String(e.amount).includes(q)));
  if(creditMatches.length) groups.push({label:'Credit Entries', items: creditMatches.slice(0,20).map(e=>{ const cust=DB.customers.find(c=>c.id===e.customerId); return {text:`${cust?cust.name:'?'} — ${e.type} — ${fmtMoney(e.amount)} — ${fmtDate(e.date)}`, action:()=>{ closeModal(); if(cust) viewCustomerLedger(cust.id); }}; })});


  if(groups.length===0){ box.innerHTML = `<div class="empty"><div class="big">🔍</div>No matches for "${qRaw}".</div>`; return; }
  box.innerHTML = groups.map(g=>`<div class="searchResultGroup"><h5>${g.label} (${g.items.length})</h5>${g.items.map((it,idx)=>`<div class="searchResultRow" data-g="${g.label}" data-i="${idx}">${it.text}</div>`).join('')}</div>`).join('');
  window._globalSearchGroups = groups;
  box.querySelectorAll('.searchResultRow').forEach(row=>{
    row.addEventListener('click', ()=>{
      const g = window._globalSearchGroups.find(x=>x.label===row.dataset.g);
      if(g) g.items[Number(row.dataset.i)].action();
    });
  });
}

function findOrCreateCustomer(name, phone){
  name=(name||'').trim(); if(!name) return null;
  let c = DB.customers.find(x=>x.name.toLowerCase()===name.toLowerCase() && (!phone || x.phone===phone));
  if(!c){
    c = {id:uid('CUS'), name, phone:phone||'', address:'', notes:'', createdAt:nowISO(), creditEnabled:false, village:'', referredBy:'', familyLink:'', tags:'', photo:null};
    DB.customers.push(c);
    logHistory('Customer','Created','New customer added: '+name);
  }
  return c;
}
function customerBalance(customerId){
  let bal=0;
  DB.creditEntries.filter(e=>e.customerId===customerId && !e.deleted).forEach(e=>{ bal += (e.type==='debit'? e.amount : -e.amount); });
  return bal;
}

  return DB.customers.map(c=>`<option value="${c.id}">${c.name}${c.phone?' — '+c.phone:''}</option>`).join('');
}

  });
  return list;
}

        <option value="due">Due / Credit</option>
        <option value="void">Void</option>
      </select>
    </div>
    <div id="salesTableWrap"></div>
  </div>`;

function filterSalesTable(){
  const q = (document.getElementById('saleSearch')?.value||'').toLowerCase();
  const sortBy = document.getElementById('saleSort')?.value||'date_desc';
  const statusF = document.getElementById('saleStatusFilter')?.value||'';
  let rows = [...DB.sales].filter(s=>!s.deleted);
  if(q) rows = rows.filter(s => s.billNo.toLowerCase().includes(q) || s.customerName.toLowerCase().includes(q) || s.items.some(i=>i.itemName.toLowerCase().includes(q)) || String(s.grandTotal).includes(q));
  if(statusF==='paid') rows = rows.filter(s=>!s.void && s.grandTotal-s.amountPaid<=0);
  else if(statusF==='due') rows = rows.filter(s=>!s.void && s.grandTotal-s.amountPaid>0);
  else if(statusF==='void') rows = rows.filter(s=>s.void);
  const sorters = {
    date_desc: (a,b)=> b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt),
    date_asc: (a,b)=> a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt),
    amount_desc: (a,b)=> b.grandTotal-a.grandTotal,
    amount_asc: (a,b)=> a.grandTotal-b.grandTotal,
    customer: (a,b)=> a.customerName.localeCompare(b.customerName),
    balance_desc: (a,b)=> (b.grandTotal-b.amountPaid)-(a.grandTotal-a.amountPaid)
  };
  rows.sort(sorters[sortBy]||sorters.date_desc);
  let html = `<table><tr><th>Date</th><th>Bill No</th><th>Customer</th><th>Item(s)</th><th>Weight</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="10"><div class="empty"><div class="big">🧾</div>No sales match.</div></td></tr>`;
  rows.forEach(s=>{
    const wt = s.items.reduce((a,i)=>a+Number(i.weight||0),0);
    const itemNames = s.items.map(i=>i.itemName).filter(Boolean).join(', ');
    html += `<tr>
      <td>${fmtDate(s.date)}</td><td>${s.billNo}</td><td>${s.customerName}</td>
      <td style="max-width:180px;">${itemNames||'-'}</td><td>${fmtWt(wt)}</td>
      <td>${fmtMoney(s.grandTotal)}</td><td>${fmtMoney(s.amountPaid)}</td><td>${fmtMoney(s.grandTotal-s.amountPaid)}</td>
      <td>${s.void?'<span class="tag tag-red">VOID</span>':(s.grandTotal-s.amountPaid<=0?'<span class="tag tag-green">Paid</span>':'<span class="tag tag-gold">Due</span>')}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="viewSale('${s.id}')">View</button></td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById('salesTableWrap').innerHTML = html;
}

function recalcSaleTotals(){
  let sub=0, wt=0, pureWt=0;
  saleDraftItems.forEach(it=>{
    const purity = (it.purity===undefined||it.purity==='') ? 100 : Number(it.purity);
    const pw = (Number(it.weight)||0) * (purity/100);
    pureWt += pw; wt += Number(it.weight||0);
    sub += (pw*(it.rate||0)) + Number(it.making||0);
  });
  const discount = parseFloat(document.getElementById('saleDiscount')?.value)||0;
  const grand = Math.max(sub-discount,0);
  const pct = sub>0 ? (discount/sub*100) : 0;
  document.getElementById('saleTotalsBox').innerHTML = `
    <div class="totalsRow"><span>Total Weight</span><span>${fmtWt(wt)}</span></div>
    <div class="totalsRow"><span>Pure Weight (by purity)</span><span>${fmtWt(pureWt)}</span></div>
    <div class="totalsRow"><span>Subtotal</span><span>${fmtMoney(sub)}</span></div>
    <div class="totalsRow"><span>${T('discount')}</span><span>- ${fmtMoney(discount)}</span></div>
    <div class="totalsRow grand"><span>Grand Total</span><span>${fmtMoney(grand)}</span></div>`;
  const note = document.getElementById('saleApprovalNote');
  if(note){
    if(pct > DB.meta.discountApprovalThresholdPct){
      note.innerHTML = `<div class="approveBox">⚠️ Discount is ${pct.toFixed(1)}%, above the ${DB.meta.discountApprovalThresholdPct}% limit. Owner approval will be required to save this bill.</div>`;
    } else note.innerHTML='';
  }
}
function saveSale(){
  const custName = document.getElementById('saleCustomer').value.trim();
  if(!custName){ toast('Please enter customer name'); return; }
  if(saleDraftItems.length===0 || saleDraftItems.every(i=>!i.itemName)){ toast('Add at least one item'); return; }
  const phone = document.getElementById('salePhone').value.trim();
  const discount = parseFloat(document.getElementById('saleDiscount').value)||0;
  const payMode = document.getElementById('salePayMode').value;
  const saleDate = document.getElementById('saleDate').value || todayStr();
  const manualPaid = document.getElementById('saleAmountPaid').value;
  let sub=0; saleDraftItems.forEach(it=>{ const purity=(it.purity===undefined||it.purity==='')?100:Number(it.purity); const pw=(it.weight||0)*(purity/100); sub += (pw*(it.rate||0))+Number(it.making||0); });
  const pct = sub>0 ? (discount/sub*100):0;

  const finalize = ()=>{
    const cust = findOrCreateCustomer(custName, phone);
    const grand = Math.max(sub-discount,0);
    const amountPaid = manualPaid!=='' ? (parseFloat(manualPaid)||0) : ((payMode==='Full Credit') ? 0 : grand);
    const cleanItems = saleDraftItems.filter(i=>i.itemName).map(i=>({...i, purity:(i.purity===undefined||i.purity==='')?100:Number(i.purity)}));
    if(editingSaleId){
      const s = DB.sales.find(x=>x.id===editingSaleId);
      // Release any inventory items that were linked to this sale before, so relinking is clean
      DB.inventory.filter(inv=>inv.linkedSaleId===s.id).forEach(inv=>{
        inv.status='available'; inv.linkedSaleId=null; inv.soldDate=null;
        logInventoryMovement(inv.id, 'Sold → Available', {toLocation:inv.location||'Showcase', reference:s.billNo, notes:'Unlinked before re-saving edited bill'});
      });
      s.customerId=cust.id; s.customerName=cust.name; s.date=saleDate; s.items=cleanItems;
      s.subTotal=sub; s.discount=discount; s.discountPct=pct; s.grandTotal=grand; s.paymentMode=payMode; s.amountPaid=amountPaid;
      applyInventoryDeduction(s);
      logHistory('Sales','Edited', `Bill ${s.billNo} edited for ${cust.name} — new total ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale updated: '+s.billNo); renderSales();
    } else {
      const sale = {
        id: uid('SAL'), billNo: 'INV-'+(DB.sales.length+1001), date: saleDate, createdAt: nowISO(),
        customerId: cust.id, customerName: cust.name, items: cleanItems,
        subTotal: sub, discount, discountPct: pct, grandTotal: grand, paymentMode: payMode, amountPaid, void:false
      };
      DB.sales.push(sale);
      applyInventoryDeduction(sale);
      if(amountPaid < grand){
        DB.creditEntries.push({id:uid('CR'), customerId:cust.id, date:saleDate, type:'debit', amount: grand-amountPaid, description:'Sale '+sale.billNo, createdAt: nowISO()});
      }
      logHistory('Sales','Created', `Bill ${sale.billNo} for ${cust.name} — ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale saved: '+sale.billNo); renderSales();
    }
  };

  if(pct > DB.meta.discountApprovalThresholdPct){
    askOwnerApproval(`This bill has a discount of ${pct.toFixed(1)}%, above the allowed ${DB.meta.discountApprovalThresholdPct}%. Owner PIN is required to proceed.`, ()=>finalize());
  } else finalize();
}
/* Marks every inventory item linked to this sale's items as sold, and logs it.
   Called on both new sales and edits (edits release old links first). */
function applyInventoryDeduction(sale){
  sale.items.forEach(it=>{
    if(!it.linkedInventoryId) return;
    const inv = DB.inventory.find(x=>x.id===it.linkedInventoryId && !x.deleted);
    if(!inv) return;
    const oldLoc = inv.location;
    inv.status = 'sold'; inv.soldDate = sale.date; inv.linkedSaleId = sale.id; inv.qty = Math.max((Number(inv.qty)||1)-1, 0);
    logInventoryMovement(inv.id, 'Available → Sold', {fromLocation:oldLoc, toLocation:'Customer', weightChange:-(Number(inv.weight)||0), reference:sale.billNo, notes:'Sold via bill '+sale.billNo});
    logHistory('Inventory','Sold', `${inv.itemName} (${inv.code}) sold via bill ${sale.billNo} — weight ${fmtWt(inv.weight)} and 1 unit removed from available stock`);
  });
}
/* Reverses the sold status on any inventory linked to this sale — used when
   a bill is voided or deleted, so stock stays accurate. */
function releaseInventoryForSale(sale){
  DB.inventory.filter(inv=>inv.linkedSaleId===sale.id).forEach(inv=>{
    inv.status='available'; inv.linkedSaleId=null; inv.soldDate=null; inv.qty = (Number(inv.qty)||0)+1;
    logInventoryMovement(inv.id, 'Sold → Available', {fromLocation:'Customer', toLocation:inv.location||'Showcase', weightChange:(Number(inv.weight)||0), reference:sale.billNo, notes:'Bill voided/deleted — item returned to stock'});
    logHistory('Inventory','Returned to Stock', `${inv.itemName} (${inv.code}) returned to stock — bill ${sale.billNo} was voided/deleted`);
  });
}

function numberToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'Zero Rupees Only';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:''); }
  function threeDigit(n){ if(n<100) return twoDigit(n); return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+twoDigit(n%100):''); }
  let n = num, parts=[];
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thousand=Math.floor(n/1000); n%=1000;
  const rest=n;
  if(crore) parts.push(threeDigit(crore)+' Crore');
  if(lakh) parts.push(threeDigit(lakh)+' Lakh');
  if(thousand) parts.push(threeDigit(thousand)+' Thousand');
  if(rest) parts.push(threeDigit(rest));
  return (parts.join(' ')||'Zero')+' Rupees Only';
}

/* ---------------------- Generic receipt printer: Buying / Girvi / Jobs ---------------------- */
/* =====================================================================
   MINIMAL PDF GENERATOR — pure vanilla JS, no external library, so it
   works fully offline. Produces a valid multi-page PDF from plain text
   lines using the built-in Helvetica base font. Note: PDF base fonts
   only support Latin-1 text, so ₹ is rendered as "Rs" and any Hindi/
   non-Latin characters are shown as "?" in the PDF specifically
   (print and on-screen Rupee/Hindi text elsewhere are unaffected).
===================================================================== */
function escapePdfText(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function toPdfSafeText(s){ return String(s).replace(/₹/g,'Rs ').replace(/[^\x00-\xFF]/g,'?'); }
/* ---------------------------------------------------------------------
   RICH PDF DRAWING ENGINE — absolute-position text + filled rectangles
   + accurate text width (real Helvetica AFM widths), so PDFs can match
   the app's actual maroon/gold visual design instead of plain text.
--------------------------------------------------------------------- */
const HELV_WIDTHS = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584];
function pdfTextWidth(text, size){
  let w=0;
  for(const ch of String(text)){
    const code = ch.charCodeAt(0);
    w += (code>=32 && code<=126) ? HELV_WIDTHS[code-32] : 556;
  }
  return w*size/1000;
}
function pdfColor(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  return [r,g,b];
}
function PdfPage(){
  this.ops = [];
}
PdfPage.prototype.rect = function(x,y,w,h,colorHex){
  const [r,g,b]=pdfColor(colorHex);
  this.ops.push(`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg\n${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f\n`);
};
PdfPage.prototype.strokeRect = function(x,y,w,h,colorHex,lineWidth){
  const [r,g,b]=pdfColor(colorHex);
  this.ops.push(`${lineWidth||1} w\n${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} RG\n${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re S\n`);
};
PdfPage.prototype.line = function(x1,y1,x2,y2,colorHex,lineWidth){
  const [r,g,b]=pdfColor(colorHex||'#000000');
  this.ops.push(`${lineWidth||1} w\n${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} RG\n${x1.toFixed(1)} ${y1.toFixed(1)} m ${x2.toFixed(1)} ${y2.toFixed(1)} l S\n`);
};
PdfPage.prototype.text = function(x,y,str,opts){
  opts = opts||{};
  const size = opts.size||10;
  const safe = toPdfSafeText(str);
  const font = opts.bold ? '/F2' : (opts.italic ? '/F3' : '/F1');
  const w = pdfTextWidth(safe, size);
  let tx = x;
  if(opts.align==='right') tx = x-w; else if(opts.align==='center') tx = x-w/2;
  const [r,g,b]=pdfColor(opts.colorHex||'#000000');
  this.ops.push(`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg\nBT ${font} ${size} Tf ${tx.toFixed(1)} ${y.toFixed(1)} Td (${escapePdfText(safe)}) Tj ET\n`);
  return w;
};
PdfPage.prototype.stream = function(){ return this.ops.join(''); };
function assemblePdfFromPages(pages){
  const pageWidth=595, pageHeight=842;
  const catalogNum=1, pagesNum=2, fontRegNum=3, fontBoldNum=4, fontItalicNum=5;
  let nextObjNum=6;
  const pageObjNums=[], contentObjNums=[], contentStrings=[];
  pages.forEach(pb=>{
    const contentNum=nextObjNum++; contentObjNums.push(contentNum);
    const pageNum=nextObjNum++; pageObjNums.push(pageNum);
    contentStrings.push(pb.stream());
  });
  const objMap = {};
  objMap[catalogNum] = `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`;
  objMap[pagesNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageObjNums.length} >>`;
  objMap[fontRegNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objMap[fontBoldNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;
  objMap[fontItalicNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique >>`;
  pageObjNums.forEach((pageNum,idx)=>{
    objMap[pageNum] = `<< /Type /Page /Parent ${pagesNum} 0 R /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R /F3 ${fontItalicNum} 0 R >> >> /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Contents ${contentObjNums[idx]} 0 R >>`;
  });
  contentObjNums.forEach((contentNum,idx)=>{
    const stream = contentStrings[idx];
    objMap[contentNum] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  const maxObjNum = nextObjNum-1;
  let pdf = '%PDF-1.4\n';
  const offsets = {};
  for(let n=1;n<=maxObjNum;n++){ offsets[n]=pdf.length; pdf += `${n} 0 obj\n${objMap[n]}\nendobj\n`; }
  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${maxObjNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxObjNum;n++){ pdf += String(offsets[n]).padStart(10,'0')+' 00000 n \n'; }
  pdf += `trailer\n<< /Size ${maxObjNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}

  pb.text(pageW/2, y-42, m.location, {size:9.5, colorHex:B.goldLight, align:'center'});

  pb.text(pageW/2, y-14, docTitle.toUpperCase(), {size:11, bold:true, colorHex:B.maroonDark, align:'center'});
  y -= 34;
  rows.forEach((r,idx)=>{
    if(idx%2===1) pb.rect(marginX, y-16, contentW, 16, '#FBF8F1');
    pb.text(marginX+6, y-11, String(r[0]), {size:9.5, bold:true, colorHex:B.inkSoft});
    pb.text(pageW-marginX-6, y-11, String(r[1]), {size:10, colorHex:B.ink, align:'right'});
    y -= 18;
  });
  if(extraNote){
    y -= 8;

    pb.text(marginX+6, y-16, String(extraNote).replace(/<[^>]+>/g,''), {size:8.5, colorHex:B.inkSoft});
    y -= 26;
  }
  y -= 24;
  pb.text(marginX+6, y, 'Thank you.', {size:9, colorHex:B.inkSoft});
  const bytes = assemblePdfFromPages([pb]);
  return new Blob([bytes], {type:'application/pdf'});
}

function buildPdfBytes(lineObjs){
  const pageWidth=595, pageHeight=842, marginX=50, topY=800, bottomY=50, defaultSize=10, defaultLeading=14;
  const laidOutPages = [];
  let y = topY, current = [];
  lineObjs.forEach(lo=>{
    const size = lo.size || defaultSize;
    const leading = lo.leading || (lo.big ? size+8 : defaultLeading);
    if(y - leading < bottomY){ laidOutPages.push(current); current=[]; y=topY; }
    current.push(Object.assign({}, lo, {y, size}));
    y -= leading;
  });
  laidOutPages.push(current);
  if(laidOutPages.length===0) laidOutPages.push([]);
  const catalogNum=1, pagesNum=2, fontRegNum=3, fontBoldNum=4;
  let nextObjNum=5;
  const pageObjNums=[], contentObjNums=[], contentStrings=[];
  laidOutPages.forEach(pageLines=>{
    const contentNum=nextObjNum++; contentObjNums.push(contentNum);
    const pageNum=nextObjNum++; pageObjNums.push(pageNum);
    let stream = '';
    pageLines.forEach(lo=>{
      if(lo.rule){
        stream += `${marginX} ${lo.y+4} m ${pageWidth-marginX} ${lo.y+4} l S\n`;
      } else if(lo.text!==undefined && lo.text!==null){
        const font = lo.bold ? '/F2' : '/F1';
        const x = lo.right ? (pageWidth-marginX-(lo.text.length*lo.size*0.52)) : marginX;
        stream += `BT ${font} ${lo.size} Tf ${x.toFixed(1)} ${lo.y} Td (${escapePdfText(lo.text)}) Tj ET\n`;
      }
    });
    contentStrings.push(stream);
  });
  const objMap = {};
  objMap[catalogNum] = `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`;
  objMap[pagesNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageObjNums.length} >>`;
  objMap[fontRegNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objMap[fontBoldNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;
  pageObjNums.forEach((pageNum,idx)=>{
    objMap[pageNum] = `<< /Type /Page /Parent ${pagesNum} 0 R /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >> >> /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Contents ${contentObjNums[idx]} 0 R >>`;
  });
  contentObjNums.forEach((contentNum,idx)=>{
    const stream = contentStrings[idx];
    objMap[contentNum] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  const maxObjNum = nextObjNum-1;
  let pdf = '%PDF-1.4\n';
  const offsets = {};
  for(let n=1;n<=maxObjNum;n++){ offsets[n]=pdf.length; pdf += `${n} 0 obj\n${objMap[n]}\nendobj\n`; }
  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${maxObjNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxObjNum;n++){ pdf += String(offsets[n]).padStart(10,'0')+' 00000 n \n'; }
  pdf += `trailer\n<< /Size ${maxObjNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}
/* Convenience: turn a flat array of plain strings into simple line objects
   (kept for any caller that still wants plain text-only PDFs). */
function pdfBlobFromLines(rawLines){
  const lineObjs = rawLines.map(l=>({text: toPdfSafeText(l)}));
  const bytes = buildPdfBytes(lineObjs);
  return new Blob([bytes], {type:'application/pdf'});
}
function pdfBlobFromLayout(lineObjs){
  const safe = lineObjs.map(lo=> lo.rule ? lo : Object.assign({}, lo, {text: lo.text!==undefined ? toPdfSafeText(lo.text) : lo.text}));
  const bytes = buildPdfBytes(safe);
  return new Blob([bytes], {type:'application/pdf'});
}
async function sharePdfBlob(blob, filename, title){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title});
      toast('PDF shared'); return;
    }
  }catch(err){ if(err.name==='AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('PDF downloaded — attach it manually in WhatsApp or any app');
}

function buildBillText(s){
  const m = DB.meta;
  const cust = DB.customers.find(c=>c.id===s.customerId);
  let lines = [];
  lines.push(`*${m.shopName}*`);
  lines.push(m.location);
  if(m.gstin) lines.push(`GSTIN: ${m.gstin}`);
  lines.push('');
  lines.push(`Bill No: *${s.billNo}*`);
  lines.push(`Date: ${new Date(s.createdAt||s.date).toLocaleString('en-IN')}`);
  lines.push(`Customer: ${s.customerName}${cust&&cust.phone?' ('+cust.phone+')':''}`);
  lines.push('');
  lines.push('Items:');
  s.items.forEach(i=>{
    const purity=(i.purity===undefined||i.purity==='')?100:i.purity;
    const pw=(i.weight||0)*(purity/100);
    const amt=pw*(i.rate||0)+Number(i.making||0);
    lines.push(`• ${i.itemName} — ${i.weight}g @ ${purity}% — ${fmtMoney(amt)}`);
  });
  lines.push('');
  lines.push(`Subtotal: ${fmtMoney(s.subTotal)}`);
  lines.push(`Discount: -${fmtMoney(s.discount)}`);
  lines.push(`*Total: ${fmtMoney(s.grandTotal)}*`);
  lines.push(`Paid (${s.paymentMode}): ${fmtMoney(s.amountPaid)}`);
  lines.push(`Balance: ${fmtMoney(s.grandTotal-s.amountPaid)}`);
  lines.push('');
  lines.push('Thank you for your business!');
  return lines.join('\n');
}

  }
}
function copyBillToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('Bill copied — paste it into WhatsApp or any app');
    }).catch(()=>{
      toast('Could not share or copy — try Print instead');
    });
  } else {
    toast('Sharing not supported on this browser — try Print instead');
  }
}

let editingBuyId = null;

function renderBuyTable(){
  const q = (document.getElementById('buySearch')?.value||'').toLowerCase();
  let rows = [...DB.buying].filter(b=>!b.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(q) rows = rows.filter(b=> b.customerName.toLowerCase().includes(q) || (b.itemDesc||'').toLowerCase().includes(q));
  let html = `<table><tr><th>Date</th><th>Customer</th><th>Item</th><th>Metal</th><th>Wt</th><th>Purity</th><th>Pure Wt</th><th>Rate</th><th>Amount</th><th></th></tr>`;

  rows.forEach(b=>{
    const purity = (b.purity===undefined||b.purity==='')?100:Number(b.purity);
    const pw = (Number(b.weight)||0) * (purity/100);
    html += `<tr><td>${fmtDate(b.date)}</td><td>${b.customerName}</td><td>${b.itemDesc}</td><td>${b.metal}</td><td>${fmtWt(b.weight)}</td><td>${purity}%</td><td>${fmtWt(pw)}</td><td>${fmtMoney(b.rateApplied)}</td><td>${fmtMoney(b.amount)}</td>

function buyRecalc(){
  const w = parseFloat(document.getElementById('buyWeight').value)||0;
  const purity = parseFloat(document.getElementById('buyPurity').value);
  const p = (purity===undefined||isNaN(purity)) ? 100 : purity;
  const r = parseFloat(document.getElementById('buyRate').value)||0;
  const pw = w*(p/100);
  document.getElementById('buyPureWtOut').textContent = fmtWt(pw);
  document.getElementById('buyAmountOut').textContent = fmtMoney(pw*r);
}
function saveBuy(){
  const name = document.getElementById('buyCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  const cust = findOrCreateCustomer(name, document.getElementById('buyPhone').value.trim());
  const weight = parseFloat(document.getElementById('buyWeight').value)||0;
  const purityRaw = parseFloat(document.getElementById('buyPurity').value);
  const purity = (purityRaw===undefined||isNaN(purityRaw)) ? 100 : purityRaw;
  const rate = parseFloat(document.getElementById('buyRate').value)||0;
  const pureWeight = weight*(purity/100);
  const date = document.getElementById('buyDate').value || todayStr();
  if(editingBuyId){
    const b = DB.buying.find(x=>x.id===editingBuyId);
    b.customerId=cust.id; b.customerName=cust.name; b.itemDesc=document.getElementById('buyItemDesc').value;
    b.metal=document.getElementById('buyMetal').value; b.purity=purity; b.weight=weight; b.rateApplied=rate;
    b.amount=pureWeight*rate; b.date=date; b.paymentMode=document.getElementById('buyPayMode').value;
    logHistory('Buying','Edited', `Purchase from ${cust.name} edited — ${fmtMoney(b.amount)}`);
    saveDB(); closeModal(); toast('Purchase updated'); renderBuying();
  } else {
    const b = {
      id: uid('BUY'), date, createdAt: nowISO(), customerId:cust.id, customerName:cust.name,
      itemDesc: document.getElementById('buyItemDesc').value, metal: document.getElementById('buyMetal').value,
      purity, weight, rateApplied: rate, amount: pureWeight*rate,
      paymentMode: document.getElementById('buyPayMode').value

/* Reusable: compress any uploaded/captured photo to a small JPEG data URL
   so it can never overflow localStorage. Used by Girvi and Customer photos. */
function compressImageFile(file, maxDim, quality, onDone, onError){
  if(!file){ return; }
  if(!file.type || !file.type.startsWith('image/')){ toast('Please choose an image file'); if(onError) onError(); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ onDone(canvas.toDataURL('image/jpeg', quality)); }
      catch(err){ toast('Could not process this photo — try a different one'); if(onError) onError(); }
    };
    img.onerror = function(){ toast('Could not read this photo — try a different one'); if(onError) onError(); };
    img.src = evt.target.result;
  };
  reader.onerror = function(){ toast('Could not read this file'); if(onError) onError(); };
  reader.readAsDataURL(file);
}
function handleGirviPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  compressImageFile(file, 320, 0.6, (dataUrl)=>{

function recomputeGirviPrincipal(g){
  let p = 0, lastInterest = g.date;
  (g.transactions||[]).filter(t=>!t.deleted).forEach(t=>{
    if(t.type==='Loan Given' || t.type==='Additional Loan') p += t.amount;
    else if(t.type==='Part Payment') p -= t.amount;
    else if(t.type==='Interest Received') lastInterest = t.date;
    else if(t.type==='Redeemed') p = 0;
  });
  g.outstandingPrincipal = Math.max(p,0);
  g.lastInterestDate = lastInterest;
}
function deleteGirviTx(girviId, txId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const t = (g.transactions||[]).find(x=>x.id===txId); if(!t) return;
  if(t.type==='Loan Given'){ toast('Cannot delete the initial loan entry — delete the whole loan record instead if this was a mistake.'); return; }
  guardDelete('transaction ('+t.type+' — '+fmtMoney(t.amount)+')', ()=>{
    t.deleted = true;
    recomputeGirviPrincipal(g);
    logHistory('Girvi','Transaction Deleted', `${t.type} of ${fmtMoney(t.amount)} removed from ${g.customerName}'s girvi (${g.itemDesc})`);
    saveDB(); toast('Transaction deleted'); viewGirvi(girviId);
  });
}

    'Part Payment':'Amount paid towards the principal. This reduces the outstanding due.',
    'Additional Loan':'More money given to the customer against the same item. This increases the outstanding due.'
  }[type] || '';
  const body = `
    <p class="helpText" style="margin-top:0;">${help}</p>
    <div class="grid grid-2">
      <div class="field"><label>Date</label><input type="date" id="gtxDate" value="${todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Amount</label><input type="number" id="gtxAmount"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Note</label><input id="gtxNote" placeholder="Optional note"></div>
  `;
  openModal(type, body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:T('save'), cls:'btn-primary', onClick:()=>saveGirviTx(id,type)}
  ]);
}
function saveGirviTx(id, type){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const amt = parseFloat(document.getElementById('gtxAmount').value)||0;
  const date = document.getElementById('gtxDate').value || todayStr();
  const note = document.getElementById('gtxNote').value || '';
  if(amt<=0){ toast('Enter a valid amount'); return; }
  g.transactions = g.transactions || [];
  g.transactions.push({id:uid('GTX'), date, type, amount:amt, note});
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  if(type==='Additional Loan') g.outstandingPrincipal = principal + amt;
  else if(type==='Part Payment') g.outstandingPrincipal = Math.max(principal - amt, 0);
  else if(type==='Interest Received') g.lastInterestDate = date;
  logHistory('Girvi', type, `${type} of ${fmtMoney(amt)} for ${g.customerName} (${g.itemDesc})`);
  saveDB(); closeModal(); toast('Entry saved'); renderGirvi();
}
function redeemGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const bal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  confirmAction(`Outstanding principal is ${fmtMoney(bal)}. Mark this girvi item (${g.itemDesc}) as fully redeemed by ${g.customerName}? This closes the loan and stays in History.`, ()=>{
    g.status='redeemed'; g.redeemedDate=todayStr(); g.outstandingPrincipal=0;
    g.transactions.push({id:uid('GTX'), date:todayStr(), type:'Redeemed', amount:bal, note:'Loan closed / item redeemed'});
    logHistory('Girvi','Redeemed', `${g.itemDesc} redeemed by ${g.customerName}`);
    saveDB(); renderGirvi(); toast('Marked as redeemed');
  });
}
function openForfeitForm(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  const interest = girviInterestDue(g);
  const totalDue = principal + interest;
  const body = `
    <p class="helpText" style="margin-top:0;">Use this when a customer sells you the item they'd pledged, instead of redeeming it. Cutting the principal and accrued interest from what the item is worth, you hand over the remaining balance.</p>
    <div class="totalsBox">
      <div class="totalsRow"><span>Outstanding Principal</span><span>${fmtMoney(principal)}</span></div>
      <div class="totalsRow"><span>Accrued Interest (estimate)</span><span>${fmtMoney(interest)}</span></div>
      <div class="totalsRow grand"><span>Total Due</span><span>${fmtMoney(totalDue)}</span></div>
    </div>
    <div class="grid grid-2" style="margin-top:14px;">
      <div class="field"><label>Forfeit Date</label><input type="date" id="ffDate" value="${todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Final Settlement Amount Given to Customer</label><input type="number" id="ffSettlement" oninput="recalcForfeit(${totalDue})"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Extra — Above Principal + Interest</label><input type="number" id="ffExtra" readonly style="background:var(--bg);"></div>
    <div class="field" style="margin-top:12px;"><label>Notes</label><input id="ffNotes" placeholder="e.g. settled at today's market rate"></div>
    <div id="ffCalcOut" class="approveBox" style="margin-top:12px;"></div>
  `;
  openModal('Forfeit — Settle & Buy Item', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:'Confirm Forfeit', cls:'btn-danger', onClick:()=>saveForfeit(id, totalDue, principal, interest)}
  ]);
}
function recalcForfeit(totalDue){
  const settlement = parseFloat(document.getElementById('ffSettlement').value)||0;
  const extra = settlement - totalDue;
  document.getElementById('ffExtra').value = extra.toFixed(2);
  const out = document.getElementById('ffCalcOut');
  out.innerHTML = extra>=0
    ? `Settlement covers the full ${fmtMoney(totalDue)} due, plus <b>${fmtMoney(extra)}</b> extra paid to the customer for the item's value above the loan.`
    : `⚠️ Settlement of ${fmtMoney(settlement)} is <b>less</b> than the ${fmtMoney(totalDue)} due — customer is receiving less than what they owe (short-settlement of ${fmtMoney(-extra)}).`;
}
function saveForfeit(id, totalDue, principal, interest){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const settlement = parseFloat(document.getElementById('ffSettlement').value);
  if(isNaN(settlement) || settlement<0){ toast('Enter a valid settlement amount'); return; }
  const date = document.getElementById('ffDate').value || todayStr();
  const extra = settlement - totalDue;
  const notes = document.getElementById('ffNotes').value || '';
  askOwnerApproval('Forfeiting closes this girvi permanently and creates a Buying entry for the item. This requires owner approval.', ()=>{
    g.status = 'forfeited';
    g.outstandingPrincipal = 0;
    g.transactions = g.transactions || [];
    g.transactions.push({id:uid('GTX'), date, type:'Forfeited', amount:settlement, note:`Total due ${fmtMoney(totalDue)} (principal ${fmtMoney(principal)} + interest ${fmtMoney(interest)}), settlement ${fmtMoney(settlement)}${notes?' — '+notes:''}`});

    const buying = {
      id: uid('BUY'), date, createdAt: nowISO(), customerId: g.customerId, customerName: g.customerName,
      itemDesc: g.itemDesc+' (ex-girvi, forfeited)', metal: g.metal, purity: g.purity||100, weight: g.weight,
      rateApplied: g.weight>0 ? Math.round((settlement/((g.weight*(g.purity||100)/100))) * 100)/100 : 0,
      amount: settlement, paymentMode:'Cash', linkedGirviId: g.id, deleted:false,
      notes: `Forfeit settlement — principal ${fmtMoney(principal)} + interest ${fmtMoney(interest)} = due ${fmtMoney(totalDue)}; extra ${fmtMoney(extra)}${notes?'; '+notes:''}`
    };
    DB.buying.push(buying);
    g.linkedBuyingId = buying.id;

    if(g.linkedInventoryId){
      const inv = DB.inventory.find(x=>x.id===g.linkedInventoryId && !x.deleted);
      if(inv){
        const oldLoc = inv.location;
        inv.status = 'available'; inv.location = 'Showcase'; inv.linkedGirviId = null;
        logInventoryMovement(inv.id, 'Pledged → Forfeited (now shop stock)', {fromLocation:oldLoc, toLocation:'Showcase', reference:'Girvi forfeit', notes});
      }
    }
    logHistory('Girvi','Forfeited', `${g.itemDesc} forfeited for ${g.customerName} — settlement ${fmtMoney(settlement)}, Buying entry ${buying.id} created`);
    logHistory('Buying','Created (Auto)', `Auto-created from girvi forfeit: ${buying.itemDesc} — ${fmtMoney(settlement)}`);
    saveDB(); closeModal(); toast('Girvi forfeited — Buying entry created'); renderGirvi();
  });
}

function creditOldestOverdueInfo(custId){
  const debits = DB.creditEntries.filter(e=>e.customerId===custId && !e.deleted && e.type==='debit').sort((a,b)=>a.date.localeCompare(b.date));
  if(debits.length===0) return null;
  const oldest = debits[0];
  const dueDate = oldest.dueDate || null;
  const isOverdue = dueDate ? dueDate < todayStr() : daysBetween(oldest.date) > 30;
  return {oldestDate: oldest.date, dueDate, isOverdue, daysOld: daysBetween(oldest.date)};
}
function renderCredit(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><div style="display:flex;gap:10px;">
    <button class="btn btn-outline" onclick="openAddCreditCustomerForm()">+ Mark Customer as Credit</button>
    <button class="btn btn-primary" onclick="openCreditForm()">+ Add Entry</button>
  </div></div>`;
  const creditCustomers = DB.customers.filter(c=>c.creditEnabled);
  html += `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">`;
  const totalDue = creditCustomers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0);
  const customersWithDue = creditCustomers.filter(c=>customerBalance(c.id)>0).length;
  html += `<div class="statCard"><div class="lbl">Total Outstanding</div><div class="val">${fmtMoney(totalDue)}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Customers with Due</div><div class="val">${customersWithDue}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Credit Customers</div><div class="val">${creditCustomers.length}</div></div>`;
  html += `</div>`;
  html += `<p class="helpText" style="margin-bottom:10px;">Only customers you've intentionally marked for credit show here — not your full customer list.</p>`;
  html += `<div class="card">
    <div class="grid grid-3" style="margin-bottom:10px;">
      <input id="creditSearch" placeholder="Search by name or phone..." oninput="renderCreditTable()">
      <select id="creditSort" onchange="renderCreditTable()">
        <option value="balance_desc">Balance Due (High to Low)</option>
        <option value="balance_asc">Balance Due (Low to High)</option>
        <option value="name">Customer Name (A-Z)</option>
        <option value="oldest_date">Oldest Udhaar First</option>
        <option value="due_date">Due Date (Soonest)</option>
      </select>
      <select id="creditStatusFilter" onchange="renderCreditTable()">
        <option value="">All</option>
        <option value="due">Has Balance Due</option>
        <option value="overdue">Overdue</option>
        <option value="paid">Fully Paid</option>
      </select>
    </div>
    <div id="creditTableWrap"></div>
  </div>`;
  document.getElementById('content').innerHTML = html;
  renderCreditTable();
}
function renderCreditTable(){
  const q = (document.getElementById('creditSearch')?.value||'').toLowerCase();
  const sortBy = document.getElementById('creditSort')?.value||'balance_desc';
  const statusF = document.getElementById('creditStatusFilter')?.value||'';
  let rows = DB.customers.filter(c=>c.creditEnabled).map(c=>({c, bal:customerBalance(c.id), overdueInfo:creditOldestOverdueInfo(c.id)}));
  if(q) rows = rows.filter(({c})=> c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));
  if(statusF==='due') rows = rows.filter(({bal})=>bal>0);
  else if(statusF==='overdue') rows = rows.filter(({bal,overdueInfo})=>bal>0 && overdueInfo && overdueInfo.isOverdue);
  else if(statusF==='paid') rows = rows.filter(({bal})=>bal<=0);
  const sorters = {
    balance_desc: (a,b)=>b.bal-a.bal, balance_asc: (a,b)=>a.bal-b.bal,
    name: (a,b)=>a.c.name.localeCompare(b.c.name),
    oldest_date: (a,b)=> (a.overdueInfo?a.overdueInfo.oldestDate:'9999') .localeCompare(b.overdueInfo?b.overdueInfo.oldestDate:'9999'),
    due_date: (a,b)=> (a.overdueInfo&&a.overdueInfo.dueDate?a.overdueInfo.dueDate:'9999').localeCompare(b.overdueInfo&&b.overdueInfo.dueDate?b.overdueInfo.dueDate:'9999')
  };
  rows.sort(sorters[sortBy]||sorters.balance_desc);
  let html = `<table><tr><th>Customer</th><th>Phone</th><th>Balance Due</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="5"><div class="empty"><div class="big">📒</div>No matching credit customers. Tap "+ Mark Customer as Credit" to add one.</div></td></tr>`;
  rows.forEach(({c,bal,overdueInfo})=>{
    const isOverdue = bal>0 && overdueInfo && overdueInfo.isOverdue;
    const statusTag = bal<=0 ? '<span class="tag tag-green">Paid</span>' : (isOverdue ? '<span class="tag tag-red">Overdue</span>' : '<span class="tag tag-gold">Active Due</span>');
    html += `<tr style="${isOverdue?'background:#FBEAE8;':''}"><td>${c.name}</td><td>${c.phone||'-'}</td><td>${bal>0?'<b style="color:var(--danger)">'+fmtMoney(bal)+'</b>':fmtMoney(bal)}</td><td>${statusTag}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View Ledger</button>
    <button class="btn btn-sm btn-danger" onclick="unmarkCreditCustomer('${c.id}')">Remove from Credit</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('creditTableWrap').innerHTML = html;
}
function openAddCreditCustomerForm(){
  const eligible = DB.customers.filter(c=>!c.creditEnabled);
  const body = `
    <div class="field"><label>${T('customer')} *</label><input list="custListCr" id="acCustomer" placeholder="Type or select a customer">

function unmarkCreditCustomer(id){

function openCreditForm(prefillName){

function saveCredit(){

/* =====================================================================
   PAGE: INVENTORY — masterclass module.
   Item Master + Stock Lots + Components + Movement Ledger, all tabbed.
   Status/location vocabulary is ADDITIVE: old items stored with
   status:'in-stock' keep that value forever — invIsAvailable() treats
   'in-stock' and 'available' as the same thing everywhere, so nothing
   old needs to be rewritten.
===================================================================== */
const INV_STATUSES = ['available','reserved','under-repair','in-manufacturing','pledged','exchanged','damaged','melted','returned','sold'];
const INV_LOCATIONS = ['Showcase','Vault','Workshop','Repair','In Transit','Customer','Other'];
function invIsAvailable(item){ return item.status==='available' || item.status==='in-stock'; }
function invStatusLabel(status){
  if(status==='in-stock') return 'Available';
  return (status||'available').split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
}
function invStatusTagClass(status){
  if(invIsAvailable({status})) return 'tag-green';
  if(['reserved','under-repair','in-manufacturing'].includes(status)) return 'tag-gold';
  if(['pledged','damaged'].includes(status)) return 'tag-red';
  return 'tag-gray';
}
function logInventoryMovement(itemId, type, opts){
  opts = opts||{};
  DB.inventoryMovements.push({
    id: uid('MOV'), itemId, type, date: todayStr(), createdAt: nowISO(),
    fromLocation: opts.fromLocation||'', toLocation: opts.toLocation||'',
    weightChange: opts.weightChange||0, reference: opts.reference||'', notes: opts.notes||'', deleted:false
  });
}
function setInvStatus(id, newStatus, newLocation, reference, notes, silent){
  const item = DB.inventory.find(x=>x.id===id); if(!item) return;
  const oldStatus=item.status, oldLoc=item.location;
  item.status = newStatus; if(newLocation) item.location = newLocation;
  logInventoryMovement(id, invStatusLabel(oldStatus)+' → '+invStatusLabel(newStatus), {fromLocation:oldLoc, toLocation:item.location, reference, notes});
  logHistory('Inventory','Status Changed', `${item.itemName} (${item.code}): ${invStatusLabel(oldStatus)} → ${invStatusLabel(newStatus)}`);
  if(!silent) saveDB();
}
function renderInventory(){
  window._invTab = window._invTab || 'items';
  let html = `<div class="pillTabs">
    <div class="pillTab ${window._invTab==='items'?'active':''}" onclick="setInvTab(this,'items')">Item Master</div>
    <div class="pillTab ${window._invTab==='lots'?'active':''}" onclick="setInvTab(this,'lots')">Stock Lots</div>
    <div class="pillTab ${window._invTab==='components'?'active':''}" onclick="setInvTab(this,'components')">Components</div>
    <div class="pillTab ${window._invTab==='movements'?'active':''}" onclick="setInvTab(this,'movements')">Movements</div>
  </div>
  <div id="invTabBody"></div>`;
  document.getElementById('content').innerHTML = html;
  renderInvTabBody();
}
function setInvTab(el, tab){
  window._invTab = tab;
  document.querySelectorAll('#content .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active');
  renderInvTabBody();
}
function renderInvTabBody(){
  const wrap = document.getElementById('invTabBody'); if(!wrap) return;
  if(window._invTab==='items') renderInvItemsTab(wrap);
  else if(window._invTab==='lots') renderInvLotsTab(wrap);
  else if(window._invTab==='components') renderInvComponentsTab(wrap);
  else renderInvMovementsTab(wrap);
}

/* ---- ITEM MASTER ---- */
function renderInvItemsTab(wrap){
  const items = DB.inventory.filter(i=>!i.deleted);
  const totalWeight = {Gold:0, Silver:0};
  let totalValue = 0;
  items.filter(invIsAvailable).forEach(i=>{
    const purity = parseFloat(i.purity)||100;
    const pw = (Number(i.weight)||0)*(purity/100);
    if(i.category==='Gold') totalWeight.Gold += Number(i.weight)||0;
    else if(i.category==='Silver') totalWeight.Silver += Number(i.weight)||0;
    const rate = i.category==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
    totalValue += pw*rate;
  });
  let html = `<div class="statGrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px;">
    <div class="statCard"><div class="lbl">Available Items</div><div class="val">${items.filter(invIsAvailable).length}</div></div>
    <div class="statCard" style="border-color:var(--gold)"><div class="lbl">Gold / Silver Weight</div><div class="val" style="font-size:18px;">${fmtWt(totalWeight.Gold)} / ${fmtWt(totalWeight.Silver)}</div></div>
    <div class="statCard" style="border-color:var(--success)"><div class="lbl">Est. Stock Value</div><div class="val" style="font-size:18px;">${fmtMoney(totalValue)}</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Pledged / Repair / Mfg</div><div class="val" style="font-size:18px;">${items.filter(i=>i.status==='pledged').length} / ${items.filter(i=>i.status==='under-repair').length} / ${items.filter(i=>i.status==='in-manufacturing').length}</div></div>
  </div>`;
  html += `<div class="cardHead" style="margin-bottom:10px;"><div></div><button class="btn btn-primary" onclick="openInvForm()">+ Add Item</button></div>`;
  html += `<div class="card">
    <div class="grid grid-3" style="margin-bottom:12px;">
      <input id="invSearch" placeholder="Search item / code / HUID..." oninput="renderInvTable()">
      <select id="invStatusFilter" onchange="renderInvTable()"><option value="">All Statuses</option>${INV_STATUSES.map(s=>`<option value="${s}">${invStatusLabel(s)}</option>`).join('')}</select>
      <select id="invLocationFilter" onchange="renderInvTable()"><option value="">All Locations</option>${INV_LOCATIONS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
    </div>
    <div id="invTableWrap"></div>
  </div>`;
  wrap.innerHTML = html;
  renderInvTable();
}
function renderInvTable(){
  const q = (document.getElementById('invSearch')?.value||'').toLowerCase();
  const statusF = document.getElementById('invStatusFilter')?.value||'';
  const locF = document.getElementById('invLocationFilter')?.value||'';
  let rows = [...DB.inventory].filter(i=>!i.deleted).sort((a,b)=>b.addedDate.localeCompare(a.addedDate));
  if(q) rows = rows.filter(i=> [i.itemName,i.code,i.subcategory,i.designGroup,i.style,i.batchNo,i.karigarSource,i.huid,i.hallmarkNumber].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
  if(statusF) rows = rows.filter(i=> statusF==='available' ? invIsAvailable(i) : i.status===statusF);
  if(locF) rows = rows.filter(i=> (i.location||'Showcase')===locF);
  let html = `<table><tr><th>Code</th><th>Item</th><th>Category / Variant</th><th>Wt</th><th>Purity</th><th>Status</th><th>Location</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="8"><div class="empty"><div class="big">💍</div>No inventory items match.</div></td></tr>`;
  rows.forEach(i=>{
    const variantBits = [i.subcategory,i.designGroup,i.size,i.pairSingle,i.style,i.stoneOrNot].filter(Boolean);
    html += `<tr><td>${i.code}${i.huid?' <span class="helpText">HUID</span>':''}</td><td>${i.itemName}${i.pieceCount>1?' ('+i.pieceCount+' pc)':''}</td><td>${i.category}${variantBits.length?'<br><span class="helpText">'+variantBits.join(' • ')+'</span>':''}</td><td>${fmtWt(i.weight)}</td><td>${i.purity}</td>

    <td>${invIsAvailable(i)?`<button class="btn btn-sm btn-outline" onclick="markSold('${i.id}')">Mark Sold</button>`:''}

function viewInvDetails(id){

    ['Design Group', i.designGroup], ['Size', i.size], ['Pair / Single', i.pairSingle], ['Style', i.style],

    ['Weight Type', i.weightType], ['Piece Count', i.pieceCount], ['Gross Weight', i.grossWeight?fmtWt(i.grossWeight):''],
    ['Net Weight', i.netWeight?fmtWt(i.netWeight):''], ['Weight', fmtWt(i.weight)], ['Purity', i.purity], ['Qty', i.qty],
    ['Cost Price', i.costPrice?fmtMoney(i.costPrice):''], ['Selling Price', i.sellingPrice?fmtMoney(i.sellingPrice):''],
    ['HUID', i.huid], ['Hallmark No.', i.hallmarkNumber], ['Hallmark Status', i.hallmarkStatus],

    ['Location', i.location], ['Tags', i.tags], ['Remarks', i.remarks], ['Status', invStatusLabel(i.status)]
  ].filter(([k,v])=> v!==undefined && v!==null && v!=='');
  let body = `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;">
    <div style="flex-shrink:0;">${(i.photos&&i.photos[0])?`<img src="${i.photos[0]}" class="photoThumb" style="width:80px;height:80px;">`:`<div class="photoPlaceholder" style="width:80px;height:80px;">💍</div>`}</div>

      <span class="tag ${invStatusTagClass(i.status)}" style="margin-top:4px;display:inline-block;">${invStatusLabel(i.status)}</span>
      <span class="tag tag-gray" style="margin-top:4px;">${i.location||'Showcase'}</span>

  if(i.photos && i.photos.length>1){
    body += `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">${i.photos.map(p=>`<img src="${p}" class="photoThumb" style="width:56px;height:56px;">`).join('')}</div>`;
  }
  body += `<table>${rows.map(([k,v])=>`<tr><td style="font-weight:600;width:42%;">${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  if(i.sourceType==='Wholesaler Made' && i.billingPurity){
    const w = DB.wholesalers.find(x=>x.id===i.wholesalerId);
    const weight = Number(i.weight)||0, billingPurity = Number(i.billingPurity)||0, making = Number(i.wholesalerMakingPerGram)||0;
    let rate = Number(i.wholesalerRateUsed);
    if(!rate) rate = i.category==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
    const billedWeight = weight*(billingPurity/100);
    const totalCost = billedWeight*rate + weight*making;
    body += `<h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:16px 0 8px;">🏭 Wholesaler Making Cost</h4>
      <table>
        <tr><td style="font-weight:600;width:42%;">Wholesaler</td><td>${w?w.name:'-'}</td></tr>

        <tr><td style="font-weight:600;">Billed At Purity</td><td>${billingPurity}%</td></tr>
        <tr><td style="font-weight:600;">Making</td><td>${fmtMoney(making)}/g</td></tr>
        <tr><td style="font-weight:600;">Your Total Cost</td><td><b>${fmtMoney(totalCost)}</b></td></tr>
      </table>`;
  }
  if(i.costPrice && i.sellingPrice){
    const margin = Number(i.sellingPrice) - Number(i.costPrice);
    const marginPct = Number(i.costPrice)>0 ? (margin/Number(i.costPrice)*100) : 0;
    body += `<div class="approveBox" style="margin-top:14px;">💰 Estimated margin: <b>${fmtMoney(margin)}</b> (${marginPct.toFixed(1)}%)</div>`;
  }
  const movements = DB.inventoryMovements.filter(m=>m.itemId===id && !m.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  body += `<h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:16px 0 4px;">Movement Timeline</h4>

  const links = [];
  if(i.linkedGirviId) links.push({label:'View Linked Girvi', action:()=>{ closeModal(); viewGirvi(i.linkedGirviId); }});
  if(i.linkedJobId) links.push({label:'View Linked Job', action:()=>{ closeModal(); goTo('jobs'); }});
  if(i.linkedSaleId) links.push({label:'View Linked Sale', action:()=>{ closeModal(); viewSale(i.linkedSaleId); }});
  const foot = [{label:'Close', cls:'btn-ghost', onClick:closeModal}];
  foot.push({label:'🔀 Change Status/Location', cls:'btn-outline', onClick:()=>{ guardEdit('inventory item status', ()=>{ closeModal(); openInvStatusForm(id); }); }});
  foot.push({label:'🏷 Print Label', cls:'btn-gold', onClick:()=>printInvLabel(id)});
  links.forEach(l=> foot.push({label:l.label, cls:'btn-ghost', onClick:l.action}));
  openModal(i.itemName+' — Details', body, foot);
}

function handleInvPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  compressImageFile(file, 320, 0.6, (dataUrl)=>{
    invPhotoData.push(dataUrl);
    document.getElementById('invPhotoPreviewWrap').innerHTML = invPhotoData.map(p=>`<img src="${p}" class="photoThumb" style="width:56px;height:56px;">`).join('');
  });
}
function recalcInvCost(){
  const out = document.getElementById('invCostOut'); if(!out) return;
  const weight = parseFloat(document.getElementById('invWeight')?.value)||0;
  const billingPurity = parseFloat(document.getElementById('invBillingPurity')?.value);
  const making = parseFloat(document.getElementById('invWholesalerMaking')?.value)||0;
  let rate = parseFloat(document.getElementById('invWholesalerRate')?.value);
  if(!rate){
    const cat = document.getElementById('invCategory')?.value;
    rate = cat==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
  }
  if(!weight || isNaN(billingPurity)){ out.innerHTML = `<p class="helpText" style="margin:0;">Fill weight and billed purity to see your cost.</p>`; return; }
  const billedWeight = weight*(billingPurity/100);
  const metalCost = billedWeight*rate;
  const makingCost = weight*making;
  const totalCost = metalCost+makingCost;
  out.innerHTML = `
    <div class="totalsRow"><span>Billed Weight (${billingPurity}% of ${weight}g)</span><span>${fmtWt(billedWeight)}</span></div>
    <div class="totalsRow"><span>Metal Cost</span><span>${fmtMoney(metalCost)}</span></div>
    <div class="totalsRow"><span>Making Cost</span><span>${fmtMoney(makingCost)}</span></div>
    <div class="totalsRow grand"><span>Your Total Cost</span><span>${fmtMoney(totalCost)}</span></div>
  `;
}
function saveInv(id){
  const name = document.getElementById('invName').value;
  if(!name){ toast('Enter item name'); return; }
  const extra = {
    subcategory: document.getElementById('invSubcat').value, designGroup: document.getElementById('invDesignGroup').value,
    size: document.getElementById('invSize').value, pairSingle: document.getElementById('invPairSingle').value,
    style: document.getElementById('invStyle').value, stoneOrNot: document.getElementById('invStoneOrNot').value,
    weightType: document.getElementById('invWeightType').value, pieceCount: parseInt(document.getElementById('invPieceCount').value)||1,
    batchNo: document.getElementById('invBatchNo').value, karigarSource: document.getElementById('invKarigarSource').value,
    customAttr: document.getElementById('invCustomAttr').value, remarks: document.getElementById('invRemarks').value,
    sourceType: document.getElementById('invSourceType').value, wholesalerId: document.getElementById('invWholesalerId').value,
    actualPurity: document.getElementById('invActualPurity').value, billingPurity: document.getElementById('invBillingPurity').value,
    wholesalerMakingPerGram: document.getElementById('invWholesalerMaking').value, wholesalerRateUsed: document.getElementById('invWholesalerRate').value,
    grossWeight: document.getElementById('invGrossWeight').value, netWeight: document.getElementById('invNetWeight').value,
    stoneType: document.getElementById('invStoneType').value, stoneCount: document.getElementById('invStoneCount').value,
    stoneCarat: document.getElementById('invStoneCarat').value, stoneColor: document.getElementById('invStoneColor').value,
    huid: document.getElementById('invHuid').value, hallmarkNumber: document.getElementById('invHallmarkNo').value,
    hallmarkStatus: document.getElementById('invHallmarkStatus').value, hallmarkCertDetails: document.getElementById('invHallmarkCert').value,
    costPrice: document.getElementById('invCostPrice').value, sellingPrice: document.getElementById('invSellingPrice').value,
    location: document.getElementById('invLocation').value, mfgDate: document.getElementById('invMfgDate').value,
    tags: document.getElementById('invTags').value, photos: [...invPhotoData]
  };
  if(id){
    const item = DB.inventory.find(x=>x.id===id); if(!item) return;
    item.code=document.getElementById('invCode').value; item.category=document.getElementById('invCategory').value;
    item.itemName=name; item.weight=parseFloat(document.getElementById('invWeight').value)||0;
    item.purity=document.getElementById('invPurity').value; item.qty=parseInt(document.getElementById('invQty').value)||1;
    Object.assign(item, extra);
    logHistory('Inventory','Edited', `${item.itemName} (${item.code}) edited`);
    saveDB(); closeModal(); toast('Item updated'); renderInventory();
    return;
  }
  const item = {
    id:uid('INV'), code:document.getElementById('invCode').value, category:document.getElementById('invCategory').value,
    itemName:name, weight:parseFloat(document.getElementById('invWeight').value)||0,
    purity:document.getElementById('invPurity').value, qty:parseInt(document.getElementById('invQty').value)||1,
    status:'available', addedDate: todayStr(), ...extra
  };
  DB.inventory.push(item);
  logInventoryMovement(item.id, 'Added to Stock', {toLocation:item.location||'Showcase', reference:item.batchNo, notes:'Initial entry'});
  logHistory('Inventory','Added', `${item.itemName} (${item.code}) added to stock`);
  saveDB(); closeModal(); toast('Item added'); renderInventory();
}
function deleteInv(id){
  const item = DB.inventory.find(x=>x.id===id); if(!item) return;
  guardDelete('inventory item ('+item.itemName+')', ()=>{
    item.deleted = true;
    logHistory('Inventory','Deleted', `${item.itemName} (${item.code}) deleted`);
    saveDB(); renderInventory(); toast('Item deleted');
  });
}
function markSold(id){
  const it = DB.inventory.find(x=>x.id===id); if(!it) return;
  confirmAction(`Mark "${it.itemName}" as sold?`, ()=>{
    setInvStatus(id, 'sold', it.location, '', 'Marked sold directly from inventory');
    saveDB(); renderInventory(); toast('Marked as sold');
  });
}

/* ---- CODE 39 BARCODE + PRINT LABEL ---- */
const CODE39_PATTERNS = {
  '0':'NNNWWNWNN','1':'WNNWNNNNW','2':'NNWWNNNNW','3':'WNWWNNNNN','4':'NNNWWNNNW',
  '5':'WNNWWNNNN','6':'NNWWWNNNN','7':'NNNWNNWNW','8':'WNNWNNWNN','9':'NNWWNNWNN',
  'A':'WNNNNWNNW','B':'NNWNNWNNW','C':'WNWNNWNNN','D':'NNNNWWNNW','E':'WNNNWWNNN',
  'F':'NNWNWWNNN','G':'NNNNNWWNW','H':'WNNNNWWNN','I':'NNWNNWWNN','J':'NNNNWWWNN',
  'K':'WNNNNNNWW','L':'NNWNNNNWW','M':'WNWNNNNWN','N':'NNNNWNNWW','O':'WNNNWNNWN',
  'P':'NNWNWNNWN','Q':'NNNNNNWWW','R':'WNNNNNWWN','S':'NNWNNNWWN','T':'NNNNWNWWN',
  'U':'WWNNNNNNW','V':'NWWNNNNNW','W':'WWWNNNNNN','X':'NWNNWNNNW','Y':'WWNNWNNNN',
  'Z':'NWWNWNNNN','-':'NWNNNNWNW','.':'WWNNNNNWN',' ':'NWWNNNWNN','$':'NWNWNWNNN',
  '/':'NWNWNNNWN','+':'NWNNNWNWN','%':'NNNWNWNWN','*':'NWNNWNWNN'
};
function code39Compatible(text){ return /^[A-Z0-9 \-.$/+%]+$/.test(text); }
function renderCode39SVG(text, height){
  height = height||46;
  const raw = String(text).toUpperCase();
  const clean = code39Compatible(raw) ? raw : raw.replace(/[^A-Z0-9\-]/g,'');
  const chars = '*'+clean+'*';
  let x=0; const narrow=2, wide=5, gap=2; const bars=[];
  for(const ch of chars){
    const pattern = CODE39_PATTERNS[ch]; if(!pattern) continue;
    for(let k=0;k<pattern.length;k++){
      const isBar = k%2===0; const w = pattern[k]==='W'?wide:narrow;
      if(isBar) bars.push(`<rect x="${x}" y="0" width="${w}" height="${height}" fill="#000"/>`);
      x += w;
    }
    x += gap;
  }
  return `<svg viewBox="0 0 ${x} ${height}" width="100%" height="${height}" style="max-width:320px;">${bars.join('')}</svg>`;
}
function printInvLabel(id){

      <div class="field"><label>Old Item Value</label><input type="number" id="exOldVal" value="${e?e.oldValue:''}" oninput="exRecalc()"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>New Item Description</label><input id="exNewItem" value="${e?e.newItemDesc:''}"></div>
      <div class="field"><label>New Item Value</label><input type="number" id="exNewVal" value="${e?e.newValue:''}" oninput="exRecalc()"></div>
    </div>
    <div class="totalsBox"><div class="totalsRow grand"><span>Balance To Pay</span><span id="exBalOut">₹0</span></div></div>
  `;
  openModal(e?'Edit Exchange':T('newExchange'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:e?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>saveEx(id)}
  ]);
  exRecalc();
}
function exRecalc(){
  const o=parseFloat(document.getElementById('exOldVal').value)||0, n=parseFloat(document.getElementById('exNewVal').value)||0;
  document.getElementById('exBalOut').textContent = fmtMoney(n-o);
}
function saveEx(id){
  const name=document.getElementById('exCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  const cust = findOrCreateCustomer(name,'');
  const oldVal=parseFloat(document.getElementById('exOldVal').value)||0, newVal=parseFloat(document.getElementById('exNewVal').value)||0;
  const exDate = document.getElementById('exDate')?.value || todayStr();
  if(id){
    const e = DB.exchange.find(x=>x.id===id); if(!e) return;
    e.customerId=cust.id; e.customerName=cust.name; e.date=exDate;
    e.oldItemDesc=document.getElementById('exOldItem').value; e.oldValue=oldVal;
    e.newItemDesc=document.getElementById('exNewItem').value; e.newValue=newVal; e.balanceToPay=newVal-oldVal;
    logHistory('Exchange','Edited', `${cust.name}: ${e.oldItemDesc} → ${e.newItemDesc} edited`);
    saveDB(); closeModal(); toast('Exchange updated'); renderExchange();
    return;
  }
  const e={id:uid('EXC'), date:exDate, createdAt:nowISO(), customerId:cust.id, customerName:cust.name,
    oldItemDesc:document.getElementById('exOldItem').value, oldValue:oldVal,
    newItemDesc:document.getElementById('exNewItem').value, newValue:newVal, balanceToPay:newVal-oldVal};
  DB.exchange.push(e);
  logHistory('Exchange','Created', `${cust.name}: ${e.oldItemDesc} → ${e.newItemDesc}`);
  saveDB(); closeModal(); toast('Exchange saved'); renderExchange();
}
function deleteEx(id){
  const e = DB.exchange.find(x=>x.id===id); if(!e) return;
  guardDelete('exchange entry ('+e.oldItemDesc+' → '+e.newItemDesc+')', ()=>{
    e.deleted = true;
    logHistory('Exchange','Deleted', `Exchange for ${e.customerName} deleted`);
    saveDB(); renderExchange(); toast('Exchange deleted');
  });
}

function renderLedger(){

}
function renderLedgerList(){
