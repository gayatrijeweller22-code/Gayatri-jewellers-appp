  };
  if(id){
    const item = DB.inventory.find(x=>x.id===id); if(!item) return;
    item.code=document.getElementById('invCode').value; item.category=document.getElementById('invCategory').value;
    item.itemName=name; item.weight=parseFloat(document.getElementById('invWeight').value)||0;
    item.purity=document.getElementById('invPurity').value; item.qty=parseInt(document.getElementById('invQty').value)||1;
    Object.assign(item, extra);
    logHistory('Inventory','Edited', `${item.itemName} (${item.code}) edited`);
    saveDB(); closeModal(); toast('Item updated'); renderInventory();
    return;
  }
  const item = {
    id:uid('INV'), code:document.getElementById('invCode').value, category:document.getElementById('invCategory').value,
    itemName:name, weight:parseFloat(document.getElementById('invWeight').value)||0,
    purity:document.getElementById('invPurity').value, qty:parseInt(document.getElementById('invQty').value)||1,
    status:'in-stock', addedDate: todayStr(), ...extra
  };
  DB.inventory.push(item);
  logHistory('Inventory','Added', `${item.itemName} (${item.code}) added to stock`);
  saveDB(); closeModal(); toast('Item added'); renderInventory();
}
function deleteInv(id){
  const item = DB.inventory.find(x=>x.id===id); if(!item) return;
  guardDelete('inventory item ('+item.itemName+')', ()=>{
    item.deleted = true;
    logHistory('Inventory','Deleted', `${item.itemName} (${item.code}) deleted`);
    saveDB(); renderInventory(); toast('Item deleted');
  });
}
function markSold(id){
  const it = DB.inventory.find(x=>x.id===id); if(!it) return;
  confirmAction(`Mark "${it.itemName}" as sold?`, ()=>{
    it.status='sold'; logHistory('Inventory','Sold', it.itemName+' marked sold');
    saveDB(); renderInventory(); toast('Marked as sold');
  });
}

/* =====================================================================
   PAGE: JOBS (Manufacturing & Repair)
===================================================================== */
function renderJobs(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openJobForm()">+ ${T('newJob')}</button></div>`;
  html += `<div class="pillTabs" id="jobFilterTabs">
    ${['All','Pending','In Progress','Ready','Delivered'].map(s=>`<div class="pillTab ${s==='All'?'active':''}" data-s="${s}" onclick="setJobFilter(this,'${s}')">${s}</div>`).join('')}
  </div>`;
  html += `<div class="card"><div id="jobsTableWrap"></div></div>`;
  document.getElementById('content').innerHTML = html;
  window._jobFilter='All';
  renderJobsTable();
}
function setJobFilter(el,s){ document.querySelectorAll('#jobFilterTabs .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active'); window._jobFilter=s; renderJobsTable(); }
function renderJobsTable(){
  const f = window._jobFilter||'All';
  const map = {'Pending':'pending','In Progress':'in-progress','Ready':'ready','Delivered':'delivered'};
  let rows = [...DB.jobs].filter(j=>!j.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(f!=='All') rows = rows.filter(j=>j.status===map[f]);
  let html = `<table><tr><th>Date</th><th>Customer</th><th>Type</th><th>Item</th><th>Wt In/Out</th><th>Labour</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="8"><div class="empty"><div class="big">🛠️</div>No jobs found.</div></td></tr>`;
  rows.forEach(j=>{
    const statusTag = {pending:'tag-gold','in-progress':'tag-gold',ready:'tag-green',delivered:'tag-gray'}[j.status];
    html += `<tr><td>${fmtDate(j.date)}</td><td>${custCell(j)}</td><td>${j.type}</td><td>${j.itemDesc}${j.assignedTo==='Karigar'&&j.karigarName?`<br><span class="helpText">🧑‍🔧 ${j.karigarName}</span>`:''}</td>
    <td>${fmtWt(j.weightIn)} / ${fmtWt(j.weightOut)}</td><td>${fmtMoney(j.labourCharge)}</td>
    <td><span class="tag ${statusTag}">${j.status}</span></td>
    <td><select onchange="updateJobStatus('${j.id}', this.value)">
      <option value="pending" ${j.status==='pending'?'selected':''}>Pending</option>
      <option value="in-progress" ${j.status==='in-progress'?'selected':''}>In Progress</option>
      <option value="ready" ${j.status==='ready'?'selected':''}>Ready</option>
      <option value="delivered" ${j.status==='delivered'?'selected':''}>Delivered</option>
    </select>
    <button class="btn btn-sm btn-ghost" onclick="openGenericPrintPreview('job','${j.id}')">🖨</button>
    <button class="btn btn-sm btn-ghost" onclick="guardEdit('job', ()=>openJobForm('${j.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteJob('${j.id}')">🗑</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('jobsTableWrap').innerHTML = html;
}
function updateJobStatus(id, status){
  const j = DB.jobs.find(x=>x.id===id); if(!j) return;
  j.status = status; if(status==='delivered') j.deliveredDate = todayStr();
  logHistory('Jobs','Status Updated', `${j.itemDesc} for ${j.customerName} → ${status}`);
  saveDB(); renderJobsTable(); toast('Status updated');
}
function openJobForm(id){
  const j = id ? DB.jobs.find(x=>x.id===id) : null;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>${T('customer')} *</label><input list="custList5" id="jbCustomer" placeholder="Type name or phone — existing customers are suggested" value="${j?custNameFor(j):''}">
      <datalist id="custList5">${DB.customers.map(c=>`<option value="${c.name}">`).join('')}</datalist></div>
      <div class="field"><label>Job Type</label><select id="jbType"><option ${j&&j.type==='Manufacturing'?'selected':''}>Manufacturing</option><option ${j&&j.type==='Repair'?'selected':''}>Repair</option></select></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Item Description</label><input id="jbItem" placeholder="e.g. New silver ring from old chain" value="${j?j.itemDesc:''}"></div>
    <div class="grid grid-3" style="margin-top:12px;">
      <div class="field"><label>Weight In (g)</label><input type="number" step="0.001" id="jbWtIn" value="${j?j.weightIn:''}"></div>
      <div class="field"><label>Expected Weight Out (g)</label><input type="number" step="0.001" id="jbWtOut" value="${j?j.weightOut:''}"></div>
      <div class="field"><label>Labour Charge</label><input type="number" id="jbLabour" value="${j?j.labourCharge:''}"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Job Date</label><input type="date" id="jbDate" value="${j?j.date:todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Expected Delivery Date</label><input type="date" id="jbExpected" value="${j?j.expectedDate||'':''}"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Made By</label><select id="jbAssignedTo" onchange="toggleKarigarField()">
        <option value="In-House" ${(!j||j.assignedTo==='In-House')?'selected':''}>In-House</option>
        <option value="Karigar" ${j&&j.assignedTo==='Karigar'?'selected':''}>Given to Karigar</option>
      </select></div>
      <div class="field" id="jbKarigarWrap"><label>Karigar Name</label><input id="jbKarigarName" list="karigarList" placeholder="Who this job was given to" value="${j?j.karigarName||'':''}">
      <datalist id="karigarList">${DB.staff.filter(s=>s.role==='Karigar').map(s=>`<option value="${s.name}">`).join('')}</datalist></div>
    </div>
  `;
  openModal(j?'Edit Job':T('newJob'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:j?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>saveJob(id)}
  ]);
  toggleKarigarField();
  attachCustomerPicker('jbCustomer',null,{cid:j?j.customerId:''});
}
function toggleKarigarField(){
  const sel = document.getElementById('jbAssignedTo'); const wrap = document.getElementById('jbKarigarWrap');
  if(!sel || !wrap) return;
  wrap.classList.toggle('hidden', sel.value!=='Karigar');
}
function saveJob(id){
  const name = document.getElementById('jbCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(!customerGate('jbCustomer',null,()=>saveJob(id))) return;
  const cust = resolveCustomer('jbCustomer',null);
  const assignedTo = document.getElementById('jbAssignedTo').value;
  const karigarName = assignedTo==='Karigar' ? (document.getElementById('jbKarigarName').value||'').trim() : '';
  if(id){
    const j = DB.jobs.find(x=>x.id===id); if(!j) return;
    j.customerId=cust.id; j.customerName=cust.name; j.type=document.getElementById('jbType').value;
    j.itemDesc=document.getElementById('jbItem').value; j.weightIn=parseFloat(document.getElementById('jbWtIn').value)||0;
    j.weightOut=parseFloat(document.getElementById('jbWtOut').value)||0; j.labourCharge=parseFloat(document.getElementById('jbLabour').value)||0;
    j.date=document.getElementById('jbDate').value||j.date; j.expectedDate=document.getElementById('jbExpected').value||'';
    j.assignedTo=assignedTo; j.karigarName=karigarName;
    logHistory('Jobs','Edited', `${j.type} job for ${cust.name} edited: ${j.itemDesc}`);
    saveDB(); closeModal(); toast('Job updated'); renderJobs();
    return;
  }
  const j = {
    id:uid('JOB'), date:document.getElementById('jbDate')?.value||todayStr(), createdAt:nowISO(), customerId:cust.id, customerName:cust.name,
    type:document.getElementById('jbType').value, itemDesc:document.getElementById('jbItem').value,
    weightIn:parseFloat(document.getElementById('jbWtIn').value)||0, weightOut:parseFloat(document.getElementById('jbWtOut').value)||0,
    labourCharge:parseFloat(document.getElementById('jbLabour').value)||0, expectedDate:document.getElementById('jbExpected').value||'',
    assignedTo, karigarName, status:'pending'
  };
  DB.jobs.push(j);
  logHistory('Jobs','Created', `${j.type} job for ${cust.name}: ${j.itemDesc}${karigarName?' — given to '+karigarName:''}`);
  saveDB(); closeModal(); toast('Job created'); renderJobs();
}
function deleteJob(id){
  const j = DB.jobs.find(x=>x.id===id); if(!j) return;
  guardDelete('job ('+j.itemDesc+')', ()=>{
    j.deleted = true;
    logHistory('Jobs','Deleted', `${j.type} job for ${j.customerName} (${j.itemDesc}) deleted`);
    saveDB(); renderJobs(); toast('Job deleted');
  });
}

function renderExchange(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openExForm()">+ ${T('newExchange')}</button></div>`;
  html += `<div class="card"><table><tr><th>Date</th><th>Customer</th><th>Old Item</th><th>Old Value</th><th>New Item</th><th>New Value</th><th>Balance</th><th></th></tr>`;
  let rows=[...DB.exchange].filter(e=>!e.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(rows.length===0) html += `<tr><td colspan="8"><div class="empty"><div class="big">🔁</div>No exchanges yet.</div></td></tr>`;
  rows.forEach(e=> html += `<tr><td>${fmtDate(e.date)}</td><td>${custCell(e)}</td><td>${e.oldItemDesc}</td><td>${fmtMoney(e.oldValue)}</td><td>${e.newItemDesc}</td><td>${fmtMoney(e.newValue)}</td><td>${fmtMoney(e.balanceToPay)}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('exchange entry', ()=>openExForm('${e.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteEx('${e.id}')">🗑</button></td></tr>`);
  html += `</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openExForm(id){
  const e = id ? DB.exchange.find(x=>x.id===id) : null;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>${T('customer')} *</label><input list="custList6" id="exCustomer" placeholder="Type name or phone — existing customers are suggested" value="${e?custNameFor(e):''}">
      <datalist id="custList6">${DB.customers.map(c=>`<option value="${c.name}">`).join('')}</datalist></div>
      <div class="field"><label>${T('date')}</label><input type="date" id="exDate" value="${e?e.date:todayStr()}" max="${todayStr()}"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Old Item Description</label><input id="exOldItem" value="${e?e.oldItemDesc:''}"></div>
      <div class="field"><label>Old Item Value</label><input type="number" id="exOldVal" value="${e?e.oldValue:''}" oninput="exRecalc()"></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>New Item Description</label><input id="exNewItem" value="${e?e.newItemDesc:''}"></div>
      <div class="field"><label>New Item Value</label><input type="number" id="exNewVal" value="${e?e.newValue:''}" oninput="exRecalc()"></div>
    </div>
    <div class="totalsBox"><div class="totalsRow grand"><span>Balance To Pay</span><span id="exBalOut">₹0</span></div></div>
  `;
  openModal(e?'Edit Exchange':T('newExchange'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:e?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>saveEx(id)}
  ]);
  exRecalc();
  attachCustomerPicker('exCustomer',null,{cid:e?e.customerId:''});
}
function exRecalc(){
  const o=parseFloat(document.getElementById('exOldVal').value)||0, n=parseFloat(document.getElementById('exNewVal').value)||0;
  document.getElementById('exBalOut').textContent = fmtMoney(n-o);
}
function saveEx(id){
  const name=document.getElementById('exCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(!customerGate('exCustomer',null,()=>saveEx(id))) return;
  const cust = resolveCustomer('exCustomer',null);
  const oldVal=parseFloat(document.getElementById('exOldVal').value)||0, newVal=parseFloat(document.getElementById('exNewVal').value)||0;
  const exDate = document.getElementById('exDate')?.value || todayStr();
  if(id){
    const e = DB.exchange.find(x=>x.id===id); if(!e) return;
    e.customerId=cust.id; e.customerName=cust.name; e.date=exDate;
    e.oldItemDesc=document.getElementById('exOldItem').value; e.oldValue=oldVal;
    e.newItemDesc=document.getElementById('exNewItem').value; e.newValue=newVal; e.balanceToPay=newVal-oldVal;
    logHistory('Exchange','Edited', `${cust.name}: ${e.oldItemDesc} → ${e.newItemDesc} edited`);
    saveDB(); closeModal(); toast('Exchange updated'); renderExchange();
    return;
  }
  const e={id:uid('EXC'), date:exDate, createdAt:nowISO(), customerId:cust.id, customerName:cust.name,
    oldItemDesc:document.getElementById('exOldItem').value, oldValue:oldVal,
    newItemDesc:document.getElementById('exNewItem').value, newValue:newVal, balanceToPay:newVal-oldVal};
  DB.exchange.push(e);
  logHistory('Exchange','Created', `${cust.name}: ${e.oldItemDesc} → ${e.newItemDesc}`);
  saveDB(); closeModal(); toast('Exchange saved'); renderExchange();
}
function deleteEx(id){
  const e = DB.exchange.find(x=>x.id===id); if(!e) return;
  guardDelete('exchange entry ('+e.oldItemDesc+' → '+e.newItemDesc+')', ()=>{
    e.deleted = true;
    logHistory('Exchange','Deleted', `Exchange for ${e.customerName} deleted`);
    saveDB(); renderExchange(); toast('Exchange deleted');
  });
}

    <td>${DB.sales.filter(s=>s.customerId===c.id && !s.deleted).length}</td><td>${DB.girvi.filter(g=>g.customerId===c.id && (g.status==='active'||g.status==='pending') && !g.deleted).length}</td>

function customerLastVisit(id){
  const dates = [];
  DB.sales.filter(s=>s.customerId===id && !s.deleted).forEach(s=>dates.push(s.date));
  DB.girvi.filter(g=>g.customerId===id && !g.deleted).forEach(g=>dates.push(g.date));
  DB.creditEntries.filter(e=>e.customerId===id && !e.deleted).forEach(e=>dates.push(e.date));
  DB.jobs.filter(j=>j.customerId===id && !j.deleted).forEach(j=>dates.push(j.date));
  if(dates.length===0) return null;
  return dates.sort().reverse()[0];
}
function viewCustomerLedger(id){
  const c = customerById(id); if(!c) return; id = c.id;
  const sales = DB.sales.filter(s=>s.customerId===id && !s.deleted);
  const girvi = DB.girvi.filter(g=>g.customerId===id && !g.deleted);

  const jobs = DB.jobs.filter(j=>j.customerId===id && !j.deleted);
  const buys = DB.buying.filter(b=>b.customerId===id && !b.deleted);

  credit.forEach(e=>timeline.push({date:e.date, ts:e.createdAt, icon:'📒', text:`${e.type==='debit'?'Udhaar given':'Payment received'} — ${fmtMoney(e.amount)}${e.description?' — '+e.description:''}`}));
  jobs.forEach(j=>timeline.push({date:j.date, ts:j.createdAt, icon:'🛠️', text:`${j.type} job — ${j.itemDesc} (${j.status})`}));
  timeline.sort((a,b)=> b.date.localeCompare(a.date) || (b.ts||'').localeCompare(a.ts||''));

  let body = `
    <div class="girviDetailHead" style="margin-bottom:14px;">
      ${custAvatarHTML(c,72)}
      <div>
        <div style="font-family:var(--font-display);font-size:19px;color:var(--maroon-dark);">${c.name} ${c.tags?'<span class="tag tag-gold">'+c.tags+'</span>':''}</div>
        <div class="helpText">${c.phone||'No phone on file'}${(c.altPhones||[]).length?' • also '+escH(c.altPhones.join(', ')):''}${c.village?' • '+c.village:''}</div>
        ${(c.aliases||[]).length?`<div class="helpText">Also known as: ${escH(c.aliases.join(', '))}</div>`:''}
        <div class="helpText">Last visit: ${lastVisit?fmtDate(lastVisit):'-'} • Balance: <b style="color:${customerBalance(id)>0?'var(--danger)':'var(--success)'}">${fmtMoney(customerBalance(id))}</b></div>
      </div>
    </div>
    ${(c.referredBy||c.familyLink)?`<div class="approveBox" style="background:var(--gold-pale);border-color:var(--gold-light);color:var(--maroon-dark);margin-bottom:12px;">
      ${c.referredBy?`🤝 <b>Referred by:</b> ${c.referredBy}<br>`:''}${c.familyLink?`👪 <b>Family / relation:</b> ${c.familyLink}`:''}
    </div>`:''}
    ${c.notes?`<div class="helpText" style="margin-bottom:12px;">📝 ${c.notes}</div>`:''}
    <div class="statGrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      <div class="statCard" style="padding:12px;"><div class="lbl">Sales</div><div class="val" style="font-size:20px;">${sales.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--silver-accent)"><div class="lbl">Girvi</div><div class="val" style="font-size:20px;">${girvi.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--danger)"><div class="lbl">Credit</div><div class="val" style="font-size:20px;">${credit.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--success)"><div class="lbl">Jobs</div><div class="val" style="font-size:20px;">${jobs.length}</div></div>
    </div>
    ${galleryHTML(customerPhotoGallery(id),'📷 Photos ('+customerPhotoGallery(id).length+')')}
    <h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:0 0 8px;">Timeline</h4>

function renderHistTable(){
  const q=(document.getElementById('histSearch')?.value||'').toLowerCase();
  let rows = DB.history.filter(h=> !q || h.description.toLowerCase().includes(q) || h.module.toLowerCase().includes(q));
  let html = `<table><tr><th>Time</th><th>Module</th><th>Action</th><th>Description</th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="4"><div class="empty"><div class="big">🕘</div>No history recorded yet.</div></td></tr>`;
  rows.slice(0,300).forEach(h=> html += `<tr><td>${new Date(h.ts).toLocaleString('en-IN')}</td><td>${h.module}</td><td>${h.action}</td><td>${h.description}</td></tr>`);
  html += `</table>`;
  document.getElementById('histTableWrap').innerHTML = html;
}

===================================================================== */
function renderReports(){
  let html = `<div class="pillTabs" id="reportRangeTabs">
    ${[['today','Today'],['7','7 Days'],['30','30 Days'],['month','This Month'],['all','All Time']].map(([v,l])=>`<div class="pillTab ${v==='30'?'active':''}" data-r="${v}" onclick="setReportRange(this,'${v}')">${l}</div>`).join('')}
  </div>
  <div id="reportsBody"></div>`;
  document.getElementById('content').innerHTML = html;
  window._reportRange = '30';
  renderReportsBody();
}
function setReportRange(el, range){
  document.querySelectorAll('#reportRangeTabs .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active');
  window._reportRange = range; renderReportsBody();
}
function reportRangeFrom(range){
  const now = new Date();
  if(range==='today') return todayStr();
  if(range==='7') return new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  if(range==='month') return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  if(range==='all') return '0000-01-01';
  return new Date(Date.now()-30*86400000).toISOString().slice(0,10);
}
function renderReportsBody(){
  const range = window._reportRange||'30';
  const from = reportRangeFrom(range);
  const rangeLabel = {today:'Today',7:'Last 7 Days',30:'Last 30 Days',month:'This Month',all:'All Time'}[range] || 'Last 30 Days';

  const salesInRange = DB.sales.filter(s=>!s.void && !s.deleted && s.date>=from);
  const buyInRange = DB.buying.filter(b=>!b.deleted && b.date>=from);
  const expInRange = DB.expenses.filter(e=>!e.deleted && e.date>=from);
  const salesTotal = salesInRange.reduce((a,s)=>a+s.grandTotal,0);
  const buyTotal = buyInRange.reduce((a,b)=>a+b.amount,0);
  const expTotal = expInRange.reduce((a,e)=>a+e.amount,0);
  const net = salesTotal - buyTotal - expTotal;

  let goldRevenue=0, goldWt=0, silverRevenue=0, silverWt=0, otherRevenue=0, customRevenue=0, customQty=0;
  salesInRange.forEach(s=> (s.items||[]).forEach(i=>{
    const purity=(i.purity===undefined||i.purity==='')?100:Number(i.purity);
    const pw=(Number(i.weight)||0)*(purity/100);
    const amt = saleItemAmount(i);
    if(isCustomItem(i)){ customRevenue+=amt; customQty+=Number(i.qty)||0; }
    else if(i.category==='Gold'){ goldRevenue+=amt; goldWt+=Number(i.weight)||0; }
    else if(i.category==='Silver'){ silverRevenue+=amt; silverWt+=Number(i.weight)||0; }
    else otherRevenue+=amt;
  }));

  const activeGirvi = DB.girvi.filter(g=>!g.deleted && g.status==='active');
  const overdueGirvi = activeGirvi.filter(g=>g.dueDate && g.dueDate<todayStr());
  const activeGirviValue = activeGirvi.reduce((a,g)=>a+(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount),0);
  const overdueGirviValue = overdueGirvi.reduce((a,g)=>a+(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount),0);
  const redeemedInRange = DB.girvi.filter(g=>!g.deleted && g.status==='redeemed' && g.redeemedDate && g.redeemedDate>=from).length;
  const forfeitedTotal = DB.girvi.filter(g=>!g.deleted && g.status==='forfeited').length;

  const wholesalerTotals = DB.wholesalers.filter(w=>!w.deleted).reduce((a,w)=>{ const b=wholesalerBalance(w.id); a.silver+=Math.max(b.silverOwed,0); a.gold+=Math.max(b.goldOwed,0); a.cash+=Math.max(b.cashOwed,0); return a; }, {silver:0,gold:0,cash:0});

  const stock = inventoryValuation();

  const custTotals = {};
  salesInRange.forEach(s=>{ custTotals[s.customerName] = (custTotals[s.customerName]||0) + s.grandTotal; });
  const topCustomers = Object.entries(custTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);

  const expByCat = {};
  expInRange.forEach(e=>{ expByCat[e.category] = (expByCat[e.category]||0) + e.amount; });

  let html = `<div class="cardHead" style="margin-bottom:14px;"><div class="helpText">Showing: <b>${rangeLabel}</b></div><button class="btn btn-sm btn-outline" onclick="printReportSummary()">🖨 Print Summary</button></div>`;

  html += `<div class="statGrid" style="grid-template-columns:repeat(4,1fr);">
    <div class="statCard"><div class="lbl">Sales</div><div class="val">${fmtMoney(salesTotal)}</div><div class="sub">${salesInRange.length} bill(s)</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying</div><div class="val">${fmtMoney(buyTotal)}</div><div class="sub">${buyInRange.length} purchase(s)</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Expenses</div><div class="val">${fmtMoney(expTotal)}</div><div class="sub">${expInRange.length} entrie(s)</div></div>
    <div class="statCard" style="border-color:${net>=0?'var(--success)':'var(--danger)'}"><div class="lbl">Net (Sales − Buying − Expenses)</div><div class="val">${fmtMoney(net)}</div><div class="sub">Rough estimate, not full profit</div></div>
  </div>`;

  html += `<div class="grid grid-2">
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Sales by Metal</h3>
      <table><tr><th>Metal</th><th>Weight Sold</th><th>Revenue</th></tr>
      <tr><td>🥇 Gold</td><td>${fmtWt(goldWt)}</td><td>${fmtMoney(goldRevenue)}</td></tr>
      <tr><td>🥈 Silver</td><td>${fmtWt(silverWt)}</td><td>${fmtMoney(silverRevenue)}</td></tr>
      ${otherRevenue?`<tr><td>Other / Custom</td><td>-</td><td>${fmtMoney(otherRevenue)}</td></tr>`:''}
      ${customRevenue?`<tr><td>Custom Rupee Items</td><td>${customQty} pcs</td><td>${fmtMoney(customRevenue)}</td></tr>`:''}
      </table></div>
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Top Customers</h3>
      <table>${topCustomers.length?topCustomers.map(([name,amt])=>`<tr><td>${name}</td><td>${fmtMoney(amt)}</td></tr>`).join(''):'<tr><td class="helpText">No sales in this range.</td></tr>'}</table></div>
  </div>`;

  html += `<div class="grid grid-2">
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Girvi Snapshot</h3>
      <table>
        <tr><td>Active Loans</td><td>${activeGirvi.length} — ${fmtMoney(activeGirviValue)}</td></tr>
        <tr><td>Overdue</td><td>${overdueGirvi.length} — ${fmtMoney(overdueGirviValue)}</td></tr>
        <tr><td>Redeemed (in range)</td><td>${redeemedInRange}</td></tr>
        <tr><td>Forfeited (all time)</td><td>${forfeitedTotal}</td></tr>
        <tr><td>Photo-only (details pending)</td><td>${DB.girvi.filter(g=>!g.deleted && g.status==='pending').length}</td></tr>
      </table></div>
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Approx. Stock Value</h3>
      <table>
        <tr><td>In-Stock Items</td><td>${stock.count}</td></tr>
        <tr><td>Gold Weight</td><td>${fmtWt(stock.goldWt)}</td></tr>
        <tr><td>Silver Weight</td><td>${fmtWt(stock.silverWt)}</td></tr>
        <tr><td><b>Total Value (at today's rates)</b></td><td><b>${fmtMoney(stock.total)}</b></td></tr>
      </table></div>
  </div>`;

  html += `<div class="grid grid-2">
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Outstanding Summary</h3>
      <table><tr><td>Total Credit Due</td><td>${fmtMoney(DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0))}</td></tr>
      <tr><td>Pending Jobs</td><td>${DB.jobs.filter(j=>j.status!=='delivered' && !j.deleted).length}</td></tr>
      <tr><td>Silver Owed to Wholesalers</td><td>${fmtWt(wholesalerTotals.silver)}</td></tr>
      <tr><td>Gold Owed to Wholesalers</td><td>${fmtWt(wholesalerTotals.gold)}</td></tr>
      <tr><td>Cash/Labour Owed to Wholesalers</td><td>${fmtMoney(wholesalerTotals.cash)}</td></tr></table></div>
    <div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Expenses by Category</h3>
      <table>${Object.keys(expByCat).length? Object.entries(expByCat).map(([cat,amt])=>`<tr><td>${cat}</td><td>${fmtMoney(amt)}</td></tr>`).join('') : '<tr><td class="helpText">No expenses in this range.</td></tr>'}</table></div>
  </div>`;

  document.getElementById('reportsBody').innerHTML = html;
  window._reportSnapshot = { rangeLabel, salesTotal, buyTotal, expTotal, net, goldRevenue, goldWt, silverRevenue, silverWt, topCustomers, stock, activeGirviCount:activeGirvi.length, activeGirviValue, overdueGirviCount:overdueGirvi.length, overdueGirviValue, wholesalerTotals };
}

function renderCashday(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openCashForm()">+ Close Today</button></div>`;
  html += `<div class="card"><table><tr><th>Date</th><th>Opening</th><th>Cash In</th><th>Cash Out</th><th>Closing</th><th>Closed By</th><th></th></tr>`;
  let rows=[...DB.cashDays].filter(c=>!c.deleted).sort((a,b)=>b.date.localeCompare(a.date));
  if(rows.length===0) html+=`<tr><td colspan="7"><div class="empty"><div class="big">💰</div>No day-close records yet.</div></td></tr>`;
  rows.forEach(c=> html+=`<tr><td>${fmtDate(c.date)}</td><td>${fmtMoney(c.openingCash)}</td><td>${fmtMoney(c.cashIn)}</td><td>${fmtMoney(c.cashOut)}</td><td>${fmtMoney(c.closingCash)}</td><td>${c.closedBy}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('day close entry', ()=>openCashForm('${c.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteCashDay('${c.id}')">🗑</button></td></tr>`);
  html+=`</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openCashForm(id){
  const c = id ? DB.cashDays.find(x=>x.id===id) : null;
  const body = `<div class="grid grid-2">
    <div class="field"><label>Date</label><input type="date" id="cdDate" value="${c?c.date:todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>Closed By</label><input id="cdBy" value="${c?c.closedBy:'Owner'}"></div>
    <div class="field"><label>Opening Cash</label><input type="number" id="cdOpen" value="${c?c.openingCash:''}"></div>
    <div class="field"><label>Cash In</label><input type="number" id="cdIn" value="${c?c.cashIn:''}"></div>
    <div class="field"><label>Cash Out</label><input type="number" id="cdOut" value="${c?c.cashOut:''}"></div>
  </div>`;
  openModal(c?'Edit Day Close':'Day Close', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:c?'Save Changes':'Close Day', cls:'btn-primary', onClick:()=>{
      const open=parseFloat(document.getElementById('cdOpen').value)||0, cin=parseFloat(document.getElementById('cdIn').value)||0, cout=parseFloat(document.getElementById('cdOut').value)||0;
      const date = document.getElementById('cdDate').value || todayStr();
      if(c){
        c.date=date; c.openingCash=open; c.cashIn=cin; c.cashOut=cout; c.closingCash=open+cin-cout; c.closedBy=document.getElementById('cdBy').value||'Owner';
        logHistory('CashDay','Edited', 'Day close for '+date+' edited — closing cash '+fmtMoney(c.closingCash));
        saveDB(); closeModal(); renderCashday(); toast('Day close updated');
        return;
      }
      DB.cashDays.push({id:uid('CD'), date, openingCash:open, cashIn:cin, cashOut:cout, closingCash:open+cin-cout, closedBy:document.getElementById('cdBy').value||'Owner'});
      logHistory('CashDay','Closed', 'Day closed with closing cash '+fmtMoney(open+cin-cout));
      saveDB(); closeModal(); renderCashday(); toast('Day closed');
    }}
  ]);

function wholesalerBalance(wholesalerId){
  let silverOwed=0, goldOwed=0, cashOwed=0;
  DB.wholesalerEntries.filter(e=>e.wholesalerId===wholesalerId && !e.deleted).forEach(e=>{
    if(e.type==='purchase'){
      if(e.metal==='Gold') goldOwed += e.pureWeight; else silverOwed += e.pureWeight;
      cashOwed += Number(e.labourCharge||0);
    } else {
      if(e.metal==='Gold') goldOwed -= e.pureWeight; else silverOwed -= e.pureWeight;
      cashOwed -= Number(e.cashPaid||0);
    }
  });
  return {silverOwed, goldOwed, cashOwed};
}

      const result = Function('"use strict";return ('+calcExpr.replace(/%/g,'/100')+')')();
      calcExpr = String(Math.round(result*100)/100);
    }catch(e){ calcExpr='Error'; }
  } else { calcExpr += k; }
  updateCalcDisplay();
}

/* =====================================================================
   LIVE SPOT RATE — folded directly into the Dashboard (no separate page).
   Fetches international gold/silver spot, already converted to ₹, from a
   free CORS-enabled API. This is a reference only and never silently
   overwrites your shop's actual billing rate — that always needs an
   explicit tap on "Suggest Today's Shop Rate" → Apply.
===================================================================== */
function extractPrice(data){
  if(data==null) return null;
  if(typeof data==='number') return data;
  const candidates = [data.price, data.rate, data.value, data.price_usd, data.spot_price, data.ask, (data.rates&&data.rates.XAU), (data.rates&&data.rates.XAG)];
  for(const c of candidates){ if(typeof c==='number' && !isNaN(c)) return c; }
  return null;
}
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{ return await fetch(url, {signal: ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function fetchMarketRates(silent){
  if(!navigator.onLine){
    DB.marketRates.lastError = 'Device appears offline';
    saveDB(); renderDashboardMarketMini();
    if(!silent) toast('No internet connection right now — showing last saved rates.');
    return;
  }
  if(!silent) toast('Fetching live rates...');
  try{
    const [goldRes, silverRes] = await Promise.all([
      fetchWithTimeout('https://api.gold-api.com/price/XAU/INR', 8000),
      fetchWithTimeout('https://api.gold-api.com/price/XAG/INR', 8000)
    ]);
    if(!goldRes.ok) throw new Error('Gold source returned HTTP '+goldRes.status);
    if(!silverRes.ok) throw new Error('Silver source returned HTTP '+silverRes.status);
    const goldJson = await goldRes.json();
    const silverJson = await silverRes.json();
    const goldPrice = extractPrice(goldJson);
    const silverPrice = extractPrice(silverJson);
    if(goldPrice==null && silverPrice==null) throw new Error('Response did not contain a recognisable price field');
    DB.marketRates.goldInrOz = goldPrice;
    DB.marketRates.silverInrOz = silverPrice;
    DB.marketRates.exchangeRate = goldJson.exchangeRate || silverJson.exchangeRate || DB.marketRates.exchangeRate || null;
    DB.marketRates.fetchedAt = nowISO();
    DB.marketRates.source = 'gold-api.com (international spot, converted to ₹)';
    DB.marketRates.lastError = null;
    logHistory('MarketRates','Fetched', `Gold ₹${Math.round(goldPrice||0)}/oz, Silver ₹${Math.round(silverPrice||0)}/oz`);
    saveDB(); renderDashboardMarketMini();
    if(!silent) toast('Live rates updated');
  }catch(err){
    const reason = err.name==='AbortError' ? 'Request timed out (slow/no internet)' : (err.message || 'Unknown error');
    DB.marketRates.lastError = reason;
    saveDB(); renderDashboardMarketMini();
    if(!silent) toast('Could not fetch live rates: '+reason+'. Showing last saved rates.');
  }
}
/* Best-effort silent refresh on app open — only if online and the last
   fetch (if any) is more than an hour old. Never blocks the UI. */
function maybeAutoFetchMarketRates(){
  if(!navigator.onLine) return;
  const m = DB.marketRates;
  const staleMs = m.fetchedAt ? (Date.now() - new Date(m.fetchedAt).getTime()) : Infinity;
  if(staleMs > 60*60*1000) fetchMarketRates(true);
}
function renderDashboardMarketMini(){
  const el = document.getElementById('dashMarketMini'); if(!el) return;
  const m = DB.marketRates;
  if(!m.fetchedAt){
    el.innerHTML = `<div class="helpText">Not fetched yet — tap ↻ when the tablet has internet.</div>${m.lastError?`<div class="helpText" style="color:var(--danger);">Last attempt: ${m.lastError}</div>`:''}`;
    return;
  }
  const goldPerGram = m.goldInrOz ? (m.goldInrOz/31.1035) : null;
  const silverPerGram = m.silverInrOz ? (m.silverInrOz/31.1035) : null;
  const isStale = daysBetween(m.fetchedAt.slice(0,10)) >= 1;
  el.innerHTML = `
    <div style="display:flex;gap:18px;flex-wrap:wrap;">
      <div>🥇 Gold: <b>${goldPerGram?fmtMoney(goldPerGram*10)+' /10g':'-'}</b></div>
      <div>🥈 Silver: <b>${silverPerGram?fmtMoney(silverPerGram*1000)+' /kg':'-'}</b></div>
    </div>
    <div class="helpText" style="margin-top:4px;">${isStale?'🕘 Last live rate (offline / market closed) — ':''}as of ${new Date(m.fetchedAt).toLocaleString('en-IN')}</div>
    ${m.lastError?`<div class="helpText" style="color:var(--danger);margin-top:2px;">Last refresh failed: ${m.lastError} (showing previous rate)</div>`:''}
    ${(goldPerGram||silverPerGram)?`<button class="btn btn-sm btn-outline" style="margin-top:8px;" onclick="openSuggestRateModal()">💡 Suggest Today's Shop Rate</button>`:''}
    <div class="helpText" style="margin-top:6px;">International spot converted to ₹ — a close free reference, not the exact MCX exchange price (that needs a paid exchange feed). Your billing rate above stays fully in your control.</div>
  `;
}
function openSuggestRateModal(){
  const m = DB.marketRates;
  const goldPerGram = m.goldInrOz ? (m.goldInrOz/31.1035) : 0;
  const silverPerGram = m.silverInrOz ? (m.silverInrOz/31.1035) : 0;
  if(!goldPerGram && !silverPerGram){ toast('Fetch live rates first'); return; }
  window._sugGoldPerGram = goldPerGram; window._sugSilverPerGram = silverPerGram;
  const body = `
    <p class="helpText" style="margin-top:0;">Starting point is today's live international spot, converted to ₹. Add your usual margin, then adjust freely — nothing changes until you tap Apply.</p>
    <div class="field"><label>Add margin over spot (%)</label><input type="number" id="sugMargin" value="0" oninput="recalcSuggestRate()"></div>
    <div class="grid grid-3" style="margin-top:12px;">
      <div class="field"><label>Gold 24K (per 10g)</label><input type="number" id="sugGold24"></div>
      <div class="field"><label>Gold 22K (per 10g)</label><input type="number" id="sugGold22"></div>
      <div class="field"><label>Silver (per kg)</label><input type="number" id="sugSilverKg"></div>
    </div>
  `;
  openModal("Suggest Today's Shop Rate", body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:'Apply to Shop Rates', cls:'btn-primary', onClick:()=>{
      DB.currentRates = {
        gold24: parseFloat(document.getElementById('sugGold24').value)||0,
        gold22: parseFloat(document.getElementById('sugGold22').value)||0,
        silverKg: parseFloat(document.getElementById('sugSilverKg').value)||0,
        updatedAt: nowISO()
      };
      DB.rateHistory.push({...DB.currentRates});
      logHistory('Rates','Updated (from live suggestion)', `Gold24: ${DB.currentRates.gold24}, Gold22: ${DB.currentRates.gold22}, Silver/kg: ${DB.currentRates.silverKg}`);
      saveDB(); closeModal(); toast('Shop rates updated'); if(currentPage==='dashboard') renderDashboard();
    }}
  ]);
  recalcSuggestRate();
}
function recalcSuggestRate(){
  const margin = parseFloat(document.getElementById('sugMargin')?.value)||0;
  const factor = 1+(margin/100);
  const g24 = document.getElementById('sugGold24'); const g22 = document.getElementById('sugGold22'); const sk = document.getElementById('sugSilverKg');
  if(g24) g24.value = Math.round((window._sugGoldPerGram||0)*10*factor);
  if(g22) g22.value = Math.round((window._sugGoldPerGram||0)*10*(22/24)*factor);
  if(sk) sk.value = Math.round((window._sugSilverPerGram||0)*1000*factor);
}

  a.href=url; a.download = 'gayatri-jewellers-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);

document.getElementById('restoreFileInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      confirmAction('Restoring will replace ALL current data on this tablet with the backup file. Continue?', ()=>{
        DB = data; saveDB(); location.reload();
      });
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value='';
});

/* =====================================================================
   PIN LOCK LOGIC
===================================================================== */
let pinBuffer='';
function renderPinPad(){
  const grid = document.getElementById('padGrid'); grid.innerHTML='';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className='padBtn'+(k===''?' hidden':''); b.textContent=k;
    if(k!=='') b.onclick = ()=> handlePinKey(k);
    grid.appendChild(b);
  });
  updatePinDots();
}
function updatePinDots(){
  const dots = document.getElementById('pinDots'); dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='pinDot'+(i<pinBuffer.length?' filled':''); dots.appendChild(d); }
}
function handlePinKey(k){
  document.getElementById('lockError').textContent='';
  if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if(pinBuffer.length>=6) return;
  pinBuffer += k; updatePinDots();
  if(pinBuffer.length===DB.meta.pin.length){
    if(pinBuffer===DB.meta.pin){ unlockApp(); }
    else{ document.getElementById('lockError').textContent='Incorrect PIN, try again.'; setTimeout(()=>{pinBuffer='';updatePinDots();},450); }
  }
}
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('shell').classList.add('active');
  pinBuffer='';
  init();
  startIdleTimer();
}
function lockNow(){
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('shell').classList.remove('active');
  pinBuffer=''; updatePinDots();
  stopIdleTimer();
}
document.getElementById('lockNowBtn').addEventListener('click', lockNow);
document.getElementById('quickBackupBtn').addEventListener('click', doBackup);
document.getElementById('langEnBtn').addEventListener('click', ()=>{ setLanguage('en'); syncLangToggle(); });
document.getElementById('langHiBtn').addEventListener('click', ()=>{ setLanguage('hi'); syncLangToggle(); });
function syncLangToggle(){
  document.getElementById('langEnBtn').className = DB.meta.language==='en'?'active':'';
  document.getElementById('langHiBtn').className = DB.meta.language==='hi'?'active':'';
}

/* ---------------------- AUTO-LOCK (configurable idle timeout) ---------------------- */
let idleTimerHandle = null;
function resetIdleTimer(){
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  clearTimeout(idleTimerHandle);
  idleTimerHandle = setTimeout(()=>{ lockNow(); }, mins*60000);
}
function startIdleTimer(){
  stopIdleTimer();
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.addEventListener(evt, resetIdleTimer));
  resetIdleTimer();
}
function stopIdleTimer(){
  clearTimeout(idleTimerHandle);
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.removeEventListener(evt, resetIdleTimer));
}

function updateClock(){
  const el = document.getElementById('topDateTime'); if(!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString(DB.meta.language==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const timeStr = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  el.textContent = dateStr + '  •  ' + timeStr;
}
function init(){
  document.getElementById('brandName').textContent = DB.meta.shopName;
  document.getElementById('brandLoc').textContent = DB.meta.location.split(',')[0].toUpperCase()+', '+ (DB.meta.location.split(',')[1]||'').toUpperCase();
  renderNav(); renderRateStrip(); syncLangToggle();
  goTo('dashboard');
  updateClock();
  if(!window._clockInterval) window._clockInterval = setInterval(updateClock, 30000);
  maybeAutoFetchMarketRates();
}
