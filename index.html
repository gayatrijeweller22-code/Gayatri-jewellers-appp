/* =====================================================================
   GIRVI — MULTIPLE ITEMS IN ONE ENTRY  (added; old single-item entries keep working unchanged)
   New entries store  g.items = [{id,name,category,weight,purity,karat,loanAmount,notes,photo}].
   The old top-level fields (itemDesc, metal, weight, purity) are kept up to date as totals so
   reports, receipts, search and every older screen continue to work.
   An old entry without g.items is read as a one-item list on the fly — it is NOT rewritten.
===================================================================== */
let grItemsDraft = [], grAutoTotal = true, grTotalId = null, grTotalFixed = null, grItemPhotoTarget = 0;
function girviItems(g){
  if(g && Array.isArray(g.items) && g.items.length) return g.items;
  if(!g || (!g.itemDesc && !(Number(g.weight)>0))) return [];
  return [{id:'legacy', name:g.itemDesc||'', category:g.metal||'Silver', weight:Number(g.weight)||0, purity:(g.purity===undefined||g.purity==='')?100:g.purity, karat:null, loanAmount:Number(g.loanAmount)||0, notes:'', photo:null, legacy:true}];
}
function girviItemCount(g){ return girviItems(g).length; }
function girviIsMulti(g){ return girviItemCount(g)>1; }
function girviIncomplete(g){ return girviItems(g).some(i=>!(i.name||'').trim() || !(Number(i.weight)>0)); }
function parsePurityInput(v){
  const s=String(v==null?'':v).trim(); if(!s) return {pct:100, karat:null};
  const m=s.match(/^(\d+(?:\.\d+)?)\s*(k|kt|karat|carat)$/i);
  if(m){ const k=parseFloat(m[1]); if(k>0 && k<=24) return {pct:Math.round(k/24*10000)/100, karat:k}; }
  const n=parseFloat(s); return {pct:(n>0 && n<=100)?n:100, karat:null};
}
function girviAggregate(items){
  const names=items.map(i=>i.name).filter(Boolean);
  const cats=[...new Set(items.map(i=>i.category||'Silver'))];
  const totalW=items.reduce((a,i)=>a+(Number(i.weight)||0),0);
  const pure=items.reduce((a,i)=>a+(Number(i.weight)||0)*((Number(i.purity)||100)/100),0);
  return {itemDesc:names.join(' + '), metal:cats.length===1?cats[0]:(cats.length?'Mixed':'Silver'), weight:Math.round(totalW*1000)/1000, purity:totalW>0?Math.round(pure/totalW*10000)/100:100};

function girviSearchText(g, skipCustomer){
  const cust=customerById(g.customerId); const parts=[];
  if(!skipCustomer){ parts.push(g.customerName); if(cust){ parts.push(cust.name, cust.phone, (cust.altPhones||[]).join(' '), cust.village, cust.father, cust.caste, cust.tags); } }
  parts.push(g.referenceName, g.bagColor, g.notes, g.itemDesc, g.metal, g.status, g.date, fmtDate(g.date), g.loanAmount, g.outstandingPrincipal, g.weight, g.dueDate, g.dueDate?fmtDate(g.dueDate):'', girviIsMulti(g)?'multi item multiple items':'', g.bagColor?'':'bag not selected');
  girviItems(g).forEach(i=>parts.push(i.name, i.category, i.notes, i.weight, i.loanAmount, i.karat?i.karat+'k':''));

function girviSearchMatch(g, q){

function ledgerExtraTexts(){

  DB.creditEntries.forEach(e=>add(e.customerId, e.description));
  DB.jobs.forEach(j=>add(j.customerId, (j.itemDesc||'')+' '+(j.karigarName||'')));
  DB.buying.forEach(b=>add(b.customerId, b.itemDesc));
  Object.keys(m).forEach(k=>{ m[k]=normName(m[k]); });
  return m;
}
function ledgerMatch(c, q, extra){
  const toks=normName(q).split(' ').filter(Boolean); if(!toks.length) return true;
  const hay=normName([c.name,(c.aliases||[]).join(' '),c.phone,(c.altPhones||[]).join(' '),c.village,c.father,c.caste,c.tags,c.notes,c.referredBy,c.familyLink].filter(Boolean).join(' '))+' '+((extra&&extra[c.id])||'');
  return toks.every(t=>hay.includes(t));
}

function grRecalc(){
  const items=grItemsDraft; if(!document.getElementById('grItemsWrap')) return;
  const w=items.reduce((a,i)=>a+(Number(i.weight)||0),0), amt=items.reduce((a,i)=>a+(Number(i.loanAmount)||0),0);
  const used=items.filter(i=>(i.name||'').trim()||Number(i.weight)>0||Number(i.loanAmount)>0||(i.notes||'').trim()||i.photo).length;
  const sum=document.getElementById('grItemsSummary');
  if(sum) sum.innerHTML=`<b>${used}</b> item${used===1?'':'s'} • total weight <b>${fmtWt(w)}</b>${amt>0?` • item amounts add up to <b>${fmtMoney(amt)}</b>`:''}`;
  const tot=grTotalId?document.getElementById(grTotalId):null;
  if(tot && grAutoTotal && amt>0) tot.value=amt;
  const warns=[];
  items.forEach((it,i)=>{ const n=(it.name||'').trim(), w0=Number(it.weight)||0, a0=Number(it.loanAmount)||0;
    if(n||w0||a0||(it.notes||'').trim()||it.photo){ if(!n) warns.push(`Item ${i+1}: name / design is missing`); if(!(w0>0)) warns.push(`Item ${i+1}: weight is missing`); } });
  const compare = tot ? (Number(tot.value)||0) : (grTotalFixed||0);
  if(amt>0 && compare>0 && Math.abs(compare-amt)>0.5) warns.push(tot?`Total loan ${fmtMoney(compare)} is different from the item amounts (${fmtMoney(amt)}) — fine if you gave one lump sum.`:`Item amounts add up to ${fmtMoney(amt)} but the loan given was ${fmtMoney(compare)}. The loan total is changed only through the girvi transactions.`);
  const wEl=document.getElementById('grItemWarn');
  if(wEl) wEl.innerHTML=warns.length?`<div class="approveBox" style="margin-top:8px;">⚠️ ${warns.join('<br>⚠️ ')}</div>`:'';
}
function grReadItems(strict){
  const out=[]; let error='';
  grItemsDraft.forEach((it,i)=>{
    const name=(it.name||'').trim(), w=Number(it.weight)||0, amt=Number(it.loanAmount)||0, notes=(it.notes||'').trim();
    if(!name && !w && !amt && !notes && !it.photo) return;                         // an empty row is simply ignored
    if(strict && (!name || w<=0) && !error) error=`Item ${i+1}: please enter ${!name?'the item name / design':'the weight'} — or remove this item`;
    out.push({id:it.id, name, category:it.category||'Silver', weight:w, purity:(Number(it.purity)||100), karat:it.karat||null, loanAmount:amt, notes, photo:it.photo||null});
  });
  return {items:out, error};
}

function saveGirvi(isDraft){
  const name = document.getElementById('grCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(!customerGate('grCustomer','grPhone',()=>saveGirvi(isDraft))) return;
  const R = grReadItems(!isDraft);
  if(R.error){ toast(R.error); return; }
  const loanAmount = parseFloat(document.getElementById('grLoanAmt').value)||0;
  const gDate = document.getElementById('grDate').value || todayStr();
  if(!isDraft){
    const missing = [];
    if(!R.items.length) missing.push('at least one item (name + weight)');
    if(loanAmount<=0) missing.push('Total Loan Amount');
    if(missing.length){ toast('Please fill: '+missing.join(', ')+' — or use "Save as Draft" if details are not ready yet'); return; }
  }
  const cust = resolveCustomer('grCustomer','grPhone');
  const bag=readBag('gr'); if(bag) rememberBag(bag);
  const agg=girviAggregate(R.items);
  const g = {
    id: uid('GIR'), date: gDate, createdAt: nowISO(),
    customerId:cust.id, customerName:cust.name, itemDesc:agg.itemDesc,
    metal: R.items.length?agg.metal:'Silver', purity: R.items.length?agg.purity:100, weight: agg.weight, items: R.items,
    loanAmount, interestRatePct: parseFloat(document.getElementById('grInterest').value)||0,
    dueDate: document.getElementById('grDue').value||'', status: isDraft?'draft':'active', photo: null,
    outstandingPrincipal: loanAmount, lastInterestDate: gDate, isDraft: !!isDraft,
    referenceName: document.getElementById('grRefName').value||'', forwards: [], notes:'', bagColor:bag, photos:[], photoLog:[],
    transactions: (isDraft && loanAmount<=0) ? [] : [{id:uid('GTX'), date:gDate, type:'Loan Given', amount:loanAmount, note:'Initial girvi loan'+(R.items.length>1?' ('+R.items.length+' items)':'')}]
  };
  grApplyCustPhoto(cust, g);
  applyGirviPhotos(g, grDraftPhotos);
  DB.girvi.push(g);
  logHistory('Girvi', isDraft?'Draft Created':'Created', isDraft ? `Draft girvi started for ${cust.name} (details pending)` : `Loan of ${fmtMoney(g.loanAmount)} against ${girviItemsHistoryText(g)} for ${cust.name}${bag?' — '+bag+' bag':''}`);
  saveDB(); closeModal(); toast(isDraft?'Saved as draft — complete it later from the Girvi list':'Girvi loan saved'+(R.items.length>1?' — '+R.items.length+' items':'')+(bag?' — '+bag+' bag':'')); refreshGirviContext();

function recomputeGirviPrincipal(g){
  let p = 0, lastInterest = g.date;
  (g.transactions||[]).filter(t=>!t.deleted).forEach(t=>{
    if(t.type==='Loan Given' || t.type==='Additional Loan') p += t.amount;
    else if(t.type==='Part Payment') p -= t.amount;
    else if(t.type==='Interest Received') lastInterest = t.date;
    else if(t.type==='Redeemed') p = 0;
  });
  g.outstandingPrincipal = Math.max(p,0);
  g.lastInterestDate = lastInterest;
}
function deleteGirviTx(girviId, txId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const t = (g.transactions||[]).find(x=>x.id===txId); if(!t) return;
  if(t.type==='Loan Given'){ toast('Cannot delete the initial loan entry — delete the whole loan record instead if this was a mistake.'); return; }
  guardDelete('transaction ('+t.type+' — '+fmtMoney(t.amount)+')', ()=>{
    t.deleted = true;
    recomputeGirviPrincipal(g);
    logHistory('Girvi','Transaction Deleted', `${t.type} of ${fmtMoney(t.amount)} removed from ${g.customerName}'s girvi (${g.itemDesc})`);
    saveDB(); toast('Transaction deleted'); viewGirvi(girviId);
  });
}

  const g = DB.girvi.find(x=>x.id===id); if(!g) return;

    logHistory('Girvi','Deleted', `Girvi loan for ${g.customerName} (${g.itemDesc}) deleted`);
    saveDB(); closeModal(); refreshGirviContext(); toast('Girvi loan deleted');

}

  `;
  openModal(type, body, [

function saveGirviTx(id, type){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const amt = parseFloat(document.getElementById('gtxAmount').value)||0;
  const date = document.getElementById('gtxDate').value || todayStr();
  const note = document.getElementById('gtxNote').value || '';
  if(amt<=0){ toast('Enter a valid amount'); return; }
  g.transactions = g.transactions || [];
  g.transactions.push({id:uid('GTX'), date, type, amount:amt, note});
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  if(type==='Additional Loan') g.outstandingPrincipal = principal + amt;
  else if(type==='Part Payment') g.outstandingPrincipal = Math.max(principal - amt, 0);
  else if(type==='Interest Received') g.lastInterestDate = date;
  logHistory('Girvi', type, `${type} of ${fmtMoney(amt)} for ${g.customerName} (${g.itemDesc})`);
  saveDB(); closeModal(); toast('Entry saved'); refreshGirviContext();
}
function openForfeitForm(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;

    <div id="ffCalcOut" class="approveBox" style="margin-top:12px;"></div>
  `;
  openModal('Forfeit — Settle & Buy Item', body, [

function recalcForfeit(totalDue){
  const settlement = parseFloat(document.getElementById('ffSettlement').value)||0;
  const extra = settlement - totalDue;
  document.getElementById('ffExtra').value = extra.toFixed(2);
  const out = document.getElementById('ffCalcOut');
  out.innerHTML = extra>=0
    ? `Settlement covers the full ${fmtMoney(totalDue)} due, plus <b>${fmtMoney(extra)}</b> extra paid to the customer for the item's value above the loan.`
    : `⚠️ Settlement of ${fmtMoney(settlement)} is <b>less</b> than the ${fmtMoney(totalDue)} due — customer is receiving less than what they owe (short-settlement of ${fmtMoney(-extra)}).`;
}
function saveForfeit(id, totalDue, principal, interest){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const settlement = parseFloat(document.getElementById('ffSettlement').value);
  if(isNaN(settlement) || settlement<0){ toast('Enter a valid settlement amount'); return; }
  const date = document.getElementById('ffDate').value || todayStr();
  const extra = settlement - totalDue;
  const notes = document.getElementById('ffNotes').value || '';
  askOwnerApproval('Forfeiting closes this girvi permanently and creates a Buying entry for the item. This requires owner approval.', ()=>{
    g.status = 'forfeited';
    g.outstandingPrincipal = 0;
    g.transactions = g.transactions || [];
    g.transactions.push({id:uid('GTX'), date, type:'Forfeited', amount:settlement, note:`Total due ${fmtMoney(totalDue)} (principal ${fmtMoney(principal)} + interest ${fmtMoney(interest)}), settlement ${fmtMoney(settlement)}${notes?' — '+notes:''}`});

    const buying = {
      id: uid('BUY'), date, createdAt: nowISO(), customerId: g.customerId, customerName: g.customerName,
      itemDesc: g.itemDesc+' (ex-girvi, forfeited)', metal: g.metal, purity: g.purity||100, weight: g.weight,
      rateApplied: g.weight>0 ? Math.round((settlement/((g.weight*(g.purity||100)/100))) * 100)/100 : 0,
      amount: settlement, paymentMode:'Cash', linkedGirviId: g.id, deleted:false,
      notes: `Forfeit settlement — principal ${fmtMoney(principal)} + interest ${fmtMoney(interest)} = due ${fmtMoney(totalDue)}; extra ${fmtMoney(extra)}${notes?'; '+notes:''}`
    };
    DB.buying.push(buying);
    g.linkedBuyingId = buying.id;

    if(g.linkedInventoryId){
      const inv = DB.inventory.find(x=>x.id===g.linkedInventoryId && !x.deleted);
      if(inv){
        const oldLoc = inv.location;
        inv.status = 'available'; inv.location = 'Showcase'; inv.linkedGirviId = null;
        logInventoryMovement(inv.id, 'Pledged → Forfeited (now shop stock)', {fromLocation:oldLoc, toLocation:'Showcase', reference:'Girvi forfeit', notes});
      }
    }
    logHistory('Girvi','Forfeited', `${g.itemDesc} forfeited for ${g.customerName} — settlement ${fmtMoney(settlement)}, Buying entry ${buying.id} created`);
    logHistory('Buying','Created (Auto)', `Auto-created from girvi forfeit: ${buying.itemDesc} — ${fmtMoney(settlement)}`);
    saveDB(); closeModal(); toast('Girvi forfeited — Buying entry created'); refreshGirviContext();
  });
}

/* Udhaar tracking: payments are matched to the OLDEST unpaid udhaar first (FIFO), so every
   entry knows whether it is still outstanding and whether it is overdue (its own due date,
   or older than the "overdue after N days" setting when no due date was given). */
let _cr = {view:'customers', sort:'amount-desc', status:'all', cust:'', q:'', from:'', to:''};
function creditEntryOverdue(d, today, od){ const due=d.e.dueDate||''; return due ? due<today : daysBetween(d.e.date)>od; }
function creditStandings(){
  const map={}, by={}, today=todayStr(), od=DB.meta.creditOverdueDays||30;
  DB.creditEntries.filter(e=>!e.deleted && e.customerId).forEach(e=>{ (by[e.customerId]=by[e.customerId]||[]).push(e); });
  Object.keys(by).forEach(id=>{
    const list=by[id].slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||''));
    const debits=[]; let pay=0, bal=0, lastDate='';
    list.forEach(e=>{ if((e.date||'')>lastDate) lastDate=e.date; if(e.type==='debit'){ debits.push({e, rem:e.amount}); bal+=e.amount; } else { bal-=e.amount; pay+=e.amount; } });
    let left=pay; debits.forEach(d=>{ const t=Math.min(d.rem,left); d.rem-=t; left-=t; });
    const open=debits.filter(d=>d.rem>0.0001);
    let overdueAmt=0, earliestDue='', oldest='', overdueDays=0;
    open.forEach(d=>{
      if(!oldest||d.e.date<oldest) oldest=d.e.date;
      const due=d.e.dueDate||''; if(due && (!earliestDue||due<earliestDue)) earliestDue=due;
      if(creditEntryOverdue(d,today,od)){ overdueAmt+=d.rem; overdueDays=Math.max(overdueDays, due?daysBetween(due):daysBetween(d.e.date)-od); }
    });
    map[id]={bal, status: bal<=0.0001?'paid':(overdueAmt>0?'overdue':'active'), overdueAmt, overdueDays, earliestDue, oldest, lastDate, open, count:list.length};
  });
  return map;
}
/* kept under its old name — the dashboard alerts use it */
function creditOldestOverdueInfo(custId){
  const s=creditStandings()[custId];
  if(!s || !DB.creditEntries.some(e=>e.customerId===custId && !e.deleted && e.type==='debit')) return null;
  return {oldestDate:s.oldest||s.lastDate, dueDate:s.earliestDue||null, isOverdue:s.status==='overdue', daysOld: daysBetween(s.oldest||s.lastDate)};
}
function creditStatusTag(s){
  if(!s) return '<span class="tag tag-green">Paid</span>';
  if(s.status==='overdue') return `<span class="tag tag-red">Overdue${s.overdueDays>0?' '+s.overdueDays+'d':''}</span>`;
  if(s.status==='paid') return '<span class="tag tag-green">Paid</span>';
  return '<span class="tag tag-gold">Active</span>';
}
const _CR_EMPTY={bal:0,status:'paid',overdueAmt:0,overdueDays:0,earliestDue:'',oldest:'',lastDate:'',open:[],count:0};

      <div class="field"><label>Status</label><select id="creditStatusFilter" onchange="_cr.status=this.value;renderCreditTable()">${[['all','All'],['active','Active'],['overdue','Overdue'],['paid','Paid']].map(([v,l])=>`<option value="${v}" ${_cr.status===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Customer</label><select id="creditCustFilter" onchange="_cr.cust=this.value;renderCreditTable()"><option value="">All customers</option>${sorted.map(c=>`<option value="${c.id}" ${_cr.cust===c.id?'selected':''}>${escH(c.name)}</option>`).join('')}</select></div>

  document.getElementById('content').innerHTML=html;
  renderCreditTable();

function renderCreditTable(){

  const cmpDue=(a,b,dir)=>{ const x=a||'', y=b||''; if(!x&&!y) return 0; if(!x) return 1; if(!y) return -1; return dir*x.localeCompare(y); };

    rows.forEach(r=>{ html+=`<tr class="${r.s.status==='overdue'?'rowOverdue':''}"><td><span class="custCell">${custAvatarHTML(r.c,26)}<span><b>${escH(r.c.name)}</b>${r.c.village?`<div class="helpText">${escH(r.c.village)}</div>`:''}</span></span></td><td>${escH(r.c.phone||'-')}</td><td>${r.s.lastDate?fmtDate(r.s.lastDate):'—'}</td><td>${r.s.earliestDue?fmtDate(r.s.earliestDue):'—'}</td><td>${r.s.bal>0?'<b style="color:var(--danger)">'+fmtMoney(r.s.bal)+'</b>':fmtMoney(r.s.bal)}</td><td>${creditStatusTag(r.s)}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${r.id}')">View Ledger</button> <button class="btn btn-sm btn-outline" onclick="openCreditForm('${escH(r.c.name).replace(/'/g,'&#39;')}','${r.id}')">+ Entry</button> <button class="btn btn-sm btn-danger" onclick="unmarkCreditCustomer('${r.id}')">Remove from Credit</button></td></tr>`; });
    html+='</table>';
    note=`${rows.length} customer(s) • total due shown: ${fmtMoney(rows.reduce((a,r)=>a+Math.max(r.s.bal,0),0))}`;
  } else {
    const ids=new Set(credCusts.map(c=>c.id));
    let rows=DB.creditEntries.filter(e=>!e.deleted&&ids.has(e.customerId)).map(e=>({e, c:customerById(e.customerId), s:st[e.customerId]||_CR_EMPTY})).filter(r=>r.c);
    rows=rows.filter(r=>(_cr.status==='all'||r.s.status===_cr.status) && (!_cr.cust||r.c.id===_cr.cust) && customerMatchesQuery(r.c,_cr.q) && inRange(r.e.date));
    rows.sort((a,b)=>{ switch(_cr.sort){
      case 'amount-asc': return a.e.amount-b.e.amount; case 'amount-desc': return b.e.amount-a.e.amount; case 'date-asc': return (a.e.date||'').localeCompare(b.e.date||'');
      case 'name': return a.c.name.localeCompare(b.c.name); case 'due-asc': return cmpDue(a.e.dueDate,b.e.dueDate,1); case 'due-desc': return cmpDue(a.e.dueDate,b.e.dueDate,-1);
      case 'status': return (stOrder[a.s.status]-stOrder[b.s.status])||(b.e.date||'').localeCompare(a.e.date||''); default: return (b.e.date||'').localeCompare(a.e.date||'')||(b.e.createdAt||'').localeCompare(a.e.createdAt||''); } });
    html=`<table><tr><th>Date</th><th>Customer</th><th>Type</th><th>Amount</th><th>Due Date</th><th>Note</th><th>Customer Status</th><th></th></tr>`;
    if(!rows.length) html+=`<tr><td colspan="8"><div class="empty"><div class="big">📒</div>No entries match.</div></td></tr>`;
    rows.slice(0,500).forEach(r=>{

    });

  document.getElementById('creditTableWrap').innerHTML=`<div class="helpText" style="margin-bottom:6px;">${note}</div>`+html;
}

const INV_STATUSES = ['available','reserved','under-repair','in-manufacturing','pledged','exchanged','damaged','melted','returned','sold'];
const INV_LOCATIONS = ['Showcase','Vault','Workshop','Repair','In Transit','Customer','Other'];
function invIsAvailable(item){ return item.status==='available' || item.status==='in-stock'; }
function invStatusLabel(status){

}
function invStatusTagClass(status){
  if(invIsAvailable({status})) return 'tag-green';

function logInventoryMovement(itemId, type, opts){

  DB.inventoryMovements.push({
    id: uid('MOV'), itemId, type, date: todayStr(), createdAt: nowISO(),
    fromLocation: opts.fromLocation||'', toLocation: opts.toLocation||'',

}
function setInvStatus(id, newStatus, newLocation, reference, notes, silent){

    <div class="grid grid-3" style="margin-bottom:12px;">
      <input id="invSearch" placeholder="Search item / code / HUID..." oninput="renderInvTable()">
      <select id="invStatusFilter" onchange="renderInvTable()"><option value="">All Statuses</option>${INV_STATUSES.map(s=>`<option value="${s}">${invStatusLabel(s)}</option>`).join('')}</select>
      <select id="invLocationFilter" onchange="renderInvTable()"><option value="">All Locations</option>${INV_LOCATIONS.map(l=>`<option value="${l}">${l}</option>`).join('')}</select>
    </div>
    <div id="invTableWrap"></div>
  </div>`;
  wrap.innerHTML = html;
  renderInvTable();
}
function renderInvTable(){
  const q = (document.getElementById('invSearch')?.value||'').toLowerCase();
  const statusF = document.getElementById('invStatusFilter')?.value||'';
  const locF = document.getElementById('invLocationFilter')?.value||'';
  let rows = [...DB.inventory].filter(i=>!i.deleted).sort((a,b)=>b.addedDate.localeCompare(a.addedDate));
  if(q) rows = rows.filter(i=> [i.itemName,i.code,i.subcategory,i.designGroup,i.style,i.batchNo,i.karigarSource,i.huid,i.hallmarkNumber].filter(Boolean).some(v=>String(v).toLowerCase().includes(q)));
  if(statusF) rows = rows.filter(i=> statusF==='available' ? invIsAvailable(i) : i.status===statusF);
  if(locF) rows = rows.filter(i=> (i.location||'Showcase')===locF);
  let html = `<table><tr><th>Code</th><th>Item</th><th>Category / Variant</th><th>Wt</th><th>Purity</th><th>Status</th><th>Location</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="8"><div class="empty"><div class="big">💍</div>No inventory items match.</div></td></tr>`;
  rows.forEach(i=>{
    const variantBits = [i.subcategory,i.designGroup,i.size,i.pairSingle,i.style,i.stoneOrNot].filter(Boolean);
    html += `<tr><td>${i.code}${i.huid?' <span class="helpText">HUID</span>':''}</td><td>${i.itemName}${i.pieceCount>1?' ('+i.pieceCount+' pc)':''}</td><td>${i.category}${variantBits.length?'<br><span class="helpText">'+variantBits.join(' • ')+'</span>':''}</td><td>${fmtWt(i.weight)}</td><td>${i.purity}</td>
    <td><span class="tag ${invStatusTagClass(i.status)}">${invStatusLabel(i.status)}</span></td><td>${i.location||'Showcase'}</td>
    <td>${invIsAvailable(i)?`<button class="btn btn-sm btn-outline" onclick="markSold('${i.id}')">Mark Sold</button>`:''}
    <button class="btn btn-sm btn-ghost" onclick="viewInvDetails('${i.id}')">👁</button>
    <button class="btn btn-sm btn-ghost" onclick="guardEdit('inventory item', ()=>openInvForm('${i.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteInv('${i.id}')">🗑</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('invTableWrap').innerHTML = html;
}
function viewInvDetails(id){

    ['Code', i.code], ['Item Name', i.itemName], ['Category', i.category], ['Subcategory', i.subcategory],
    ['Design Group', i.designGroup], ['Size', i.size], ['Pair / Single', i.pairSingle], ['Style', i.style],
    ['Stone', i.stoneOrNot], ['Stone Type', i.stoneType], ['Stone Count', i.stoneCount], ['Stone Carat', i.stoneCarat],
    ['Custom Attributes', i.customAttr], ['Batch / Lot No.', i.batchNo], ['Karigar / Supplier', i.karigarSource],
    ['Weight Type', i.weightType], ['Piece Count', i.pieceCount], ['Gross Weight', i.grossWeight?fmtWt(i.grossWeight):''],
    ['Net Weight', i.netWeight?fmtWt(i.netWeight):''], ['Weight', fmtWt(i.weight)], ['Purity', i.purity], ['Qty', i.qty],
    ['Cost Price', i.costPrice?fmtMoney(i.costPrice):''], ['Selling Price', i.sellingPrice?fmtMoney(i.sellingPrice):''],
    ['HUID', i.huid], ['Hallmark No.', i.hallmarkNumber], ['Hallmark Status', i.hallmarkStatus],
    ['Hallmark Cert Details', i.hallmarkCertDetails], ['Manufacturing Date', i.mfgDate?fmtDate(i.mfgDate):''],
    ['Location', i.location], ['Tags', i.tags], ['Remarks', i.remarks], ['Status', invStatusLabel(i.status)]
  ].filter(([k,v])=> v!==undefined && v!==null && v!=='');
  let body = `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;">
    <div style="flex-shrink:0;">${(i.photos&&i.photos[0])?`<img src="${i.photos[0]}" class="photoThumb" style="width:80px;height:80px;">`:`<div class="photoPlaceholder" style="width:80px;height:80px;">💍</div>`}</div>
    <div>
      <div style="font-family:var(--font-display);font-size:18px;color:var(--maroon-dark);">${i.itemName}</div>
      <div class="helpText">${i.code}</div>
      <span class="tag ${invStatusTagClass(i.status)}" style="margin-top:4px;display:inline-block;">${invStatusLabel(i.status)}</span>
      <span class="tag tag-gray" style="margin-top:4px;">${i.location||'Showcase'}</span>
    </div>
  </div>`;
  if(i.photos && i.photos.length>1){
    body += `<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">${i.photos.map(p=>`<img src="${p}" class="photoThumb" style="width:56px;height:56px;">`).join('')}</div>`;
  }
  body += `<table>${rows.map(([k,v])=>`<tr><td style="font-weight:600;width:42%;">${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  if(i.sourceType==='Wholesaler Made' && i.billingPurity){
    const w = DB.wholesalers.find(x=>x.id===i.wholesalerId);
    const weight = Number(i.weight)||0, billingPurity = Number(i.billingPurity)||0, making = Number(i.wholesalerMakingPerGram)||0;
    let rate = Number(i.wholesalerRateUsed);
    if(!rate) rate = i.category==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
    const billedWeight = weight*(billingPurity/100);
    const totalCost = billedWeight*rate + weight*making;
    body += `<h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:16px 0 8px;">🏭 Wholesaler Making Cost</h4>
      <table>
        <tr><td style="font-weight:600;width:42%;">Wholesaler</td><td>${w?w.name:'-'}</td></tr>
        <tr><td style="font-weight:600;">Actual Purity</td><td>${i.actualPurity||'-'}%</td></tr>
        <tr><td style="font-weight:600;">Billed At Purity</td><td>${billingPurity}%</td></tr>
        <tr><td style="font-weight:600;">Making</td><td>${fmtMoney(making)}/g</td></tr>
        <tr><td style="font-weight:600;">Your Total Cost</td><td><b>${fmtMoney(totalCost)}</b></td></tr>
      </table>`;
  }
  if(i.costPrice && i.sellingPrice){
    const margin = Number(i.sellingPrice) - Number(i.costPrice);
    const marginPct = Number(i.costPrice)>0 ? (margin/Number(i.costPrice)*100) : 0;
    body += `<div class="approveBox" style="margin-top:14px;">💰 Estimated margin: <b>${fmtMoney(margin)}</b> (${marginPct.toFixed(1)}%)</div>`;
  }
  const movements = DB.inventoryMovements.filter(m=>m.itemId===id && !m.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  body += `<h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:16px 0 4px;">Movement Timeline</h4>
    <div class="txnList">${movements.map(m=>`<div class="txnRow"><span>${m.type}${m.reference?' • '+m.reference:''}${m.notes?' — '+m.notes:''}</span><span class="helpText">${fmtDate(m.date)}</span></div>`).join('') || '<div class="txnRow">No movements logged yet.</div>'}</div>`;
  const links = [];
  if(i.linkedGirviId) links.push({label:'View Linked Girvi', action:()=>{ closeModal(); viewGirvi(i.linkedGirviId); }});
  if(i.linkedJobId) links.push({label:'View Linked Job', action:()=>{ closeModal(); goTo('jobs'); }});
  if(i.linkedSaleId) links.push({label:'View Linked Sale', action:()=>{ closeModal(); viewSale(i.linkedSaleId); }});
  const foot = [{label:'Close', cls:'btn-ghost', onClick:closeModal}];
  foot.push({label:'🔀 Change Status/Location', cls:'btn-outline', onClick:()=>{ guardEdit('inventory item status', ()=>{ closeModal(); openInvStatusForm(id); }); }});
  foot.push({label:'🏷 Print Label', cls:'btn-gold', onClick:()=>printInvLabel(id)});
  links.forEach(l=> foot.push({label:l.label, cls:'btn-ghost', onClick:l.action}));
  openModal(i.itemName+' — Details', body, foot);
}

function handleInvPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  compressImageFile(file, 320, 0.6, (dataUrl)=>{
    invPhotoData.push(dataUrl);
    document.getElementById('invPhotoPreviewWrap').innerHTML = invPhotoData.map(p=>`<img src="${p}" class="photoThumb" style="width:56px;height:56px;">`).join('');
  });
}
function recalcInvCost(){
  const out = document.getElementById('invCostOut'); if(!out) return;
  const weight = parseFloat(document.getElementById('invWeight')?.value)||0;
  const billingPurity = parseFloat(document.getElementById('invBillingPurity')?.value);
  const making = parseFloat(document.getElementById('invWholesalerMaking')?.value)||0;
  let rate = parseFloat(document.getElementById('invWholesalerRate')?.value);
  if(!rate){
    const cat = document.getElementById('invCategory')?.value;
    rate = cat==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
  }
  if(!weight || isNaN(billingPurity)){ out.innerHTML = `<p class="helpText" style="margin:0;">Fill weight and billed purity to see your cost.</p>`; return; }
  const billedWeight = weight*(billingPurity/100);
  const metalCost = billedWeight*rate;
  const makingCost = weight*making;
  const totalCost = metalCost+makingCost;
  out.innerHTML = `
    <div class="totalsRow"><span>Billed Weight (${billingPurity}% of ${weight}g)</span><span>${fmtWt(billedWeight)}</span></div>
    <div class="totalsRow"><span>Metal Cost</span><span>${fmtMoney(metalCost)}</span></div>
    <div class="totalsRow"><span>Making Cost</span><span>${fmtMoney(makingCost)}</span></div>
    <div class="totalsRow grand"><span>Your Total Cost</span><span>${fmtMoney(totalCost)}</span></div>
  `;
}
function saveInv(id){
  const name = document.getElementById('invName').value;
  if(!name){ toast('Enter item name'); return; }
  const extra = {
    subcategory: document.getElementById('invSubcat').value, designGroup: document.getElementById('invDesignGroup').value,
    size: document.getElementById('invSize').value, pairSingle: document.getElementById('invPairSingle').value,
    style: document.getElementById('invStyle').value, stoneOrNot: document.getElementById('invStoneOrNot').value,
    weightType: document.getElementById('invWeightType').value, pieceCount: parseInt(document.getElementById('invPieceCount').value)||1,
    batchNo: document.getElementById('invBatchNo').value, karigarSource: document.getElementById('invKarigarSource').value,
    customAttr: document.getElementById('invCustomAttr').value, remarks: document.getElementById('invRemarks').value,
    sourceType: document.getElementById('invSourceType').value, wholesalerId: document.getElementById('invWholesalerId').value,
    actualPurity: document.getElementById('invActualPurity').value, billingPurity: document.getElementById('invBillingPurity').value,
    wholesalerMakingPerGram: document.getElementById('invWholesalerMaking').value, wholesalerRateUsed: document.getElementById('invWholesalerRate').value,
    grossWeight: document.getElementById('invGrossWeight').value, netWeight: document.getElementById('invNetWeight').value,
    stoneType: document.getElementById('invStoneType').value, stoneCount: document.getElementById('invStoneCount').value,
    stoneCarat: document.getElementById('invStoneCarat').value, stoneColor: document.getElementById('invStoneColor').value,
    huid: document.getElementById('invHuid').value, hallmarkNumber: document.getElementById('invHallmarkNo').value,
    hallmarkStatus: document.getElementById('invHallmarkStatus').value, hallmarkCertDetails: document.getElementById('invHallmarkCert').value,
    costPrice: document.getElementById('invCostPrice').value, sellingPrice: document.getElementById('invSellingPrice').value,
    location: document.getElementById('invLocation').value, mfgDate: document.getElementById('invMfgDate').value,
    tags: document.getElementById('invTags').value, photos: [...invPhotoData]
  };
  if(id){
    const item = DB.inventory.find(x=>x.id===id); if(!item) return;
    item.code=document.getElementById('invCode').value; item.category=document.getElementById('invCategory').value;
    item.itemName=name; item.weight=parseFloat(document.getElementById('invWeight').value)||0;

/* ---- CODE 39 BARCODE + PRINT LABEL ---- */
const CODE39_PATTERNS = {
  '0':'NNNWWNWNN','1':'WNNWNNNNW','2':'NNWWNNNNW','3':'WNWWNNNNN','4':'NNNWWNNNW',
  '5':'WNNWWNNNN','6':'NNWWWNNNN','7':'NNNWNNWNW','8':'WNNWNNWNN','9':'NNWWNNWNN',
  'A':'WNNNNWNNW','B':'NNWNNWNNW','C':'WNWNNWNNN','D':'NNNNWWNNW','E':'WNNNWWNNN',
  'F':'NNWNWWNNN','G':'NNNNNWWNW','H':'WNNNNWWNN','I':'NNWNNWWNN','J':'NNNNWWWNN',
  'K':'WNNNNNNWW','L':'NNWNNNNWW','M':'WNWNNNNWN','N':'NNNNWNNWW','O':'WNNNWNNWN',
  'P':'NNWNWNNWN','Q':'NNNNNNWWW','R':'WNNNNNWWN','S':'NNWNNNWWN','T':'NNNNWNWWN',
  'U':'WWNNNNNNW','V':'NWWNNNNNW','W':'WWWNNNNNN','X':'NWNNWNNNW','Y':'WWNNWNNNN',
  'Z':'NWWNWNNNN','-':'NWNNNNWNW','.':'WWNNNNNWN',' ':'NWWNNNWNN','$':'NWNWNWNNN',
  '/':'NWNWNNNWN','+':'NWNNNWNWN','%':'NNNWNWNWN','*':'NWNNWNWNN'
};
function code39Compatible(text){ return /^[A-Z0-9 \-.$/+%]+$/.test(text); }
function renderCode39SVG(text, height){
  height = height||46;
  const raw = String(text).toUpperCase();
  const clean = code39Compatible(raw) ? raw : raw.replace(/[^A-Z0-9\-]/g,'');
  const chars = '*'+clean+'*';
  let x=0; const narrow=2, wide=5, gap=2; const bars=[];
  for(const ch of chars){
    const pattern = CODE39_PATTERNS[ch]; if(!pattern) continue;
    for(let k=0;k<pattern.length;k++){
      const isBar = k%2===0; const w = pattern[k]==='W'?wide:narrow;
      if(isBar) bars.push(`<rect x="${x}" y="0" width="${w}" height="${height}" fill="#000"/>`);
      x += w;
    }
    x += gap;
  }
  return `<svg viewBox="0 0 ${x} ${height}" width="100%" height="${height}" style="max-width:320px;">${bars.join('')}</svg>`;
}

/* =====================================================================
   CUSTOMER LEDGER — a permanent memory of every customer.
   Deleted and closed entries stay visible (marked) and are never counted
   in totals; nothing is removed from a customer's history.
===================================================================== */
function buildCustIndex(){
  const idx={};
  const E=id=>idx[id]||(idx[id]={sales:0,buying:0,girviActive:0,girviClosed:0,girviDraft:0,credit:0,jobs:0,exchange:0,last:'',first:''});
  const T2=(o,d)=>{ if(!d) return; if(!o.last||d>o.last) o.last=d; if(!o.first||d<o.first) o.first=d; };
  DB.sales.forEach(s=>{ if(s.deleted||!s.customerId) return; const o=E(s.customerId); o.sales++; T2(o,s.date); });
  DB.buying.forEach(b=>{ if(b.deleted||!b.customerId) return; const o=E(b.customerId); o.buying++; T2(o,b.date); });
  DB.girvi.forEach(g=>{ if(g.deleted||!g.customerId) return; const o=E(g.customerId);
    if(g.status==='active') o.girviActive++; else if(g.status==='draft') o.girviDraft++; else o.girviClosed++; T2(o,g.date); });
  DB.creditEntries.forEach(e=>{ if(e.deleted||!e.customerId) return; const o=E(e.customerId); o.credit++; T2(o,e.date); });
  DB.jobs.forEach(j=>{ if(j.deleted||!j.customerId) return; const o=E(j.customerId); o.jobs++; T2(o,j.date); });
  DB.exchange.forEach(x=>{ if(x.deleted||!x.customerId) return; const o=E(x.customerId); o.exchange++; T2(o,x.date); });
  return idx;
}
function custIdx(idx,id){ return idx[id]||{sales:0,buying:0,girviActive:0,girviClosed:0,girviDraft:0,credit:0,jobs:0,exchange:0,last:'',first:''}; }

/* ---- everything that ever happened for a customer ---- */
function girviStatusLabel(g){
  if(g.deleted) return {t:'Deleted', cls:'tag-gray'};
  if(g.status==='draft') return {t:'Draft', cls:'tag-gray'};
  if(g.status==='redeemed') return {t:'Closed — redeemed', cls:'tag-green'};
  if(g.status==='forfeited') return {t:'Closed — forfeited', cls:'tag-gray'};
  return girviIsOverdue(g) ? {t:'Overdue', cls:'tag-red'} : {t:'Active', cls:'tag-gold'};
}
function customerTimeline(id){
  const out=[];
  DB.sales.filter(s=>s.customerId===id).forEach(s=>{
    const names=(s.items||[]).map(i=>i.itemName).filter(Boolean);
    out.push({type:'sale', date:s.date, ts:s.createdAt||'', icon:'🧾', label:'Sale', title:'Bill '+s.billNo, detail:names.slice(0,3).join(', ')+(names.length>3?' +'+(names.length-3)+' more':''), amount:s.grandTotal, deleted:!!s.deleted, tag:s.void?'Voided':'', tagCls:'tag-gray', open:`viewSale('${s.id}')`});
  });
  DB.girvi.filter(g=>g.customerId===id).forEach(g=>{
    const st=girviStatusLabel(g);
    out.push({type:'girvi', date:g.date, ts:g.createdAt||'', icon:'🔐', label:'Girvi', title:g.status==='draft'?'Girvi draft (details pending)':'Girvi — '+(g.itemDesc||''), detailHTML:girviItemsLineHTML(g)+(g.bagColor?bagChipHTML(g.bagColor)+' ':'')+(g.status!=='draft'?escH(fmtWt(g.weight)):''), amount:g.status==='draft'?null:g.loanAmount, deleted:!!g.deleted, tag:st.t, tagCls:st.cls, open:`viewGirvi('${g.id}')`});
    (g.transactions||[]).filter(t=>t.type!=='Loan Given').forEach(t=>out.push({type:'girvi', date:t.date, ts:(t.date||'')+'T12:00', icon:'↳', label:'Girvi', title:t.type+' — '+(g.itemDesc||''), detail:t.note||'', amount:t.amount, deleted:!!(g.deleted||t.deleted), open:`viewGirvi('${g.id}')`}));
  });
  DB.buying.filter(b=>b.customerId===id).forEach(b=>out.push({type:'buy', date:b.date, ts:b.createdAt||'', icon:'⚖️', label:'Purchase', title:'Purchase — '+(b.itemDesc||b.metal||''), detail:fmtWt(b.weight)+' '+(b.metal||''), amount:b.amount, deleted:!!b.deleted, open:`printBuyingReceipt('${b.id}')`}));
  DB.creditEntries.filter(e=>e.customerId===id).forEach(e=>out.push({type:'credit', date:e.date, ts:e.createdAt||'', icon:e.type==='debit'?'📒':'💵', label:'Credit', title:e.type==='debit'?'Udhaar given':'Payment received', detail:(e.description||'')+((e.type==='debit'&&e.dueDate)?' • due '+fmtDate(e.dueDate):''), amount:e.amount, deleted:!!e.deleted}));
  DB.jobs.filter(j=>j.customerId===id).forEach(j=>out.push({type:'job', date:j.date, ts:j.createdAt||'', icon:'🛠️', label:'Job', title:(j.type||'Job')+' — '+(j.itemDesc||''), detail:(j.karigarName?'Karigar: '+j.karigarName:''), amount:j.labourCharge, deleted:!!j.deleted, tag:j.status, tagCls:'tag-gold', open:`printJobReceipt('${j.id}')`}));
  DB.exchange.filter(x=>x.customerId===id).forEach(x=>out.push({type:'exchange', date:x.date, ts:x.createdAt||'', icon:'🔁', label:'Exchange', title:'Exchange — '+(x.oldItemDesc||'')+' → '+(x.newItemDesc||''), detail:'', amount:x.balanceToPay, deleted:!!x.deleted}));
  return out.sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.ts||'').localeCompare(a.ts||''));
}
function customerPhotoGallery(cid){
  const c=customerById(cid); const out=[]; const seen=new Set();

  if(c){ add(c.photo,'Profile photo'); (c.photos||[]).forEach(p=>add(typeof p==='string'?p:p.data,'Profile photo')); (c.photoHistory||[]).forEach(h=>{ if(h.data) add(h.data,'Earlier profile photo (replaced '+fmtDate(String(h.replacedAt).slice(0,10))+')'); }); }
  DB.girvi.filter(g=>g.customerId===cid && !g.deleted).forEach(g=>{
    add(g.photo,'Customer photo at girvi ('+fmtDate(g.date)+')');
    (g.photos||[]).forEach(p=>add(p.data,'Girvi — '+(g.itemDesc||'item photo')+' ('+fmtDate(g.date)+')'));

function renderProfileTimeline(){
  const id=window._profileId, f=window._pf||{type:'all',q:'',from:'',to:'',showDeleted:true};
  const all=customerTimeline(id);
  const counts={all:all.length}; all.forEach(i=>counts[i.type]=(counts[i.type]||0)+1);
  const chips=[['all','All'],['sale','🧾 Sales'],['girvi','🔐 Girvi'],['buy','⚖️ Purchases'],['credit','📒 Credit'],['job','🛠️ Jobs'],['exchange','🔁 Exchange']];
  const cEl=document.getElementById('pfChips');
  if(cEl) cEl.innerHTML=chips.filter(([k])=>k==='all'||counts[k]).map(([k,l])=>`<span class="chipBtn ${f.type===k?'active':''}" onclick="pfSet('type','${k}')">${l} ${counts[k]||0}</span>`).join('');
  const q=(f.q||'').toLowerCase();
  const rows=all.filter(i=>(f.type==='all'||i.type===f.type) && (f.showDeleted||!i.deleted) && (!f.from||i.date>=f.from) && (!f.to||i.date<=f.to)
    && (!q || (i.title+' '+(i.detail||'')+' '+(i.tag||'')+' '+(i.detailHTML||'').replace(/<[^>]*>/g,'')).toLowerCase().includes(q)));
  let html=`<table><tr><th>Date</th><th>Type</th><th>Details</th><th>Amount</th><th>Status</th><th></th></tr>`;
  if(!rows.length) html+=`<tr><td colspan="6"><div class="empty"><div class="big">📜</div>Nothing matches these filters.</div></td></tr>`;
  rows.slice(0,400).forEach(i=>{
    html+=`<tr class="${i.deleted?'rowDeleted':''}"><td style="white-space:nowrap;">${fmtDate(i.date)}</td><td>${i.icon} ${i.label}</td><td><b>${escH(i.title)}</b><div class="helpText">${i.detailHTML!==undefined?i.detailHTML:escH(i.detail||'')}</div></td>

  });

function customerLastVisit(id){
  const dates = [];
  DB.sales.filter(s=>s.customerId===id && !s.deleted).forEach(s=>dates.push(s.date));
  DB.girvi.filter(g=>g.customerId===id && !g.deleted).forEach(g=>dates.push(g.date));
  DB.creditEntries.filter(e=>e.customerId===id && !e.deleted).forEach(e=>dates.push(e.date));
  DB.jobs.filter(j=>j.customerId===id && !j.deleted).forEach(j=>dates.push(j.date));
  if(dates.length===0) return null;
  return dates.sort().reverse()[0];
}

function openMergePicker(primaryId){
  const primary = DB.customers.find(x=>x.id===primaryId); if(!primary) return;
  const body = `
    <p class="helpText" style="margin-top:0;">Merging keeps <b>${primary.name}</b> as the main profile and moves every sale, girvi, buying, credit, job, and exchange record from the duplicate onto it. Nothing is deleted — the duplicate is kept for reference but hidden from lists.</p>
    <input id="mergeSearch" placeholder="Search the duplicate customer to merge in..." style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;" oninput="renderMergeCandidates('${primaryId}', this.value)">
    <div id="mergeCandidateList" style="max-height:45vh;overflow-y:auto;"></div>
  `;
  openModal('Merge Into "'+primary.name+'"', body, [{label:'Cancel', cls:'btn-ghost', onClick:closeModal}]);
  renderMergeCandidates(primaryId, '');
}
function renderMergeCandidates(primaryId, q){
  q = (q||'').toLowerCase();
  const box = document.getElementById('mergeCandidateList'); if(!box) return;
  const matches = DB.customers.filter(c=> c.id!==primaryId && !c.mergedInto && (!q || c.name.toLowerCase().includes(q) || (c.phone||'').includes(q)));
  if(matches.length===0){ box.innerHTML = `<div class="empty"><div class="big">🔀</div>${q?'No matching customers.':'Type a name or phone to find the duplicate record.'}</div>`; return; }
  box.innerHTML = matches.slice(0,20).map(c=>`<div class="searchResultRow" onclick="confirmMergeCustomers('${primaryId}','${c.id}')">
    <span>${c.photo?`<img src="${c.photo}" class="photoThumb" style="width:24px;height:24px;margin-right:6px;vertical-align:middle;">`:''}${c.name}${c.phone?' — '+c.phone:''}${c.village?' ('+c.village+')':''}</span><span>Merge In →</span></div>`).join('');
}
function confirmMergeCustomers(primaryId, duplicateId){
  const primary = DB.customers.find(x=>x.id===primaryId), dup = DB.customers.find(x=>x.id===duplicateId);
  if(!primary || !dup) return;
  guardEdit('customer merge', ()=>{
    confirmAction(`Merge "${dup.name}" into "${primary.name}"? All of ${dup.name}'s transactions will move to ${primary.name}, and ${dup.name} will no longer appear as a separate customer. This cannot be easily undone.`, ()=>{
      mergeCustomers(primaryId, duplicateId);
    });
  });
}

function renderReports(){
  const today = todayStr();
  const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const monthAgo = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const sumSales = (from) => DB.sales.filter(s=>!s.void && !s.deleted && s.date>=from).reduce((a,s)=>a+s.grandTotal,0);
  const sumBuy = (from) => DB.buying.filter(b=>b.date>=from && !b.deleted).reduce((a,b)=>a+b.amount,0);

  let html = `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">
    <div class="statCard"><div class="lbl">Sales — Today</div><div class="val">${fmtMoney(sumSales(today))}</div></div>
    <div class="statCard"><div class="lbl">Sales — 7 Days</div><div class="val">${fmtMoney(sumSales(weekAgo))}</div></div>
    <div class="statCard"><div class="lbl">Sales — 30 Days</div><div class="val">${fmtMoney(sumSales(monthAgo))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — Today</div><div class="val">${fmtMoney(sumBuy(today))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 7 Days</div><div class="val">${fmtMoney(sumBuy(weekAgo))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 30 Days</div><div class="val">${fmtMoney(sumBuy(monthAgo))}</div></div>
  </div>`;

  // Sales by metal category (30 days)
  const catTotals = {};
  DB.sales.filter(s=>!s.void && !s.deleted && s.date>=monthAgo).forEach(s=>{
    s.items.forEach(i=>{
      const cat = i.itemType==='custom_rupee' ? 'Custom Rupee Items' : (i.category||'Other');
      catTotals[cat] = (catTotals[cat]||0) + saleItemAmount(i);
    });
  });

  // Top customers by lifetime value
  const custTotals = DB.customers.map(c=>{
    const salesTotal = DB.sales.filter(s=>s.customerId===c.id && !s.deleted && !s.void).reduce((a,s)=>a+s.grandTotal,0);
    return {name:c.name, total:salesTotal, id:c.id};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total).slice(0,5);

  // Inventory valuation at current rates
  const stockItems = DB.inventory.filter(i=>invIsAvailable(i) && !i.deleted);
  let stockValue = 0, stockWtGold=0, stockWtSilver=0;
  stockItems.forEach(i=>{
    const purity = parseFloat(i.purity)||100;
    const pureWt = (i.weight||0)*(purity/100);
    const rate = i.category==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
    stockValue += pureWt*rate;
    if(i.category==='Gold') stockWtGold += i.weight||0; else if(i.category==='Silver') stockWtSilver += i.weight||0;
  });

  // Girvi ageing buckets
  const activeGirviList = DB.girvi.filter(g=>g.status==='active' && !g.deleted);
  const buckets = {'0-30 din':0, '31-60 din':0, '61-90 din':0, '90+ din':0};
  activeGirviList.forEach(g=>{
    const d = daysBetween(g.date);
    const principal = g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount;
    if(d<=30) buckets['0-30 din']+=principal;
    else if(d<=60) buckets['31-60 din']+=principal;
    else if(d<=90) buckets['61-90 din']+=principal;
    else buckets['90+ din']+=principal;
  });

  html += `<div class="grid grid-2">`;
  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Outstanding Summary</h3>
    <table><tr><td>Total Credit Due</td><td>${fmtMoney(DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0))}</td></tr>
    <tr><td>Active Girvi Loans</td><td>${fmtMoney(activeGirviList.reduce((a,g)=>a+(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount),0))}</td></tr>
    <tr><td>Pending Jobs</td><td>${DB.jobs.filter(j=>j.status!=='delivered' && !j.deleted).length}</td></tr>
    <tr><td>Items In Stock</td><td>${stockItems.length}</td></tr>

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Top 5 Customers (Lifetime)</h3>
    <table>${custTotals.length ? custTotals.map(c=>`<tr><td>${c.name}</td><td>${fmtMoney(c.total)}</td><td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View</button></td></tr>`).join('') : '<tr><td colspan="3" class="helpText">No sales recorded yet.</td></tr>'}</table></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Girvi Ageing (Active Loans)</h3>

  { const held={}; let multiN=0;
    DB.girvi.filter(g=>!g.deleted && g.status==='active').forEach(g=>{ const its=girviItems(g); if(its.length>1) multiN++; its.forEach(i=>{ const k=i.category||'Other'; held[k]=held[k]||{n:0,w:0}; held[k].n++; held[k].w+=Number(i.weight)||0; }); });

      <table>${Object.keys(held).length?Object.entries(held).map(([k,v])=>`<tr><td>${escH(k)}</td><td>${v.n} item(s)</td><td>${fmtWt(v.w)}</td></tr>`).join(''):'<tr><td colspan="3" class="helpText">No active loans.</td></tr>'}</table>

  // Karigar-wise pending job workload

  DB.jobs.filter(j=>!j.deleted && j.status!=='delivered').forEach(j=>{
    const name = j.karigarName && j.karigarName.trim() ? j.karigarName.trim() : 'Unassigned';
    if(!karigarMap[name]) karigarMap[name] = {count:0, weightOut:0};

  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function renderCashday(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openCashForm()">+ Close Today</button></div>`;
  html += `<div class="card"><table><tr><th>Date</th><th>Opening</th><th>Cash In</th><th>Cash Out</th><th>Closing</th><th>Closed By</th><th></th></tr>`;
  let rows=[...DB.cashDays].filter(c=>!c.deleted).sort((a,b)=>b.date.localeCompare(a.date));
  if(rows.length===0) html+=`<tr><td colspan="7"><div class="empty"><div class="big">💰</div>No day-close records yet.</div></td></tr>`;
  rows.forEach(c=> html+=`<tr><td>${fmtDate(c.date)}</td><td>${fmtMoney(c.openingCash)}</td><td>${fmtMoney(c.cashIn)}</td><td>${fmtMoney(c.cashOut)}</td><td>${fmtMoney(c.closingCash)}</td><td>${c.closedBy}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('day close entry', ()=>openCashForm('${c.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteCashDay('${c.id}')">🗑</button></td></tr>`);
  html+=`</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openCashForm(id){
  const c = id ? DB.cashDays.find(x=>x.id===id) : null;
  const body = `<div class="grid grid-2">
    <div class="field"><label>Date</label><input type="date" id="cdDate" value="${c?c.date:todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>Closed By</label><input id="cdBy" value="${c?c.closedBy:'Owner'}"></div>
    <div class="field"><label>Opening Cash</label><input type="number" id="cdOpen" value="${c?c.openingCash:''}"></div>
    <div class="field"><label>Cash In</label><input type="number" id="cdIn" value="${c?c.cashIn:''}"></div>
    <div class="field"><label>Cash Out</label><input type="number" id="cdOut" value="${c?c.cashOut:''}"></div>
  </div>`;
  openModal(c?'Edit Day Close':'Day Close', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:c?'Save Changes':'Close Day', cls:'btn-primary', onClick:()=>{
      const open=parseFloat(document.getElementById('cdOpen').value)||0, cin=parseFloat(document.getElementById('cdIn').value)||0, cout=parseFloat(document.getElementById('cdOut').value)||0;
      const date = document.getElementById('cdDate').value || todayStr();
      if(c){
        c.date=date; c.openingCash=open; c.cashIn=cin; c.cashOut=cout; c.closingCash=open+cin-cout; c.closedBy=document.getElementById('cdBy').value||'Owner';
        logHistory('CashDay','Edited', 'Day close for '+date+' edited — closing cash '+fmtMoney(c.closingCash));
        saveDB(); closeModal(); renderCashday(); toast('Day close updated');
        return;
      }
      DB.cashDays.push({id:uid('CD'), date, openingCash:open, cashIn:cin, cashOut:cout, closingCash:open+cin-cout, closedBy:document.getElementById('cdBy').value||'Owner'});
      logHistory('CashDay','Closed', 'Day closed with closing cash '+fmtMoney(open+cin-cout));
      saveDB(); closeModal(); renderCashday(); toast('Day closed');
    }}
  ]);
}
function deleteCashDay(id){
  const c = DB.cashDays.find(x=>x.id===id); if(!c) return;
  guardDelete('day close record ('+fmtDate(c.date)+')', ()=>{
    c.deleted = true;
    logHistory('CashDay','Deleted', 'Day close for '+c.date+' deleted');
    saveDB(); renderCashday(); toast('Record deleted');
  });
}

   PAGE: TO-DO / PURCHASE LIST — quick reminders for things to buy or
   bring to the shop (jewellery or otherwise). Simple, fast, tablet-friendly.

function renderTodo(){
  window._todoFilter = window._todoFilter || 'pending';
  const totalPending = DB.todos.filter(t=>!t.deleted && t.status==='pending').length;
  let html = `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
    <div class="statCard"><div class="lbl">Pending</div><div class="val">${totalPending}</div></div>
    <div class="statCard" style="border-color:var(--success)"><div class="lbl">Bought</div><div class="val">${DB.todos.filter(t=>!t.deleted && t.status==='bought').length}</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Cancelled</div><div class="val">${DB.todos.filter(t=>!t.deleted && t.status==='cancelled').length}</div></div>
  </div>`;
  html += `<div class="cardHead" style="margin-bottom:12px;"><div></div><button class="btn btn-primary" onclick="openTodoForm()">+ Add To-Do</button></div>`;
  html += `<div class="pillTabs">
    ${['pending','bought','cancelled','all'].map(f=>`<div class="pillTab ${window._todoFilter===f?'active':''}" onclick="setTodoFilter(this,'${f}')">${f[0].toUpperCase()+f.slice(1)}</div>`).join('')}
  </div>`;
  html += `<div class="card"><div class="grid grid-2" style="margin-bottom:12px;">
    <input id="todoSearch" placeholder="Search item / notes..." oninput="renderTodoTable()">
    <select id="todoCategoryFilter" onchange="renderTodoTable()"><option value="">All Categories</option><option>Jewellery</option><option>Shop Item</option><option>Other</option></select>
  </div><div id="todoTableWrap"></div></div>`;
  document.getElementById('content').innerHTML = html;
  renderTodoTable();
}
function setTodoFilter(el, f){
  window._todoFilter = f;
  document.querySelectorAll('#content .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active');
  renderTodoTable();
}
function renderTodoTable(){
  const q = (document.getElementById('todoSearch')?.value||'').toLowerCase();
  const catF = document.getElementById('todoCategoryFilter')?.value||'';
  const f = window._todoFilter||'pending';
  let rows = DB.todos.filter(t=>!t.deleted).sort((a,b)=>{
    const pOrder = {High:0, Medium:1, Low:2, '':3};
    return (pOrder[a.priority]??3) - (pOrder[b.priority]??3) || b.dateCreated.localeCompare(a.dateCreated);
  });
  if(f!=='all') rows = rows.filter(t=>t.status===f);
  if(catF) rows = rows.filter(t=>t.category===catF);
  if(q) rows = rows.filter(t=> [t.itemName,t.notes].filter(Boolean).some(v=>v.toLowerCase().includes(q)));
  let html = `<table><tr><th>Item</th><th>Category</th><th>Priority</th><th>Notes</th><th>Created</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="7"><div class="empty"><div class="big">📝</div>Nothing here yet.</div></td></tr>`;
  rows.forEach(t=>{
    const statusTag = t.status==='bought'?'tag-green':t.status==='cancelled'?'tag-gray':'tag-gold';
    const prioTag = t.priority==='High'?'tag-red':t.priority==='Medium'?'tag-gold':'tag-gray';
    html += `<tr><td>${t.itemName}</td><td>${t.category||'-'}</td><td>${t.priority?`<span class="tag ${prioTag}">${t.priority}</span>`:'-'}</td><td>${t.notes||'-'}</td><td>${fmtDate(t.dateCreated)}</td>
    <td><span class="tag ${statusTag}">${t.status[0].toUpperCase()+t.status.slice(1)}</span></td>
    <td>${t.status==='pending'?`<button class="btn btn-sm btn-outline" onclick="markTodoBought('${t.id}')">Mark Bought</button><button class="btn btn-sm btn-ghost" onclick="markTodoCancelled('${t.id}')">Cancel</button>`:''}
    <button class="btn btn-sm btn-ghost" onclick="guardEdit('to-do item', ()=>openTodoForm('${t.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteTodo('${t.id}')">🗑</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('todoTableWrap').innerHTML = html;
}
function openTodoForm(id){
  const t = id ? DB.todos.find(x=>x.id===id) : null;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>Item Name *</label><input id="todoName" value="${t?t.itemName:''}" placeholder="e.g. New display trays"></div>
      <div class="field"><label>Category</label><select id="todoCategory">
        <option ${t&&t.category==='Jewellery'?'selected':''}>Jewellery</option>
        <option ${t&&t.category==='Shop Item'?'selected':''}>Shop Item</option>
        <option ${!t||t.category==='Other'?'selected':''}>Other</option>
      </select></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Priority</label><select id="todoPriority">
        <option value="" ${t&&!t.priority?'selected':''}>-</option>
        <option ${t&&t.priority==='High'?'selected':''}>High</option>
        <option ${t&&t.priority==='Medium'?'selected':''}>Medium</option>
        <option ${t&&t.priority==='Low'?'selected':''}>Low</option>
      </select></div>
      <div class="field"><label>Date</label><input type="date" id="todoDate" value="${t?t.dateCreated:todayStr()}" max="${todayStr()}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Notes</label><input id="todoNotes" value="${t?t.notes||'':''}"></div>
  `;
  openModal(t?'Edit To-Do':'New To-Do', body, [

function saveTodo(id){
  const name = document.getElementById('todoName').value.trim();
  if(!name){ toast('Enter item name'); return; }
  const data = {
    itemName:name, category: document.getElementById('todoCategory').value, priority: document.getElementById('todoPriority').value,

  };

  DB.todos.push({id:uid('TODO'), status:'pending', dateCompleted:null, linkedInventoryId:null, createdAt:nowISO(), deleted:false, ...data});

function markTodoBought(id){

function markTodoCancelled(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  t.status='cancelled'; t.dateCompleted=todayStr();
  logHistory('Todo','Cancelled', t.itemName+' cancelled');
  saveDB(); renderTodo(); toast('Cancelled');
}
function deleteTodo(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  guardDelete('to-do item ('+t.itemName+')', ()=>{

    logHistory('Todo','Deleted', t.itemName+' deleted');

/* =====================================================================
   PAGE: WHOLESALER KHATA — separate ledger per supplier (e.g. Hiraraja
   Jamnalal), tracking purity, silver/gold owed and labour charges.
===================================================================== */
function wholesalerBalance(wholesalerId){
  let silverOwed=0, goldOwed=0, cashOwed=0;
  DB.wholesalerEntries.filter(e=>e.wholesalerId===wholesalerId && !e.deleted).forEach(e=>{
    const isGold = String(e.metal||'').trim().toLowerCase()==='gold';
    if(e.type==='purchase'){
      if(isGold) goldOwed += e.pureWeight; else silverOwed += e.pureWeight;
      cashOwed += Number(e.labourCharge||0);
    } else {
      if(isGold) goldOwed -= e.pureWeight; else silverOwed -= e.pureWeight;
      cashOwed -= Number(e.cashPaid||0);
    }
  });
  return {silverOwed, goldOwed, cashOwed};
}
function renderWholesaler(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openWholesalerForm()">+ Add Wholesaler</button></div>`;
  const activeWholesalers = DB.wholesalers.filter(w=>!w.deleted);
  if(activeWholesalers.length===0){
    html += `<div class="card"><div class="empty"><div class="big">📇</div>No wholesalers added yet. Add Hiraraja Jamnalal or your other suppliers to start their kata.</div></div>`;
  } else {
    const totals = activeWholesalers.reduce((a,w)=>{ const b=wholesalerBalance(w.id); a.silver+=Math.max(b.silverOwed,0); a.gold+=Math.max(b.goldOwed,0); a.cash+=Math.max(b.cashOwed,0); return a; }, {silver:0,gold:0,cash:0});
    html += `<div class="statGrid" style="grid-template-columns:repeat(4,1fr);">
      <div class="statCard"><div class="lbl">Total Wholesalers</div><div class="val">${activeWholesalers.length}</div></div>
      <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Total Silver Owed</div><div class="val">${fmtWt(totals.silver)}</div></div>
      <div class="statCard" style="border-color:var(--gold)"><div class="lbl">Total Gold Fine Owed</div><div class="val">${fmtWt(totals.gold)}</div></div>
      <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Total Cash/Labour Owed</div><div class="val">${fmtMoney(totals.cash)}</div></div>
    </div>`;
    html += `<div class="grid grid-3">`;
    activeWholesalers.forEach(w=>{
      const bal = wholesalerBalance(w.id);
      html += `<div class="wsCard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="wsName">${w.name}</div>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="guardEdit('wholesaler', ()=>openWholesalerForm('${w.id}'))">✎</button>
            <button class="btn btn-sm btn-danger" onclick="deleteWholesaler('${w.id}')">🗑</button>
          </div>
        </div>
        <div class="helpText">${w.phone||''}</div>
        <div class="wsBalRow"><span>Silver Owed: <b>${fmtWt(bal.silverOwed)}</b></span></div>

/* =====================================================================
   PAGE: MARKET RATES — online-only, reference-only. Never writes to
   currentRates (which is what Sales/Buying actually bill against).
   Lives ONLY on the Dashboard now — no separate page.
===================================================================== */
function extractPrice(data){
  if(data==null) return null;
  if(typeof data==='number') return data;
  const candidates = [data.price, data.rate, data.value, data.price_usd, data.spot_price, data.ask, (data.rates&&data.rates.XAU), (data.rates&&data.rates.XAG)];
  for(const c of candidates){ if(typeof c==='number' && !isNaN(c)) return c; }
  return null;
}
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{ return await fetch(url, {signal: ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function fetchMarketRates(silent){
  // Note: we do NOT pre-check navigator.onLine — on some tablets/WebKit
  // versions it reports false incorrectly even with a working connection.
  // We just attempt the fetch directly and report the real error if it fails.
  if(!silent) toast('Fetching live rates...');
  try{
    const [goldRes, silverRes, fxRes] = await Promise.all([
      fetchWithTimeout('https://api.gold-api.com/price/XAU', 10000),
      fetchWithTimeout('https://api.gold-api.com/price/XAG', 10000),
      fetchWithTimeout('https://api.frankfurter.dev/v2/rate/USD/INR', 10000).catch(()=>null)
    ]);
    if(!goldRes.ok) throw new Error('Gold source returned HTTP '+goldRes.status);
    if(!silverRes.ok) throw new Error('Silver source returned HTTP '+silverRes.status);
    const goldJson = await goldRes.json();
    const silverJson = await silverRes.json();
    const goldPrice = extractPrice(goldJson);
    const silverPrice = extractPrice(silverJson);
    if(goldPrice==null && silverPrice==null) throw new Error('Response did not contain a recognisable price field');
    let usdInr = DB.marketRates.usdInr || null;
    let fxSource = 'manual';
    if(fxRes && fxRes.ok){
      try{
        const fxJson = await fxRes.json();
        const rate = fxJson.rate!=null ? fxJson.rate : (fxJson.rates && fxJson.rates.INR);
        if(typeof rate==='number' && !isNaN(rate)){ usdInr = rate; fxSource = 'frankfurter.dev (live)'; }
      }catch(e){ /* keep existing usdInr if currency parse fails */ }
    }
    // Preserve premium settings — a refresh must never silently reset them.
    DB.marketRates = {
      goldUsdOz: goldPrice, silverUsdOz: silverPrice,
      usdInr, fxSource,
      fetchedAt: nowISO(), source: 'gold-api.com (international spot reference)', lastError: null,
      mcxPremiumPctGold: DB.marketRates.mcxPremiumPctGold!==undefined ? DB.marketRates.mcxPremiumPctGold : 15,
      mcxPremiumPctSilver: DB.marketRates.mcxPremiumPctSilver!==undefined ? DB.marketRates.mcxPremiumPctSilver : 25
    };
    logHistory('MarketRates','Fetched', `Gold $${goldPrice}/oz, Silver $${silverPrice}/oz, USD/INR ${usdInr||'manual'}`);
    saveDB(); renderDashboardMarketMini(); if(!silent) toast('Live rates updated');
  }catch(err){
    const reason = err.name==='AbortError' ? 'Request timed out — slow or no internet' : (err.message || String(err) || 'Unknown error');
    DB.marketRates.lastError = reason;
    saveDB(); renderDashboardMarketMini();
    if(!silent) toast('Could not fetch live rates: '+reason);
  }
}
function saveUsdInr(val){
  DB.marketRates.usdInr = parseFloat(val)||null;
  DB.marketRates.fxSource = 'manual';
  saveDB(); renderDashboardMarketMini(); toast('Reference conversion rate saved');
}
function renderDashboardMarketMini(){
  const el = document.getElementById('dashMarketMini'); if(!el) return;
  const m = DB.marketRates;
  if(!m.fetchedAt){
    el.innerHTML = `<div class="helpText">Not fetched yet — tap ↻ when the tablet has internet.</div>${m.lastError?`<div class="helpText" style="color:var(--danger);margin-top:4px;">Last attempt failed: ${m.lastError}</div>`:''}`;
    return;
  }
  const goldPerGram = m.goldUsdOz ? (m.goldUsdOz/31.1035) : null;
  const silverPerGram = m.silverUsdOz ? (m.silverUsdOz/31.1035) : null;
  const inrRate = m.usdInr;

/* =====================================================================
   BACKUP SCHEDULER — exact timestamps. The old logic compared calendar
   dates (UTC), so a backup late in the day made the "next backup" appear
   a day or more early. Next backup is now exactly interval × 24 h after
   the last successful backup.
===================================================================== */
function backupIntervalDays(){ const v=parseFloat(DB.meta.backupReminderDays); return v>0 ? v : 3; }
function backupSchedule(){
  const l = DB.meta.lastBackupAt ? new Date(DB.meta.lastBackupAt) : null;
  const last = (l && !isNaN(l.getTime())) ? l : null;
  const next = last ? new Date(last.getTime() + backupIntervalDays()*86400000) : null;
  const msLeft = next ? next.getTime() - Date.now() : -1;
  return {last, next, msLeft, due: !last || msLeft<=0, days: backupIntervalDays()};
}
function fmtDateTime(d){ return new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtCountdown(ms){
  if(ms<=0) return 'due now';
  const m=Math.floor(ms/60000), d=Math.floor(m/1440), h=Math.floor((m%1440)/60), mm=m%60;
  return (d?d+' d ':'')+((d||h)?h+' h ':'')+mm+' min';
}
function backupStatusHTML(){
  const s=backupSchedule();
  return `<div class="backupStatus"><div>Last backup: <b>${s.last?fmtDateTime(s.last):'Never'}</b></div>
    <div>Next backup: <b>${s.next?fmtDateTime(s.next):'Now — no backup taken yet'}</b> ${s.due?'<span class="tag tag-red">Due now</span>':`<span class="tag tag-green" id="backupCountdown">in ${fmtCountdown(s.msLeft)}</span>`}</div>
    <div class="helpText">Next backup = ${s.days} day(s) after the last successful backup. Taking a backup now restarts the timer.</div></div>`;
}
function backupDashboardHTML(){
  const s=backupSchedule();
  if(s.due) return `<div class="backupWarnBanner">
      <div>⚠️ <b>Backup due.</b> ${s.last?'Last backup: '+fmtDateTime(s.last)+' — it was due '+fmtDateTime(s.next)+'.':"You haven't backed up yet."} Keep your shop data safe.</div>
      <button class="btn btn-gold btn-sm" onclick="doBackup()">⬇ Backup Now</button></div>`;
  return `<div class="backupOk"><span>💾 Last backup: <b>${fmtDateTime(s.last)}</b></span><span>Next backup: <b>${fmtDateTime(s.next)}</b></span><span class="tag tag-green" id="backupCountdown">in ${fmtCountdown(s.msLeft)}</span></div>`;
}
function doBackup(){
  const prev = DB.meta.lastBackupAt;
  try{
    DB.meta.lastBackupAt = nowISO();          // the saved file carries the new timer
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download = 'gayatri-jewellers-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(err){
    DB.meta.lastBackupAt = prev;              // failed backup must not reset the timer
    toast('⚠️ Backup failed — please try again.'); return;
  }
  window._backupSnoozeUntil = 0;
  logHistory('Backup','Created','Backup file downloaded');
  saveDB(); closeModal();
  toast('Backup downloaded — next backup '+fmtDateTime(backupSchedule().next));
  if(currentPage==='dashboard') renderDashboard(); else if(currentPage==='settings') renderSettings();
}
function startBackupScheduler(){
  if(window._backupTimer) clearInterval(window._backupTimer);
  window._backupTimer = setInterval(backupTick, 60000);
  setTimeout(backupTick, 3000);
}
function backupTick(){
  const s=backupSchedule();
  const el=document.getElementById('backupCountdown'); if(el && !s.due) el.textContent='in '+fmtCountdown(s.msLeft);
  if(!s.due) return;
  if(Date.now() < (window._backupSnoozeUntil||0)) return;
  if(!document.getElementById('shell').classList.contains('active')) return;       // app is locked
  if(document.getElementById('modalWrap').classList.contains('active')) return;    // never interrupt a form
  window._backupSnoozeUntil = Date.now()+60*60*1000;
  openModal('💾 Backup Due', `<p style="margin-top:0;">Your scheduled backup is due${s.last?' (last backup: '+fmtDateTime(s.last)+')':''}. It takes a few seconds and keeps your data safe if the tablet is lost or reset.</p>`, [
    {label:'Remind me in 1 hour', cls:'btn-ghost', onClick:closeModal},
    {label:'⬇ Backup Now', cls:'btn-primary', onClick:doBackup}
  ]);
}

let pinBuffer='';
function renderPinPad(){
  const grid = document.getElementById('padGrid'); grid.innerHTML='';

  keys.forEach(k=>{

    grid.appendChild(b);
  });

}
function updatePinDots(){
  const dots = document.getElementById('pinDots'); dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='pinDot'+(i<pinBuffer.length?' filled':''); dots.appendChild(d); }
}
function handlePinKey(k){
  document.getElementById('lockError').textContent='';
  if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if(pinBuffer.length>=6) return;
  pinBuffer += k; updatePinDots();
  if(pinBuffer.length===DB.meta.pin.length){
    if(pinBuffer===DB.meta.pin){ unlockApp(); }
    else{ document.getElementById('lockError').textContent='Incorrect PIN, try again.'; setTimeout(()=>{pinBuffer='';updatePinDots();},450); }
  }
}

}

let idleTimerHandle = null;
function resetIdleTimer(){
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  clearTimeout(idleTimerHandle);
  idleTimerHandle = setTimeout(()=>{ lockNow(); }, mins*60000);
}
function startIdleTimer(){
  stopIdleTimer();
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.addEventListener(evt, resetIdleTimer));
  resetIdleTimer();
}
function stopIdleTimer(){
  clearTimeout(idleTimerHandle);
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.removeEventListener(evt, resetIdleTimer));
}

/* Safety net against the single biggest real risk in a localStorage-only
   app: silently opening a different copy/origin of the app than usual
   (e.g. a stale Home Screen icon pointing at an older downloaded file).
   If key record counts look SMALLER than last time this app was opened,
   warn loudly before the person keeps working on what might be the
   wrong data store. */
function computeRecordCounts(){
  return {
    Girvi: DB.girvi.filter(g=>!g.deleted).length,
    Sales: DB.sales.filter(s=>!s.deleted).length,
    Customers: DB.customers.filter(c=>!c.mergedInto).length,
    Buying: DB.buying.filter(b=>!b.deleted).length,
    Credit: DB.creditEntries.filter(e=>!e.deleted).length
  };
}
function checkRecordCountDrop(){
  const current = computeRecordCounts();
  const prev = DB.meta.recordCountSnapshot;
  window._countDropWarning = null;
  if(prev){
    const drops = [];
    Object.keys(current).forEach(k=>{
      if(prev[k]!==undefined && current[k] < prev[k]) drops.push(k+': '+prev[k]+' \u2192 '+current[k]);
    });
    if(drops.length) window._countDropWarning = drops.join(', ');
  }
  DB.meta.recordCountSnapshot = current;
  DB.meta.recordCountSnapshotAt = nowISO();
  saveDB();
}
function dismissCountDropWarning(){ window._countDropWarning = null; renderDashboard(); }
function init(){
  document.getElementById('brandName').textContent = DB.meta.shopName;
  document.getElementById('brandLoc').textContent = DB.meta.location.split(',')[0].toUpperCase()+', '+ (DB.meta.location.split(',')[1]||'').toUpperCase();
  renderNav(); renderRateStrip(); syncLangToggle();
  checkRecordCountDrop();
  goTo('dashboard');
  updateClock();
  if(!window._clockInterval) window._clockInterval = setInterval(updateClock, 30000);
  startBackupScheduler();
  setTimeout(showFeatureRemovalNotice, 1200);
}
document.getElementById('lockHint').textContent = 'Loading your shop data…';
document.getElementById('padGrid').style.opacity = '0.35';
document.getElementById('padGrid').style.pointerEvents = 'none';
window._bootPromise = (async function boot(){
  try{
    DB = await loadDB();
  }catch(e){
    lockStorage('read-failed');
    DB = migrateDB(defaultDB());
  }
  document.getElementById('lockTitle').textContent = DB.meta.shopName;
  requestPersistentStorage();
  setTimeout(()=>{ ensureDailySnapshot().catch(()=>{}); }, 3000);
  document.getElementById('lockHint').textContent = 'Default PIN: 1234 — change it from Settings after login';
  document.getElementById('padGrid').style.opacity = '1';
  document.getElementById('padGrid').style.pointerEvents = 'auto';
  renderPinPad();
})();
</script>
</body>
</html>
