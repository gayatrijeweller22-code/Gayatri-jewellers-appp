  let rows = [...DB.customers].filter(c=>c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.village||'').toLowerCase().includes(q));
  let html = `<table><tr><th></th><th>Name</th><th>Phone</th><th>Village</th><th>Balance</th><th>Sales</th><th>Girvi</th><th></th></tr>`;
  if(rows.length===0) html+=`<tr><td colspan="8"><div class="empty"><div class="big">👤</div>No customers found.</div></td></tr>`;
  rows.forEach(c=>{
    const bal=customerBalance(c.id);
    html += `<tr><td>${c.photo?`<img src="${c.photo}" class="photoThumb" style="width:32px;height:32px;cursor:pointer;" onclick="openFullPhoto('${c.photo}','${c.name}')">`:'<div class="photoPlaceholder" style="width:32px;height:32px;font-size:13px;">👤</div>'}</td>
    <td>${c.name}${c.tags?' <span class="tag tag-gold" style="margin-left:4px;">'+c.tags+'</span>':''}</td><td>${c.phone||'-'}</td><td>${c.village||'-'}</td><td>${bal>0?'<b style="color:var(--danger)">'+fmtMoney(bal)+'</b>':fmtMoney(bal)}</td>
    <td>${DB.sales.filter(s=>s.customerId===c.id && !s.deleted).length}</td><td>${DB.girvi.filter(g=>g.customerId===c.id && g.status==='active' && !g.deleted).length}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('ledgerListWrap').innerHTML = html;
}
function customerLastVisit(id){
  const dates = [];
  DB.sales.filter(s=>s.customerId===id && !s.deleted).forEach(s=>dates.push(s.date));
  DB.girvi.filter(g=>g.customerId===id && !g.deleted).forEach(g=>dates.push(g.date));
  DB.creditEntries.filter(e=>e.customerId===id && !e.deleted).forEach(e=>dates.push(e.date));
  DB.jobs.filter(j=>j.customerId===id && !j.deleted).forEach(j=>dates.push(j.date));
  if(dates.length===0) return null;
  return dates.sort().reverse()[0];
}
function viewCustomerLedger(id){
  const c = DB.customers.find(x=>x.id===id); if(!c) return;
  const sales = DB.sales.filter(s=>s.customerId===id && !s.deleted);
  const girvi = DB.girvi.filter(g=>g.customerId===id && !g.deleted);
  const credit = DB.creditEntries.filter(e=>e.customerId===id && !e.deleted);
  const jobs = DB.jobs.filter(j=>j.customerId===id && !j.deleted);
  const lastVisit = customerLastVisit(id);
  const totalTxns = sales.length + girvi.length + jobs.length;
  const isFrequent = totalTxns >= 3;

  let timeline = [];
  sales.forEach(s=>timeline.push({date:s.date, ts:s.createdAt, icon:'🧾', text:`Sale ${s.billNo} — ${fmtMoney(s.grandTotal)}`}));
  girvi.forEach(g=>timeline.push({date:g.date, ts:g.createdAt, icon:'🔐', text:`Girvi loan — ${g.itemDesc} — ${fmtMoney(g.loanAmount)} (${g.status})`}));
  credit.forEach(e=>timeline.push({date:e.date, ts:e.createdAt, icon:'📒', text:`${e.type==='debit'?'Udhaar given':'Payment received'} — ${fmtMoney(e.amount)}${e.description?' — '+e.description:''}`}));
  jobs.forEach(j=>timeline.push({date:j.date, ts:j.createdAt, icon:'🛠️', text:`${j.type} job — ${j.itemDesc} (${j.status})`}));
  timeline.sort((a,b)=> b.date.localeCompare(a.date) || (b.ts||'').localeCompare(a.ts||''));

  let body = `
    <div class="girviDetailHead" style="margin-bottom:14px;">
      ${c.photo?`<img src="${c.photo}" class="photoThumb" style="width:72px;height:72px;cursor:pointer;" onclick="openFullPhoto('${c.photo}','${c.name}')">`:`<div class="photoPlaceholder" style="width:72px;height:72px;font-size:26px;">👤</div>`}
      <div>
        <div style="font-family:var(--font-display);font-size:19px;color:var(--maroon-dark);">${c.name} ${c.tags?'<span class="tag tag-gold">'+c.tags+'</span>':''}${isFrequent?' <span class="tag tag-green">Frequent</span>':''}${c.creditEnabled?' <span class="tag tag-gray">Credit A/C</span>':''}</div>
        <div class="helpText">${c.phone||'No phone on file'}${c.village?' • '+c.village:''}</div>
        <div class="helpText">Last visit: ${lastVisit?fmtDate(lastVisit):'-'} • Balance: <b style="color:${customerBalance(id)>0?'var(--danger)':'var(--success)'}">${fmtMoney(customerBalance(id))}</b></div>
      </div>
    </div>
    ${(c.referredBy||c.familyLink)?`<div class="approveBox" style="background:var(--gold-pale);border-color:var(--gold-light);color:var(--maroon-dark);margin-bottom:12px;">
      ${c.referredBy?`🤝 <b>Referred by:</b> ${c.referredBy}<br>`:''}${c.familyLink?`👪 <b>Family / relation:</b> ${c.familyLink}`:''}
    </div>`:''}
    ${c.notes?`<div class="helpText" style="margin-bottom:12px;">📝 ${c.notes}</div>`:''}
    <div class="statGrid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
      <div class="statCard" style="padding:12px;"><div class="lbl">Sales</div><div class="val" style="font-size:20px;">${sales.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--silver-accent)"><div class="lbl">Girvi</div><div class="val" style="font-size:20px;">${girvi.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--danger)"><div class="lbl">Credit</div><div class="val" style="font-size:20px;">${credit.length}</div></div>
      <div class="statCard" style="padding:12px;border-color:var(--success)"><div class="lbl">Jobs</div><div class="val" style="font-size:20px;">${jobs.length}</div></div>
    </div>
    <h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:0 0 8px;">Timeline</h4>
    <div class="txnList">${timeline.slice(0,40).map(t=>`<div class="txnRow"><span>${t.icon} ${t.text}</span><span class="helpText">${fmtDate(t.date)}</span></div>`).join('') || '<div class="txnRow">No activity yet.</div>'}</div>
    <h4 style="font-family:var(--font-display);color:var(--maroon-dark);margin:16px 0 4px;">Credit Entries (${credit.length})</h4>
    ${credit.length ? `<table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th><th></th></tr>${credit.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.type}</td><td>${fmtMoney(e.amount)}</td><td>${e.description}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('credit entry', ()=>openCreditEditForm('${e.id}','${id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteCreditEntry('${e.id}','${id}')">🗑</button></td></tr>`).join('')}</table>` : `<p class="helpText">${c.creditEnabled?'No credit entries yet.':'Not a credit customer — mark them in Edit Profile if you want to track udhaar for them.'}</p>`}
  `;
  openModal(c.name+' — Profile', body, [
    {label:'Close', cls:'btn-ghost', onClick:closeModal},
    {label:'✎ Edit Profile', cls:'btn-outline', onClick:()=>{ closeModal(); openCustomerProfileForm(id); }},
    {label:'+ Add Credit Entry', cls:'btn-outline', onClick:()=>{ closeModal(); openCreditForm(c.name); }}
  ]);
}

function openCreditEditForm(entryId, custId){

      <div class="field"><label>Entry Type</label><select id="ceType"><option value="debit" ${e.type==='debit'?'selected':''}>Udhaar Given (they owe more)</option><option value="credit" ${e.type==='credit'?'selected':''}>Payment Received (reduce due)</option></select></div>

function deleteCreditEntry(entryId, custId){

/* =====================================================================
   PAGE: REPORTS
===================================================================== */
function renderReports(){
  const today = todayStr();
  const weekAgo = new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  const monthAgo = new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const sumSales = (from) => DB.sales.filter(s=>!s.void && !s.deleted && s.date>=from).reduce((a,s)=>a+s.grandTotal,0);
  const sumBuy = (from) => DB.buying.filter(b=>b.date>=from && !b.deleted).reduce((a,b)=>a+b.amount,0);

  let html = `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">
    <div class="statCard"><div class="lbl">Sales — Today</div><div class="val">${fmtMoney(sumSales(today))}</div></div>
    <div class="statCard"><div class="lbl">Sales — 7 Days</div><div class="val">${fmtMoney(sumSales(weekAgo))}</div></div>
    <div class="statCard"><div class="lbl">Sales — 30 Days</div><div class="val">${fmtMoney(sumSales(monthAgo))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — Today</div><div class="val">${fmtMoney(sumBuy(today))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 7 Days</div><div class="val">${fmtMoney(sumBuy(weekAgo))}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Buying — 30 Days</div><div class="val">${fmtMoney(sumBuy(monthAgo))}</div></div>
  </div>`;

  // Sales by metal category (30 days)
  const catTotals = {};
  DB.sales.filter(s=>!s.void && !s.deleted && s.date>=monthAgo).forEach(s=>{
    s.items.forEach(i=>{
      const cat = i.category||'Other';
      catTotals[cat] = (catTotals[cat]||0) + ((i.weight*(((i.purity===undefined||i.purity==='')?100:i.purity)/100))*(i.rate||0) + Number(i.making||0));
    });
  });

  // Top customers by lifetime value
  const custTotals = DB.customers.map(c=>{
    const salesTotal = DB.sales.filter(s=>s.customerId===c.id && !s.deleted && !s.void).reduce((a,s)=>a+s.grandTotal,0);
    return {name:c.name, total:salesTotal, id:c.id};
  }).filter(c=>c.total>0).sort((a,b)=>b.total-a.total).slice(0,5);

  // Inventory valuation at current rates
  const stockItems = DB.inventory.filter(i=>invIsAvailable(i) && !i.deleted);
  let stockValue = 0, stockWtGold=0, stockWtSilver=0;
  stockItems.forEach(i=>{
    const purity = parseFloat(i.purity)||100;
    const pureWt = (i.weight||0)*(purity/100);
    const rate = i.category==='Gold' ? DB.currentRates.gold22/10 : DB.currentRates.silverKg/1000;
    stockValue += pureWt*rate;
    if(i.category==='Gold') stockWtGold += i.weight||0; else if(i.category==='Silver') stockWtSilver += i.weight||0;
  });

  // Girvi ageing buckets
  const activeGirviList = DB.girvi.filter(g=>g.status==='active' && !g.deleted);
  const buckets = {'0-30 din':0, '31-60 din':0, '61-90 din':0, '90+ din':0};
  activeGirviList.forEach(g=>{
    const d = daysBetween(g.date);
    const principal = g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount;
    if(d<=30) buckets['0-30 din']+=principal;
    else if(d<=60) buckets['31-60 din']+=principal;
    else if(d<=90) buckets['61-90 din']+=principal;
    else buckets['90+ din']+=principal;
  });

  html += `<div class="grid grid-2">`;
  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Outstanding Summary</h3>
    <table><tr><td>Total Credit Due</td><td>${fmtMoney(DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0))}</td></tr>
    <tr><td>Active Girvi Loans</td><td>${fmtMoney(activeGirviList.reduce((a,g)=>a+(g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount),0))}</td></tr>
    <tr><td>Pending Jobs</td><td>${DB.jobs.filter(j=>j.status!=='delivered' && !j.deleted).length}</td></tr>
    <tr><td>Items In Stock</td><td>${stockItems.length}</td></tr>
    <tr><td>Silver Owed to Wholesalers</td><td>${fmtWt(DB.wholesalers.filter(w=>!w.deleted).reduce((a,w)=>a+Math.max(wholesalerBalance(w.id).silverOwed,0),0))}</td></tr></table></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Inventory Valuation (at today's rates)</h3>
    <table><tr><td>Total Stock Value</td><td><b>${fmtMoney(stockValue)}</b></td></tr>
    <tr><td>Gold Weight in Stock</td><td>${fmtWt(stockWtGold)}</td></tr>
    <tr><td>Silver Weight in Stock</td><td>${fmtWt(stockWtSilver)}</td></tr>
    <tr><td>Items in Stock</td><td>${stockItems.length}</td></tr></table>
    <p class="helpText" style="margin-top:8px;">Estimated using current shop rates and each item's purity — a snapshot, not an audited valuation.</p></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Sales by Category (30 Days)</h3>
    <table>${Object.keys(catTotals).length ? Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`<tr><td>${cat}</td><td>${fmtMoney(amt)}</td></tr>`).join('') : '<tr><td colspan="2" class="helpText">No sales in the last 30 days.</td></tr>'}</table></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Top 5 Customers (Lifetime)</h3>
    <table>${custTotals.length ? custTotals.map(c=>`<tr><td>${c.name}</td><td>${fmtMoney(c.total)}</td><td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View</button></td></tr>`).join('') : '<tr><td colspan="3" class="helpText">No sales recorded yet.</td></tr>'}</table></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Girvi Ageing (Active Loans)</h3>
    <table>${Object.entries(buckets).map(([label,amt])=>`<tr><td>${label}</td><td>${fmtMoney(amt)}</td></tr>`).join('')}</table>
    <p class="helpText" style="margin-top:8px;">Loans older than 90 days may be worth following up or reviewing for forfeiture.</p></div>`;

  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Expenses (30 Days)</h3>
    <table>${DB.expenses.filter(e=>e.date>=monthAgo && !e.deleted).map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.category}</td><td>${fmtMoney(e.amount)}</td></tr>`).join('') || '<tr><td colspan="3" class="helpText">No expenses logged.</td></tr>'}</table></div>`;

  // Karigar-wise pending job workload
  const karigarMap = {};
  DB.jobs.filter(j=>!j.deleted && j.status!=='delivered').forEach(j=>{
    const name = j.karigarName && j.karigarName.trim() ? j.karigarName.trim() : 'Unassigned';
    if(!karigarMap[name]) karigarMap[name] = {count:0, weightOut:0};
    karigarMap[name].count += 1;
    karigarMap[name].weightOut += Number(j.weightOut)||0;
  });
  html += `<div class="card"><h3 style="font-family:var(--font-display);color:var(--maroon-dark);margin-top:0;">Karigar Workload (Pending Jobs)</h3>
    <table><tr><th>Karigar</th><th>Pending Jobs</th><th>Expected Weight Out</th></tr>
    ${Object.keys(karigarMap).length ? Object.entries(karigarMap).sort((a,b)=>b[1].count-a[1].count).map(([name,d])=>`<tr><td>${name}</td><td>${d.count}</td><td>${fmtWt(d.weightOut)}</td></tr>`).join('') : '<tr><td colspan="3" class="helpText">No pending manufacturing/repair jobs.</td></tr>'}</table></div>`;

  html += `</div>`;
  document.getElementById('content').innerHTML = html;
}

function renderCashday(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openCashForm()">+ Close Today</button></div>`;
  html += `<div class="card"><table><tr><th>Date</th><th>Opening</th><th>Cash In</th><th>Cash Out</th><th>Closing</th><th>Closed By</th><th></th></tr>`;

  if(rows.length===0) html+=`<tr><td colspan="7"><div class="empty"><div class="big">💰</div>No day-close records yet.</div></td></tr>`;
  rows.forEach(c=> html+=`<tr><td>${fmtDate(c.date)}</td><td>${fmtMoney(c.openingCash)}</td><td>${fmtMoney(c.cashIn)}</td><td>${fmtMoney(c.cashOut)}</td><td>${fmtMoney(c.closingCash)}</td><td>${c.closedBy}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('day close entry', ()=>openCashForm('${c.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteCashDay('${c.id}')">🗑</button></td></tr>`);
  html+=`</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openCashForm(id){
  const c = id ? DB.cashDays.find(x=>x.id===id) : null;
  const body = `<div class="grid grid-2">
    <div class="field"><label>Date</label><input type="date" id="cdDate" value="${c?c.date:todayStr()}" max="${todayStr()}"></div>
    <div class="field"><label>Closed By</label><input id="cdBy" value="${c?c.closedBy:'Owner'}"></div>
    <div class="field"><label>Opening Cash</label><input type="number" id="cdOpen" value="${c?c.openingCash:''}"></div>
    <div class="field"><label>Cash In</label><input type="number" id="cdIn" value="${c?c.cashIn:''}"></div>
    <div class="field"><label>Cash Out</label><input type="number" id="cdOut" value="${c?c.cashOut:''}"></div>
  </div>`;
  openModal(c?'Edit Day Close':'Day Close', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:c?'Save Changes':'Close Day', cls:'btn-primary', onClick:()=>{
      const open=parseFloat(document.getElementById('cdOpen').value)||0, cin=parseFloat(document.getElementById('cdIn').value)||0, cout=parseFloat(document.getElementById('cdOut').value)||0;
      const date = document.getElementById('cdDate').value || todayStr();
      if(c){
        c.date=date; c.openingCash=open; c.cashIn=cin; c.cashOut=cout; c.closingCash=open+cin-cout; c.closedBy=document.getElementById('cdBy').value||'Owner';
        logHistory('CashDay','Edited', 'Day close for '+date+' edited — closing cash '+fmtMoney(c.closingCash));
        saveDB(); closeModal(); renderCashday(); toast('Day close updated');
        return;
      }
      DB.cashDays.push({id:uid('CD'), date, openingCash:open, cashIn:cin, cashOut:cout, closingCash:open+cin-cout, closedBy:document.getElementById('cdBy').value||'Owner'});
      logHistory('CashDay','Closed', 'Day closed with closing cash '+fmtMoney(open+cin-cout));
      saveDB(); closeModal(); renderCashday(); toast('Day closed');
    }}
  ]);
}
function deleteCashDay(id){
  const c = DB.cashDays.find(x=>x.id===id); if(!c) return;
  guardDelete('day close record ('+fmtDate(c.date)+')', ()=>{
    c.deleted = true;
    logHistory('CashDay','Deleted', 'Day close for '+c.date+' deleted');
    saveDB(); renderCashday(); toast('Record deleted');
  });
}

/* =====================================================================
   PAGE: TO-DO / PURCHASE LIST — quick reminders for things to buy or
   bring to the shop (jewellery or otherwise). Simple, fast, tablet-friendly.
===================================================================== */
function renderTodo(){
  window._todoFilter = window._todoFilter || 'pending';
  const totalPending = DB.todos.filter(t=>!t.deleted && t.status==='pending').length;
  let html = `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
    <div class="statCard"><div class="lbl">Pending</div><div class="val">${totalPending}</div></div>
    <div class="statCard" style="border-color:var(--success)"><div class="lbl">Bought</div><div class="val">${DB.todos.filter(t=>!t.deleted && t.status==='bought').length}</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Cancelled</div><div class="val">${DB.todos.filter(t=>!t.deleted && t.status==='cancelled').length}</div></div>
  </div>`;
  html += `<div class="cardHead" style="margin-bottom:12px;"><div></div><button class="btn btn-primary" onclick="openTodoForm()">+ Add To-Do</button></div>`;
  html += `<div class="pillTabs">
    ${['pending','bought','cancelled','all'].map(f=>`<div class="pillTab ${window._todoFilter===f?'active':''}" onclick="setTodoFilter(this,'${f}')">${f[0].toUpperCase()+f.slice(1)}</div>`).join('')}
  </div>`;
  html += `<div class="card"><div class="grid grid-2" style="margin-bottom:12px;">
    <input id="todoSearch" placeholder="Search item / notes..." oninput="renderTodoTable()">
    <select id="todoCategoryFilter" onchange="renderTodoTable()"><option value="">All Categories</option><option>Jewellery</option><option>Shop Item</option><option>Other</option></select>
  </div><div id="todoTableWrap"></div></div>`;
  document.getElementById('content').innerHTML = html;
  renderTodoTable();
}
function setTodoFilter(el, f){
  window._todoFilter = f;
  document.querySelectorAll('#content .pillTab').forEach(p=>p.classList.remove('active')); el.classList.add('active');
  renderTodoTable();
}
function renderTodoTable(){
  const q = (document.getElementById('todoSearch')?.value||'').toLowerCase();
  const catF = document.getElementById('todoCategoryFilter')?.value||'';
  const f = window._todoFilter||'pending';
  let rows = DB.todos.filter(t=>!t.deleted).sort((a,b)=>{
    const pOrder = {High:0, Medium:1, Low:2, '':3};
    return (pOrder[a.priority]??3) - (pOrder[b.priority]??3) || b.dateCreated.localeCompare(a.dateCreated);
  });
  if(f!=='all') rows = rows.filter(t=>t.status===f);
  if(catF) rows = rows.filter(t=>t.category===catF);
  if(q) rows = rows.filter(t=> [t.itemName,t.notes].filter(Boolean).some(v=>v.toLowerCase().includes(q)));
  let html = `<table><tr><th>Item</th><th>Category</th><th>Priority</th><th>Notes</th><th>Created</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="7"><div class="empty"><div class="big">📝</div>Nothing here yet.</div></td></tr>`;
  rows.forEach(t=>{
    const statusTag = t.status==='bought'?'tag-green':t.status==='cancelled'?'tag-gray':'tag-gold';
    const prioTag = t.priority==='High'?'tag-red':t.priority==='Medium'?'tag-gold':'tag-gray';
    html += `<tr><td>${t.itemName}</td><td>${t.category||'-'}</td><td>${t.priority?`<span class="tag ${prioTag}">${t.priority}</span>`:'-'}</td><td>${t.notes||'-'}</td><td>${fmtDate(t.dateCreated)}</td>
    <td><span class="tag ${statusTag}">${t.status[0].toUpperCase()+t.status.slice(1)}</span></td>
    <td>${t.status==='pending'?`<button class="btn btn-sm btn-outline" onclick="markTodoBought('${t.id}')">Mark Bought</button><button class="btn btn-sm btn-ghost" onclick="markTodoCancelled('${t.id}')">Cancel</button>`:''}
    <button class="btn btn-sm btn-ghost" onclick="guardEdit('to-do item', ()=>openTodoForm('${t.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteTodo('${t.id}')">🗑</button></td></tr>`;
  });
  html += `</table>`;
  document.getElementById('todoTableWrap').innerHTML = html;
}
function openTodoForm(id){
  const t = id ? DB.todos.find(x=>x.id===id) : null;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>Item Name *</label><input id="todoName" value="${t?t.itemName:''}" placeholder="e.g. New display trays"></div>
      <div class="field"><label>Category</label><select id="todoCategory">
        <option ${t&&t.category==='Jewellery'?'selected':''}>Jewellery</option>
        <option ${t&&t.category==='Shop Item'?'selected':''}>Shop Item</option>
        <option ${!t||t.category==='Other'?'selected':''}>Other</option>
      </select></div>
    </div>
    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Priority</label><select id="todoPriority">
        <option value="" ${t&&!t.priority?'selected':''}>-</option>
        <option ${t&&t.priority==='High'?'selected':''}>High</option>
        <option ${t&&t.priority==='Medium'?'selected':''}>Medium</option>
        <option ${t&&t.priority==='Low'?'selected':''}>Low</option>
      </select></div>
      <div class="field"><label>Date</label><input type="date" id="todoDate" value="${t?t.dateCreated:todayStr()}" max="${todayStr()}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Notes</label><input id="todoNotes" value="${t?t.notes||'':''}"></div>
  `;
  openModal(t?'Edit To-Do':'New To-Do', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:t?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>saveTodo(id)}
  ]);
}
function saveTodo(id){
  const name = document.getElementById('todoName').value.trim();
  if(!name){ toast('Enter item name'); return; }
  const data = {
    itemName:name, category: document.getElementById('todoCategory').value, priority: document.getElementById('todoPriority').value,
    notes: document.getElementById('todoNotes').value, dateCreated: document.getElementById('todoDate').value||todayStr()
  };
  if(id){
    const t = DB.todos.find(x=>x.id===id); if(!t) return;
    Object.assign(t, data);
    logHistory('Todo','Edited', name+' edited');
    saveDB(); closeModal(); toast('To-do updated'); renderTodo();
    return;
  }
  DB.todos.push({id:uid('TODO'), status:'pending', dateCompleted:null, linkedInventoryId:null, createdAt:nowISO(), deleted:false, ...data});
  logHistory('Todo','Added', name+' added to to-do list');
  saveDB(); closeModal(); toast('Added to list'); renderTodo();
}
function markTodoBought(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  t.status='bought'; t.dateCompleted=todayStr();
  logHistory('Todo','Bought', t.itemName+' marked bought');
  saveDB(); renderTodo(); toast('Marked bought ✓');
}
function markTodoCancelled(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  t.status='cancelled'; t.dateCompleted=todayStr();
  logHistory('Todo','Cancelled', t.itemName+' cancelled');
  saveDB(); renderTodo(); toast('Cancelled');
}
function deleteTodo(id){
  const t = DB.todos.find(x=>x.id===id); if(!t) return;
  guardDelete('to-do item ('+t.itemName+')', ()=>{
    t.deleted = true;
    logHistory('Todo','Deleted', t.itemName+' deleted');
    saveDB(); renderTodo(); toast('Deleted');
  });
}

/* =====================================================================
   PAGE: WHOLESALER KHATA — separate ledger per supplier (e.g. Hiraraja
   Jamnalal), tracking purity, silver/gold owed and labour charges.
===================================================================== */
function wholesalerBalance(wholesalerId){
  let silverOwed=0, goldOwed=0, cashOwed=0;
  DB.wholesalerEntries.filter(e=>e.wholesalerId===wholesalerId && !e.deleted).forEach(e=>{
    if(e.type==='purchase'){
      if(e.metal==='Gold') goldOwed += e.pureWeight; else silverOwed += e.pureWeight;
      cashOwed += Number(e.labourCharge||0);
    } else {
      if(e.metal==='Gold') goldOwed -= e.pureWeight; else silverOwed -= e.pureWeight;
      cashOwed -= Number(e.cashPaid||0);
    }
  });
  return {silverOwed, goldOwed, cashOwed};
}
function renderWholesaler(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openWholesalerForm()">+ Add Wholesaler</button></div>`;
  const activeWholesalers = DB.wholesalers.filter(w=>!w.deleted);
  if(activeWholesalers.length===0){
    html += `<div class="card"><div class="empty"><div class="big">📇</div>No wholesalers added yet. Add Hiraraja Jamnalal or your other suppliers to start their kata.</div></div>`;
  } else {
    const totals = activeWholesalers.reduce((a,w)=>{ const b=wholesalerBalance(w.id); a.silver+=Math.max(b.silverOwed,0); a.cash+=Math.max(b.cashOwed,0); return a; }, {silver:0,cash:0});
    html += `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">
      <div class="statCard"><div class="lbl">Total Wholesalers</div><div class="val">${activeWholesalers.length}</div></div>
      <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Total Silver Owed</div><div class="val">${fmtWt(totals.silver)}</div></div>
      <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Total Cash/Labour Owed</div><div class="val">${fmtMoney(totals.cash)}</div></div>
    </div>`;
    html += `<div class="grid grid-3">`;
    activeWholesalers.forEach(w=>{
      const bal = wholesalerBalance(w.id);
      html += `<div class="wsCard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="wsName">${w.name}</div>
          <div>
            <button class="btn btn-sm btn-ghost" onclick="guardEdit('wholesaler', ()=>openWholesalerForm('${w.id}'))">✎</button>
            <button class="btn btn-sm btn-danger" onclick="deleteWholesaler('${w.id}')">🗑</button>
          </div>
        </div>
        <div class="helpText">${w.phone||''}</div>
        <div class="wsBalRow"><span>Silver: <b>${fmtWt(bal.silverOwed)}</b></span></div>
        <div class="wsBalRow"><span>Gold: <b>${fmtWt(bal.goldOwed)}</b></span><span>Cash/Labour: <b>${fmtMoney(bal.cashOwed)}</b></span></div>
        <button class="btn btn-sm btn-outline" style="margin-top:10px;" onclick="viewWholesalerKata('${w.id}')">Open Kata</button>
      </div>`;
    });
    html += `</div>`;
  }
  document.getElementById('content').innerHTML = html;
}
function openWholesalerForm(id){
  const w = id ? DB.wholesalers.find(x=>x.id===id) : null;
  const body = `
    <div class="field"><label>Wholesaler Name *</label><input id="whName" placeholder="e.g. Hiraraja Jamnalal" value="${w?w.name:''}"></div>
    <div class="field" style="margin-top:12px;"><label>Phone</label><input id="whPhone" value="${w?w.phone||'':''}"></div>
    <div class="field" style="margin-top:12px;"><label>Notes</label><input id="whNotes" placeholder="Optional" value="${w?w.notes||'':''}"></div>
  `;
  openModal(w?'Edit Wholesaler':'Add Wholesaler', body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:w?'Save Changes':T('save'), cls:'btn-primary', onClick:()=>{
      const name = document.getElementById('whName').value.trim();
      if(!name){ toast('Enter wholesaler name'); return; }
      if(w){
        w.name=name; w.phone=document.getElementById('whPhone').value; w.notes=document.getElementById('whNotes').value;
        logHistory('Wholesaler','Edited', name+' details updated');
        saveDB(); closeModal(); renderWholesaler(); toast('Wholesaler updated');
        return;
      }
      DB.wholesalers.push({id:uid('WHS'), name, phone:document.getElementById('whPhone').value, notes:document.getElementById('whNotes').value, createdAt:nowISO()});
      logHistory('Wholesaler','Added', name+' added as wholesaler');
      saveDB(); closeModal(); renderWholesaler(); toast('Wholesaler added');
    }}
  ]);
}
function deleteWholesaler(id){
  const w = DB.wholesalers.find(x=>x.id===id); if(!w) return;
  guardDelete('wholesaler ('+w.name+') and its whole kata', ()=>{
    w.deleted = true;
    logHistory('Wholesaler','Deleted', w.name+' deleted');
    saveDB(); renderWholesaler(); toast('Wholesaler deleted');
  });
}
function viewWholesalerKata(id){
  const w = DB.wholesalers.find(x=>x.id===id); if(!w) return;
  const entries = DB.wholesalerEntries.filter(e=>e.wholesalerId===id && !e.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const bal = wholesalerBalance(id);
  let body = `<div class="grid grid-2" style="margin-bottom:12px;">
    <div><b>Silver Owed:</b> ${fmtWt(bal.silverOwed)}</div><div><b>Gold Owed:</b> ${fmtWt(bal.goldOwed)}</div>
    <div><b>Cash/Labour Owed:</b> ${fmtMoney(bal.cashOwed)}</div><div><b>Phone:</b> ${w.phone||'-'}</div>
  </div>
  <table><tr><th>Date</th><th>Type</th><th>Item</th><th>Purity</th><th>Wt</th><th>Pure Wt</th><th>Labour</th><th>Cash Paid</th><th></th></tr>
  ${entries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.type}</td><td>${e.itemDesc||'-'}</td><td>${e.purity||100}%</td><td>${fmtWt(e.weight||0)}</td><td>${fmtWt(e.pureWeight||0)}</td><td>${fmtMoney(e.labourCharge||0)}</td><td>${fmtMoney(e.cashPaid||0)}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="guardEdit('wholesaler entry', ()=>openWholesalerEntryForm('${id}','${e.type}','${e.id}'))">✎</button>
    <button class="btn btn-sm btn-danger" onclick="deleteWholesalerEntry('${id}','${e.id}')">🗑</button></td></tr>`).join('') || '<tr><td colspan="9" class="helpText">No entries yet.</td></tr>'}
  </table>`;
  openModal(w.name+' — Kata', body, [
    {label:'Close', cls:'btn-ghost', onClick:closeModal},
    {label:'+ Purchase Entry', cls:'btn-outline', onClick:()=>{ closeModal(); openWholesalerEntryForm(id,'purchase'); }},
    {label:'+ Payment Entry', cls:'btn-primary', onClick:()=>{ closeModal(); openWholesalerEntryForm(id,'payment'); }}

function saveWholesalerEntry(wholesalerId, type, editId){
  const weight = parseFloat(document.getElementById('weWeight').value)||0;
  const purity = parseFloat(document.getElementById('wePurity').value);
  const pf = isNaN(purity)?1:(purity/100);
  const w = DB.wholesalers.find(x=>x.id===wholesalerId);
  if(editId){
    const e = DB.wholesalerEntries.find(x=>x.id===editId); if(!e) return;
    e.date = document.getElementById('weDate').value||e.date; e.metal = document.getElementById('weMetal').value;

    e.labourCharge = type==='purchase' ? (parseFloat(document.getElementById('weLabour')?.value)||0) : 0;
    e.cashPaid = type==='payment' ? (parseFloat(document.getElementById('weCashPaid')?.value)||0) : 0;
    e.note = document.getElementById('weNote').value||'';
    logHistory('Wholesaler', type+' Edited', `${type} entry for ${w?w.name:''} edited — ${fmtWt(e.pureWeight)}`);

    type, metal: document.getElementById('weMetal').value, purity: isNaN(purity)?100:purity,
    weight, pureWeight: weight*pf,
    itemDesc: type==='purchase' ? (document.getElementById('weItem')?.value||'') : '',

    cashPaid: type==='payment' ? (parseFloat(document.getElementById('weCashPaid')?.value)||0) : 0,
    note: document.getElementById('weNote').value||''
  };
  DB.wholesalerEntries.push(e);

function renderStdCalc(){
  const wrap = document.getElementById('calcStdWrap');
  wrap.innerHTML = `
    <div class="calcScreen"><div class="expr" id="calcExprOut">&nbsp;</div><div class="val" id="calcValOut">0</div></div>
    <div class="calcGrid">
      <button class="calcBtn clear" onclick="calcPress('C')">C</button>
      <button class="calcBtn clear" onclick="calcPress('BACK')">⌫</button>
      <button class="calcBtn op" onclick="calcPress('%')">%</button>
      <button class="calcBtn op" onclick="calcPress('/')">÷</button>
      <button class="calcBtn" onclick="calcPress('7')">7</button>
      <button class="calcBtn" onclick="calcPress('8')">8</button>
      <button class="calcBtn" onclick="calcPress('9')">9</button>
      <button class="calcBtn op" onclick="calcPress('*')">×</button>
      <button class="calcBtn" onclick="calcPress('4')">4</button>

      <button class="calcBtn" onclick="calcPress('3')">3</button>
      <button class="calcBtn op" onclick="calcPress('+')">+</button>
      <button class="calcBtn" onclick="calcPress('0')">0</button>
      <button class="calcBtn" onclick="calcPress('.')">.</button>
      <button class="calcBtn eq" onclick="calcPress('=')">=</button>
    </div>`;
  updateCalcDisplay();
}
function calcPress(k){
  if(k==='C'){ calcExpr=''; }
  else if(k==='BACK'){ calcExpr = calcExpr.slice(0,-1); }
  else if(k==='='){
    try{
      if(!/^[0-9+\-*/.% ]+$/.test(calcExpr)) throw new Error('invalid');
      const result = Function('"use strict";return ('+calcExpr.replace(/%/g,'/100')+')')();
      calcExpr = String(Math.round(result*100)/100);
    }catch(e){ calcExpr='Error'; }
  } else { calcExpr += k; }
  updateCalcDisplay();
}
function updateCalcDisplay(){
  const v=document.getElementById('calcValOut'); const e=document.getElementById('calcExprOut');
  if(v) v.textContent = calcExpr || '0';
}

/* =====================================================================
   PAGE: MARKET RATES — online-only, reference-only. Never writes to
   currentRates (which is what Sales/Buying actually bill against).
   Lives ONLY on the Dashboard now — no separate page.
===================================================================== */
function extractPrice(data){
  if(data==null) return null;
  if(typeof data==='number') return data;
  const candidates = [data.price, data.rate, data.value, data.price_usd, data.spot_price, data.ask, (data.rates&&data.rates.XAU), (data.rates&&data.rates.XAG)];
  for(const c of candidates){ if(typeof c==='number' && !isNaN(c)) return c; }
  return null;
}
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), ms);
  try{ return await fetch(url, {signal: ctrl.signal}); }
  finally{ clearTimeout(timer); }
}
async function fetchMarketRates(silent){
  // Note: we do NOT pre-check navigator.onLine — on some tablets/WebKit
  // versions it reports false incorrectly even with a working connection.
  // We just attempt the fetch directly and report the real error if it fails.
  if(!silent) toast('Fetching live rates...');
  try{
    const [goldRes, silverRes, fxRes] = await Promise.all([
      fetchWithTimeout('https://api.gold-api.com/price/XAU', 10000),
      fetchWithTimeout('https://api.gold-api.com/price/XAG', 10000),
      fetchWithTimeout('https://api.frankfurter.dev/v2/rate/USD/INR', 10000).catch(()=>null)
    ]);
    if(!goldRes.ok) throw new Error('Gold source returned HTTP '+goldRes.status);
    if(!silverRes.ok) throw new Error('Silver source returned HTTP '+silverRes.status);
    const goldJson = await goldRes.json();
    const silverJson = await silverRes.json();
    const goldPrice = extractPrice(goldJson);
    const silverPrice = extractPrice(silverJson);
    if(goldPrice==null && silverPrice==null) throw new Error('Response did not contain a recognisable price field');
    let usdInr = DB.marketRates.usdInr || null;
    let fxSource = 'manual';
    if(fxRes && fxRes.ok){
      try{
        const fxJson = await fxRes.json();
        const rate = fxJson.rate!=null ? fxJson.rate : (fxJson.rates && fxJson.rates.INR);
        if(typeof rate==='number' && !isNaN(rate)){ usdInr = rate; fxSource = 'frankfurter.dev (live)'; }
      }catch(e){ /* keep existing usdInr if currency parse fails */ }
    }
    // Preserve premium settings — a refresh must never silently reset them.
    DB.marketRates = {
      goldUsdOz: goldPrice, silverUsdOz: silverPrice,
      usdInr, fxSource,
      fetchedAt: nowISO(), source: 'gold-api.com (international spot reference)', lastError: null,
      mcxPremiumPctGold: DB.marketRates.mcxPremiumPctGold!==undefined ? DB.marketRates.mcxPremiumPctGold : 15,
      mcxPremiumPctSilver: DB.marketRates.mcxPremiumPctSilver!==undefined ? DB.marketRates.mcxPremiumPctSilver : 25
    };
    logHistory('MarketRates','Fetched', `Gold $${goldPrice}/oz, Silver $${silverPrice}/oz, USD/INR ${usdInr||'manual'}`);
    saveDB(); renderDashboardMarketMini(); if(!silent) toast('Live rates updated');
  }catch(err){
    const reason = err.name==='AbortError' ? 'Request timed out — slow or no internet' : (err.message || String(err) || 'Unknown error');
    DB.marketRates.lastError = reason;
    saveDB(); renderDashboardMarketMini();
    if(!silent) toast('Could not fetch live rates: '+reason);
  }
}
function saveUsdInr(val){
  DB.marketRates.usdInr = parseFloat(val)||null;
  DB.marketRates.fxSource = 'manual';
  saveDB(); renderDashboardMarketMini(); toast('Reference conversion rate saved');
}
function renderDashboardMarketMini(){
  const el = document.getElementById('dashMarketMini'); if(!el) return;
  const m = DB.marketRates;
  if(!m.fetchedAt){
    el.innerHTML = `<div class="helpText">Not fetched yet — tap ↻ when the tablet has internet.</div>${m.lastError?`<div class="helpText" style="color:var(--danger);margin-top:4px;">Last attempt failed: ${m.lastError}</div>`:''}`;
    return;
  }
  const goldPerGram = m.goldUsdOz ? (m.goldUsdOz/31.1035) : null;
  const silverPerGram = m.silverUsdOz ? (m.silverUsdOz/31.1035) : null;
  const inrRate = m.usdInr;
  const premGold = (m.mcxPremiumPctGold===undefined||m.mcxPremiumPctGold===null) ? 15 : m.mcxPremiumPctGold;
  const premSilver = (m.mcxPremiumPctSilver===undefined||m.mcxPremiumPctSilver===null) ? 25 : m.mcxPremiumPctSilver;
  const spotGoldInr10g = (inrRate&&goldPerGram) ? goldPerGram*inrRate*10 : null;
  const spotSilverInrKg = (inrRate&&silverPerGram) ? silverPerGram*inrRate*1000 : null;
  const mcxGoldEst = spotGoldInr10g ? spotGoldInr10g*(1+premGold/100) : null;
  const mcxSilverEst = spotSilverInrKg ? spotSilverInrKg*(1+premSilver/100) : null;
  const isStale = daysBetween(m.fetchedAt.slice(0,10)) >= 1;
  el.innerHTML = `
    ${isStale?`<div class="helpText" style="color:#8A6416;">🕘 Last known rate (market closed / was offline) — not live right now.</div>`:''}
    <table style="margin-top:4px;">
      <tr><th>Metal</th><th>MCX (est.)</th><th>Spot</th></tr>
      <tr><td>🥇 Gold</td><td>${mcxGoldEst?fmtMoney(mcxGoldEst)+'/10g':'-'}</td><td>$${m.goldUsdOz?m.goldUsdOz.toFixed(2):'-'}/oz${spotGoldInr10g?' ('+fmtMoney(spotGoldInr10g)+'/10g)':''}</td></tr>
      <tr><td>🥈 Silver</td><td>${mcxSilverEst?fmtMoney(mcxSilverEst)+'/kg':'-'}</td><td>$${m.silverUsdOz?m.silverUsdOz.toFixed(2):'-'}/oz${spotSilverInrKg?' ('+fmtMoney(spotSilverInrKg)+'/kg)':''}</td></tr>
    </table>
    <div class="helpText" style="margin-top:4px;">As of ${new Date(m.fetchedAt).toLocaleString('en-IN')} • Source: ${m.source||'international spot'}</div>
    <div class="helpText" style="margin-top:2px;">"MCX (est.)" = spot converted to ₹ + duty/premium % below — a reference estimate, not an exchange-fed live MCX price. No free public MCX feed exists; a paid exchange data vendor would be needed for exact futures prices. Gold and silver premiums differ (silver's is currently running higher due to reported supply tightness), so they're set separately below.</div>
    <div style="display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:6px;">
        <label class="helpText" style="margin:0;">USD→INR:</label>
        <input type="number" id="usdInrInput" value="${m.usdInr||''}" placeholder="e.g. 95.4" style="width:70px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;" onchange="saveUsdInr(this.value)">
        <span class="helpText" style="margin:0;">(${m.fxSource==='manual'||!m.fxSource?'manual':'live-fetched'})</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <label class="helpText" style="margin:0;">Gold premium %:</label>
        <input type="number" id="mcxPremiumGoldInput" value="${premGold}" style="width:55px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;" onchange="saveMcxPremium('gold', this.value)">
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <label class="helpText" style="margin:0;">Silver premium %:</label>
        <input type="number" id="mcxPremiumSilverInput" value="${premSilver}" style="width:55px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;" onchange="saveMcxPremium('silver', this.value)">
      </div>
    </div>
    ${m.lastError?`<div class="helpText" style="color:var(--danger);margin-top:6px;">Last refresh attempt failed: ${m.lastError}</div>`:''}
  `;
}
function saveMcxPremium(metal, val){
  const parsed = parseFloat(val);
  if(metal==='gold') DB.marketRates.mcxPremiumPctGold = isNaN(parsed) ? 15 : parsed;
  else DB.marketRates.mcxPremiumPctSilver = isNaN(parsed) ? 25 : parsed;
  saveDB(); renderDashboardMarketMini(); toast('Premium updated');
}

function saveRates(){
  DB.currentRates = {
    gold24: parseFloat(document.getElementById('setGold24').value)||0,
    gold22: parseFloat(document.getElementById('setGold22').value)||0,
    silverKg: parseFloat(document.getElementById('setSilverKg').value)||0,
    updatedAt: nowISO()
  };
  DB.rateHistory.push({...DB.currentRates});
  logHistory('Rates','Updated', `Gold24: ${DB.currentRates.gold24}, Gold22: ${DB.currentRates.gold22}, Silver/kg: ${DB.currentRates.silverKg}`);
  saveDB(); toast('Rates updated');
}
function saveSecurity(){
  DB.meta.pin = document.getElementById('setPin').value||DB.meta.pin;
  DB.meta.ownerPin = document.getElementById('setOwnerPin').value||DB.meta.ownerPin;
  DB.meta.discountApprovalThresholdPct = parseFloat(document.getElementById('setThreshold').value)||3;
  DB.meta.autoLockMinutes = parseFloat(document.getElementById('setAutoLock').value)||0;
  saveDB(); startIdleTimer(); toast('Security settings saved');
}
function saveBackupReminderDays(val){
  DB.meta.backupReminderDays = parseFloat(val)||3;
  saveDB(); toast('Backup reminder updated');
}
function addStaff(){
  const name = document.getElementById('newStaffName').value.trim();
  if(!name){ toast('Enter staff name'); return; }
  DB.staff.push({id:uid('STF'), name, role:document.getElementById('newStaffRole').value, pin:'0000'});
  logHistory('Staff','Added', name+' added as '+document.getElementById('newStaffRole').value);
  saveDB(); renderSettings(); toast('Staff added');
}
function doBackup(){
  DB.meta.lastBackupAt = nowISO(); saveDB();
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'gayatri-jewellers-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logHistory('Backup','Created','Backup file downloaded');
  toast('Backup downloaded');
}
document.getElementById('restoreFileInput').addEventListener('change', function(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const data = JSON.parse(evt.target.result);
      confirmAction('Restoring will replace ALL current data on this tablet with the backup file. Continue?', ()=>{
        DB = data; saveDB(); location.reload();
      });
    }catch(err){ toast('Invalid backup file'); }
  };
  reader.readAsText(file);
  e.target.value='';
});
function setLanguage(l){ DB.meta.language=l; saveDB(); renderNav(); goTo(currentPage); toast(l==='hi'?'भाषा बदली गई':'Language changed'); }

/* =====================================================================
   PIN LOCK LOGIC
===================================================================== */
let pinBuffer='';
function renderPinPad(){
  const grid = document.getElementById('padGrid'); grid.innerHTML='';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.className='padBtn'+(k===''?' hidden':''); b.textContent=k;
    if(k!=='') b.onclick = ()=> handlePinKey(k);
    grid.appendChild(b);
  });
  updatePinDots();
}
function updatePinDots(){
  const dots = document.getElementById('pinDots'); dots.innerHTML='';
  for(let i=0;i<4;i++){ const d=document.createElement('div'); d.className='pinDot'+(i<pinBuffer.length?' filled':''); dots.appendChild(d); }
}
function handlePinKey(k){
  document.getElementById('lockError').textContent='';
  if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); updatePinDots(); return; }
  if(pinBuffer.length>=6) return;
  pinBuffer += k; updatePinDots();
  if(pinBuffer.length===DB.meta.pin.length){
    if(pinBuffer===DB.meta.pin){ unlockApp(); }
    else{ document.getElementById('lockError').textContent='Incorrect PIN, try again.'; setTimeout(()=>{pinBuffer='';updatePinDots();},450); }
  }
}
function unlockApp(){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('shell').classList.add('active');
  pinBuffer='';
  init();
  startIdleTimer();
}
function lockNow(){
  document.getElementById('lockScreen').style.display='flex';
  document.getElementById('shell').classList.remove('active');
  pinBuffer=''; updatePinDots();
  stopIdleTimer();
}
document.getElementById('lockNowBtn').addEventListener('click', lockNow);
document.getElementById('quickBackupBtn').addEventListener('click', doBackup);
document.getElementById('langEnBtn').addEventListener('click', ()=>{ setLanguage('en'); syncLangToggle(); });
document.getElementById('langHiBtn').addEventListener('click', ()=>{ setLanguage('hi'); syncLangToggle(); });
function syncLangToggle(){
  document.getElementById('langEnBtn').className = DB.meta.language==='en'?'active':'';
  document.getElementById('langHiBtn').className = DB.meta.language==='hi'?'active':'';
}

/* ---------------------- AUTO-LOCK (configurable idle timeout) ---------------------- */
let idleTimerHandle = null;
function resetIdleTimer(){
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  clearTimeout(idleTimerHandle);
  idleTimerHandle = setTimeout(()=>{ lockNow(); }, mins*60000);
}
function startIdleTimer(){
  stopIdleTimer();
  const mins = DB.meta.autoLockMinutes || 0;
  if(mins<=0) return;
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.addEventListener(evt, resetIdleTimer));
  resetIdleTimer();
}
function stopIdleTimer(){
  clearTimeout(idleTimerHandle);
  ['click','touchstart','keydown','mousemove'].forEach(evt=> document.removeEventListener(evt, resetIdleTimer));
}

function updateClock(){
  const el = document.getElementById('topDateTime'); if(!el) return;
  const now = new Date();
  const dateStr = now.toLocaleDateString(DB.meta.language==='hi'?'hi-IN':'en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const timeStr = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  el.textContent = dateStr + '  •  ' + timeStr;
}
function init(){
  document.getElementById('brandName').textContent = DB.meta.shopName;
  document.getElementById('brandLoc').textContent = DB.meta.location.split(',')[0].toUpperCase()+', '+ (DB.meta.location.split(',')[1]||'').toUpperCase();
  renderNav(); renderRateStrip(); syncLangToggle();
  goTo('dashboard');
  updateClock();
  if(!window._clockInterval) window._clockInterval = setInterval(updateClock, 30000);
}
document.getElementById('lockTitle').textContent = DB.meta.shopName;
renderPinPad();
