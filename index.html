<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#450D17;
  --maroon-light:#8C2233;
  --gold:#AD8A3B;
  --gold-light:#E4D4A7;
  --gold-pale:#F3EAD1;
  --bg:#F2ECDD;
  --paper:#FFFFFF;
  --ink:#2B2320;
  --ink-soft:#6B5F55;
  --line:#E2D8C2;
  --silver-accent:#7C8794;
  --success:#2F7A4F;
  --success-bg:#E4F0E7;
  --danger:#AD3B32;
  --danger-bg:#F5E4E1;
  --warn-bg:#FBEFD9;
  --radius:10px;
  --shadow:0 2px 10px rgba(69,13,23,0.08);
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--maroon-dark),var(--maroon) 60%,#5A1420);
  display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;
}
.seal{
  width:92px;height:92px;border-radius:50%;border:3px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:30px;color:var(--gold-light);letter-spacing:1px;margin-bottom:18px;
  box-shadow:0 0 0 4px rgba(228,212,167,0.15);
}
.lockCard{
  background:rgba(255,255,255,0.06);border:1px solid rgba(228,212,167,0.35);
  border-radius:16px;padding:36px 40px;text-align:center;min-width:340px;
  backdrop-filter:blur(2px);
}
.lockCard h1{font-family:var(--font-display);color:#fff;font-size:26px;margin:0 0 2px;letter-spacing:.5px;}
.lockCard p.sub{color:var(--gold-light);margin:0 0 22px;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.pinDots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pinDot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold-light);background:transparent;transition:.15s;}
.pinDot.filled{background:var(--gold-light);}
.padGrid{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center;margin-top:10px;}
.padBtn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(228,212,167,0.5);background:rgba(255,255,255,0.05);color:#fff;font-size:22px;}
.padBtn:active{background:var(--gold);color:var(--maroon-dark);}
.padBtn.wide{grid-column:span 1;font-size:14px;}
#lockError{color:#FFC9C0;font-size:13px;height:18px;margin-top:8px;}
#lockHint{color:rgba(255,255,255,.55);font-size:12px;margin-top:14px;}

/* ---------- SHELL ---------- */
#shell{display:none;height:100vh;width:100vw;grid-template-columns:230px 1fr;}
#shell.active{display:grid;}
#sidebar{
  background:var(--maroon-dark);color:#fff;display:flex;flex-direction:column;
  padding:18px 0;overflow-y:auto;
}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(228,212,167,0.2);margin-bottom:10px;display:flex;gap:10px;align-items:center;}
.brand .mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold-light);font-size:15px;flex-shrink:0;}
.brand .txt h2{font-family:var(--font-display);font-size:15px;margin:0;line-height:1.2;color:#fff;}
.brand .txt span{font-size:10px;color:var(--gold-light);letter-spacing:1px;}

/* =====================================================================
   GAYATRI JEWELLERS — OFFLINE SHOP MANAGER
   Single-file offline ERP. All data in IndexedDB (permanent browser database). No network calls except optional live rates.
===================================================================== */

const DB_KEY = 'gj_erp_db_v1';
const uid = (p='ID') => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});

/* Days between a given date (YYYY-MM-DD) and today (or a second date if given).
   Used across Girvi ageing, interest calculation, and the backup-reminder banner. */
const daysBetween = (fromISODate, toISODate) => {
  if(!fromISODate) return 0;
  const a = new Date(String(fromISODate).slice(0,10)+'T00:00:00'), b = new Date((toISODate||todayStr())+'T00:00:00');
  if(isNaN(a.getTime())) return 0;
  return Math.max(Math.round((b-a)/86400000), 0);
};

/* Backward-compatible migration: fills in any fields added in later app updates

function migrateDB(d){
  if(!d.wholesalers) d.wholesalers=[];
  if(!d.wholesalerEntries) d.wholesalerEntries=[];
  (d.wholesalerEntries||[]).forEach(e=>{
    // Normalize metal to exactly 'Gold' or 'Silver' regardless of how it was
    // originally stored (case/whitespace) — this is the safeguard against
    // gold entries silently falling into the silver bucket in totals.
    const m = String(e.metal||'').trim().toLowerCase();
    e.metal = m==='gold' ? 'Gold' : 'Silver';

  if(!d.marketRates) d.marketRates={ goldUsdOz:null, silverUsdOz:null, usdInr:null, fxSource:null, fetchedAt:null, source:null, lastError:null, mcxPremiumPctGold:15, mcxPremiumPctSilver:25 };

    const old = d.marketRates.mcxPremiumPct;
    if(d.marketRates.mcxPremiumPctGold===undefined) d.marketRates.mcxPremiumPctGold = (old!==undefined?old:15);
    if(d.marketRates.mcxPremiumPctSilver===undefined) d.marketRates.mcxPremiumPctSilver = (old!==undefined?Math.max(old,25):25);
    delete d.marketRates.mcxPremiumPct;
    // The USD-INR default used to be a stale hardcoded 88 — if it looks like
    // nobody ever adjusted it and no live fetch has happened, clear it so the
    // widget prompts a fresh fetch instead of silently using an old number.
    if(d.marketRates.usdInr===88 && !d.marketRates.fetchedAt) d.marketRates.usdInr = null;
    if(d.marketRates.fxSource===undefined) d.marketRates.fxSource = null;

/* =====================================================================
   STORAGE ENGINE — IndexedDB, not localStorage.
   Why: Safari caps localStorage at ~5-10MB regardless of device free
   space, which is what was causing "device storage is full" errors and
   silently-failed saves even on a mostly-empty iPad. IndexedDB draws
   from the device's real free space (often GBs) and is fully supported
   offline in Safari on iPad. DB itself stays a plain synchronous
   in-memory object exactly as before — every other part of the app
   reads/writes DB directly with zero changes. Only this storage layer
   changed.
===================================================================== */
const IDB_NAME = 'gj_erp_idb_v1';
const IDB_STORE = 'kv';
const IDB_ROW_KEY = 'db';
let _idbConn = null;   // one shared connection: a save starts its transaction immediately
function idbOpen(){
  if(_idbConn) return Promise.resolve(_idbConn);
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB not available in this browser')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE); };
    req.onsuccess = (e)=>{ const db=e.target.result; db.onversionchange=()=>{ try{ db.close(); }catch(x){} _idbConn=null; }; db.onclose=()=>{ _idbConn=null; }; _idbConn=db; resolve(db); };
    req.onerror = (e)=> reject(e.target.error||new Error('IndexedDB open failed'));
  });
}
async function idbGet(){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(IDB_ROW_KEY);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error||new Error('IndexedDB read failed'));
  });
}
async function idbSet(value){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, IDB_ROW_KEY);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error||new Error('IndexedDB write failed'));
  });
}
let DB = defaultDB(); // real data is loaded asynchronously by boot() below before the PIN pad appears
/* =====================================================================
   DATA SAFETY LAYER (on top of the IndexedDB engine above)
   1. Guarded writes: a save is refused if the stored data was changed by another
      window/tab (it would overwrite their work) or if it would replace real
      records with an empty database. Saving pauses and a red banner explains.
   2. If the saved data cannot be READ, the app never saves over it.
   3. Daily safety copies (newest 3 days) plus a copy made just before an upgrade
      or a restore - kept in the same browser database, restorable from Settings.
   4. Asks the browser for "persistent" storage so it is not cleaned up automatically.
   5. A pending change is flushed when the tab is hidden/closed; failed saves retry.
===================================================================== */
const SNAP_PREFIX = 'snap:';
let _storageRev = 0, _storageLocked = false, _storageLockReason = '', _lastSavedAt = null, _idbRetry = 0;
let _idbSaveInFlight = false, _idbSavePending = false, _idbLastError = null;
function recordTotal(d){ return ['customers','sales','buying','girvi','creditEntries','inventory','jobs','exchange'].reduce((a,k)=>a+((d&&Array.isArray(d[k]))?d[k].length:0),0); }
function countsOf(d){
  const n=(k,f)=>((d&&d[k])||[]).filter(f||(()=>true)).length;
  return {Customers:n('customers',c=>!c.mergedInto), Sales:n('sales',s=>!s.deleted), Girvi:n('girvi',g=>!g.deleted), Buying:n('buying',b=>!b.deleted), Credit:n('creditEntries',e=>!e.deleted)};
}
function idbKeyGet(key){ return idbOpen().then(db=>new Promise((res,rej)=>{ const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error||new Error('read failed')); })); }
function idbKeyPut(key,val){ return idbOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(val,key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error||new Error('write failed')); tx.onabort=()=>rej(tx.error||new Error('write aborted')); })); }
function idbKeyDel(key){ return idbOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(key); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error||new Error('delete failed')); })); }
function idbAllKeys(){ return idbOpen().then(db=>new Promise((res,rej)=>{ const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error||new Error('list failed')); })); }
function idbSaveGuarded(snapshot){
  return idbOpen().then(db=>new Promise((resolve,reject)=>{
    let tx; try{ tx=db.transaction(IDB_STORE,'readwrite',{durability:'strict'}); }catch(e0){ tx=db.transaction(IDB_STORE,'readwrite'); }
    const st=tx.objectStore(IDB_STORE);
    let failure=null;
    const rq=st.get(IDB_ROW_KEY);
    rq.onsuccess=()=>{
      const cur=rq.result; const curRev=(cur&&cur.meta&&cur.meta._rev)||0;
      if(cur && curRev!==_storageRev){ failure=Object.assign(new Error('The data was changed in another window'),{code:'STALE'}); tx.abort(); return; }
      if(cur && recordTotal(cur)>0 && recordTotal(snapshot)===0){ failure=Object.assign(new Error('Refused to replace saved records with an empty database'),{code:'EMPTY'}); tx.abort(); return; }
      const next=curRev+1; snapshot.meta=snapshot.meta||{}; snapshot.meta._rev=next;
      st.put(snapshot, IDB_ROW_KEY);
      tx.oncomplete=()=>{ _storageRev=next; resolve(next); };
    };
    rq.onerror=()=>{ failure=rq.error||new Error('read failed'); };
    tx.onerror=()=>reject(failure||tx.error||new Error('IndexedDB write failed'));
    tx.onabort=()=>reject(failure||tx.error||new Error('IndexedDB write aborted'));
  }));
}
function lockStorage(reason){
  _storageLocked=true; _storageLockReason=reason;
  let el=document.getElementById('storageLockBanner');
  if(!el){ el=document.createElement('div'); el.id='storageLockBanner'; el.style.cssText='position:fixed;left:0;right:0;top:0;z-index:5000;background:#7A1010;color:#fff;padding:12px 18px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 16px rgba(0,0,0,.4);'; document.body.appendChild(el); }
  const msg = reason==='stale' ? 'This app was changed in another window or tab, so this window stopped saving to avoid overwriting that work. Nothing already saved is lost.'
    : reason==='empty' ? 'This window tried to replace your saved records with an empty database — that was blocked. Your saved data is untouched.'
    : 'Your saved data could not be read just now, so nothing will be saved over it. Your data is not erased.';
  el.innerHTML=`<div style="flex:1;min-width:240px;">🛑 <b>Saving is paused to protect your data.</b> ${msg}</div><button class="btn btn-sm btn-gold" onclick="location.reload()">Reload now</button><button class="btn btn-sm btn-ghost" onclick="downloadThisWindowData()">⬇ Keep a copy of this window's data</button>`;
}
function downloadThisWindowData(){

  const a=document.createElement('a'); a.href=url; a.download='gayatri-jewellers-THIS-WINDOW-copy-'+todayStr()+'.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

async function loadDB(){
  let data;
  try{ data = await idbGet(); }
  catch(e){
    lockStorage('read-failed');            // never save over data that could not be read
    try{ const raw=localStorage.getItem(DB_KEY); if(raw) return migrateDB(JSON.parse(raw)); }catch(e2){}
    return defaultDB();
  }
  try{
    if(!data){
      // first run on this device: bring over any very old localStorage copy (it is left untouched)
      const raw = localStorage.getItem(DB_KEY); let old=null;
      if(raw){ try{ old=JSON.parse(raw); }catch(e2){ old=null; } }
      data = old || defaultDB();
      await idbSet(data);
    } else {
      _storageRev = (data.meta && data.meta._rev) || 0;
      if(!('customerMerges' in data)){        // first open after this upgrade: keep an untouched copy of the old data
        try{ if(!(await idbKeyGet(SNAP_PREFIX+'before-upgrade'))) await idbKeyPut(SNAP_PREFIX+'before-upgrade', {at:nowISO(), label:'Copy of your data made just before this upgrade', counts:countsOf(data), data:JSON.parse(JSON.stringify(data))}); }catch(e3){}
      }
    }
  }catch(e){ /* a failed first-time write is retried by the normal save queue */ }
  return migrateDB(data || defaultDB());
}
async function flushIdbSaveQueue(){
  if(_idbSaveInFlight || _storageLocked) return;
  _idbSaveInFlight = true;
  while(_idbSavePending && !_storageLocked){
    _idbSavePending = false;
    const snapshot = JSON.parse(JSON.stringify(DB));
    try{
      const rev = await idbSaveGuarded(snapshot);
      DB.meta._rev = rev; _lastSavedAt = nowISO(); _idbLastError = null; _idbRetry = 0;
    }catch(err){
      _idbLastError = err;
      if(err && err.code==='STALE'){ lockStorage('stale'); }
      else if(err && err.code==='EMPTY'){ lockStorage('empty'); }
      else {
        _idbSavePending = true;                     // keep the change and try again shortly
        toast('⚠️ Could not save: '+(err&&err.message?err.message:'storage error')+' — retrying. Please back up soon.');
        if(_idbRetry < 6){ _idbRetry++; setTimeout(()=>flushIdbSaveQueue(), 2500*_idbRetry); }
        break;
      }
    }
  }
  _idbSaveInFlight = false;
}
function saveDB(){
  try{
    renderRateStrip();
    _idbSavePending = true;
    flushIdbSaveQueue();
    return true;
  }catch(err){
    toast('⚠️ Could not save: '+(err&&err.message?err.message:'unknown error'));
    return false;
  }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && _idbSavePending) flushIdbSaveQueue(); });
window.addEventListener('pagehide', ()=>{ if(_idbSavePending) flushIdbSaveQueue(); });
/* ---- persistent storage + safety copies ---- */
function persistLineText(){
  return window._storagePersisted ? 'Protected from automatic clean-up by the browser: <b>Yes ✅</b>'
    : 'Protected from automatic clean-up: <b>not granted by this browser ⚠️</b> — keep your backups up to date (Safari can clear data of websites that are not used for a long time; adding the app to the Home Screen helps).';
}
function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persisted().then(p=> p ? true : navigator.storage.persist()).then(g=>{ window._storagePersisted=!!g; const el=document.getElementById('persistLine'); if(el) el.innerHTML=persistLineText(); }).catch(()=>{});
    }
  }catch(e){}
}
async function ensureDailySnapshot(){
  if(_storageLocked || recordTotal(DB)===0) return;
  const key=SNAP_PREFIX+'day-'+todayStr();
  const keys=await idbAllKeys();
  if(!keys.includes(key)) await idbKeyPut(key,{at:nowISO(), label:'Daily safety copy', counts:countsOf(DB), data:JSON.parse(JSON.stringify(DB))});
  const days=(await idbAllKeys()).filter(k=>String(k).startsWith(SNAP_PREFIX+'day-')).sort();
  while(days.length>3){ await idbKeyDel(days.shift()); }
}
function storageSafetyHTML(){

async function renderSnapshotList(){
  const el=document.getElementById('snapList'); if(!el) return;

  }catch(e){ el.innerHTML='<div class="helpText">Could not list the safety copies.</div>'; }
}

  box.querySelectorAll('.searchResultRow').forEach(row=>{

/* =====================================================================
   CUSTOMER MEMORY — recognise repeat customers, warn about duplicates,
   merge safely (with undo), keep every photo. Nothing is ever deleted:
   a merged duplicate is only flagged (mergedInto) and every move is
   logged in DB.customerMerges so it can be undone.
===================================================================== */
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normPhone(p){ const d=String(p||'').replace(/\D/g,''); return d.length>10 ? d.slice(-10) : d; }
function normName(n){
  return String(n||'').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu,' ').replace(/\b(shri|shree|sri|smt|mr|mrs|ji)\b/g,' ').replace(/\s+/g,' ').trim();
}
function levDist(a,b){
  if(a===b) return 0; const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ cur[0]=i; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } const t=prev; prev=cur; cur=t; }
  return prev[n];
}
/* Customers are written the way the shop writes them:  Name, Father, Caste, Village
   e.g. "Ajay, Ramesh, Ninama, Sarwan".  The 4th part IS the village — there is no separate village box. */
function parseNameParts(raw){
  const s0=String(raw==null?'':raw);
  const parts=s0.split(/[,،;|]+/).map(x=>x.replace(/\s+/g,' ').trim());
  return {first:parts[0]||'', father:parts[1]||'', caste:parts[2]||'', village:parts[3]||'', hasSep:/[,،;|]/.test(s0), count:parts.filter(Boolean).length};
}
function fmtCustName(raw){
  const s0=String(raw==null?'':raw).trim();
  if(!/[,،;|]/.test(s0)) return s0.replace(/\s+/g,' ');
  const cap=w=>w.replace(/(^|[\s.\-])([a-z])/g,(m,p,ch)=>p+ch.toUpperCase());
  const t=s0.split(/[,،;|]+/).map(x=>cap(x.replace(/\s+/g,' ').trim()));
  while(t.length && !t[t.length-1]) t.pop();
  return t.join(', ');
}
function applyNameParts(c){
  const P=parseNameParts(c.name);
  if(P.hasSep){ c.father=P.father; c.caste=P.caste; c.village=P.village; }
}
/* two written-out names are the same person only if every part they BOTH have matches
   (same first name but a different father / caste / village = a different person) */
function nameSimilarity(a,b){
  const A=parseNameParts(a), B=parseNameParts(b);
  if(A.hasSep && B.hasSep){
    const sims=[plainNameSim(A.first,B.first)];
    ['father','caste','village'].forEach(k=>{ if(A[k] && B[k]) sims.push(plainNameSim(A[k],B[k])); });
    const mn=Math.min(...sims);
    return mn<0.75 ? Math.min(0.5,mn) : mn;
  }
  return plainNameSim(a,b);
}
function plainNameSim(a,b){
  a=normName(a); b=normName(b); if(!a||!b) return 0; if(a===b) return 1;
  if(a.split(' ').sort().join(' ')===b.split(' ').sort().join(' ')) return 0.97;
  const sh=a.length<=b.length?a:b, lg=a.length<=b.length?b:a;
  if(sh.length>=4 && lg.includes(sh)) return 0.85;
  return 1 - levDist(a,b)/Math.max(a.length,b.length);
}
function custPhones(c){ return [c.phone].concat(c.altPhones||[]).map(normPhone).filter(Boolean); }
function bestNameSim(c, name){ return Math.max(nameSimilarity(c.name,name), ...(c.aliases||[]).map(a=>nameSimilarity(a,name))); }
function liveCustomers(){ return DB.customers.filter(c=>!c.mergedInto); }
function customerById(id){
  if(!id) return null;
  let c=DB.customers.find(x=>x.id===id), guard=0;
  while(c && c.mergedInto && guard++<10) c=DB.customers.find(x=>x.id===c.mergedInto);
  return c||null;
}
function customerMainPhoto(c){ if(!c) return null; if(c.photo) return c.photo; if(c.photos&&c.photos.length) return (typeof c.photos[0]==='string')?c.photos[0]:c.photos[0].data; return null; }
function custAvatarHTML(c, size, nameFallback, photoOverride){

function custNameFor(rec){ const c=customerById(rec&&rec.customerId); return escH((c&&c.name)||(rec&&rec.customerName)||''); }
function makeThumb(dataUrl, maxDim, quality, cb){
  const img=new Image();
  img.onload=()=>{ let w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    try{ cb(c.toDataURL('image/jpeg',quality)); }catch(e){ cb(dataUrl); } };
  img.onerror=()=>cb(dataUrl); img.src=dataUrl;
}
function touchCustomerPhone(c, phone){
  const np=normPhone(phone); if(!np) return;
  if(!c.phone){ c.phone=phone; return; }
  if(!custPhones(c).includes(np)){ c.altPhones=c.altPhones||[]; c.altPhones.push(phone); logHistory('Customer','Phone added','Extra number '+phone+' saved for '+c.name); }
}
function findOrCreateCustomer(name, phone, opts){
  name=fmtCustName(name); if(!name) return null; phone=(phone||'').trim();
  let c=null;
  if(!(opts&&opts.forceNew)){
    const nn=normName(name), np=normPhone(phone);
    c=liveCustomers().find(x=> normName(x.name)===nn && (!np || !custPhones(x).length || custPhones(x).includes(np)));
  }
  if(!c){
    c={id:uid('CUS'), name, phone, address:'', notes:'', createdAt:nowISO(), creditEnabled:false, village:'', referredBy:'', familyLink:'', tags:'', photo:null, photos:[], altPhones:[], aliases:[], photoHistory:[], noteLog:[], father:'', caste:''};
    applyNameParts(c);
    DB.customers.push(c);
    logHistory('Customer','Created','New customer added: '+name+(phone?' ('+phone+')':''));
  } else if(phone) touchCustomerPhone(c, phone);
  return c;
}
function customerMatchesQuery(c,q){
  q=String(q||'').trim(); if(!q) return true;
  const nq=normName(q), dq=q.replace(/\D/g,'');
  const names=[c.name].concat(c.aliases||[]).map(normName);
  if(nq){ const toks=nq.split(' ').filter(Boolean); if(names.some(n=>toks.every(t=>n.includes(t)))) return true; }
  if(dq.length>=3 && custPhones(c).some(p=>p.includes(dq))) return true;
  if(nq && normName(c.village||'').includes(nq)) return true;
  if(nq && normName(c.tags||'').includes(nq)) return true;
  return false;
}
function findCustomerMatches(name, phone, limit){
  const nq=normName(name), pq=String(phone||'').replace(/\D/g,''); const toks=nq?nq.split(' ').filter(Boolean):[];
  const out=[];
  liveCustomers().forEach(c=>{
    let score=0, why='';
    if(pq.length>=3){
      const phones=custPhones(c);
      if(phones.includes(normPhone(pq)) && pq.length>=6){ score=100; why='Same phone number'; }
      else if(phones.some(p=>p.includes(pq))){ score=70; why='Phone matches'; }
    }
    if(nq){
      let best=0;
      [c.name].concat(c.aliases||[]).forEach(n=>{
        const nn=normName(n); let s=0;
        if(nn===nq) s=95; else if(nn.startsWith(nq)) s=88; else if(nn.includes(nq)) s=78;
        else if(toks.length>1 && toks.every(t=>nn.includes(t))) s=75;
        else { const sim=nameSimilarity(n,name); if(sim>=0.75) s=Math.round(sim*70); }
        if(s>best) best=s;
      });
      if(best>score){ score=best; why=best>=95?'Same name':(best>=75?'Name matches':'Similar name'); }
      if(!score && c.village && normName(c.village).includes(nq)){ score=40; why='Village match'; }
    }
    if(score>0) out.push({c,score,why});
  });
  out.sort((a,b)=>b.score-a.score || a.c.name.localeCompare(b.c.name));
  return out.slice(0,limit||6);
}
function findDuplicateCandidates(name, phone){
  const np=normPhone(phone); const out=[];
  liveCustomers().forEach(c=>{
    const phones=custPhones(c);
    const samePhone=np.length>=6 && phones.includes(np);
    const sim=bestNameSim(c,name); const exact=sim===1;
    let reason='';
    if(samePhone) reason=exact?'Same name & phone':'Same phone number';
    else if(sim>=0.85 && (!np || !phones.length)) reason=exact?'Same name':'Very similar name';
    if(reason) out.push({c,reason,sim,samePhone,exact});
  });
  return out.sort((a,b)=>(b.samePhone-a.samePhone)||(b.sim-a.sim));
}
function findDuplicatePairs(){
  const list=liveCustomers(), pairs=[], seen=new Set(), byPhone={};
  list.forEach(c=>custPhones(c).forEach(p=>{ if(p.length>=6){ (byPhone[p]=byPhone[p]||[]).push(c); } }));
  Object.keys(byPhone).forEach(p=>{ const arr=byPhone[p];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const k=[arr[i].id,arr[j].id].sort().join('|'); if(seen.has(k)) continue; seen.add(k);
      pairs.push({a:arr[i], b:arr[j], reason:'Same phone number ('+p+')', score:100});
    } });
  const buckets={};
  list.forEach(c=>{ const n=normName(c.name); if(!n) return; (buckets[n[0]]=buckets[n[0]]||[]).push({c,n}); });
  Object.keys(buckets).forEach(key=>{ const arr=buckets[key];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const x=arr[i], y=arr[j]; if(Math.abs(x.n.length-y.n.length)>4 && !(parseNameParts(x.c.name).hasSep && parseNameParts(y.c.name).hasSep)) continue;
      const k=[x.c.id,y.c.id].sort().join('|'); if(seen.has(k)) continue;
      const sim=nameSimilarity(x.c.name,y.c.name); if(sim<0.88) continue;
      const px=custPhones(x.c), py=custPhones(y.c);
      const conflict=px.length&&py.length&&!px.some(p=>py.includes(p));
      if(conflict && sim<1) continue;
      seen.add(k);
      pairs.push({a:x.c, b:y.c, reason: sim===1 ? (conflict?'Same name (different phone numbers)':'Same name') : 'Very similar name', score:Math.round(sim*100)});
    } });
  return pairs.sort((p,q)=>q.score-p.score);
}

function mergeCustomers(primaryId, duplicateId){
  const primary = DB.customers.find(x=>x.id===primaryId), dup = DB.customers.find(x=>x.id===duplicateId);
  if(!primary || !dup || primary.id===dup.id) return;
  const before={phone:primary.phone||'', village:primary.village||'', referredBy:primary.referredBy||'', familyLink:primary.familyLink||'', tags:primary.tags||'', notes:primary.notes||'', photo:primary.photo||null, creditEnabled:!!primary.creditEnabled};
  const addedPhotos=[], addedAlt=[], addedAliases=[];
  ['phone','village','referredBy','familyLink','tags','notes'].forEach(f=>{ if(!primary[f] && dup[f]) primary[f]=dup[f]; });
  if(!primary.photo && dup.photo) primary.photo = dup.photo;
  if(!Array.isArray(primary.photos)) primary.photos = primary.photo?[primary.photo]:[];
  (dup.photos||[]).forEach(p=>{ if(!primary.photos.includes(p)){ primary.photos.push(p); addedPhotos.push(p); } });
  if(dup.photo && !primary.photos.includes(dup.photo)){ primary.photos.push(dup.photo); addedPhotos.push(dup.photo); }
  primary.altPhones=primary.altPhones||[];
  const known=new Set(custPhones(primary));
  [dup.phone].concat(dup.altPhones||[]).forEach(p=>{ const np=normPhone(p); if(!np||known.has(np)) return; known.add(np); primary.altPhones.push(p); addedAlt.push(p); });
  primary.aliases=primary.aliases||[];
  [dup.name].concat(dup.aliases||[]).forEach(a=>{ if(a && nameSimilarity(a,primary.name)<1 && !primary.aliases.includes(a)){ primary.aliases.push(a); addedAliases.push(a); } });
  if(!primary.creditEnabled && dup.creditEnabled) primary.creditEnabled = true;
  const moved={}; let count=0;
  ['sales','buying','girvi','creditEntries','jobs','exchange'].forEach(coll=>{
    moved[coll]=[];
    (DB[coll]||[]).forEach(rec=>{
      if(rec.customerId===duplicateId){ moved[coll].push({id:rec.id, prevName:rec.customerName}); rec.customerId=primaryId; rec.customerName=primary.name; count++; }
    });
  });
  dup.mergedInto = primaryId; dup.deleted = true;
  DB.customerMerges=DB.customerMerges||[];
  DB.customerMerges.unshift({id:uid('MRG'), at:nowISO(), mainId:primaryId, mainName:primary.name, secId:duplicateId, secName:dup.name, moved, before, addedPhotos, addedAlt, addedAliases, undone:false});
  logHistory('Customer','Merged', `${dup.name} merged into ${primary.name} — ${count} record(s) moved`);
  saveDB(); closeModal(); toast(`Merged — ${count} record(s) now under ${primary.name}`); viewCustomerLedger(primaryId);
}
function undoMerge(logId){
  const L=(DB.customerMerges||[]).find(x=>x.id===logId);
  if(!L||L.undone){ toast('This merge was already undone'); return false; }
  const S=DB.customers.find(x=>x.id===L.secId), M=DB.customers.find(x=>x.id===L.mainId);
  if(!S||!M){ toast('Cannot undo — a profile is missing'); return false; }
  Object.keys(L.moved).forEach(coll=>{ (L.moved[coll]||[]).forEach(m=>{ const r=(DB[coll]||[]).find(x=>x.id===m.id); if(r && r.customerId===M.id){ r.customerId=S.id; r.customerName=m.prevName; } }); });
  const B=L.before;
  ['phone','village','referredBy','familyLink','tags','notes'].forEach(f=>{ M[f]=B[f]; });
  M.creditEnabled=B.creditEnabled;
  if(!B.photo) M.photo=null;
  M.photos=(M.photos||[]).filter(p=>!(L.addedPhotos||[]).includes(p));
  M.altPhones=(M.altPhones||[]).filter(p=>!(L.addedAlt||[]).includes(p));
  M.aliases=(M.aliases||[]).filter(a=>!(L.addedAliases||[]).includes(a));
  S.mergedInto=null; S.deleted=false;
  L.undone=true; L.undoneAt=nowISO();
  logHistory('Customer','Merge undone','“'+S.name+'” restored as a separate customer (was merged into “'+M.name+'”)');
  return true;
}

/* =====================================================================
   VILLAGE CHECK + MULTI-STORE DIRECTORY
   Ask a new customer's village → see who in your records is from there
   (and, if you imported another store's directory, them too) to build

function knownVillages(ownOnly){
  const map={};
  const add=v=>{ const k=normName(v); if(!k) return; (map[k]=map[k]||{name:String(v).trim(),count:0}).count++; };
  liveCustomers().forEach(c=>add(c.village));
  if(!ownOnly) (DB.refDirectory||[]).forEach(c=>add(c.village));
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>a.name.localeCompare(b.name));
}
function villageMatches(q, v){
  const a=normName(q), b=normName(v); if(!a||!b) return false; if(a===b) return true;
  if(a.length>=3 && (b.includes(a)||a.includes(b))) return true;
  return nameSimilarity(a,b)>=0.8;
}
function closeVillageLookup(){ const w=document.getElementById('villageWrap'); if(w) w.remove(); }
function openVillageLookup(prefill, opts){
  window._vlOpts=opts||{}; closeVillageLookup();
  const w=document.createElement('div'); w.id='villageWrap'; w.className='gateWrap vlWrap';
  w.innerHTML=`<div class="gateBox"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><h3 style="margin:0;">🏘 Village Check</h3><button class="btn btn-sm btn-ghost" onclick="closeVillageLookup()">✕ Close</button></div>
    <p class="helpText" style="margin:4px 0 10px;">Ask the customer which village they are from, then see who in your records comes from there — useful as a background / identity check before you proceed.</p>
    <div class="grid grid-2"><div class="field"><label>Village / Locality</label><input id="vlVillage" list="vlVillageList" placeholder="e.g. Sarwan" value="${escH(prefill||'')}" oninput="vlRender()"><datalist id="vlVillageList">${knownVillages().map(v=>`<option value="${escH(v.name)}">`).join('')}</datalist></div>
    <div class="field"><label>Name / reference to verify <span class="helpText">(optional)</span></label><input id="vlName" placeholder="A name the customer mentions" oninput="vlRender()"></div></div>
    <div id="vlResults" style="margin-top:10px;"></div></div>`;
  document.body.appendChild(w); vlRender();
}
function vlLinkScore(c, who){
  if(!who) return 0; const nw=normName(who); if(!nw) return 0;
  const hay=normName([c.referredBy,c.familyLink,c.notes,c.tags,(c.aliases||[]).join(' ')].join(' '));
  let s=0; if(nameSimilarity(c.name,who)>=0.75) s+=2;
  if(hay.includes(nw)) s+=3; else if(nw.split(' ').some(t=>t.length>=4 && hay.includes(t))) s+=1;
  return s;
}
function vlRender(){
  const box=document.getElementById('vlResults'); if(!box) return;
  const q=(document.getElementById('vlVillage').value||'').trim(), who=(document.getElementById('vlName').value||'').trim();
  if(!q){
    const vs=knownVillages();
    box.innerHTML = vs.length ? `<div class="helpText">Villages in your records — tap one:</div><div class="chipRow">${vs.map(v=>`<span class="chipBtn" onclick="document.getElementById('vlVillage').value='${escH(v.name).replace(/'/g,'&#39;')}';vlRender()">${escH(v.name)} <b>${v.count}</b></span>`).join('')}</div>`
      : `<div class="empty"><div class="big">🏘</div>No villages saved yet. Add a village to customers (Edit Profile, or the Village field in the Girvi form) and they will show up here.</div>`;
    return;
  }
  const idx=buildCustIndex();
  let list=liveCustomers().filter(c=>villageMatches(q,c.village)).map(c=>({c, src:'own', k:custIdx(idx,c.id)}))
    .concat((DB.refDirectory||[]).filter(c=>villageMatches(q,c.village)).map(c=>({c, src:'dir', k:null})));
  list.forEach(e=>{ e.link=vlLinkScore(e.c, who); e.txn=e.k?(e.k.sales+e.k.buying+e.k.girviActive+e.k.girviClosed+e.k.credit+e.k.jobs):0; });
  list.sort((a,b)=>(b.link-a.link)||(b.txn-a.txn)||a.c.name.localeCompare(b.c.name));
  window._vlList=list;
  const pick=window._vlOpts&&window._vlOpts.onPick;
  const own=list.filter(e=>e.src==='own').length, dir=list.length-own;
  let html=`<div class="helpText" style="margin-bottom:4px;"><b>${own}</b> customer(s) in your records from “${escH(q)}”${dir?` • <b>${dir}</b> from other stores' directories`:''}${who?` • matching “${escH(who)}”`:''}</div>`;
  if(!list.length) html+=`<div class="empty"><div class="big">🔍</div>Nobody from this village in your records yet.<br><span class="helpText">That is information too — treat this customer as new and verify identity carefully.</span></div>`;
  list.slice(0,40).forEach((e,i)=>{
    const c=e.c, k=e.k;
    const phones=[c.phone].concat(c.altPhones||[]).filter(Boolean).join(' • ');
    let bal=0; if(e.src==='own') bal=customerBalance(c.id);

      <div><b>${escH(c.name)}</b> ${e.link>=2?'<span class="tag tag-gold">🔗 Possible link</span>':''} ${e.src==='dir'?`<span class="tag tag-gray">📦 ${escH(c._store||'other store')}</span>`:''}</div>
      <div>📞 ${phones?escH(phones):'<span class="helpText">no phone</span>'} <span class="helpText">• 🏘 ${escH(c.village||'')}</span></div>
      ${(c.referredBy||c.familyLink)?`<div class="helpText">${c.referredBy?'🤝 Referred by '+escH(c.referredBy)+' ':''}${c.familyLink?'👪 '+escH(c.familyLink):''}</div>`:''}
      ${c.notes?`<div class="helpText">📝 ${escH(String(c.notes).slice(0,140))}</div>`:''}
      ${k?`<div class="helpText">Customer since ${k.first?fmtDate(k.first):'—'} • ${e.txn} transaction(s)${k.girviClosed?' • '+k.girviClosed+' closed girvi':''}${k.girviActive?' • '+k.girviActive+' active girvi':''} • ${bal>0?'<b style="color:var(--danger)">credit due '+fmtMoney(bal)+'</b>':'no dues'}</div>`:`<div class="helpText">${c.since?'Customer since '+fmtDate(c.since):''}</div>`}
    </div><div style="display:flex;flex-direction:column;gap:6px;">${e.src==='own'?`<button class="btn btn-sm btn-outline" onclick="closeVillageLookup();viewCustomerLedger('${c.id}')">Open profile</button>`:''}${pick?`<button class="btn btn-sm btn-primary" onclick="vlPick(${i})">Use as reference</button>`:''}</div></div>`;
  });
  box.innerHTML=html;
}
function vlPick(i){
  const e=(window._vlList||[])[i]; if(!e) return;

/* ---- export / import a customer directory (so a second store can look up your customers) ---- */
async function exportCustomerDirectory(){
  const withPhotos=!!(document.getElementById('dirPhotos')||{}).checked;
  const store=DB.meta.storeName||'Main Store';
  toast('Preparing directory…');
  const rows=[];
  for(const c of liveCustomers()){
    const r={id:c.id, name:c.name, phone:c.phone||'', altPhones:c.altPhones||[], village:c.village||'', address:c.address||'', referredBy:c.referredBy||'', familyLink:c.familyLink||'', notes:c.notes||'', tags:c.tags||'', aliases:c.aliases||[], since:(c.createdAt||'').slice(0,10)};
    if(withPhotos){ const p=customerMainPhoto(c); if(p) r.photo=await new Promise(res=>makeThumb(p,120,0.6,res)); }
    rows.push(r);
  }
  const payload={format:'gj-customer-directory', version:1, store, exportedAt:nowISO(), count:rows.length, customers:rows};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='customer-directory-'+store.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  logHistory('Settings','Directory exported', rows.length+' customers exported from '+store);
  saveDB(); toast('Directory downloaded — '+rows.length+' customers');
}
function importCustomerDirectory(e){
  const file=(e.target.files||[])[0]; e.target.value=''; if(!file) return;
  const fr=new FileReader();
  fr.onload=()=>{
    let p; try{ p=JSON.parse(fr.result); }catch(err){ toast('That file is not a valid directory file'); return; }
    if(!p || p.format!=='gj-customer-directory' || !Array.isArray(p.customers)){ toast('That file is not a customer directory export'); return; }
    const store=String(p.store||'Other Store');
    if(store===(DB.meta.storeName||'Main Store')){ if(!confirm('This directory comes from a store named “'+store+'”, the same name as this store. Import anyway? (Tip: give each store its own name in Settings.)')) return; }
    const before=(DB.refDirectory||[]).length;
    const rest=(DB.refDirectory||[]).filter(x=>x._store!==store);
    const add=p.customers.map(c=>Object.assign({}, c, {_store:store, _importedAt:nowISO()}));
    DB.refDirectory=rest.concat(add);
    logHistory('Settings','Directory imported', add.length+' customers from '+store);
    saveDB(); toast('Imported '+add.length+' customers from '+store); if(currentPage==='settings') renderSettings();
  };
  fr.readAsText(file);
}
function removeDirectory(store){
  confirmAction('Remove the imported directory “'+store+'”? This only removes the reference copy used for village checks — none of your own customers are touched.', ()=>{
    DB.refDirectory=(DB.refDirectory||[]).filter(x=>x._store!==store);
    logHistory('Settings','Directory removed','Imported directory '+store+' removed'); saveDB(); renderSettings(); toast('Directory removed');
  });
}

        <option value="due">Due / Credit</option>
        <option value="void">Void</option>
      </select>

  </div>`;

  filterSalesTable();
}
function filterSalesTable(){
  const q = (document.getElementById('saleSearch')?.value||'').toLowerCase();
  const sortBy = document.getElementById('saleSort')?.value||'date_desc';
  const statusF = document.getElementById('saleStatusFilter')?.value||'';
  let rows = [...DB.sales].filter(s=>!s.deleted);
  if(q) rows = rows.filter(s => s.billNo.toLowerCase().includes(q) || s.customerName.toLowerCase().includes(q) || s.items.some(i=>i.itemName.toLowerCase().includes(q)) || String(s.grandTotal).includes(q));
  if(statusF==='paid') rows = rows.filter(s=>!s.void && s.grandTotal-s.amountPaid<=0);
  else if(statusF==='due') rows = rows.filter(s=>!s.void && s.grandTotal-s.amountPaid>0);
  else if(statusF==='void') rows = rows.filter(s=>s.void);
  const sorters = {
    date_desc: (a,b)=> b.date.localeCompare(a.date) || b.createdAt.localeCompare(a.createdAt),
    date_asc: (a,b)=> a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt),
    amount_desc: (a,b)=> b.grandTotal-a.grandTotal,
    amount_asc: (a,b)=> a.grandTotal-b.grandTotal,
    customer: (a,b)=> a.customerName.localeCompare(b.customerName),
    balance_desc: (a,b)=> (b.grandTotal-b.amountPaid)-(a.grandTotal-a.amountPaid)
  };
  rows.sort(sorters[sortBy]||sorters.date_desc);
  let html = `<table><tr><th>Date</th><th>Bill No</th><th>Customer</th><th>Item(s)</th><th>Weight</th><th>Total</th><th>Paid</th><th>Balance</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="10"><div class="empty"><div class="big">🧾</div>No sales match.</div></td></tr>`;
  rows.forEach(s=>{
    const wt = s.items.reduce((a,i)=>a+Number(i.weight||0),0);
    const itemNames = s.items.map(i=>i.itemName).filter(Boolean).join(', ');
    html += `<tr>
      <td>${fmtDate(s.date)}</td><td>${s.billNo}</td><td>${custCell(s)}</td>
      <td style="max-width:180px;">${itemNames||'-'}</td><td>${fmtWt(wt)}</td>
      <td>${fmtMoney(s.grandTotal)}</td><td>${fmtMoney(s.amountPaid)}</td><td>${fmtMoney(s.grandTotal-s.amountPaid)}</td>
      <td>${s.void?'<span class="tag tag-red">VOID</span>':(s.grandTotal-s.amountPaid<=0?'<span class="tag tag-green">Paid</span>':'<span class="tag tag-gold">Due</span>')}</td>
      <td><button class="btn btn-sm btn-ghost" onclick="viewSale('${s.id}')">View</button></td>
    </tr>`;
  });
  html += `</table>`;
  document.getElementById('salesTableWrap').innerHTML = html;
}
function deleteSale(id){
  const s = DB.sales.find(x=>x.id===id); if(!s) return;

    releaseInventoryForSale(s);

function recalcSaleTotals(){
  let sub=0, wt=0, pureWt=0;
  saleDraftItems.forEach(it=>{
    if(it.itemType==='custom_rupee'){
      sub += saleItemAmount(it);
      return;
    }
    const purity = (it.purity===undefined||it.purity==='') ? 100 : Number(it.purity);
    const pw = (Number(it.weight)||0) * (purity/100);
    pureWt += pw; wt += Number(it.weight||0);
    sub += saleItemAmount(it);
  });
  const discount = parseFloat(document.getElementById('saleDiscount')?.value)||0;
  const grand = Math.max(sub-discount,0);
  const pct = sub>0 ? (discount/sub*100) : 0;
  document.getElementById('saleTotalsBox').innerHTML = `
    <div class="totalsRow"><span>Total Weight</span><span>${fmtWt(wt)}</span></div>
    <div class="totalsRow"><span>Pure Weight (by purity)</span><span>${fmtWt(pureWt)}</span></div>
    <div class="totalsRow"><span>Subtotal</span><span>${fmtMoney(sub)}</span></div>
    <div class="totalsRow"><span>${T('discount')}</span><span>- ${fmtMoney(discount)}</span></div>
    <div class="totalsRow grand"><span>Grand Total</span><span>${fmtMoney(grand)}</span></div>`;
  const note = document.getElementById('saleApprovalNote');
  if(note){
    if(pct > DB.meta.discountApprovalThresholdPct){
      note.innerHTML = `<div class="approveBox">⚠️ Discount is ${pct.toFixed(1)}%, above the ${DB.meta.discountApprovalThresholdPct}% limit. Owner approval will be required to save this bill.</div>`;
    } else note.innerHTML='';
  }
}
/* Keeps a sale's auto-generated credit entry in sync with its current
   balance — used on create, edit, and void. Never creates duplicates:
   any previous auto-entry for this sale is soft-removed first. Also
   auto-enables the customer for the Credit module, since a part/full
   credit sale is a clear signal they should be visible there. */
function syncSaleCreditEntry(sale, cust){
  DB.creditEntries.filter(e=>e.linkedSaleId===sale.id && !e.deleted).forEach(e=>{ e.deleted=true; });
  const balance = sale.grandTotal - sale.amountPaid;
  if(balance > 0.004){
    const itemNames = (sale.items||[]).map(i=>i.itemName).filter(Boolean).join(', ');
    DB.creditEntries.push({
      id:uid('CR'), customerId:cust.id, date:sale.date, dueDate:'', type:'debit', amount:balance,
      description: (itemNames?itemNames+' — ':'')+'Sale '+sale.billNo, createdAt: nowISO(), linkedSaleId: sale.id, deleted:false
    });
    if(!cust.creditEnabled){
      cust.creditEnabled = true;
      logHistory('Customer','Credit Enabled', cust.name+' auto-marked as credit customer (sale on credit)');
    }
  }
}
function saveSale(){
  const custName = document.getElementById('saleCustomer').value.trim();
  if(!custName){ toast('Please enter customer name'); return; }
  if(saleDraftItems.length===0 || saleDraftItems.every(i=>!i.itemName)){ toast('Add at least one item'); return; }
  if(!customerGate('saleCustomer','salePhone', saveSale)) return;
  const custSel = readCustomerSel('saleCustomer','salePhone');
  const phone = document.getElementById('salePhone').value.trim();
  const discount = parseFloat(document.getElementById('saleDiscount').value)||0;
  const payMode = document.getElementById('salePayMode').value;
  const saleDate = document.getElementById('saleDate').value || todayStr();
  const manualPaid = document.getElementById('saleAmountPaid').value;
  let sub=0; saleDraftItems.forEach(it=>{ sub += saleItemAmount(it); });
  const pct = sub>0 ? (discount/sub*100):0;

  const finalize = ()=>{
    const cust = resolveCustomerFrom(custSel);
    const grand = Math.max(sub-discount,0);
    const amountPaid = manualPaid!=='' ? (parseFloat(manualPaid)||0) : ((payMode==='Full Credit') ? 0 : grand);
    const cleanItems = saleDraftItems.filter(i=>i.itemName).map(i=>({...i, purity:(i.purity===undefined||i.purity==='')?100:Number(i.purity)}));
    if(editingSaleId){
      const s = DB.sales.find(x=>x.id===editingSaleId);
      // Release any inventory items that were linked to this sale before, so relinking is clean
      DB.inventory.filter(inv=>inv.linkedSaleId===s.id).forEach(inv=>{
        inv.status='available'; inv.linkedSaleId=null; inv.soldDate=null;
        logInventoryMovement(inv.id, 'Sold → Available', {toLocation:inv.location||'Showcase', reference:s.billNo, notes:'Unlinked before re-saving edited bill'});
      });
      s.customerId=cust.id; s.customerName=cust.name; s.date=saleDate; s.items=cleanItems;
      s.subTotal=sub; s.discount=discount; s.discountPct=pct; s.grandTotal=grand; s.paymentMode=payMode; s.amountPaid=amountPaid;
      applyInventoryDeduction(s);
      syncSaleCreditEntry(s, cust);
      logHistory('Sales','Edited', `Bill ${s.billNo} edited for ${cust.name} — new total ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale updated: '+s.billNo); renderSales();
    } else {
      const sale = {
        id: uid('SAL'), billNo: 'INV-'+(DB.sales.length+1001), date: saleDate, createdAt: nowISO(),
        customerId: cust.id, customerName: cust.name, items: cleanItems,
        subTotal: sub, discount, discountPct: pct, grandTotal: grand, paymentMode: payMode, amountPaid, void:false
      };
      DB.sales.push(sale);
      applyInventoryDeduction(sale);
      syncSaleCreditEntry(sale, cust);
      logHistory('Sales','Created', `Bill ${sale.billNo} for ${cust.name} — ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale saved: '+sale.billNo); renderSales();
    }
  };

  if(pct > DB.meta.discountApprovalThresholdPct){
    askOwnerApproval(`This bill has a discount of ${pct.toFixed(1)}%, above the allowed ${DB.meta.discountApprovalThresholdPct}%. Owner PIN is required to proceed.`, ()=>finalize());
  } else finalize();
}
/* Deducts the ACTUAL sold weight (and 1 piece) from a linked inventory lot —
   not the whole lot. Stores the exact amount deducted on the sale item itself
   so voiding/deleting/editing the sale can restore precisely, never guessing. */
function applyInventoryDeduction(sale){
  sale.items.forEach(it=>{
    if(!it.linkedInventoryId) return;
    const inv = DB.inventory.find(x=>x.id===it.linkedInventoryId && !x.deleted);
    if(!inv){ it.linkedInvDeductedWeight=0; it.linkedInvDeductedPieces=0; return; }
    const soldWeight = Number(it.weight)||0;
    const availableWeight = Number(inv.weight)||0;
    const availableQty = Number(inv.qty)||0;
    const insufficientWeight = soldWeight > availableWeight;
    const insufficientQty = availableQty <= 0;
    const deductWeight = Math.min(soldWeight, availableWeight); // never allow negative stock
    const deductPieces = insufficientQty ? 0 : 1;
    const oldLoc = inv.location;
    inv.weight = Math.max(availableWeight - deductWeight, 0);
    inv.qty = Math.max(availableQty - deductPieces, 0);
    it.linkedInvDeductedWeight = deductWeight;
    it.linkedInvDeductedPieces = deductPieces;
    const exhausted = inv.weight<=0 || inv.qty<=0;
    if(exhausted){ inv.status='sold'; inv.soldDate=sale.date; }
    inv.linkedSaleId = sale.id;
    const warn = (insufficientWeight||insufficientQty) ? ' ⚠️ Recorded stock was insufficient for this sale — clamped to zero, please physically recount this lot.' : '';
    logInventoryMovement(inv.id, exhausted?'Sold — lot exhausted':'Sold (partial from lot)', {fromLocation:oldLoc, toLocation: exhausted?'Customer':oldLoc, weightChange:-deductWeight, reference:sale.billNo, notes:`${fmtWt(deductWeight)} / ${deductPieces} pc sold via bill ${sale.billNo}. Remaining: ${fmtWt(inv.weight)}, ${inv.qty} pc(s).${warn}`});
    logHistory('Inventory', insufficientWeight||insufficientQty?'Sold — Stock Warning':'Sold', `${inv.itemName} (${inv.code}): ${fmtWt(deductWeight)} sold via bill ${sale.billNo}. Remaining ${fmtWt(inv.weight)} / ${inv.qty} pc(s).${warn}`);
    if(insufficientWeight||insufficientQty) toast('⚠️ Stock for '+inv.itemName+' was insufficient — reduced to zero. Please recount.');
  });
}
/* Reverses exactly what applyInventoryDeduction did for this sale's items —
   restores the precise weight/pieces that were deducted, not a guess. Used
   when a bill is voided, deleted, or edited (edits release-then-reapply). */
function releaseInventoryForSale(sale){
  sale.items.forEach(it=>{
    if(!it.linkedInventoryId) return;
    const inv = DB.inventory.find(x=>x.id===it.linkedInventoryId && !x.deleted);
    if(!inv) return;
    const restoreWeight = Number(it.linkedInvDeductedWeight||0);
    const restorePieces = Number(it.linkedInvDeductedPieces||0);
    if(restoreWeight<=0 && restorePieces<=0) return;
    const wasExhausted = inv.status==='sold';
    inv.weight = (Number(inv.weight)||0) + restoreWeight;
    inv.qty = (Number(inv.qty)||0) + restorePieces;
    if(wasExhausted && (inv.weight>0 || inv.qty>0)){ inv.status='available'; inv.soldDate=null; }
    inv.linkedSaleId = null;
    logInventoryMovement(inv.id, 'Sale voided/edited — stock restored', {fromLocation:'Customer', toLocation:inv.location||'Showcase', weightChange:restoreWeight, reference:sale.billNo, notes:`${fmtWt(restoreWeight)} / ${restorePieces} pc(s) restored — bill ${sale.billNo} voided, deleted, or re-edited.`});
    logHistory('Inventory','Returned to Stock', `${inv.itemName} (${inv.code}): ${fmtWt(restoreWeight)} / ${restorePieces} pc(s) restored — bill ${sale.billNo} voided/deleted/edited.`);
    it.linkedInvDeductedWeight = 0; it.linkedInvDeductedPieces = 0; // prevent double-restore
  });
}
function viewSale(id){

  let body = `<div class="grid grid-2" style="margin-bottom:14px;">

function numberToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'Zero Rupees Only';
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n){ if(n<20) return ones[n]; return tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:''); }
  function threeDigit(n){ if(n<100) return twoDigit(n); return ones[Math.floor(n/100)]+' Hundred'+(n%100?' '+twoDigit(n%100):''); }
  let n = num, parts=[];
  const crore=Math.floor(n/10000000); n%=10000000;
  const lakh=Math.floor(n/100000); n%=100000;
  const thousand=Math.floor(n/1000); n%=1000;
  const rest=n;
  if(crore) parts.push(threeDigit(crore)+' Crore');
  if(lakh) parts.push(threeDigit(lakh)+' Lakh');
  if(thousand) parts.push(threeDigit(thousand)+' Thousand');
  if(rest) parts.push(threeDigit(rest));
  return (parts.join(' ')||'Zero')+' Rupees Only';
}

/* =====================================================================
   MINIMAL PDF GENERATOR — pure vanilla JS, no external library, so it
   works fully offline. Produces a valid multi-page PDF from plain text
   lines using the built-in Helvetica base font. Note: PDF base fonts
   only support Latin-1 text, so ₹ is rendered as "Rs" and any Hindi/
   non-Latin characters are shown as "?" in the PDF specifically
   (print and on-screen Rupee/Hindi text elsewhere are unaffected).
===================================================================== */
function escapePdfText(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function toPdfSafeText(s){ return String(s).replace(/₹/g,'Rs ').replace(/[^\x00-\xFF]/g,'?'); }
/* ---------------------------------------------------------------------
   RICH PDF DRAWING ENGINE — absolute-position text + filled rectangles
   + accurate text width (real Helvetica AFM widths), so PDFs can match
   the app's actual maroon/gold visual design instead of plain text.
--------------------------------------------------------------------- */
const HELV_WIDTHS = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
  556,556,556,556,556,556,556,556,556,556,
  278,278,584,584,584,556,1015,
  667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
  278,278,278,469,556,333,
  556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
  334,260,334,584];
function pdfTextWidth(text, size){
  let w=0;
  for(const ch of String(text)){
    const code = ch.charCodeAt(0);
    w += (code>=32 && code<=126) ? HELV_WIDTHS[code-32] : 556;
  }
  return w*size/1000;
}
function pdfColor(hex){
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  return [r,g,b];
}
function PdfPage(){
  this.ops = [];
}
PdfPage.prototype.rect = function(x,y,w,h,colorHex){
  const [r,g,b]=pdfColor(colorHex);
  this.ops.push(`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg\n${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re f\n`);
};
PdfPage.prototype.strokeRect = function(x,y,w,h,colorHex,lineWidth){
  const [r,g,b]=pdfColor(colorHex);
  this.ops.push(`${lineWidth||1} w\n${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} RG\n${x.toFixed(1)} ${y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)} re S\n`);
};
PdfPage.prototype.line = function(x1,y1,x2,y2,colorHex,lineWidth){
  const [r,g,b]=pdfColor(colorHex||'#000000');
  this.ops.push(`${lineWidth||1} w\n${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} RG\n${x1.toFixed(1)} ${y1.toFixed(1)} m ${x2.toFixed(1)} ${y2.toFixed(1)} l S\n`);
};
PdfPage.prototype.text = function(x,y,str,opts){
  opts = opts||{};
  const size = opts.size||10;
  const safe = toPdfSafeText(str);
  const font = opts.bold ? '/F2' : (opts.italic ? '/F3' : '/F1');
  const w = pdfTextWidth(safe, size);
  let tx = x;
  if(opts.align==='right') tx = x-w; else if(opts.align==='center') tx = x-w/2;
  const [r,g,b]=pdfColor(opts.colorHex||'#000000');
  this.ops.push(`${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} rg\nBT ${font} ${size} Tf ${tx.toFixed(1)} ${y.toFixed(1)} Td (${escapePdfText(safe)}) Tj ET\n`);
  return w;
};
PdfPage.prototype.stream = function(){ return this.ops.join(''); };
function assemblePdfFromPages(pages){
  const pageWidth=595, pageHeight=842;
  const catalogNum=1, pagesNum=2, fontRegNum=3, fontBoldNum=4, fontItalicNum=5;
  let nextObjNum=6;
  const pageObjNums=[], contentObjNums=[], contentStrings=[];
  pages.forEach(pb=>{
    const contentNum=nextObjNum++; contentObjNums.push(contentNum);
    const pageNum=nextObjNum++; pageObjNums.push(pageNum);
    contentStrings.push(pb.stream());
  });
  const objMap = {};
  objMap[catalogNum] = `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`;
  objMap[pagesNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageObjNums.length} >>`;
  objMap[fontRegNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objMap[fontBoldNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;
  objMap[fontItalicNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique >>`;
  pageObjNums.forEach((pageNum,idx)=>{
    objMap[pageNum] = `<< /Type /Page /Parent ${pagesNum} 0 R /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R /F3 ${fontItalicNum} 0 R >> >> /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Contents ${contentObjNums[idx]} 0 R >>`;
  });
  contentObjNums.forEach((contentNum,idx)=>{
    const stream = contentStrings[idx];
    objMap[contentNum] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  const maxObjNum = nextObjNum-1;
  let pdf = '%PDF-1.4\n';
  const offsets = {};
  for(let n=1;n<=maxObjNum;n++){ offsets[n]=pdf.length; pdf += `${n} 0 obj\n${objMap[n]}\nendobj\n`; }
  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${maxObjNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxObjNum;n++){ pdf += String(offsets[n]).padStart(10,'0')+' 00000 n \n'; }
  pdf += `trailer\n<< /Size ${maxObjNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}

function buildPdfBytes(lineObjs){
  const pageWidth=595, pageHeight=842, marginX=50, topY=800, bottomY=50, defaultSize=10, defaultLeading=14;
  const laidOutPages = [];
  let y = topY, current = [];
  lineObjs.forEach(lo=>{
    const size = lo.size || defaultSize;
    const leading = lo.leading || (lo.big ? size+8 : defaultLeading);
    if(y - leading < bottomY){ laidOutPages.push(current); current=[]; y=topY; }
    current.push(Object.assign({}, lo, {y, size}));
    y -= leading;
  });
  laidOutPages.push(current);
  if(laidOutPages.length===0) laidOutPages.push([]);
  const catalogNum=1, pagesNum=2, fontRegNum=3, fontBoldNum=4;
  let nextObjNum=5;
  const pageObjNums=[], contentObjNums=[], contentStrings=[];
  laidOutPages.forEach(pageLines=>{
    const contentNum=nextObjNum++; contentObjNums.push(contentNum);
    const pageNum=nextObjNum++; pageObjNums.push(pageNum);
    let stream = '';
    pageLines.forEach(lo=>{
      if(lo.rule){
        stream += `${marginX} ${lo.y+4} m ${pageWidth-marginX} ${lo.y+4} l S\n`;
      } else if(lo.text!==undefined && lo.text!==null){
        const font = lo.bold ? '/F2' : '/F1';
        const x = lo.right ? (pageWidth-marginX-(lo.text.length*lo.size*0.52)) : marginX;
        stream += `BT ${font} ${lo.size} Tf ${x.toFixed(1)} ${lo.y} Td (${escapePdfText(lo.text)}) Tj ET\n`;
      }
    });
    contentStrings.push(stream);
  });
  const objMap = {};
  objMap[catalogNum] = `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`;
  objMap[pagesNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageObjNums.length} >>`;
  objMap[fontRegNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objMap[fontBoldNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;
  pageObjNums.forEach((pageNum,idx)=>{
    objMap[pageNum] = `<< /Type /Page /Parent ${pagesNum} 0 R /Resources << /Font << /F1 ${fontRegNum} 0 R /F2 ${fontBoldNum} 0 R >> >> /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Contents ${contentObjNums[idx]} 0 R >>`;
  });
  contentObjNums.forEach((contentNum,idx)=>{
    const stream = contentStrings[idx];
    objMap[contentNum] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
  });
  const maxObjNum = nextObjNum-1;
  let pdf = '%PDF-1.4\n';
  const offsets = {};
  for(let n=1;n<=maxObjNum;n++){ offsets[n]=pdf.length; pdf += `${n} 0 obj\n${objMap[n]}\nendobj\n`; }
  const xrefOffset = pdf.length;
  pdf += `xref\n0 ${maxObjNum+1}\n0000000000 65535 f \n`;
  for(let n=1;n<=maxObjNum;n++){ pdf += String(offsets[n]).padStart(10,'0')+' 00000 n \n'; }
  pdf += `trailer\n<< /Size ${maxObjNum+1} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`;
  const bytes = new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
  return bytes;
}
/* Convenience: turn a flat array of plain strings into simple line objects
   (kept for any caller that still wants plain text-only PDFs). */
function pdfBlobFromLines(rawLines){
  const lineObjs = rawLines.map(l=>({text: toPdfSafeText(l)}));
  const bytes = buildPdfBytes(lineObjs);
  return new Blob([bytes], {type:'application/pdf'});
}
function pdfBlobFromLayout(lineObjs){
  const safe = lineObjs.map(lo=> lo.rule ? lo : Object.assign({}, lo, {text: lo.text!==undefined ? toPdfSafeText(lo.text) : lo.text}));
  const bytes = buildPdfBytes(safe);
  return new Blob([bytes], {type:'application/pdf'});
}
async function sharePdfBlob(blob, filename, title){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title});
      toast('PDF shared'); return;
    }
  }catch(err){ if(err.name==='AbortError') return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('PDF downloaded — attach it manually in WhatsApp or any app');
}

function buildBillText(s){
  const m = DB.meta;
  const cust = DB.customers.find(c=>c.id===s.customerId);
  let lines = [];
  lines.push(`*${m.shopName}*`);
  lines.push(m.location);
  if(m.gstin) lines.push(`GSTIN: ${m.gstin}`);
  lines.push('');
  lines.push(`Bill No: *${s.billNo}*`);
  lines.push(`Date: ${new Date(s.createdAt||s.date).toLocaleString('en-IN')}`);
  lines.push(`Customer: ${s.customerName}${cust&&cust.phone?' ('+cust.phone+')':''}`);
  lines.push('');
  lines.push('Items:');
  s.items.forEach(i=>{
    if(i.itemType==='custom_rupee'){
      lines.push(`• ${i.itemName} (Custom Item) — Qty ${i.qty} × ${fmtMoney(i.pricePerPiece)} — ${fmtMoney(saleItemAmount(i))}`);
      return;
    }
    const purity=(i.purity===undefined||i.purity==='')?100:i.purity;
    const pw=(i.weight||0)*(purity/100);
    const amt=pw*(i.rate||0)+Number(i.making||0);
    lines.push(`• ${i.itemName} — ${i.weight}g @ ${purity}% — ${fmtMoney(amt)}`);
  });
  lines.push('');
  lines.push(`Subtotal: ${fmtMoney(s.subTotal)}`);
  lines.push(`Discount: -${fmtMoney(s.discount)}`);
  lines.push(`*Total: ${fmtMoney(s.grandTotal)}*`);
  lines.push(`Paid (${s.paymentMode}): ${fmtMoney(s.amountPaid)}`);
  lines.push(`Balance: ${fmtMoney(s.grandTotal-s.amountPaid)}`);
  lines.push('');
  lines.push('Thank you for your business!');
  return lines.join('\n');
}
async function shareBill(saleId){
  const s = DB.sales.find(x=>x.id===saleId); if(!s) return;
  const text = buildBillText(s);
  logHistory('Sales','Shared', `Bill ${s.billNo} shared`);
  saveDB();
  if(navigator.share){
    try{
      await navigator.share({ title: 'Bill '+s.billNo, text });
      toast('Bill shared');
    }catch(err){
      if(err.name!=='AbortError') copyBillToClipboard(text);
    }
  } else {
    copyBillToClipboard(text);
  }
}
function copyBillToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('Bill copied — paste it into WhatsApp or any app');
    }).catch(()=>{
      toast('Could not share or copy — try Print instead');
    });
  } else {
    toast('Sharing not supported on this browser — try Print instead');
  }
}

function deleteBuy(id){
  const b = DB.buying.find(x=>x.id===id); if(!b) return;

    b.deleted = true;

let buyDraftItems = [];
function buyItemAmount(it){
  const purity = (it.purity===undefined||it.purity==='') ? 100 : Number(it.purity);
  const pw = (Number(it.weight)||0) * (purity/100);
  return (pw*(Number(it.rate)||0)) + Number(it.making||0) + Number(it.labour||0);
}
function addBuyItemRow(){
  buyDraftItems.push({itemDesc:'', metal:'Silver', weight:0, purity:100, rate: DB.currentRates.silverKg/1000, making:0, labour:0});

}
function removeBuyItemRow(i){ buyDraftItems.splice(i,1); renderBuyItemRows(); recalcBuyTotals(); }
function setBuyItemMetal(i, metal){

function recalcBuyTotals(){

function openBuyForm(id){

  `;
  openModal(id?'Edit Purchase':T('newPurchase'), body, [

function saveBuy(){
  const name = document.getElementById('buyCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(buyDraftItems.length===0 || buyDraftItems.every(i=>!i.itemDesc)){ toast('Add at least one item'); return; }
  if(!customerGate('buyCustomer','buyPhone', saveBuy)) return;
  const cust = resolveCustomer('buyCustomer','buyPhone');
  const date = document.getElementById('buyDate').value || todayStr();
  const payMode = document.getElementById('buyPayMode').value;
  const items = buyDraftItems.filter(i=>i.itemDesc).map(i=>({...i, amount: buyItemAmount(i)}));
  const totalWeight = items.reduce((a,i)=>a+(Number(i.weight)||0),0);
  const totalAmount = items.reduce((a,i)=>a+i.amount,0);
  const totalMaking = items.reduce((a,i)=>a+(Number(i.making)||0),0);
  const totalLabour = items.reduce((a,i)=>a+(Number(i.labour)||0),0);
  const metals = [...new Set(items.map(i=>i.metal))];
  const aggregate = {
    itemDesc: items.map(i=>i.itemDesc).join(', '),
    metal: metals.length===1 ? metals[0] : 'Mixed',
    purity: items.length===1 ? items[0].purity : '',
    weight: totalWeight,
    rateApplied: items.length===1 ? items[0].rate : 0,
    amount: totalAmount, making: totalMaking, labour: totalLabour
  };
  if(editingBuyId){
    const b = DB.buying.find(x=>x.id===editingBuyId);
    b.customerId=cust.id; b.customerName=cust.name; b.date=date; b.paymentMode=payMode;
    b.items = items; Object.assign(b, aggregate);
    logHistory('Buying','Edited', `Purchase from ${cust.name} edited — ${items.length} item(s), ${fmtMoney(b.amount)}`);
    saveDB(); closeModal(); toast('Purchase updated'); renderBuying();
  } else {
    const b = { id: uid('BUY'), date, createdAt: nowISO(), customerId:cust.id, customerName:cust.name, paymentMode:payMode, items, ...aggregate };
    DB.buying.push(b);
    logHistory('Buying','Created', `Bought ${items.length} item(s) from ${cust.name} — ${fmtMoney(b.amount)}`);
    saveDB(); closeModal(); toast('Purchase saved'); renderBuying();
  }
}

/* ---- vault bag colour ---- */
const BAG_CSS = {red:'#C62828',blue:'#1565C0',green:'#2E7D32',yellow:'#F9C20A',black:'#212121',white:'#FFFFFF',orange:'#EF6C00',pink:'#EC407A',purple:'#6A1B9A',brown:'#6D4C41',grey:'#757575',gray:'#757575',maroon:'#800000',gold:'#D4A017',golden:'#D4A017',silver:'#B0B0B0',sky:'#29B6F6',cream:'#F5E6C8',lal:'#C62828',neela:'#1565C0',hara:'#2E7D32',peela:'#F9C20A',kala:'#212121',safed:'#FFFFFF',gulabi:'#EC407A'};
function bagCss(name){
  const n=String(name||'').trim().toLowerCase().replace(/\s*bag\s*$/,'').trim(); if(!n) return null;
  if(BAG_CSS[n]) return BAG_CSS[n];
  const first=n.split(/\s+/)[0]; if(BAG_CSS[first]) return BAG_CSS[first];
  try{ const st=new Option().style; st.color=n; if(st.color) return n; }catch(e){}
  return '#9E9E9E';
}
function bagChipHTML(name, opt){
  opt=opt||{};
  if(!name) return opt.showNone ? '<span class="helpText">no bag</span>' : '';
  return `<span class="bagChip ${opt.big?'big':''}"><span class="bagDot" style="background:${bagCss(name)};"></span>${escH(name)}</span>`;
}
function bagColorList(){ return (DB.meta.bagColors&&DB.meta.bagColors.length) ? DB.meta.bagColors : ['Red','Blue','Green','Yellow','Black','White','Orange','Pink','Purple']; }
function bagPickerHTML(prefix, current){
  const list=bagColorList(); const cur=(current||'').trim();
  const match=list.find(c=>c.toLowerCase()===cur.toLowerCase());
  const sel = cur ? (match||'__other') : '';
  return `<div class="field"><label>🎒 Vault Bag Colour</label>
    <select id="${prefix}Bag" onchange="bagPickerChange('${prefix}')"><option value="">Not selected</option>${list.map(c=>`<option value="${escH(c)}" ${sel===c?'selected':''}>${escH(c)}</option>`).join('')}<option value="__other" ${sel==='__other'?'selected':''}>Other (type a name)…</option></select>
    <input id="${prefix}BagOther" class="${sel==='__other'?'':'hidden'}" placeholder="Custom bag name / colour" value="${sel==='__other'?escH(cur):''}" oninput="bagHint('${prefix}')" style="margin-top:6px;">
    <div class="helpText" id="${prefix}BagHint" style="margin-top:4px;"></div></div>`;
}
function bagPickerChange(prefix){
  const s=document.getElementById(prefix+'Bag'), o=document.getElementById(prefix+'BagOther'); if(!s||!o) return;
  o.classList.toggle('hidden', s.value!=='__other'); if(s.value==='__other') o.focus(); bagHint(prefix);

function readBag(prefix){
  const s=document.getElementById(prefix+'Bag'); if(!s) return '';
  if(s.value==='__other') return (document.getElementById(prefix+'BagOther').value||'').trim();
  return s.value;
}
function bagItemCount(name, exceptId){
  const n=(name||'').toLowerCase(); if(!n) return 0;
  return DB.girvi.filter(g=>!g.deleted && (g.status==='active'||g.status==='draft') && g.id!==exceptId && (g.bagColor||'').toLowerCase()===n).length;
}
function bagHint(prefix, exceptId){
  const el=document.getElementById(prefix+'BagHint'); if(!el) return;
  const v=readBag(prefix);
  el.innerHTML = v ? `${bagChipHTML(v)} — ${bagItemCount(v, exceptId)} item(s) already recorded in this bag` : '';

function rememberBag(v){
  if(!v) return; DB.meta.lastBagColor=v;
  const list=DB.meta.bagColors=(DB.meta.bagColors&&DB.meta.bagColors.length)?DB.meta.bagColors:bagColorList().slice();
  if(!list.some(c=>c.toLowerCase()===v.toLowerCase())) list.push(v);
}
function bagCounts(){
  const map={}; let none=0;
  DB.girvi.filter(g=>!g.deleted && (g.status==='active'||g.status==='draft')).forEach(g=>{
    const k=(g.bagColor||'').trim(); if(!k){ none++; return; }
    const key=k.toLowerCase(); map[key]=map[key]||{name:k,count:0}; map[key].count++;
  });
  return {list:Object.values(map).sort((a,b)=>b.count-a.count), none};
}
function closureBagBanner(g){

/* ---- Girvi list: ACTIVE loans (and drafts) only — closed loans live in the customer ledger ---- */
function girviIsOverdue(g){ return g.status==='active' && g.dueDate && g.dueDate<todayStr(); }
function refreshGirviContext(){

  const villages=[...new Map(DB.girvi.filter(g=>!g.deleted&&(g.status==='active'||g.status==='draft')).map(g=>customerById(g.customerId)).filter(c=>c&&c.village).map(c=>[normName(c.village),c.village])).values()].sort();

    <div class="statCard" style="border-color:var(--gold)"><div class="lbl">Total Outstanding</div><div class="val" style="font-size:19px;">${fmtMoney(totalOut)}</div><div class="sub">active loans only</div></div>
    <div class="statCard" style="border-color:var(--danger)"><div class="lbl">Overdue</div><div class="val">${od.length}</div></div>
    <div class="statCard" style="border-color:var(--silver-accent)"><div class="lbl">Draft Entries</div><div class="val">${drafts.length}</div></div>
  </div>`;
  html += `<div class="card"><div class="pillTabs" id="girviFilterTabs">${tabs.map(([k,l])=>`<div class="pillTab ${_grFilter===k?'active':''}" data-k="${k}" onclick="setGirviFilter('${k}')">${l}</div>`).join('')}</div>
    <div class="filterBar"><div class="field" style="flex:2;min-width:200px;"><input id="girviSearch" placeholder="🔍 Search name, phone, village, item, bag, amount, date…" oninput="renderGirviTable()"></div>
    <div class="field"><select id="girviVillage" onchange="_grVillage=this.value;renderGirviTable()"><option value="">All villages</option>${villages.map(v=>`<option ${_grVillage===v?'selected':''}>${escH(v)}</option>`).join('')}</select></div></div>
    <div id="girviBagChips" class="chipRow"></div>
    <div id="girviTableWrap"></div>
    <div class="helpText" style="margin-top:10px;">✅ Closed (redeemed / forfeited) loans are not listed here — find them in <a class="cpLink" onclick="goTo('ledger')">Customer Ledger</a>, on the customer's profile.</div></div>`;

function setGirviFilter(k){
  _grFilter=k;
  document.querySelectorAll('#girviFilterTabs .pillTab').forEach(t=>t.classList.toggle('active', t.dataset.k===k));
  renderGirviChips(); renderGirviTable();
}
function setGirviBag(v){ _grBag=v; renderGirviChips(); renderGirviTable(); }
function renderGirviChips(){
  const el=document.getElementById('girviBagChips'); if(!el) return;
  const bc=bagCounts();
  el.innerHTML = `<span class="helpText" style="align-self:center;">🎒 Bags:</span><span class="chipBtn ${_grBag===''?'active':''}" onclick="setGirviBag('')">All bags</span>`
    + bc.list.map(b=>`<span class="chipBtn ${_grBag.toLowerCase()===b.name.toLowerCase()?'active':''}" onclick="setGirviBag('${escH(b.name).replace(/'/g,'&#39;')}')">${bagChipHTML(b.name)} ${b.count}</span>`).join('')
    + (bc.none?`<span class="chipBtn ${_grBag==='__none'?'active':''}" onclick="setGirviBag('__none')">Not selected ${bc.none}</span>`:'');
}
function girviInterestDue(g){
  const months = daysBetween(g.lastInterestDate||g.date) / 30;
  return Math.round((g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount) * (g.interestRatePct/100) * months);
}
function girviStatusTag(g){
  if(g.deleted) return '<span class="tag tag-gray">🗑 Deleted</span>';
  if(g.status==='draft') return '<span class="tag tag-gray">📋 Draft — Pending Details</span>';
  if(g.status==='redeemed') return '<span class="tag tag-green">✅ Redeemed</span>';
  if(g.status==='forfeited') return '<span class="tag tag-gray">⚖️ Forfeited</span>';
  if(g.status==='active'){
    if(g.dueDate && g.dueDate<todayStr()) return '<span class="tag tag-red">⚠️ Overdue</span>';
    return '<span class="tag tag-gold">🔐 Active</span>';
  }
  return `<span class="tag tag-gray">${g.status}</span>`;
}
function renderGirviTable(){
  if(!document.getElementById('girviTableWrap')) return;
  const q = (document.getElementById('girviSearch')?.value||'').trim().toLowerCase();
  let rows = [...DB.girvi].filter(g=>!g.deleted && (g.status==='active'||g.status==='draft')).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if(_grFilter==='active') rows=rows.filter(g=>g.status==='active');
  else if(_grFilter==='overdue') rows=rows.filter(girviIsOverdue);
  else if(_grFilter==='draft') rows=rows.filter(g=>g.status==='draft');
  if(_grBag==='__none') rows=rows.filter(g=>!(g.bagColor||'').trim());
  else if(_grBag) rows=rows.filter(g=>(g.bagColor||'').toLowerCase()===_grBag.toLowerCase());

/* Reusable: compress any uploaded/captured photo to a small JPEG data URL
   so it can never overflow localStorage. Used by Girvi and Customer photos. */
function compressImageFile(file, maxDim, quality, onDone, onError){
  if(!file){ return; }
  if(!file.type || !file.type.startsWith('image/')){ toast('Please choose an image file'); if(onError) onError(); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ onDone(canvas.toDataURL('image/jpeg', quality)); }
      catch(err){ toast('Could not process this photo — try a different one'); if(onError) onError(); }
    };
    img.onerror = function(){ toast('Could not read this photo — try a different one'); if(onError) onError(); };
    img.src = evt.target.result;
  };
  reader.onerror = function(){ toast('Could not read this file'); if(onError) onError(); };
  reader.readAsDataURL(file);
}
/* Re-compress an already-stored dataURL photo down further (used by the
   "Free Up Space" tool). Promise-based sibling of compressImageFile. */
function recompressDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!dataUrl || typeof dataUrl!=='string' || !dataUrl.startsWith('data:image')){ resolve(dataUrl); return; }
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
      catch(err){ reject(err); }
    };
    img.onerror = function(){ reject(new Error('could not decode image')); };
    img.src = dataUrl;
  });
}
function freeUpSpace(){
  confirmAction('This permanently lowers the quality of the stored photos to save space (names and records are not touched). A safety copy is made first. Continue?', freeUpSpaceNow);

async function freeUpSpaceNow(){
  try{ await idbKeyPut(SNAP_PREFIX+'before-photo-shrink', {at:nowISO(), label:'Copy made just before shrinking photos', counts:countsOf(DB), data:JSON.parse(JSON.stringify(DB))}); }catch(e5){}
  toast('Shrinking stored photos…');
  const sizeBefore = new Blob([JSON.stringify(DB)]).size;
  const jobs = [];
  DB.customers.forEach(c=>{
    if(c.photo) jobs.push(recompressDataUrl(c.photo,200,0.5).then(v=>{ c.photo=v; }));
    if(Array.isArray(c.photos) && c.photos.length){
      jobs.push(Promise.all(c.photos.map(p=>recompressDataUrl(p,200,0.5))).then(arr=>{ c.photos=arr; }));
    }
  });
  DB.girvi.forEach(g=>{ if(g.photo) jobs.push(recompressDataUrl(g.photo,200,0.5).then(v=>{ g.photo=v; })); (g.items||[]).forEach(it=>{ if(it.photo) jobs.push(recompressDataUrl(it.photo,200,0.5).then(v=>{ it.photo=v; })); }); (g.photos||[]).forEach(p=>{ if(p.data) jobs.push(recompressDataUrl(p.data,200,0.5).then(v=>{ p.data=v; })); }); });
  DB.inventory.forEach(i=>{
    if(Array.isArray(i.photos) && i.photos.length){
      jobs.push(Promise.all(i.photos.map(p=>recompressDataUrl(p,200,0.5))).then(arr=>{ i.photos=arr; }));
    }
  });
  try{ await Promise.all(jobs); }catch(e){ /* keep whatever succeeded */ }
  const sizeAfter = new Blob([JSON.stringify(DB)]).size;
  const savedKB = Math.max(0, Math.round((sizeBefore-sizeAfter)/1024));
  logHistory('Settings','Free Up Space', `Recompressed all stored photos, freed ~${savedKB} KB`);
  saveDB(); renderStorageHealth();
  toast('Done — freed about '+savedKB+' KB');
}
