<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#450D17;
  --maroon-light:#8C2233;
  --gold:#AD8A3B;
  --gold-light:#E4D4A7;
  --gold-pale:#F3EAD1;
  --bg:#F2ECDD;
  --paper:#FFFFFF;
  --ink:#2B2320;
  --ink-soft:#6B5F55;
  --line:#E2D8C2;
  --silver-accent:#7C8794;
  --success:#2F7A4F;
  --success-bg:#E4F0E7;
  --danger:#AD3B32;
  --danger-bg:#F5E4E1;
  --warn-bg:#FBEFD9;
  --radius:10px;
  --shadow:0 2px 10px rgba(69,13,23,0.08);
  --font-display:Georgia,'Times New Roman',serif;
  --font-body:'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--gold-light);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--maroon-dark),var(--maroon) 60%,#5A1420);
  display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;
}
.seal{
  width:92px;height:92px;border-radius:50%;border:3px solid var(--gold-light);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
  font-size:30px;color:var(--gold-light);letter-spacing:1px;margin-bottom:18px;
  box-shadow:0 0 0 4px rgba(228,212,167,0.15);
}
.lockCard{
  background:rgba(255,255,255,0.06);border:1px solid rgba(228,212,167,0.35);
  border-radius:16px;padding:36px 40px;text-align:center;min-width:340px;
  backdrop-filter:blur(2px);
}
.lockCard h1{font-family:var(--font-display);color:#fff;font-size:26px;margin:0 0 2px;letter-spacing:.5px;}
.lockCard p.sub{color:var(--gold-light);margin:0 0 22px;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
.pinDots{display:flex;gap:12px;justify-content:center;margin:18px 0;}
.pinDot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold-light);background:transparent;transition:.15s;}
.pinDot.filled{background:var(--gold-light);}
.padGrid{display:grid;grid-template-columns:repeat(3,64px);gap:12px;justify-content:center;margin-top:10px;}
.padBtn{width:64px;height:64px;border-radius:50%;border:1px solid rgba(228,212,167,0.5);background:rgba(255,255,255,0.05);color:#fff;font-size:22px;}
.padBtn:active{background:var(--gold);color:var(--maroon-dark);}
.padBtn.wide{grid-column:span 1;font-size:14px;}
#lockError{color:#FFC9C0;font-size:13px;height:18px;margin-top:8px;}
#lockHint{color:rgba(255,255,255,.55);font-size:12px;margin-top:14px;}

/* ---------- SHELL ---------- */
#shell{display:none;height:100vh;width:100vw;grid-template-columns:230px 1fr;}
#shell.active{display:grid;}
#sidebar{
  background:var(--maroon-dark);color:#fff;display:flex;flex-direction:column;
  padding:18px 0;overflow-y:auto;
}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(228,212,167,0.2);margin-bottom:10px;display:flex;gap:10px;align-items:center;}
.brand .mark{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold-light);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);color:var(--gold-light);font-size:15px;flex-shrink:0;}
.brand .txt h2{font-family:var(--font-display);font-size:15px;margin:0;line-height:1.2;color:#fff;}
.brand .txt span{font-size:10px;color:var(--gold-light);letter-spacing:1px;}

<script>
/* =====================================================================
   GAYATRI JEWELLERS — OFFLINE SHOP MANAGER
   Single-file offline ERP. All data in localStorage. No network calls.
===================================================================== */

const DB_KEY = 'gj_erp_db_v1';
const uid = (p='ID') => p + '-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,5).toUpperCase();
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtDate = (iso) => { if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtMoney = (n) => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const fmtWt = (n) => (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:3}) + ' g';
/* Days between a given date (YYYY-MM-DD) and today (or a second date if given).
   Used across Girvi ageing, interest calculation, and the backup-reminder banner. */
const daysBetween = (fromISODate, toISODate) => {
  if(!fromISODate) return 0;
  const a = new Date(String(fromISODate).slice(0,10)+'T00:00:00'), b = new Date((toISODate||todayStr())+'T00:00:00');
  if(isNaN(a.getTime())) return 0;
  return Math.max(Math.round((b-a)/86400000), 0);
};

function defaultDB(){
  return {
    meta:{
      shopName:'Gayatri Jewellers', location:'Soni Gali, Sarwan, Madhya Pradesh, India',
      startDate:'2024-01-22', pin:'1234', ownerPin:'9999', language:'en',
      discountApprovalThresholdPct: 3, lastBackupAt:null,
      gstin:'', bisLicenceNo:'', signatureLine:'For Gayatri Jewellers',
      autoLockMinutes: 0, backupReminderDays: 3
    },
    rateHistory:[],
    currentRates:{ gold24:9800, gold22:8990, silverKg:88000, updatedAt: nowISO() },
    marketRates:{ goldUsdOz:null, silverUsdOz:null, usdInr:null, goldInrOz:null, silverInrOz:null, exchangeRate:null, fetchedAt:null, source:null, lastError:null },
    customers:[],
    sales:[], buying:[], girvi:[], creditEntries:[], inventory:[], jobs:[], exchange:[],
    expenses:[], cashDays:[], staff:[{id:uid('STF'),name:'Owner',role:'owner',pin:'1234'}],
    wholesalers:[], wholesalerEntries:[],
    history:[]
  };
}
/* Backward-compatible migration: fills in any fields added in later app updates
   without touching or erasing existing shop data. */
function migrateDB(d){
  if(!d.wholesalers) d.wholesalers=[];
  if(!d.wholesalerEntries) d.wholesalerEntries=[];
  if(!d.marketRates) d.marketRates={ goldUsdOz:null, silverUsdOz:null, usdInr:null, fetchedAt:null, source:null, lastError:null };
  else if(d.marketRates.lastError===undefined) d.marketRates.lastError=null;
  if(d.meta && d.meta.discountApprovalThresholdPct===undefined) d.meta.discountApprovalThresholdPct=3;
  if(d.meta){
    if(d.meta.gstin===undefined) d.meta.gstin='';
    if(d.meta.bisLicenceNo===undefined) d.meta.bisLicenceNo='';
    if(d.meta.signatureLine===undefined) d.meta.signatureLine='For '+(d.meta.shopName||'the shop');
    if(d.meta.autoLockMinutes===undefined) d.meta.autoLockMinutes=0;
    if(d.meta.backupReminderDays===undefined) d.meta.backupReminderDays=3;
  }
  (d.girvi||[]).forEach(g=>{
    if(!g.transactions){
      g.transactions=[{id:uid('GTX'), date:g.date, type:'Loan Given', amount:g.loanAmount, note:'Initial girvi loan'}];
    }
    if(g.photo===undefined) g.photo=null;
    if(g.outstandingPrincipal===undefined){
      let principal = g.loanAmount||0;
      g.transactions.forEach(t=>{
        if(t.type==='Additional Loan') principal += t.amount;
        if(t.type==='Part Payment') principal -= t.amount;
      });
      g.outstandingPrincipal = Math.max(principal,0);
    }
    if(g.referenceName===undefined) g.referenceName='';
    if(g.forwards===undefined) g.forwards=[];
  });
  (d.sales||[]).forEach(s=>{ (s.items||[]).forEach(i=>{ if(i.purity===undefined || i.purity==='') i.purity=100; if(i.stoneWeight===undefined) i.stoneWeight=0; }); });
  (d.buying||[]).forEach(b=>{ if(b.purity===undefined || b.purity==='') b.purity=100; });
  (d.customers||[]).forEach(c=>{
    if(c.photo===undefined) c.photo=null;
    if(c.village===undefined) c.village='';
    if(c.referredBy===undefined) c.referredBy='';
    if(c.familyLink===undefined) c.familyLink='';
    if(c.tags===undefined) c.tags='';
    if(c.notes===undefined) c.notes='';
  });
  (d.inventory||[]).forEach(i=>{
    ['subcategory','designGroup','size','pairSingle','style','stoneOrNot','customAttr','batchNo','karigarSource','remarks','weightType'].forEach(f=>{
      if(i[f]===undefined) i[f]='';
    });
    if(i.pieceCount===undefined) i.pieceCount=1;
    /* Manufacturing / sourcing cost tracking — e.g. sent to a wholesaler/karigar
       who bills at a higher "purity" than the item's actual purity to cover
       wastage, plus a separate per-gram making charge. */
    if(i.mfgSource===undefined) i.mfgSource='';
    if(i.mfgParty===undefined) i.mfgParty='';
    if(i.mfgActualPurity===undefined) i.mfgActualPurity='';
    if(i.mfgBilledPurity===undefined) i.mfgBilledPurity='';
    if(i.mfgMakingPerGram===undefined) i.mfgMakingPerGram='';
    if(i.soldViaSaleId===undefined) i.soldViaSaleId=null;
    if(i.soldDate===undefined) i.soldDate=null;
  });
  (d.jobs||[]).forEach(j=>{
    if(j.assignedTo===undefined) j.assignedTo='In-House';
    if(j.karigarName===undefined) j.karigarName='';
  });
  (d.wholesalers||[]).forEach(w=>{ if(w.deleted===undefined) w.deleted=false; });
  /* Customer memory / merge, girvi photos & pending entries, custom rupee items.
     Purely additive: nothing is renamed or removed, old records open as before. */
  if(!Array.isArray(d.mergedCustomers)) d.mergedCustomers=[];
  if(!Array.isArray(d.customerMerges)) d.customerMerges=[];
  if(d.meta && !Array.isArray(d.meta.customItemTypes)) d.meta.customItemTypes=['Rudraksh','Stone','Other'];
  (d.customers||[]).forEach(c=>{
    if(!Array.isArray(c.altPhones)) c.altPhones=[];
    if(!Array.isArray(c.photos)) c.photos=[];
    if(!Array.isArray(c.aliases)) c.aliases=[];
    if(c.village===undefined) c.village='';
    if(c.photo===undefined) c.photo=null;
  });
  (d.girvi||[]).forEach(g=>{
    if(!Array.isArray(g.photos)) g.photos=[];
    if(!Array.isArray(g.photoLog)) g.photoLog=[];
    if(g.pendingDetails===undefined) g.pendingDetails=(g.status==='pending');
    /* old single girvi photo -> also becomes the customer's profile photo when they have none */
    if(g.photo && g.customerId){ const cu=(d.customers||[]).find(c=>c.id===g.customerId); if(cu && !cu.photo) cu.photo=g.photo; }
  });
  if(d.marketRates){
    if(d.marketRates.goldInrOz===undefined) d.marketRates.goldInrOz=null;
    if(d.marketRates.silverInrOz===undefined) d.marketRates.silverInrOz=null;
    if(d.marketRates.exchangeRate===undefined) d.marketRates.exchangeRate=null;
  }
  return d;
}

/* ---------------------- CUSTOMER HELPERS ---------------------- */
/* =====================================================================
   CUSTOMER MEMORY — central customer list, suggestions, duplicate
   detection, merge (with undo), photo gallery & storage guard.
   Customers are never deleted: a merged duplicate is archived in
   DB.mergedCustomers and every move is logged in DB.customerMerges.
===================================================================== */
function escH(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normPhone(p){ const d=String(p||'').replace(/\D/g,''); return d.length>10 ? d.slice(-10) : d; }
function normName(n){
  return String(n||'').toLowerCase().replace(/[^\p{L}\p{M}\p{N}\s]/gu,' ').replace(/\b(shri|shree|sri|smt|mr|mrs|ji)\b/g,' ').replace(/\s+/g,' ').trim();
}
function levDist(a,b){
  if(a===b) return 0; const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=new Array(n+1), cur=new Array(n+1);
  for(let j=0;j<=n;j++) prev[j]=j;
  for(let i=1;i<=m;i++){ cur[0]=i; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } const t=prev; prev=cur; cur=t; }
  return prev[n];
}
function nameSimilarity(a,b){
  a=normName(a); b=normName(b); if(!a||!b) return 0; if(a===b) return 1;
  if(a.split(' ').sort().join(' ')===b.split(' ').sort().join(' ')) return 0.97;
  const sh=a.length<=b.length?a:b, lg=a.length<=b.length?b:a;
  if(sh.length>=4 && lg.includes(sh)) return 0.85;
  return 1 - levDist(a,b)/Math.max(a.length,b.length);
}
function custPhones(c){ return [c.phone].concat(c.altPhones||[]).map(normPhone).filter(Boolean); }
function bestNameSim(c, name){ return Math.max(nameSimilarity(c.name,name), ...(c.aliases||[]).map(a=>nameSimilarity(a,name))); }
function customerById(id){
  if(!id) return null;
  const c=DB.customers.find(x=>x.id===id); if(c) return c;
  const m=(DB.mergedCustomers||[]).find(x=>x.id===id);
  return m ? (DB.customers.find(x=>x.id===m.mergedInto)||null) : null;
}
function customerMainPhoto(c){ if(!c) return null; if(c.photo) return c.photo; if(c.photos&&c.photos.length) return c.photos[0].data; return null; }
function custAvatarHTML(c, size, nameFallback, photoOverride){
  size=size||28; const p=photoOverride||customerMainPhoto(c);
  if(p) return `<img src="${p}" class="photoThumb avatarImg" style="width:${size}px;height:${size}px;">`;
  const ch=(((c&&c.name)||nameFallback||'?').trim().charAt(0).toUpperCase())||'?';
  return `<span class="avatarInit" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.45)}px;">${escH(ch)}</span>`;
}
function custCell(rec, photoOverride){
  const c=customerById(rec.customerId); const name=(c&&c.name)||rec.customerName||'-';
  return `<span class="custCell">${custAvatarHTML(c,26,name,(c&&customerMainPhoto(c))?null:photoOverride)}<span>${escH(name)}</span></span>`;
}
function touchCustomerPhone(c, phone){
  const np=normPhone(phone); if(!np) return;
  if(!c.phone){ c.phone=phone; return; }
  if(!custPhones(c).includes(np)){ c.altPhones=c.altPhones||[]; c.altPhones.push(phone); logHistory('Customer','Phone added','Extra number '+phone+' saved for '+c.name); }
}
function findOrCreateCustomer(name, phone, opts){
  name=(name||'').trim(); if(!name) return null; phone=(phone||'').trim();
  let c=null;
  if(!(opts&&opts.forceNew)){
    const nn=normName(name), np=normPhone(phone);
    c=DB.customers.find(x=> normName(x.name)===nn && (!np || !custPhones(x).length || custPhones(x).includes(np)));
  }
  if(!c){
    c={id:uid('CUS'), name, phone, address:'', notes:'', village:'', photo:null, altPhones:[], photos:[], aliases:[], createdAt:nowISO()};
    DB.customers.push(c);
    logHistory('Customer','Created','New customer added: '+name+(phone?' ('+phone+')':''));
  } else if(phone) touchCustomerPhone(c, phone);
  return c;
}
/* ---- suggestions & search ---- */
function customerMatchesQuery(c,q){
  q=String(q||'').trim(); if(!q) return true;
  const nq=normName(q), dq=q.replace(/\D/g,'');
  const names=[c.name].concat(c.aliases||[]).map(normName);
  if(nq){ const toks=nq.split(' ').filter(Boolean); if(names.some(n=>toks.every(t=>n.includes(t)))) return true; }
  if(dq.length>=3 && custPhones(c).some(p=>p.includes(dq))) return true;
  if(nq && normName(c.village||'').includes(nq)) return true;
  if(nq && normName(c.tags||'').includes(nq)) return true;
  return false;
}
function findCustomerMatches(name, phone, limit){
  const nq=normName(name), pq=String(phone||'').replace(/\D/g,''); const toks=nq?nq.split(' ').filter(Boolean):[];
  const out=[];
  DB.customers.forEach(c=>{
    let score=0, why='';
    if(pq.length>=3){
      const phones=custPhones(c);
      if(phones.includes(normPhone(pq)) && pq.length>=6){ score=100; why='Same phone number'; }
      else if(phones.some(p=>p.includes(pq))){ score=70; why='Phone matches'; }
    }
    if(nq){
      let best=0;
      [c.name].concat(c.aliases||[]).forEach(n=>{
        const nn=normName(n); let s=0;
        if(nn===nq) s=95; else if(nn.startsWith(nq)) s=88; else if(nn.includes(nq)) s=78;
        else if(toks.length>1 && toks.every(t=>nn.includes(t))) s=75;
        else { const sim=nameSimilarity(n,name); if(sim>=0.75) s=Math.round(sim*70); }
        if(s>best) best=s;
      });
      if(best>score){ score=best; why=best>=95?'Same name':(best>=75?'Name matches':'Similar name'); }
      if(!score && c.village && normName(c.village).includes(nq)){ score=40; why='Village match'; }
    }
    if(score>0) out.push({c,score,why});
  });
  out.sort((a,b)=>b.score-a.score || a.c.name.localeCompare(b.c.name));
  return out.slice(0,limit||6);
}
function findDuplicateCandidates(name, phone){
  const np=normPhone(phone); const out=[];
  DB.customers.forEach(c=>{
    const phones=custPhones(c);
    const samePhone=np.length>=6 && phones.includes(np);
    const sim=bestNameSim(c,name); const exact=sim===1;
    let reason='';
    if(samePhone) reason=exact?'Same name & phone':'Same phone number';
    else if(sim>=0.85 && (!np || !phones.length)) reason=exact?'Same name':'Very similar name';
    if(reason) out.push({c,reason,sim,samePhone,exact});
  });
  return out.sort((a,b)=>(b.samePhone-a.samePhone)||(b.sim-a.sim));
}
function findDuplicatePairs(){
  const list=DB.customers, pairs=[], seen=new Set(), byPhone={};
  list.forEach(c=>custPhones(c).forEach(p=>{ if(p.length>=6){ (byPhone[p]=byPhone[p]||[]).push(c); } }));
  Object.keys(byPhone).forEach(p=>{ const arr=byPhone[p];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const k=[arr[i].id,arr[j].id].sort().join('|'); if(seen.has(k)) continue; seen.add(k);
      pairs.push({a:arr[i], b:arr[j], reason:'Same phone number ('+p+')', score:100});
    } });
  const buckets={};
  list.forEach(c=>{ const n=normName(c.name); if(!n) return; (buckets[n[0]]=buckets[n[0]]||[]).push({c,n}); });
  Object.keys(buckets).forEach(key=>{ const arr=buckets[key];
    for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
      const x=arr[i], y=arr[j]; if(Math.abs(x.n.length-y.n.length)>4) continue;
      const k=[x.c.id,y.c.id].sort().join('|'); if(seen.has(k)) continue;
      const sim=nameSimilarity(x.c.name,y.c.name); if(sim<0.88) continue;
      const px=custPhones(x.c), py=custPhones(y.c);
      const conflict=px.length&&py.length&&!px.some(p=>py.includes(p));
      if(conflict && sim<1) continue;
      seen.add(k);
      pairs.push({a:x.c, b:y.c, reason: sim===1 ? (conflict?'Same name (different phone numbers)':'Same name') : 'Very similar name', score:Math.round(sim*100)});
    } });
  return pairs.sort((p,q)=>q.score-p.score);
}

const _cp = {};

  return findOrCreateCustomer(sel.name, sel.phone, {forceNew: sel.newOk});
}

/* returns true when saving may continue; otherwise shows the duplicate
   warning and re-runs `proceed` after the user chooses */
function customerGate(nameId, phoneId, proceed){
  const sel=readCustomerSel(nameId, phoneId);
  if(!sel.name || sel.cid || sel.newOk) return true;
  const np=normPhone(sel.phone);
  const cands=findDuplicateCandidates(sel.name, sel.phone);
  if(!cands.length) return true;
  if(cands.length===1 && cands[0].exact && (!np || !custPhones(cands[0].c).length || cands[0].samePhone)) return true;
  showCustomerGate(nameId, cands.slice(0,4), proceed);

function cpRefresh(nameId, showDrop){
  const st=_cp[nameId]; if(!st) return;
  const ne=document.getElementById(nameId), pe=document.getElementById(st.phoneId), drop=document.getElementById(nameId+'_drop'), status=document.getElementById(nameId+'_status');
  if(!ne||!drop||!status) return;
  let name=(ne.value||'').trim(), phone=pe?(pe.value||'').trim():'';
  if(/^[\d\s+\-]{3,}$/.test(name)){ phone=phone||name; name=''; }
  const linked=ne.dataset.cid?DB.customers.find(x=>x.id===ne.dataset.cid):null;
  if(linked){
    const bal=customerBalance(linked.id);
    status.innerHTML=`<div class="cpOk">${custAvatarHTML(linked,32)}<div><b>✅ Existing customer</b><div class="helpText">${escH(linked.name)}${linked.phone?' • '+escH(linked.phone):''}${linked.village?' • '+escH(linked.village):''}${bal>0?' • <span style="color:var(--danger);font-weight:700;">Due '+fmtMoney(bal)+'</span>':''}</div></div></div><div class="cpLinks"><a onclick="cpUnlink('${nameId}')">✕ Not this person</a></div>`;
    drop.classList.add('hidden'); return;
  }
  if(!name && phone.replace(/\D/g,'').length<3){ status.innerHTML=''; drop.classList.add('hidden'); return; }
  const matches=findCustomerMatches(name, phone, 6);
  if(showDrop && matches.length){
    drop.style.top=(ne.offsetTop+ne.offsetHeight+2)+'px';
    drop.innerHTML=matches.map(m=>`<div class="cpRow" onpointerdown="event.preventDefault();cpSelect('${nameId}','${m.c.id}')">${custAvatarHTML(m.c,34)}<div style="flex:1;min-width:0;"><div class="nm">${escH(m.c.name)}</div><div class="sub">${escH(m.c.phone||'No phone')}${m.c.village?' • '+escH(m.c.village):''} • ${escH(m.why)}</div></div></div>`).join('');
    drop.classList.remove('hidden');
  } else if(!matches.length || !showDrop){ drop.classList.add('hidden'); }
  const dup=(name||phone)?findDuplicateCandidates(name, phone):[];
  if(ne.dataset.newOk==='1'){ status.innerHTML=`<div class="cpNew">🆕 <b>New customer</b> (you chose to create a new record)</div>`; return; }
  const np=normPhone(phone);
  const silent=dup.length===1 && dup[0].exact && (!np || !custPhones(dup[0].c).length || dup[0].samePhone);
  if(silent){ status.innerHTML=`<div class="cpOk">${custAvatarHTML(dup[0].c,32)}<div><b>✅ Existing customer</b><div class="helpText">Will be linked to ${escH(dup[0].c.name)}${dup[0].c.phone?' • '+escH(dup[0].c.phone):''}</div></div></div><div class="cpLinks"><a onclick="cpSelect('${nameId}','${dup[0].c.id}')">Use this record</a></div>`; return; }
  if(dup.length){
    status.innerHTML=`<div class="cpWarn">⚠️ <b>Similar customer already exists</b>${dup.slice(0,2).map(x=>`<div style="margin-top:4px;">${escH(x.c.name)} ${x.c.phone?'('+escH(x.c.phone)+')':''} <span class="helpText">— ${escH(x.reason)}</span> <a onclick="cpSelect('${nameId}','${x.c.id}')">Use this customer</a></div>`).join('')}</div>`; return;
  }
  if(name.length>=2) status.innerHTML=`<div class="cpNew">🆕 <b>New customer</b> — will be saved to your customer list</div>`;
  else status.innerHTML='';
}
function cpSelect(nameId, cid){

function makeThumb(dataUrl, maxDim, q, cb){
  const img=new Image();
  img.onload=()=>{ try{ const sc=Math.min(1, maxDim/Math.max(img.width,img.height)); const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc)); cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cb(cv.toDataURL('image/jpeg',q)); }catch(e){ cb(dataUrl); } };
  img.onerror=()=>cb(dataUrl); img.src=dataUrl;
}

/* ---- merge ---- */
function custRecordCounts(id){
  const n=k=>(DB[k]||[]).filter(r=>r.customerId===id && !r.deleted).length;
  return {sales:n('sales'), buying:n('buying'), girvi:n('girvi'), credit:n('creditEntries'), jobs:n('jobs'), exchange:n('exchange'), photos:customerPhotoGallery(id).length};
}
function mergeCustomers(mainId, secId){
  const M=DB.customers.find(c=>c.id===mainId), S=DB.customers.find(c=>c.id===secId);
  if(!M||!S||M.id===S.id) return null;
  const moved={};
  ['sales','buying','girvi','creditEntries','jobs','exchange'].forEach(k=>{ moved[k]=[]; (DB[k]||[]).forEach(r=>{ if(r.customerId===S.id){ r.customerId=M.id; moved[k].push(r.id); } }); });
  const before={phone:M.phone||'', village:M.village||'', address:M.address||'', notes:M.notes||'', tags:M.tags||'', referredBy:M.referredBy||'', familyLink:M.familyLink||''};
  M.altPhones=M.altPhones||[]; M.photos=M.photos||[]; M.aliases=M.aliases||[];
  const addedAltPhones=[], addedAliases=[], addedPhotoIds=[]; let photoFromSec=false;
  const known=new Set(custPhones(M));
  [S.phone].concat(S.altPhones||[]).forEach(p=>{ const np=normPhone(p); if(!np||known.has(np)) return; known.add(np); if(!M.phone) M.phone=p; else { M.altPhones.push(p); addedAltPhones.push(p); } });
  ['village','address','referredBy','familyLink'].forEach(f=>{ if(!M[f] && S[f]) M[f]=S[f]; });
  if(S.tags){ const t=new Set((M.tags||'').split(',').map(x=>x.trim()).filter(Boolean)); S.tags.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>t.add(x)); M.tags=[...t].join(', '); }
  if(S.notes) M.notes=(M.notes?M.notes+' | ':'')+'(from '+S.name+') '+S.notes;
  if(nameSimilarity(M.name,S.name)<1 && !M.aliases.includes(S.name)){ M.aliases.push(S.name); addedAliases.push(S.name); }
  (S.aliases||[]).forEach(a=>{ if(!M.aliases.includes(a) && nameSimilarity(a,M.name)<1){ M.aliases.push(a); addedAliases.push(a); } });
  if(!M.photo && S.photo){ M.photo=S.photo; photoFromSec=true; }
  else if(S.photo && S.photo!==M.photo){ const id=uid('PH'); M.photos.push({id, data:S.photo, addedAt:nowISO(), source:'merged', note:'From '+S.name}); addedPhotoIds.push(id); }
  (S.photos||[]).forEach(p=>{ const id=uid('PH'); M.photos.push(Object.assign({}, p, {id})); addedPhotoIds.push(id); });
  const afterScalars={phone:M.phone||'', village:M.village||'', address:M.address||'', tags:M.tags||'', referredBy:M.referredBy||'', familyLink:M.familyLink||''};
  DB.customers=DB.customers.filter(c=>c.id!==S.id);
  S.mergedInto=M.id; S.mergedAt=nowISO();
  DB.mergedCustomers=DB.mergedCustomers||[]; DB.mergedCustomers.push(S);
  const log={id:uid('MRG'), at:nowISO(), mainId:M.id, mainName:M.name, secId:S.id, secName:S.name, moved, before, afterScalars, afterNotes:M.notes||'', addedAltPhones, addedAliases, addedPhotoIds, photoFromSec, undone:false};
  DB.customerMerges=DB.customerMerges||[]; DB.customerMerges.unshift(log);
  const total=Object.keys(moved).reduce((a,k)=>a+moved[k].length,0);
  logHistory('Customer','Merged','“'+S.name+'” merged into “'+M.name+'” — '+total+' record(s) moved');
  return log;
}
function undoMerge(logId){
  const L=(DB.customerMerges||[]).find(x=>x.id===logId);
  if(!L||L.undone){ toast('This merge was already undone'); return false; }
  const S=(DB.mergedCustomers||[]).find(x=>x.id===L.secId), M=DB.customers.find(c=>c.id===L.mainId);
  if(!S||!M){ toast('Cannot undo — a profile is missing'); return false; }
  Object.keys(L.moved).forEach(k=>{ (L.moved[k]||[]).forEach(id=>{ const r=(DB[k]||[]).find(x=>x.id===id); if(r && r.customerId===M.id) r.customerId=S.id; }); });
  const A=L.afterScalars||{}, B=L.before||{};
  ['phone','village','address','referredBy','familyLink','tags'].forEach(f=>{ if((M[f]||'')===(A[f]||'')) M[f]=B[f]; });
  if(M.notes===L.afterNotes) M.notes=B.notes;
  M.altPhones=(M.altPhones||[]).filter(p=>!(L.addedAltPhones||[]).includes(p));
  M.aliases=(M.aliases||[]).filter(a=>!(L.addedAliases||[]).includes(a));
  M.photos=(M.photos||[]).filter(p=>!(L.addedPhotoIds||[]).includes(p.id));
  if(L.photoFromSec && M.photo===S.photo) M.photo=null;
  DB.mergedCustomers=DB.mergedCustomers.filter(x=>x.id!==S.id);
  delete S.mergedInto; delete S.mergedAt; DB.customers.push(S);
  L.undone=true; L.undoneAt=nowISO();
  logHistory('Customer','Merge undone','“'+S.name+'” restored as a separate customer (was merged into “'+M.name+'”)');
  return true;
}

/* Rough approximate value of in-stock inventory at today's shop rates
   (purity × weight × per-gram rate for the item's category). Used on the
   Dashboard and in Reports — always a reference estimate, not a valuation. */
function inventoryValuation(){
  let goldWt=0, silverWt=0, otherCount=0, goldValue=0, silverValue=0, count=0;
  DB.inventory.filter(i=>i.status==='in-stock' && !i.deleted).forEach(i=>{
    count++;
    const purity = parseFloat(i.purity); const pf = isNaN(purity) ? 1 : (purity/100);
    const pureWt = (Number(i.weight)||0) * pf;
    if(i.category==='Gold'){ goldWt+=Number(i.weight)||0; goldValue += pureWt*(DB.currentRates.gold22/10); }
    else if(i.category==='Silver'){ silverWt+=Number(i.weight)||0; silverValue += pureWt*(DB.currentRates.silverKg/1000); }
    else otherCount++;
  });
  return { count, goldWt, silverWt, otherCount, total: goldValue+silverValue, goldValue, silverValue };
}

let saleDraftItems = [];

/* Keep Inventory in sync with Sales: any sale item picked "from inventory"
   marks that item sold; editing/voiding/deleting the bill releases it back
   to stock. Only releases items this exact sale claimed (soldViaSaleId),
   so a manual status change elsewhere is never overwritten by accident. */
function releaseInventoryForSale(saleId){
  DB.inventory.forEach(it=>{
    if(it.soldViaSaleId===saleId && it.status==='sold'){
      it.status='in-stock'; it.soldViaSaleId=null; it.soldDate=null;
    }
  });
}
function claimInventoryForSale(sale){
  const invIds = [...new Set((sale.items||[]).map(i=>i.invId).filter(Boolean))];
  invIds.forEach(id=>{
    const it = DB.inventory.find(x=>x.id===id);
    if(it && it.status!=='sold'){
      it.status='sold'; it.soldViaSaleId=sale.id; it.soldDate=sale.date;
      logHistory('Inventory','Sold', `${it.itemName} (${it.code}) marked sold via bill ${sale.billNo}`);
    }
  });
}
function renderSales(){

/* ---- Custom Rupee Items (Rudraksh, stones, other articles priced in ₹, no weight/purity/making) ---- */
const SALE_CATEGORIES = ['Silver','Gold','Part Silver','Khirchi Silver','Custom','Custom Rupee Item'];
function isCustomItem(it){ return !!it && (it.kind==='custom' || it.category==='Custom Rupee Item'); }
function customItemAmount(it){
  const q=Number(it.qty)||0;
  return it.priceMode==='total' ? (Number(it.totalPrice)||0) : q*(Number(it.unitPrice)||0);
}
/* one place that knows how any sale line is priced — metal lines use the same formula as always */
function saleItemAmount(it){
  if(isCustomItem(it)) return customItemAmount(it);
  const purity=(it.purity===undefined||it.purity==='')?100:Number(it.purity);
  const pw=(Number(it.weight)||0)*((Number(purity)||0)/100);
  return pw*(Number(it.rate)||0)+Number(it.making||0);
}
function custNameFor(rec){ const c=customerById(rec&&rec.customerId); return escH((c&&c.name)||(rec&&rec.customerName)||''); }
function saleCategorySelectHTML(i, current){
  return `<select onchange="saleCategoryChange(${i},this.value)">${SALE_CATEGORIES.map(c=>`<option ${current===c?'selected':''}>${c}</option>`).join('')}</select>`;
}
function saleCategoryChange(i, v){
  const it=saleDraftItems[i]; if(!it) return; const wasCustom=isCustomItem(it);
  it.category=v;
  if(v==='Custom Rupee Item'){
    it.kind='custom'; it.qty=it.qty||1; it.priceMode=it.priceMode||'unit'; it.unitPrice=it.unitPrice||0; it.totalPrice=it.totalPrice||0; it.notes=it.notes||'';
    it.weight=0; it.purity=100; it.rate=0; it.making=0; it.invId=null;
  } else {
    if(wasCustom){ delete it.kind; it.weight=0; it.purity=100; it.rate=0; it.making=0; }
    autoFillRate(i);
  }
  renderSaleItemRows(); recalcSaleTotals();
}
function setCustomPriceMode(i, mode){ const it=saleDraftItems[i]; it.priceMode=mode; renderSaleItemRows(); recalcSaleTotals(); }
function setCustomPrice(i, v){ const it=saleDraftItems[i]; const n=parseFloat(v)||0; if(it.priceMode==='total') it.totalPrice=n; else it.unitPrice=n; customRowUpdate(i); }
function customRowUpdate(i){
  const el=document.getElementById('custAmt_'+i); if(el) el.value=fmtMoney(customItemAmount(saleDraftItems[i]));
  recalcSaleTotals();
}

      <div class="field"><label>Pricing</label><select onchange="setCustomPriceMode(${i},this.value)"><option value="unit" ${mode==='unit'?'selected':''}>Per piece</option><option value="total" ${mode==='total'?'selected':''}>Total price</option></select></div>
      <div class="field"><label>${mode==='unit'?'Price / piece (₹)':'Total price (₹)'}</label><input type="number" min="0" value="${mode==='unit'?(it.unitPrice||''):(it.totalPrice||'')}" oninput="setCustomPrice(${i},this.value)"></div>
      <div class="field"><label>Amount</label><input id="custAmt_${i}" value="${fmtMoney(customItemAmount(it))}" disabled style="background:var(--bg);color:var(--ink-soft);"></div>
      <button class="miniRemove" onclick="removeSaleItemRow(${i})">✕</button>
    </div>
    <input placeholder="Notes / details (optional) — no weight, purity or making charge for custom items" value="${escH(it.notes||'')}" style="width:100%;margin-top:6px;padding:8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;" oninput="saleDraftItems[${i}].notes=this.value">
  </div>`;
}
function removeSaleItemRow(i){ saleDraftItems.splice(i,1); renderSaleItemRows(); recalcSaleTotals(); }
function inventoryOptionsForRow(rowIndex){
  const usedElsewhere = new Set(saleDraftItems.map((it,idx)=> idx!==rowIndex ? it.invId : null).filter(Boolean));
  const currentId = saleDraftItems[rowIndex].invId;
  const items = DB.inventory.filter(x=> (!x.deleted || x.id===currentId) && (x.status==='in-stock' || x.id===currentId) && !usedElsewhere.has(x.id));
  return items.map(x=>`<option value="${x.id}" ${x.id===currentId?'selected':''}>${x.code} — ${x.itemName} (${fmtWt(x.weight)}, ${x.purity}%)</option>`).join('');
}
function fillFromInventory(i, invId){
  if(!invId){ saleDraftItems[i].invId=null; return; }
  const it = DB.inventory.find(x=>x.id===invId); if(!it) return;
  saleDraftItems[i].invId = it.id;
  saleDraftItems[i].itemName = it.itemName;
  saleDraftItems[i].category = (it.category==='Gold'||it.category==='Silver') ? it.category : 'Custom';
  saleDraftItems[i].weight = Number(it.weight)||0;
  const p = parseFloat(it.purity); saleDraftItems[i].purity = isNaN(p) ? 100 : p;
  saleDraftItems[i].rate = 0;
  renderSaleItemRows();
  recalcSaleTotals();
}
function renderSaleItemRows(){
  const wrap = document.getElementById('saleItemsWrap');
  wrap.innerHTML = `<datalist id="customTypeList">${(DB.meta.customItemTypes||[]).map(t=>`<option value="${escH(t)}">`).join('')}</datalist>` + saleDraftItems.map((it,i)=>{
    if(isCustomItem(it)) return customItemRowHTML(it,i);
    const purity = (it.purity===undefined||it.purity==='')?100:it.purity;
    const pureWt = (Number(it.weight)||0) * (Number(purity)||0)/100;
    return `
    <div style="margin-bottom:10px;">
      <select style="width:100%;padding:8px;margin-bottom:6px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;color:var(--ink-soft);" onchange="fillFromInventory(${i}, this.value)">
        <option value="">📦 Pick from Inventory (optional) — or fill in manually below</option>
        ${inventoryOptionsForRow(i)}
      </select>
      <div class="itemRow" style="grid-template-columns:1.2fr 0.85fr 0.7fr 0.75fr 0.8fr 0.75fr 0.8fr 0.85fr auto;margin-bottom:0;">
        <div class="field"><label>Item</label><input value="${it.itemName}" placeholder="e.g. Silver Payal" oninput="saleDraftItems[${i}].itemName=this.value"></div>
        <div class="field"><label>${T('category')}</label>
          ${saleCategorySelectHTML(i, it.category)}</div>
        <div class="field"><label>${T('weight')}</label><input type="number" step="0.001" value="${it.weight}" oninput="saleDraftItems[${i}].weight=parseFloat(this.value)||0; recalcSaleTotals();"></div>
        <div class="field"><label>${T('purity')} %</label><input type="number" step="0.1" value="${purity}" placeholder="e.g. 90" oninput="saleDraftItems[${i}].purity=parseFloat(this.value)||0; recalcSaleTotals();"></div>
        <div class="field"><label>Pure Wt</label><input value="${pureWt.toFixed(3)}" disabled style="background:var(--bg);color:var(--ink-soft);"></div>
        <div class="field"><label>${T('rate')}/g</label><input type="number" value="${it.rate}" oninput="saleDraftItems[${i}].rate=parseFloat(this.value)||0; recalcSaleTotals();"></div>
        <div class="field"><label>${T('making')}</label><input type="number" value="${it.making}" oninput="saleDraftItems[${i}].making=parseFloat(this.value)||0; recalcSaleTotals();"></div>
        <div class="field"><label>Amount</label><input value="${fmtMoney(pureWt*(it.rate||0)+Number(it.making||0))}" disabled style="background:var(--bg);color:var(--ink-soft);"></div>
        <button class="miniRemove" onclick="removeSaleItemRow(${i})">✕</button>
      </div>
    </div>
  `;}).join('');
  saleDraftItems.forEach((it,i)=> autoFillRate(i));
}
function autoFillRate(i){
  const it = saleDraftItems[i]; if(!it) return;
  if(isCustomItem(it)) return;
  if(it.rate) return;
  if(it.category==='Gold') it.rate = DB.currentRates.gold22/10;
  else if(it.category!=='Custom') it.rate = DB.currentRates.silverKg/1000;
}
function recalcSaleTotals(){
  let sub=0, wt=0, pureWt=0;
  saleDraftItems.forEach(it=>{
    const purity = (it.purity===undefined||it.purity==='') ? 100 : Number(it.purity);
    if(isCustomItem(it)){ sub += customItemAmount(it); return; }
    const pw = (Number(it.weight)||0) * (purity/100);
    pureWt += pw; wt += Number(it.weight||0);
    sub += (pw*(it.rate||0)) + Number(it.making||0);
  });
  const discount = parseFloat(document.getElementById('saleDiscount')?.value)||0;
  const grand = Math.max(sub-discount,0);
  const pct = sub>0 ? (discount/sub*100) : 0;
  document.getElementById('saleTotalsBox').innerHTML = `
    <div class="totalsRow"><span>Total Weight</span><span>${fmtWt(wt)}</span></div>
    <div class="totalsRow"><span>Pure Weight (by purity)</span><span>${fmtWt(pureWt)}</span></div>
    <div class="totalsRow"><span>Subtotal</span><span>${fmtMoney(sub)}</span></div>
    <div class="totalsRow"><span>${T('discount')}</span><span>- ${fmtMoney(discount)}</span></div>
    <div class="totalsRow grand"><span>Grand Total</span><span>${fmtMoney(grand)}</span></div>`;
  const note = document.getElementById('saleApprovalNote');
  if(note){
    if(pct > DB.meta.discountApprovalThresholdPct){
      note.innerHTML = `<div class="approveBox">⚠️ Discount is ${pct.toFixed(1)}%, above the ${DB.meta.discountApprovalThresholdPct}% limit. Owner approval will be required to save this bill.</div>`;
    } else note.innerHTML='';
  }
}
function saveSale(){
  const custName = document.getElementById('saleCustomer').value.trim();
  if(!custName){ toast('Please enter customer name'); return; }
  if(saleDraftItems.length===0 || saleDraftItems.every(i=>!i.itemName)){ toast('Add at least one item'); return; }
  const badCustom = saleDraftItems.find(i=>i.itemName && isCustomItem(i) && customItemAmount(i)<=0);
  if(badCustom){ toast('Enter quantity and price for the custom item “'+badCustom.itemName+'”'); return; }
  if(!customerGate('saleCustomer','salePhone', saveSale)) return;
  const custSel = readCustomerSel('saleCustomer','salePhone');
  const phone = document.getElementById('salePhone').value.trim();
  const discount = parseFloat(document.getElementById('saleDiscount').value)||0;
  const payMode = document.getElementById('salePayMode').value;
  const saleDate = document.getElementById('saleDate').value || todayStr();
  const manualPaid = document.getElementById('saleAmountPaid').value;
  let sub=0; saleDraftItems.forEach(it=>{ sub += saleItemAmount(it); });
  const pct = sub>0 ? (discount/sub*100):0;

  const finalize = ()=>{
    const cust = resolveCustomerFrom(custSel);
    const grand = Math.max(sub-discount,0);
    const amountPaid = manualPaid!=='' ? (parseFloat(manualPaid)||0) : ((payMode==='Full Credit') ? 0 : grand);
    const cleanItems = saleDraftItems.filter(i=>i.itemName).map(i=> isCustomItem(i) ? ({...i, kind:'custom', category:'Custom Rupee Item', itemType:i.itemName, qty:Number(i.qty)||0, weight:0, purity:100, rate:0, making:0, invId:null, amount:customItemAmount(i)}) : ({...i, purity:(i.purity===undefined||i.purity==='')?100:Number(i.purity)}));
    if(editingSaleId){
      const s = DB.sales.find(x=>x.id===editingSaleId);
      releaseInventoryForSale(s.id);
      s.customerId=cust.id; s.customerName=cust.name; s.date=saleDate; s.items=cleanItems;
      s.subTotal=sub; s.discount=discount; s.discountPct=pct; s.grandTotal=grand; s.paymentMode=payMode; s.amountPaid=amountPaid;
      claimInventoryForSale(s);
      logHistory('Sales','Edited', `Bill ${s.billNo} edited for ${cust.name} — new total ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale updated: '+s.billNo); renderSales();
    } else {
      const sale = {
        id: uid('SAL'), billNo: 'INV-'+(DB.sales.length+1001), date: saleDate, createdAt: nowISO(),
        customerId: cust.id, customerName: cust.name, items: cleanItems,
        subTotal: sub, discount, discountPct: pct, grandTotal: grand, paymentMode: payMode, amountPaid, void:false
      };
      DB.sales.push(sale);
      claimInventoryForSale(sale);
      if(amountPaid < grand){
        DB.creditEntries.push({id:uid('CR'), customerId:cust.id, date:saleDate, type:'debit', amount: grand-amountPaid, description:'Sale '+sale.billNo, createdAt: nowISO()});
      }
      logHistory('Sales','Created', `Bill ${sale.billNo} for ${cust.name} — ${fmtMoney(grand)}`);
      saveDB(); closeModal(); toast('Sale saved: '+sale.billNo); renderSales();
    }
  };

  if(pct > DB.meta.discountApprovalThresholdPct){
    askOwnerApproval(`This bill has a discount of ${pct.toFixed(1)}%, above the allowed ${DB.meta.discountApprovalThresholdPct}%. Owner PIN is required to proceed.`, ()=>finalize());
  } else finalize();
}

function doPrint(saleId){

function buildBillText(s){
  const m = DB.meta;
  const cust = DB.customers.find(c=>c.id===s.customerId);
  let lines = [];
  lines.push(`*${m.shopName}*`);
  lines.push(m.location);
  if(m.gstin) lines.push(`GSTIN: ${m.gstin}`);
  lines.push('');
  lines.push(`Bill No: *${s.billNo}*`);
  lines.push(`Date: ${new Date(s.createdAt||s.date).toLocaleString('en-IN')}`);
  lines.push(`Customer: ${s.customerName}${cust&&cust.phone?' ('+cust.phone+')':''}`);
  lines.push('');
  lines.push('Items:');
  s.items.forEach(i=>{
    const purity=(i.purity===undefined||i.purity==='')?100:i.purity;
    const pw=(i.weight||0)*(purity/100);
    const amt=saleItemAmount(i);
    if(isCustomItem(i)) lines.push(`• ${i.itemName} (Custom Item) — ${i.priceMode==='total'?'Qty '+i.qty+', lump sum':i.qty+' × '+fmtMoney(i.unitPrice)} — ${fmtMoney(amt)}`);
    else lines.push(`• ${i.itemName} — ${i.weight}g @ ${purity}% — ${fmtMoney(amt)}`);
  });
  lines.push('');
  lines.push(`Subtotal: ${fmtMoney(s.subTotal)}`);
  lines.push(`Discount: -${fmtMoney(s.discount)}`);
  lines.push(`*Total: ${fmtMoney(s.grandTotal)}*`);
  lines.push(`Paid (${s.paymentMode}): ${fmtMoney(s.amountPaid)}`);
  lines.push(`Balance: ${fmtMoney(s.grandTotal-s.amountPaid)}`);
  lines.push('');
  lines.push('Thank you for your business!');
  return lines.join('\n');
}
async function shareBill(saleId){
  const s = DB.sales.find(x=>x.id===saleId); if(!s) return;
  const text = buildBillText(s);
  logHistory('Sales','Shared', `Bill ${s.billNo} shared`);
  saveDB();
  if(navigator.share){
    try{
      await navigator.share({ title: 'Bill '+s.billNo, text });
      toast('Bill shared');
    }catch(err){
      if(err.name!=='AbortError') copyBillToClipboard(text);
    }
  } else {
    copyBillToClipboard(text);
  }
}
function copyBillToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      toast('Bill copied — paste it into WhatsApp or any app');
    }).catch(()=>{
      toast('Could not share or copy — try Print instead');
    });
  } else {
    toast('Sharing not supported on this browser — try Print instead');
  }
}

   GENERIC RECEIPTS — shared print / "save as PDF" / share-as-text system
   used by Buying, Girvi and Jobs (Manufacturing & Repair). Sales has its
   own richer bill builder above; this keeps the same look & pattern for
   the other modules without duplicating the whole print pipeline.

function genericReceiptConfig(kind, id){
  if(kind==='buy'){
    const b = DB.buying.find(x=>x.id===id); if(!b) return null;
    const purity = (b.purity===undefined||b.purity==='')?100:Number(b.purity);
    const pw = (Number(b.weight)||0)*(purity/100);
    return { title:'Purchase Receipt', ref:'', dateLine: fmtDate(b.date),
      rows:[
        ['Customer', b.customerName], ['Item', b.itemDesc||'-'], ['Metal', b.metal],
        ['Weight', fmtWt(b.weight)], ['Purity', purity+'%'], ['Pure Weight', fmtWt(pw)],
        ['Rate (per g, pure)', fmtMoney(b.rateApplied)], ['Payment Mode', b.paymentMode]
      ],
      totalLabel:'Amount Paid', totalValue: fmtMoney(b.amount) };
  }
  if(kind==='girvi'){
    const g = DB.girvi.find(x=>x.id===id); if(!g) return null;

    return { title:'Girvi / Pledge Receipt', ref:g.id.slice(-6), dateLine: fmtDate(g.date),
      rows:[
        ['Customer', g.customerName], ['Item Pledged', g.itemDesc||'-'], ['Metal', g.metal],
        ['Weight', fmtWt(g.weight)], ['Purity', (g.purity||100)+'%'], ['Loan Amount', fmtMoney(g.loanAmount)],
        ['Outstanding Principal', fmtMoney(principal)], ['Interest', g.interestRatePct+'% / month'],
        ['Due Date', g.dueDate?fmtDate(g.dueDate):'Not fixed'], ['Status', g.status]
      ],
      totalLabel:'Loan Amount', totalValue: fmtMoney(g.loanAmount),
      note:'Please keep this receipt safely — it will be needed to redeem the pledged item.' };

function buildGenericReceiptText(kind, id){
  const cfg = genericReceiptConfig(kind, id); if(!cfg) return '';
  const m = DB.meta;
  let lines = [];
  lines.push(`*${m.shopName}*`); lines.push(m.location); lines.push('');
  lines.push(`*${cfg.title}*${cfg.ref?' #'+cfg.ref:''}`); lines.push(`Date: ${cfg.dateLine}`); lines.push('');
  cfg.rows.forEach(([k,v])=> lines.push(`${k}: ${v}`));
  lines.push('');
  lines.push(`*${cfg.totalLabel}: ${cfg.totalValue}*`);
  if(cfg.note){ lines.push(''); lines.push(cfg.note); }
  return lines.join('\n');
}
function openGenericPrintPreview(kind, id){

let editingBuyId = null;
function renderBuying(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openBuyForm()">+ ${T('newPurchase')}</button></div>`;
  html += `<div class="card"><div class="searchBar"><input id="buySearch" placeholder="Search by customer or item..." oninput="renderBuyTable()"></div><div id="buyTableWrap"></div></div>`;

}
function renderBuyTable(){
  const q = (document.getElementById('buySearch')?.value||'').toLowerCase();
  let rows = [...DB.buying].filter(b=>!b.deleted).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  if(q) rows = rows.filter(b=> b.customerName.toLowerCase().includes(q) || (b.itemDesc||'').toLowerCase().includes(q));
  let html = `<table><tr><th>Date</th><th>Customer</th><th>Item</th><th>Metal</th><th>Wt</th><th>Purity</th><th>Pure Wt</th><th>Rate</th><th>Amount</th><th></th></tr>`;

    const pw = (Number(b.weight)||0) * (purity/100);
    html += `<tr><td>${fmtDate(b.date)}</td><td>${custCell(b)}</td><td>${b.itemDesc}</td><td>${b.metal}</td><td>${fmtWt(b.weight)}</td><td>${purity}%</td><td>${fmtWt(pw)}</td><td>${fmtMoney(b.rateApplied)}</td><td>${fmtMoney(b.amount)}</td>

function deleteBuy(id){

function openBuyForm(id){
  editingBuyId = id||null;
  const b = id ? DB.buying.find(x=>x.id===id) : null;
  const purity = b ? ((b.purity===undefined||b.purity==='')?100:b.purity) : 100;
  const body = `

    <div class="grid grid-2" style="margin-top:12px;">

    </div>

      <div class="field"><label>${T('date')}</label><input type="date" id="buyDate" value="${b?b.date:todayStr()}"></div>
      <div class="field"><label>Payment Mode</label><select id="buyPayMode"><option ${b&&b.paymentMode==='Cash'?'selected':''}>Cash</option><option ${b&&b.paymentMode==='UPI'?'selected':''}>UPI</option><option ${b&&b.paymentMode==='Adjust in Sale'?'selected':''}>Adjust in Sale</option></select></div>
    </div>
    <div class="totalsBox">
      <div class="totalsRow"><span>Pure Weight (wt × purity%)</span><span id="buyPureWtOut">0 g</span></div>
      <div class="totalsRow grand"><span>Amount Payable</span><span id="buyAmountOut">₹0</span></div>
    </div>
    <div class="helpText">Formula: weight × purity% = pure weight, then pure weight × rate = amount.</div>
  `;
  openModal(id?'Edit Purchase':T('newPurchase'), body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:id?'Save Changes':T('save'), cls:'btn-primary', onClick:saveBuy}
  ]);
  if(!b) buyAutoRate(); else buyRecalc();
  attachCustomerPicker('buyCustomer','buyPhone',{cid:b?b.customerId:''});
}
function buyAutoRate(){
  const metal = document.getElementById('buyMetal').value;
  document.getElementById('buyRate').value = metal==='Gold' ? (DB.currentRates.gold22/10).toFixed(2) : (DB.currentRates.silverKg/1000).toFixed(2);
  buyRecalc();
}
function buyRecalc(){
  const w = parseFloat(document.getElementById('buyWeight').value)||0;
  const purity = parseFloat(document.getElementById('buyPurity').value);
  const p = (purity===undefined||isNaN(purity)) ? 100 : purity;
  const r = parseFloat(document.getElementById('buyRate').value)||0;
  const pw = w*(p/100);
  document.getElementById('buyPureWtOut').textContent = fmtWt(pw);
  document.getElementById('buyAmountOut').textContent = fmtMoney(pw*r);
}
function saveBuy(){
  const name = document.getElementById('buyCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(!customerGate('buyCustomer','buyPhone',saveBuy)) return;
  const cust = resolveCustomer('buyCustomer','buyPhone');
  const weight = parseFloat(document.getElementById('buyWeight').value)||0;
  const purityRaw = parseFloat(document.getElementById('buyPurity').value);
  const purity = (purityRaw===undefined||isNaN(purityRaw)) ? 100 : purityRaw;
  const rate = parseFloat(document.getElementById('buyRate').value)||0;
  const pureWeight = weight*(purity/100);
  const date = document.getElementById('buyDate').value || todayStr();
  if(editingBuyId){
    const b = DB.buying.find(x=>x.id===editingBuyId);
    b.customerId=cust.id; b.customerName=cust.name; b.itemDesc=document.getElementById('buyItemDesc').value;
    b.metal=document.getElementById('buyMetal').value; b.purity=purity; b.weight=weight; b.rateApplied=rate;
    b.amount=pureWeight*rate; b.date=date; b.paymentMode=document.getElementById('buyPayMode').value;
    logHistory('Buying','Edited', `Purchase from ${cust.name} edited — ${fmtMoney(b.amount)}`);
    saveDB(); closeModal(); toast('Purchase updated'); renderBuying();
  } else {
    const b = {
      id: uid('BUY'), date, createdAt: nowISO(), customerId:cust.id, customerName:cust.name,
      itemDesc: document.getElementById('buyItemDesc').value, metal: document.getElementById('buyMetal').value,
      purity, weight, rateApplied: rate, amount: pureWeight*rate,
      paymentMode: document.getElementById('buyPayMode').value
    };
    DB.buying.push(b);
    logHistory('Buying','Created', `Bought ${b.itemDesc} from ${cust.name} — ${fmtMoney(b.amount)}`);
    saveDB(); closeModal(); toast('Purchase saved'); renderBuying();
  }
}

let grPhotoData = null;          // legacy single-photo variable (kept so older code paths keep loading)

let _grFilter = 'all';
function renderGirvi(){
  const pend=DB.girvi.filter(g=>!g.deleted && g.status==='pending').length;

function setGirviFilter(k){

function girviInterestDue(g){
  const months = daysBetween(g.lastInterestDate||g.date) / 30;
  return Math.round((g.outstandingPrincipal!==undefined?g.outstandingPrincipal:g.loanAmount) * (g.interestRatePct/100) * months);
}
/* all photos of a girvi: the old single `photo` (if any) + the new `photos` list */
function girviPhotoList(g){
  const out=[]; if(g.photo) out.push({id:'legacy', data:g.photo, addedAt:g.createdAt||'', source:'legacy'});
  (g.photos||[]).forEach(p=>out.push(p));
  return out;
}
function photoLabel(p){ return (p.source==='camera'?'📷 Camera':p.source==='gallery'?'🖼 Gallery':'Photo')+(p.addedAt?' — '+fmtDate(String(p.addedAt).slice(0,10)):''); }
function renderGirviTable(){
  const q = (document.getElementById('girviSearch')?.value||'').toLowerCase();
  let rows = [...DB.girvi].filter(g=>!g.deleted).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  if(_grFilter!=='all') rows = rows.filter(g=>g.status===_grFilter);
  if(q) rows = rows.filter(g=>{
    const cust = customerById(g.customerId);
    return (g.customerName||'').toLowerCase().includes(q) || (cust&&customerMatchesQuery(cust,q)) ||
      (g.referenceName||'').toLowerCase().includes(q) || (g.itemDesc||'').toLowerCase().includes(q);
  });
  let html = `<table><tr><th>Date</th><th>Days at Shop</th><th>Customer</th><th>Item</th><th>Wt</th><th>Principal Due</th><th>Interest/mo</th><th>Status</th><th></th></tr>`;
  if(rows.length===0) html += `<tr><td colspan="9"><div class="empty"><div class="big">🔐</div>${q?'No matching customer found.':(_grFilter==='pending'?'No photo-only entries waiting for details.':'No girvi loans yet.')}</div></td></tr>`;
  rows.forEach(g=>{
    const pend = g.status==='pending';
    const days = daysBetween(g.date);

      : g.status==='active' ? (g.dueDate && g.dueDate<todayStr()?'<span class="tag tag-red">Overdue</span>':'<span class="tag tag-gold">Active</span>')
      : g.status==='redeemed' ? '<span class="tag tag-green">Redeemed</span>' : '<span class="tag tag-gray">Forfeited</span>';

      <td>${pend?`<button class="btn btn-sm btn-primary" onclick="openGirviForm('${g.id}')">Complete</button> `:''}<button class="btn btn-sm btn-outline" onclick="viewGirvi('${g.id}')">${pend?'View':'Manage'}</button></td></tr>`;

/* ---- girvi photo picker: camera + gallery, several photos ---- */
function girviPhotoPickerHTML(){
  return `<div class="field" style="margin-top:12px;"><label>Photos (customer / item)</label>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <button type="button" class="btn btn-sm btn-primary" onclick="document.getElementById('grCamInput').click()">📷 Take Photo</button>

function renderGrPhotoStrip(){
  const el=document.getElementById('grPhotoStrip'); if(!el) return;
  window._photoViewerList=grDraftPhotos.map(p=>({data:p.data,label:photoLabel(p)}));
  el.innerHTML = grDraftPhotos.length ? grDraftPhotos.map((p,i)=>`<div class="photoItem"><img src="${p.data}" class="photoThumb" style="width:76px;height:76px;" onclick="openPhotoViewer(${i})"><button type="button" class="photoDel" onclick="grRemovePhoto(${i})">✕</button><span class="photoSrc">${p.source==='camera'?'📷':p.source==='gallery'?'🖼':'📁'}</span></div>`).join('') : '<div class="helpText">No photos added yet.</div>';

function grAddPhotos(e, source){
  const files=[...(e.target.files||[])]; e.target.value='';
  if(!files.length) return;
  if(storageUsage().pct>=92){ toast('⚠️ Storage is almost full — download a backup and free space before adding photos.'); return; }
  files.forEach(file=> compressImageFile(file, 640, 0.65, dataUrl=>{
    grDraftPhotos.push({id:uid('PH'), data:dataUrl, addedAt:nowISO(), source});
    renderGrPhotoStrip();
  }));
}
function grRemovePhoto(i){ grDraftPhotos.splice(i,1); renderGrPhotoStrip(); }
/* writes the working photo list onto the girvi, logging every add/remove */
function applyGirviPhotos(g, list){
  const prev=girviPhotoList(g); const prevIds=new Set(prev.map(p=>p.id)); const newIds=new Set(list.map(p=>p.id));
  const added=list.filter(p=>!prevIds.has(p.id)); const removed=prev.filter(p=>!newIds.has(p.id));
  g.photos=list.filter(p=>p.id!=='legacy').map(p=>({id:p.id, data:p.data, addedAt:p.addedAt, source:p.source, note:p.note||''}));
  if(removed.some(p=>p.id==='legacy')) g.photo=null;
  g.photoLog=g.photoLog||[];
  added.forEach(p=>{ g.photoLog.push({ts:nowISO(), action:'added', source:p.source, photoId:p.id}); logHistory('Girvi','Photo added',(p.source==='camera'?'Camera':'Gallery')+' photo added to girvi of '+g.customerName); });
  removed.forEach(p=>{ g.photoLog.push({ts:nowISO(), action:'removed', source:p.source, photoId:p.id}); logHistory('Girvi','Photo removed','Photo removed from girvi of '+g.customerName); });
}
/* the first girvi photo becomes the customer's profile photo if they have none yet
   (every other girvi photo shows up in their ledger gallery automatically) */
function ensureCustomerPhotoFromGirvi(g){
  if(!g.customerId) return; const c=DB.customers.find(x=>x.id===g.customerId); if(!c||c.photo) return;
  const first=girviPhotoList(g)[0]; if(!first) return;
  makeThumb(first.data, 240, 0.7, t=>{ if(!c.photo){ c.photo=t; logHistory('Customer','Photo saved','Profile photo set from girvi photo for '+c.name); saveDB(); } });
}

/* Reusable: compress any uploaded/captured photo to a small JPEG data URL
   so it can never overflow localStorage. Used by Girvi and Customer photos. */
function compressImageFile(file, maxDim, quality, onDone, onError){
  if(!file){ return; }
  if(!file.type || !file.type.startsWith('image/')){ toast('Please choose an image file'); if(onError) onError(); return; }
  const reader = new FileReader();
  reader.onload = function(evt){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * (maxDim/w)); w = maxDim; }
      else if(h >= w && h > maxDim){ w = Math.round(w * (maxDim/h)); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      try{ onDone(canvas.toDataURL('image/jpeg', quality)); }
      catch(err){ toast('Could not process this photo — try a different one'); if(onError) onError(); }
    };
    img.onerror = function(){ toast('Could not read this photo — try a different one'); if(onError) onError(); };
    img.src = evt.target.result;
  };
  reader.onerror = function(){ toast('Could not read this file'); if(onError) onError(); };
  reader.readAsDataURL(file);
}
function handleGirviPhoto(e){
  const file = e.target.files[0]; if(!file) return;
  compressImageFile(file, 320, 0.6, (dataUrl)=>{
    grPhotoData = dataUrl;
    document.getElementById('grPhotoPreview').outerHTML = `<img id="grPhotoPreview" src="${grPhotoData}" class="photoThumb">`;
  });
}
function saveGirvi(){
  const name = document.getElementById('grCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }
  if(!customerGate('grCustomer','grPhone', saveGirvi)) return;
  const cust = resolveCustomer('grCustomer','grPhone');
  const loanAmount = parseFloat(document.getElementById('grLoanAmt').value)||0;
  const gDate = document.getElementById('grDate').value || todayStr();
  const draft = window._girviDraftId ? DB.girvi.find(x=>x.id===window._girviDraftId) : null;
  const fields = {
    date: gDate, customerId:cust.id, customerName:cust.name, itemDesc: document.getElementById('grItem').value,
    metal: document.getElementById('grMetal').value, purity: parseFloat(document.getElementById('grPurity').value)||100,
    weight: parseFloat(document.getElementById('grWeight').value)||0,
    loanAmount, interestRatePct: parseFloat(document.getElementById('grInterest').value)||0,
    dueDate: document.getElementById('grDue').value||'', status:'active', pendingDetails:false,
    outstandingPrincipal: loanAmount, lastInterestDate: gDate,
    referenceName: document.getElementById('grRefName').value||''
  };
  const loanTx = ()=>[{id:uid('GTX'), date:gDate, type:'Loan Given', amount:loanAmount, note:'Initial girvi loan'}];
  let g;
  if(draft){
    g = draft; Object.assign(g, fields); g.forwards = g.forwards||[]; g.transactions = loanTx();
    logHistory('Girvi','Details completed', `Details added to photo-only entry: loan of ${fmtMoney(g.loanAmount)} against ${g.itemDesc} for ${cust.name}`);
  } else {
    g = Object.assign({id: uid('GIR'), createdAt: nowISO(), photo:null, photos:[], photoLog:[], forwards:[], transactions: loanTx()}, fields);
    DB.girvi.push(g);
    logHistory('Girvi','Created', `Loan of ${fmtMoney(g.loanAmount)} against ${g.itemDesc} for ${cust.name}`);
  }
  applyGirviPhotos(g, grDraftPhotos); ensureCustomerPhotoFromGirvi(g);
  window._girviDraftId = null;
  saveDB(); closeModal(); toast(draft?'Girvi details completed':'Girvi loan saved'); renderGirvi();
}
/* Photos first, details later: saved as status "pending" so it is NOT counted in active loans */
function saveGirviPhotosOnly(){
  if(!grDraftPhotos.length){ toast('Add at least one photo first'); return; }
  const name = document.getElementById('grCustomer').value.trim();
  if(name && !customerGate('grCustomer','grPhone', saveGirviPhotosOnly)) return;
  const cust = name ? resolveCustomer('grCustomer','grPhone') : null;
  const gDate = document.getElementById('grDate').value || todayStr();
  let g = window._girviDraftId ? DB.girvi.find(x=>x.id===window._girviDraftId) : null;
  const isNew = !g;
  if(!g){
    g = {id:uid('GIR'), createdAt:nowISO(), date:gDate, customerId:null, customerName:'Unknown — details pending', itemDesc:'(photo only)',
      metal:'Silver', purity:100, weight:0, loanAmount:0, interestRatePct:0, dueDate:'', status:'pending', pendingDetails:true,
      photo:null, photos:[], photoLog:[], outstandingPrincipal:0, lastInterestDate:gDate, referenceName:'', forwards:[], transactions:[]};
    DB.girvi.push(g);
  }
  if(cust){ g.customerId=cust.id; g.customerName=cust.name; }
  g.date = gDate;
  const item = document.getElementById('grItem').value.trim(); if(item) g.itemDesc=item;
  const w = parseFloat(document.getElementById('grWeight').value); if(w) g.weight=w;
  g.metal = document.getElementById('grMetal').value; g.purity = parseFloat(document.getElementById('grPurity').value)||100;
  const la = parseFloat(document.getElementById('grLoanAmt').value); if(la) g.loanAmount=la;
  g.interestRatePct = parseFloat(document.getElementById('grInterest').value)||0;
  g.dueDate = document.getElementById('grDue').value||''; g.referenceName = document.getElementById('grRefName').value||'';
  applyGirviPhotos(g, grDraftPhotos); ensureCustomerPhotoFromGirvi(g);
  logHistory('Girvi', isNew?'Photo-only entry saved':'Photo-only entry updated', 'Photos saved'+(cust?' for '+cust.name:'')+' — loan details pending');
  window._girviDraftId = null;
  saveDB(); closeModal(); toast('Photos saved — complete the details later from Girvi → Pending details'); renderGirvi();
}

function saveGirviPhotoManager(){
  const g = DB.girvi.find(x=>x.id===window._girviPhotoMgrId); if(!g) return;
  const keep = new Set(grDraftPhotos.map(p=>p.id));
  const removed = girviPhotoList(g).filter(p=>!keep.has(p.id));
  const apply = ()=>{ applyGirviPhotos(g, grDraftPhotos); ensureCustomerPhotoFromGirvi(g); saveDB(); toast('Photos updated'); viewGirvi(g.id); if(currentPage==='girvi') renderGirviTable(); };
  if(removed.length) askOwnerApproval('Removing '+removed.length+' photo(s) needs the manager PIN.', apply); else apply();
}

function saveGirviForward(girviId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const shopName = document.getElementById('gfShop').value.trim();
  if(!shopName){ toast('Enter the shop/person name'); return; }
  const amount = parseFloat(document.getElementById('gfAmount').value)||0;
  if(amount<=0){ toast('Enter a valid amount'); return; }
  g.forwards = g.forwards || [];
  g.forwards.push({
    id: uid('GFWD'), shopName, amount, percent: parseFloat(document.getElementById('gfPercent').value)||0,
    dateForwarded: document.getElementById('gfDate').value||todayStr(), notes: document.getElementById('gfNotes').value||'',
    status:'forwarded', dateReturned:null, amountReturned:null
  });
  logHistory('Girvi','Forwarded', `${fmtMoney(amount)} from ${g.customerName}'s girvi forwarded to ${shopName}`);
  saveDB(); closeModal(); toast('Marked as forwarded'); viewGirvi(girviId);
}
function markGirviForwardReturned(girviId, forwardId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const f = (g.forwards||[]).find(x=>x.id===forwardId); if(!f) return;
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>Date Returned</label><input type="date" id="gfrDate" value="${todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Amount Returned</label><input type="number" id="gfrAmount" value="${f.amount}"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Notes</label><input id="gfrNotes"></div>
  `;
  openModal('Mark as Returned — '+f.shopName, body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:T('save'), cls:'btn-primary', onClick:()=>{
      f.status='returned'; f.dateReturned=document.getElementById('gfrDate').value||todayStr();
      f.amountReturned=parseFloat(document.getElementById('gfrAmount').value)||f.amount;
      f.notes = (f.notes?f.notes+' | ':'')+(document.getElementById('gfrNotes').value||'');
      logHistory('Girvi','Forward Returned', `${fmtMoney(f.amountReturned)} returned from ${f.shopName} for ${g.customerName}'s girvi`);
      saveDB(); closeModal(); toast('Marked as returned'); viewGirvi(girviId);
    }}
  ]);
}
function deleteGirviForward(girviId, forwardId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const f = (g.forwards||[]).find(x=>x.id===forwardId); if(!f) return;
  guardDelete('forward entry ('+f.shopName+')', ()=>{
    f.deleted = true;
    logHistory('Girvi','Forward Deleted', `Forward entry to ${f.shopName} deleted from ${g.customerName}'s girvi`);
    saveDB(); toast('Forward entry deleted'); viewGirvi(girviId);
  });
}
function recomputeGirviPrincipal(g){
  let p = 0, lastInterest = g.date;
  (g.transactions||[]).filter(t=>!t.deleted).forEach(t=>{
    if(t.type==='Loan Given' || t.type==='Additional Loan') p += t.amount;
    else if(t.type==='Part Payment') p -= t.amount;
    else if(t.type==='Interest Received') lastInterest = t.date;
    else if(t.type==='Redeemed') p = 0;
  });
  g.outstandingPrincipal = Math.max(p,0);
  g.lastInterestDate = lastInterest;
}
function deleteGirviTx(girviId, txId){
  const g = DB.girvi.find(x=>x.id===girviId); if(!g) return;
  const t = (g.transactions||[]).find(x=>x.id===txId); if(!t) return;
  if(t.type==='Loan Given'){ toast('Cannot delete the initial loan entry — delete the whole loan record instead if this was a mistake.'); return; }
  guardDelete('transaction ('+t.type+' — '+fmtMoney(t.amount)+')', ()=>{
    t.deleted = true;
    recomputeGirviPrincipal(g);
    logHistory('Girvi','Transaction Deleted', `${t.type} of ${fmtMoney(t.amount)} removed from ${g.customerName}'s girvi (${g.itemDesc})`);
    saveDB(); toast('Transaction deleted'); viewGirvi(girviId);
  });
}

  `;

      g.metal = document.getElementById('egMetal').value;
      g.weight = parseFloat(document.getElementById('egWeight').value)||0;
      g.purity = parseFloat(document.getElementById('egPurity').value)||100;
      g.interestRatePct = parseFloat(document.getElementById('egInterest').value)||0;

      saveDB(); closeModal(); toast('Girvi details updated'); renderGirvi();

function deleteGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  guardDelete('girvi loan for '+g.customerName+' ('+g.itemDesc+')', ()=>{
    g.deleted = true;
    logHistory('Girvi','Deleted', `Girvi loan for ${g.customerName} (${g.itemDesc}) deleted`);
    saveDB(); closeModal(); renderGirvi(); toast('Girvi loan deleted');
  });
}
function openGirviTxForm(id, type){
  const help = {
    'Interest Received':'Interest paid by the customer. This does not reduce the principal amount.',
    'Part Payment':'Amount paid towards the principal. This reduces the outstanding due.',
    'Additional Loan':'More money given to the customer against the same item. This increases the outstanding due.'
  }[type] || '';
  const body = `
    <p class="helpText" style="margin-top:0;">${help}</p>
    <div class="grid grid-2">
      <div class="field"><label>Date</label><input type="date" id="gtxDate" value="${todayStr()}" max="${todayStr()}"></div>
      <div class="field"><label>Amount</label><input type="number" id="gtxAmount"></div>
    </div>
    <div class="field" style="margin-top:12px;"><label>Note</label><input id="gtxNote" placeholder="Optional note"></div>
  `;
  openModal(type, body, [
    {label:T('cancel'), cls:'btn-ghost', onClick:closeModal},
    {label:T('save'), cls:'btn-primary', onClick:()=>saveGirviTx(id,type)}
  ]);
}
function saveGirviTx(id, type){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const amt = parseFloat(document.getElementById('gtxAmount').value)||0;
  const date = document.getElementById('gtxDate').value || todayStr();
  const note = document.getElementById('gtxNote').value || '';
  if(amt<=0){ toast('Enter a valid amount'); return; }
  g.transactions = g.transactions || [];
  g.transactions.push({id:uid('GTX'), date, type, amount:amt, note});
  const principal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  if(type==='Additional Loan') g.outstandingPrincipal = principal + amt;
  else if(type==='Part Payment') g.outstandingPrincipal = Math.max(principal - amt, 0);
  else if(type==='Interest Received') g.lastInterestDate = date;
  logHistory('Girvi', type, `${type} of ${fmtMoney(amt)} for ${g.customerName} (${g.itemDesc})`);
  saveDB(); closeModal(); toast('Entry saved'); renderGirvi();
}
function redeemGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  const bal = g.outstandingPrincipal!==undefined ? g.outstandingPrincipal : g.loanAmount;
  confirmAction(`Outstanding principal is ${fmtMoney(bal)}. Mark this girvi item (${g.itemDesc}) as fully redeemed by ${g.customerName}? This closes the loan and stays in History.`, ()=>{
    g.status='redeemed'; g.redeemedDate=todayStr(); g.outstandingPrincipal=0;
    g.transactions.push({id:uid('GTX'), date:todayStr(), type:'Redeemed', amount:bal, note:'Loan closed / item redeemed'});
    logHistory('Girvi','Redeemed', `${g.itemDesc} redeemed by ${g.customerName}`);
    saveDB(); renderGirvi(); toast('Marked as redeemed');
  });
}
function forfeitGirvi(id){
  const g = DB.girvi.find(x=>x.id===id); if(!g) return;
  askOwnerApproval('Forfeiting means the shop keeps the item permanently since the customer did not repay. This requires owner approval.', ()=>{
    g.status='forfeited';
    g.transactions.push({id:uid('GTX'), date:todayStr(), type:'Forfeited', amount:0, note:'Item forfeited to shop'});
    logHistory('Girvi','Forfeited', `${g.itemDesc} forfeited (customer: ${g.customerName})`);
    saveDB(); renderGirvi(); toast('Item marked as forfeited');
  });
}

function renderCredit(){
  let html = `<div class="cardHead" style="margin-bottom:14px;"><div></div><button class="btn btn-primary" onclick="openCreditForm()">+ Add Entry</button></div>`;
  html += `<div class="statGrid" style="grid-template-columns:repeat(3,1fr);">`;
  const totalDue = DB.customers.reduce((a,c)=>a+Math.max(customerBalance(c.id),0),0);
  const customersWithDue = DB.customers.filter(c=>customerBalance(c.id)>0).length;
  html += `<div class="statCard"><div class="lbl">Total Outstanding</div><div class="val">${fmtMoney(totalDue)}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Customers with Due</div><div class="val">${customersWithDue}</div></div>`;
  html += `<div class="statCard"><div class="lbl">Total Customers</div><div class="val">${DB.customers.length}</div></div>`;
  html += `</div>`;
  html += `<div class="card"><table><tr><th>Customer</th><th>Phone</th><th>Balance Due</th><th></th></tr>`;
  const withBal = DB.customers.map(c=>({c,bal:customerBalance(c.id)})).sort((a,b)=>b.bal-a.bal);
  if(withBal.length===0) html += `<tr><td colspan="4"><div class="empty"><div class="big">📒</div>No customers yet.</div></td></tr>`;
  withBal.forEach(({c,bal})=>{
    html += `<tr><td><span class="custCell">${custAvatarHTML(c,26)}<span>${escH(c.name)}</span></span></td><td>${c.phone||'-'}</td><td>${bal>0?'<b style="color:var(--danger)">'+fmtMoney(bal)+'</b>':fmtMoney(bal)}</td>
    <td><button class="btn btn-sm btn-ghost" onclick="viewCustomerLedger('${c.id}')">View Ledger</button></td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById('content').innerHTML = html;
}
function openCreditForm(prefillName, prefillId){
  const body = `
    <div class="grid grid-2">
      <div class="field"><label>${T('customer')} *</label><input list="custList4" id="crCustomer" value="${prefillName?prefillName:''}">

    <div class="grid grid-2" style="margin-top:12px;">
      <div class="field"><label>Entry Type</label><select id="crType"><option value="debit">Udhaar Given (they owe more)</option><option value="credit">Payment Received (reduce due)</option></select></div>

function saveCredit(){
  const name = document.getElementById('crCustomer').value.trim();
  if(!name){ toast('Enter customer name'); return; }

  const cust = resolveCustomer('crCustomer',null);
  const amt = parseFloat(document.getElementById('crAmount').value)||0;
  const type = document.getElementById('crType').value;
  const crDate = document.getElementById('crDate').value || todayStr();
  DB.creditEntries.push({id:uid('CR'), customerId:cust.id, date:crDate, type, amount:amt, description:document.getElementById('crDesc').value||'Manual entry', createdAt:nowISO()});

}

function invMfgRecalc(){
  const out = document.getElementById('invMfgOut'); if(!out) return;
  const weight = parseFloat(document.getElementById('invWeight')?.value)||0;
  const category = document.getElementById('invCategory')?.value;
  const actualP = parseFloat(document.getElementById('invMfgActualPurity')?.value);
  const billedP = parseFloat(document.getElementById('invMfgBilledPurity')?.value);
  const making = parseFloat(document.getElementById('invMfgMaking')?.value)||0;
  if(isNaN(actualP) && isNaN(billedP) && !making){ out.innerHTML=''; return; }
  const actualPureWt = weight*((isNaN(actualP)?0:actualP)/100);
  const billedPureWt = weight*((isNaN(billedP)?0:billedP)/100);
  const wastagePureWt = Math.max(billedPureWt-actualPureWt, 0);
  const makingTotal = weight*making;

  const totalCost = billedPureWt*rate + makingTotal;
  out.innerHTML = `
    <div class="totalsRow"><span>Actual Pure Weight</span><span>${fmtWt(actualPureWt)}</span></div>
    <div class="totalsRow"><span>Billed Pure Weight</span><span>${fmtWt(billedPureWt)}</span></div>
    <div class="totalsRow"><span>Wastage (pure metal)</span><span>${fmtWt(wastagePureWt)}</span></div>
    <div class="totalsRow"><span>Making Charge Total</span><span>${fmtMoney(makingTotal)}</span></div>
    <div class="totalsRow grand"><span>Approx. Total Cost</span><span>${fmtMoney(totalCost)}</span></div>
    <div class="helpText" style="margin-top:4px;">Metal cost estimated at today's shop rate (${category==='Gold'?'Gold 22K':'Silver'}: ${fmtMoney(rate)}/g).</div>
  `;
}
function saveInv(id){
  const name = document.getElementById('invName').value;
  if(!name){ toast('Enter item name'); return; }
  const extra = {
    subcategory: document.getElementById('invSubcat').value, designGroup: document.getElementById('invDesignGroup').value,
    size: document.getElementById('invSize').value, pairSingle: document.getElementById('invPairSingle').value,
    style: document.getElementById('invStyle').value, stoneOrNot: document.getElementById('invStoneOrNot').value,
    weightType: document.getElementById('invWeightType').value, pieceCount: parseInt(document.getElementById('invPieceCount').value)||1,
    batchNo: document.getElementById('invBatchNo').value, karigarSource: document.getElementById('invKarigarSource').value,
    customAttr: document.getElementById('invCustomAttr').value, remarks: document.getElementById('invRemarks').value,
    mfgSource: document.getElementById('invMfgSource').value, mfgParty: document.getElementById('invMfgParty').value,
    mfgActualPurity: document.getElementById('invMfgActualPurity').value, mfgBilledPurity: document.getElementById('invMfgBilledPurity').value,
